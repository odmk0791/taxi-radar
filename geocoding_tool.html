  var url = 'https://msearch.gsi.go.jp/address-search/AddressSearch?q=' + query;

  fetch(url)
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data && data.length > 0) {
        var c = data[0].geometry.coordinates;
        var lat = Math.round(c[1] * 10000) / 10000;
        var lng = Math.round(c[0] * 10000) / 10000;
        results[addr] = {lat: lat, lng: lng, ok: true};
        if (queueIdx % 50 === 0) log('✅ ' + addr + ' → [' + lat + ',' + lng + ']');
      } else {
        results[addr] = {lat: null, lng: null, ok: false};
        log('❌ 取得失敗: ' + addr);
      }
    })
    .catch(function(e) {
      results[addr] = {lat: null, lng: null, ok: false};
      log('⚠️ エラー: ' + addr + ' (' + e.message + ')');
    })
    .then(function() {
      queueIdx++;
      updateUI();
      if (running) setTimeout(processNext, INTERVAL);
    });
}

function startGeo() {
  running = true;
  document.getElementById('btn-start').disabled = true;
  document.getElementById('btn-stop').disabled = false;
  log('▶️ 取得開始（' + ADDRESSES.length + '件）');
  processNext();
}

function stopGeo() {
  running = false;
  document.getElementById('btn-start').disabled = false;
  document.getElementById('btn-stop').disabled = true;
  log('⏹️ 一時停止');
  updateUI();
}

function downloadCSV() {
  var lines = ['\uFEFF住所,緯度(latitude),経度(longitude),ステータス'];
  ADDRESSES.forEach(function(addr) {
    var r = results[addr];
    if (r && r.ok) {
      lines.push(addr + ',' + r.lat + ',' + r.lng + ',GSI取得済');
    } else if (r && !r.ok) {
      lines.push(addr + ',,,' + 'GSI取得失敗');
    } else {
      lines.push(addr + ',,,' + '未取得');
    }
  });
  var blob = new Blob([lines.join('\n')], {type: 'text/csv;charset=utf-8'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'busann23ku_gsi_coordinates.csv';
  a.click();
  log('💾 CSVダウンロード（' + Object.keys(results).length + '件）');
}

updateUI();
log('準備完了。「取得開始」を押してください。');
</script>
