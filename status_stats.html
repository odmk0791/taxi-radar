<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ステータス別 統計分析</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#090912;color:#e2e8f0;font-family:'Hiragino Sans',sans-serif;padding-bottom:48px}
#hdr{background:linear-gradient(135deg,#1c0a3a,#0f1e40);border-bottom:1px solid #a78bfa44;padding:18px 16px 14px}
.sub{font-size:10px;color:#a78bfa;letter-spacing:3px;text-transform:uppercase;margin-bottom:2px}
h1{font-size:18px;font-weight:800}
#msgbox{margin:20px 16px;padding:14px;background:#161626;border:2px solid #60a5fa;border-radius:12px;font-size:13px;line-height:1.9;word-break:break-all;min-height:60px}
@keyframes sp{to{transform:rotate(360deg)}}
.spin{display:inline-block;animation:sp 1s linear infinite}
.rbtn{display:block;width:calc(100% - 32px);margin:0 16px 16px;padding:13px;background:#1a2035;border:1px solid #f87171;border-radius:12px;color:#f87171;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.tabs{display:flex;gap:5px;padding:0 14px 12px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;margin-top:14px}
.tab{padding:8px 14px;border-radius:20px;border:none;background:#151e30;color:#fff;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap;font-family:inherit;flex-shrink:0;opacity:.6}
.tab.on{opacity:1}
.panel{padding:0 14px;display:none}
.panel.on{display:block}
.card{background:#161626;border:1px solid #1e2d40;border-radius:12px;padding:14px;margin-bottom:12px}
.card-ttl{font-size:12px;font-weight:700;margin-bottom:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:8px}
.cell{background:#0d1220;border-radius:8px;padding:8px 10px}
.cell .lbl{font-size:9px;color:#475569;margin-bottom:3px}
.cell .val{font-size:13px;font-weight:800;line-height:1.3}
.cell .sub{font-size:9px;color:#64748b;margin-top:2px}
.bwrap{height:12px;background:#151e30;border-radius:4px;overflow:hidden;margin-top:3px}
.binner{height:100%;border-radius:4px}
.row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #0d1220;font-size:12px}
.row:last-child{border:none}
.sbox{border-radius:10px;padding:11px 12px;margin-bottom:8px}
.highlight{border-radius:8px;padding:10px 12px;margin-top:8px;font-size:12px;color:#cbd5e1;line-height:1.9}
.cmp-wrap{margin-bottom:10px}
.cmp-lbl{display:flex;justify-content:space-between;margin-bottom:3px;font-size:11px}
</style>
</head>
<body>
<div id="hdr">
  <div class="sub">Statistical Analysis</div>
  <h1>📊 ステータス・サンキュー別 統計分析</h1>
</div>
<div id="msgbox"><span class="spin">⏳</span> データ取得中...</div>
<button class="rbtn" id="rbtn" onclick="run()" style="display:none">🔄 再試行</button>
<div id="dashboard" style="display:none">
  <div class="tabs">
    <button class="tab on"  onclick="sw('compare',this)"  style="background:#a78bfa">🔢 全体比較</button>
    <button class="tab"     onclick="sw('pretax',this)"   style="background:#f59e0b">⭐ プレタク比較</button>
    <button class="tab"     onclick="sw('go',this)"       style="background:#4ade80">🟢 GO</button>
    <button class="tab"     onclick="sw('sma',this)"      style="background:#60a5fa">📱 スマ配</button>
    <button class="tab"     onclick="sw('nag',this)"      style="background:#facc15">🚕 流し</button>
    <button class="tab"     onclick="sw('pt',this)"       style="background:#f59e0b">🚐 プレタク</button>
    <button class="tab"     onclick="sw('ptp',this)"      style="background:#fb923c">✨ プレタクP</button>
  </div>
  <div class="panel on" id="p-compare"></div>
  <div class="panel"    id="p-pretax"></div>
  <div class="panel"    id="p-go"></div>
  <div class="panel"    id="p-sma"></div>
  <div class="panel"    id="p-nag"></div>
  <div class="panel"    id="p-pt"></div>
  <div class="panel"    id="p-ptp"></div>
</div>

<script>
var U2='https://docs.google.com/spreadsheets/d/e/2PACX-1vTm1IwbqhN5odntM8GhM4xHZwR3h1a4WKeWpt-4eLDczrGTTAVz8Bl49SI_c0jGEVrp0t_8iRMTN77A/pub?gid=0&single=true&output=csv';

function parseCSV(t){
  var lines=t.trim().split(/\r?\n/).filter(function(l){return l.trim();});
  function sp(line){var cols=[],cur='',q=false;for(var i=0;i<line.length;i++){var c=line[i];if(c==='"'){q=!q;}else if(c===','&&!q){cols.push(cur.trim());cur='';}else{cur+=c;}}cols.push(cur.trim());return cols;}
  var h=sp(lines[0]);
  return lines.slice(1).map(function(l){var v=sp(l),o={};h.forEach(function(k,i){o[k]=v[i]||'';});return o;});
}
function toN(v){return parseInt(String(v||'').replace(/[^\d]/g,''))||0;}
function es(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function bar(pct,col,h){h=h||12;return '<div class="bwrap" style="height:'+h+'px"><div class="binner" style="width:'+Math.min(pct||0,100)+'%;background:'+col+'"></div></div>';}

function mean(a){return a.length?a.reduce(function(x,y){return x+y;},0)/a.length:0;}
function median(a){
  var s=[].concat(a).sort(function(x,y){return x-y;});
  var m=Math.floor(s.length/2);
  return s.length%2?s[m]:Math.round((s[m-1]+s[m])/2);
}
function stddev(a){
  var mu=mean(a);
  return Math.sqrt(a.reduce(function(s,x){return s+(x-mu)*(x-mu);},0)/a.length);
}
function pctile(a,p){
  var s=[].concat(a).sort(function(x,y){return x-y;});
  var idx=(p/100)*(s.length-1),lo=Math.floor(idx),hi=Math.ceil(idx);
  return Math.round(s[lo]+(s[hi]-s[lo])*(idx-lo));
}

function calcStat(fares,allAvg){
  var n=fares.length;
  if(!n)return null;
  var avg=Math.round(mean(fares));
  var med=median(fares);
  var sd=Math.round(stddev(fares));
  var cv=avg>0?Math.round(sd/avg*100):0;
  var mu2hi=Math.round(avg+2*sd);
  var mu2lo=Math.max(0,Math.round(avg-2*sd));
  var mu3hi=Math.round(avg+3*sd);
  var in1=fares.filter(function(f){return f>=Math.max(0,avg-sd)&&f<=avg+sd;}).length;
  var in2=fares.filter(function(f){return f>=mu2lo&&f<=mu2hi;}).length;
  var in3=fares.filter(function(f){return f>=Math.max(0,avg-3*sd)&&f<=mu3hi;}).length;
  var ghosts=fares.filter(function(f){return f>mu2hi;}).sort(function(a,b){return b-a;});
  var p25=pctile(fares,25),p75=pctile(fares,75);
  var iqrHi=p75+1.5*(p75-p25);
  var iqrIn=fares.filter(function(f){return f<=iqrHi;});
  var cleanAvg2=in2>0?Math.round(mean(fares.filter(function(f){return f>=mu2lo&&f<=mu2hi;}))):avg;
  var cleanAvgIqr=iqrIn.length?Math.round(mean(iqrIn)):avg;
  return{
    n:n,avg:avg,med:med,sd:sd,cv:cv,
    mu2lo:mu2lo,mu2hi:mu2hi,mu3hi:mu3hi,
    in1:in1,in2:in2,in3:in3,
    ghosts:ghosts,
    p25:p25,p50:med,p75:p75,
    p90:pctile(fares,90),p95:pctile(fares,95),
    iqrHi:Math.round(iqrHi),
    iqrOutCnt:fares.filter(function(f){return f>iqrHi;}).length,
    cleanAvg2:cleanAvg2,cleanAvgIqr:cleanAvgIqr,
    diffAll:cleanAvg2-allAvg,
    max:Math.max.apply(null,fares),min:Math.min.apply(null,fares)
  };
}

function buildPage(st,col,icon,allAvg){
  if(!st)return '<p style="color:#64748b;padding:20px;font-size:13px">データなし</p>';
  var s=st,h='';
  h+='<div class="card" style="border-color:'+col+'44">';
  h+='<div class="card-ttl" style="color:'+col+'">'+icon+' 基本統計（'+s.n+'件）</div>';
  h+='<div class="grid2">';
  h+='<div class="cell"><div class="lbl">平均値</div><div class="val" style="color:#f87171">¥'+s.avg.toLocaleString()+'</div><div class="sub">外れ値込み</div></div>';
  h+='<div class="cell"><div class="lbl">中央値（実態）</div><div class="val" style="color:#4ade80">¥'+s.med.toLocaleString()+'</div><div class="sub">最も信頼できる値</div></div>';
  h+='</div><div class="grid2">';
  h+='<div class="cell"><div class="lbl">標準偏差（σ）</div><div class="val" style="color:#facc15">¥'+s.sd.toLocaleString()+'</div></div>';
  h+='<div class="cell"><div class="lbl">変動係数 CV</div><div class="val" style="color:'+(s.cv>=80?'#f87171':s.cv>=50?'#facc15':'#4ade80')+'">'+s.cv+'%</div><div class="sub">'+(s.cv>=80?'超ばらつき':s.cv>=50?'ばらつき大':'安定')+'</div></div>';
  h+='</div><div class="grid2" style="margin-top:4px">';
  h+='<div class="cell"><div class="lbl">最高単価</div><div class="val" style="color:#4ade80">¥'+s.max.toLocaleString()+'</div></div>';
  h+='<div class="cell"><div class="lbl">最低単価</div><div class="val" style="color:#94a3b8">¥'+s.min.toLocaleString()+'</div></div>';
  h+='</div></div>';

  h+='<div class="card"><div class="card-ttl" style="color:#facc15">📊 σ区間と外れ値</div>';
  [{lbl:'±1σ（68%）',lo:Math.max(0,s.avg-s.sd),hi:s.avg+s.sd,cnt:s.in1,col:'#60a5fa'},
   {lbl:'±2σ（95%）',lo:s.mu2lo,hi:s.mu2hi,cnt:s.in2,col:'#4ade80'},
   {lbl:'±3σ（99.7%）',lo:Math.max(0,s.avg-3*s.sd),hi:s.mu3hi,cnt:s.in3,col:'#a78bfa'},
  ].forEach(function(x){
    var pct=s.n>0?x.cnt/s.n*100:0;
    h+='<div class="sbox" style="background:'+x.col+'0d;border:1px solid '+x.col+'33">';
    h+='<div style="display:flex;justify-content:space-between;margin-bottom:4px"><span style="font-size:11px;font-weight:700;color:'+x.col+'">'+x.lbl+'</span><span style="font-size:11px;color:#475569">'+x.cnt+'件 ('+pct.toFixed(1)+'%)</span></div>';
    h+='<div style="font-size:11px;color:#cbd5e1;margin-bottom:4px">¥'+Math.round(x.lo).toLocaleString()+' 〜 ¥'+Math.round(x.hi).toLocaleString()+'</div>';
    h+=bar(pct,x.col,10)+'</div>';
  });
  h+='<div class="grid2">';
  h+='<div class="cell" style="border-color:#f8717133"><div class="lbl">±2σ外れ値（おばけ）</div><div class="val" style="color:#f87171">'+s.ghosts.length+'件</div><div class="sub">¥'+s.mu2hi.toLocaleString()+'超</div></div>';
  h+='<div class="cell" style="border-color:#f8717133"><div class="lbl">IQR外れ値</div><div class="val" style="color:#f87171">'+s.iqrOutCnt+'件</div><div class="sub">¥'+s.iqrHi.toLocaleString()+'超</div></div>';
  h+='</div></div>';

  h+='<div class="card" style="border-color:#4ade8044">';
  h+='<div class="card-ttl" style="color:#4ade80">✅ 外れ値除外後の実態平均</div>';
  h+='<div class="grid3">';
  h+='<div class="cell"><div class="lbl">全件平均</div><div class="val" style="color:#f87171">¥'+s.avg.toLocaleString()+'</div><div class="sub">おばけ込み</div></div>';
  h+='<div class="cell"><div class="lbl">±2σ除外後</div><div class="val" style="color:#4ade80">¥'+s.cleanAvg2.toLocaleString()+'</div><div class="sub">'+s.in2+'件</div></div>';
  h+='<div class="cell"><div class="lbl">IQR除外後</div><div class="val" style="color:#4ade80">¥'+s.cleanAvgIqr.toLocaleString()+'</div></div>';
  h+='</div>';
  h+='<div class="highlight" style="background:'+(s.diffAll>=0?'#4ade8010':'#f8717110')+';border:1px solid '+(s.diffAll>=0?'#4ade8033':'#f8717133')+'">';
  h+='実態平均 <strong style="color:#4ade80">¥'+s.cleanAvg2.toLocaleString()+'</strong> vs 全体平均 <strong style="color:#94a3b8">¥'+allAvg.toLocaleString()+'</strong>　';
  h+='差額：<strong style="color:'+(s.diffAll>=0?'#4ade80':'#f87171')+'">'+(s.diffAll>=0?'+':'')+'¥'+s.diffAll.toLocaleString()+'</strong>';
  h+='</div></div>';

  h+='<div class="card"><div class="card-ttl" style="color:#a78bfa">📈 パーセンタイル</div>';
  var maxP=s.p95||1;
  [{lbl:'25%（下位25%）',v:s.p25,col:'#f87171'},{lbl:'50%（中央値）',v:s.p50,col:'#facc15'},
   {lbl:'75%（上位25%）',v:s.p75,col:'#60a5fa'},{lbl:'90%（上位10%）',v:s.p90,col:'#4ade80'},
   {lbl:'95%（上位5%）',v:s.p95,col:'#a78bfa'}].forEach(function(p){
    h+='<div style="margin-bottom:7px"><div style="display:flex;justify-content:space-between;margin-bottom:2px"><span style="font-size:11px;color:#94a3b8">'+p.lbl+'</span><span style="font-size:12px;font-weight:700;color:'+p.col+'">¥'+p.v.toLocaleString()+'</span></div>'+bar(p.v/maxP*100,p.col)+'</div>';
  });
  h+='<div style="font-size:11px;color:#64748b;margin-top:4px">IQR外れ値ライン：¥'+s.iqrHi.toLocaleString()+'超（'+s.iqrOutCnt+'件）</div>';
  h+='</div>';

  if(s.ghosts.length){
    h+='<div class="card" style="border-color:#f8717144">';
    h+='<div class="card-ttl" style="color:#f87171">👻 おばけ案件（±2σ超 '+s.ghosts.length+'件）</div>';
    s.ghosts.slice(0,15).forEach(function(f,i){
      h+='<div class="row"><span style="font-size:11px;color:#64748b">'+(i+1)+'位</span><span style="font-size:14px;font-weight:800;color:#f87171">¥'+f.toLocaleString()+'</span></div>';
    });
    if(s.ghosts.length>15)h+='<p style="font-size:10px;color:#475569;margin-top:6px">他'+(s.ghosts.length-15)+'件</p>';
    h+='</div>';
  }
  return h;
}

async function run(){
  document.getElementById('msgbox').style.display='';
  document.getElementById('msgbox').innerHTML='<span class="spin">⏳</span> データ取得中...';
  document.getElementById('msgbox').style.borderColor='#60a5fa';
  document.getElementById('rbtn').style.display='none';
  document.getElementById('dashboard').style.display='none';
  try{
    var r=await fetch(U2);
    if(!r.ok)throw new Error('HTTP '+r.status);
    var text=await r.text();
    document.getElementById('msgbox').innerHTML='<span class="spin">⏳</span> 集計中...';

    var rows=parseCSV(text);
    var allF=rows.map(function(r){return toN(r['料金']);}).filter(function(v){return v>0;});
    var allAvg=Math.round(mean(allF));

    /* ステータス別 */
    function byStatus(st){
      return rows.filter(function(r){return(r['ステータス']||'').trim()===st;})
        .map(function(r){return toN(r['料金']);}).filter(function(v){return v>0;});
    }
    /* サンキュー列別 */
    function bySanq(sk){
      return rows.filter(function(r){return(r['サンキュー']||'').trim()===sk;})
        .map(function(r){return toN(r['料金']);}).filter(function(v){return v>0;});
    }

    var goF =byStatus('GO');
    var smaF=byStatus('スマ配');
    var nagF=byStatus('流し');
    var ptF =bySanq('プレタク');
    var ptpF=bySanq('プレタクP');

    var goS =calcStat(goF, allAvg);
    var smaS=calcStat(smaF,allAvg);
    var nagS=calcStat(nagF,allAvg);
    var ptS =calcStat(ptF, allAvg);
    var ptpS=calcStat(ptpF,allAvg);

    /* ── 全体比較タブ ── */
    var allStats=[
      {lbl:'🟢 GO',    s:goS, col:'#4ade80'},
      {lbl:'📱 スマ配', s:smaS,col:'#60a5fa'},
      {lbl:'🚕 流し',   s:nagS,col:'#facc15'},
    ];
    var h='';
    h+='<div class="card" style="border-color:#a78bfa44">';
    h+='<div class="card-ttl" style="color:#a78bfa">🔢 GO / スマ配 / 流し 比較</div>';
    h+='<p style="font-size:10px;color:#475569;margin-bottom:10px">全体平均単価（外れ値込み）：¥'+allAvg.toLocaleString()+'　全'+allF.length+'件</p>';

    /* 件数 */
    var maxCnt=Math.max.apply(null,allStats.map(function(x){return x.s?x.s.n:0;}))||1;
    h+='<p style="font-size:10px;color:#64748b;font-weight:700;margin-bottom:6px">件数</p>';
    allStats.forEach(function(x){
      if(!x.s)return;
      h+='<div class="cmp-wrap"><div class="cmp-lbl"><span style="color:'+x.col+'">'+x.lbl+'</span><span style="color:#475569">'+x.s.n+'件 ('+(allF.length>0?(x.s.n/allF.length*100).toFixed(1):0)+'%)</span></div>'+bar(x.s.n/maxCnt*100,x.col,14)+'</div>';
    });

    /* 中央値 */
    var maxMed=Math.max.apply(null,allStats.map(function(x){return x.s?x.s.med:0;}))||1;
    h+='<p style="font-size:10px;color:#64748b;font-weight:700;margin:12px 0 6px">中央値（実態単価）</p>';
    allStats.forEach(function(x){
      if(!x.s)return;
      h+='<div class="cmp-wrap"><div class="cmp-lbl"><span style="color:'+x.col+'">'+x.lbl+'</span><span style="font-weight:700;color:'+x.col+'">¥'+x.s.med.toLocaleString()+'</span></div>'+bar(x.s.med/maxMed*100,x.col,14)+'</div>';
    });

    /* 実態平均（±2σ除外） */
    var maxClean=Math.max.apply(null,allStats.map(function(x){return x.s?x.s.cleanAvg2:0;}))||1;
    h+='<p style="font-size:10px;color:#64748b;font-weight:700;margin:12px 0 6px">実態平均（±2σ除外後）</p>';
    allStats.forEach(function(x){
      if(!x.s)return;
      h+='<div class="cmp-wrap"><div class="cmp-lbl"><span style="color:'+x.col+'">'+x.lbl+'</span><span style="font-weight:700;color:'+x.col+'">¥'+x.s.cleanAvg2.toLocaleString()+' <span style="font-size:10px;color:'+(x.s.diffAll>=0?'#4ade80':'#f87171')+'">'+(x.s.diffAll>=0?'↑+':'↓')+'¥'+Math.abs(x.s.diffAll).toLocaleString()+'</span></span></div>'+bar(x.s.cleanAvg2/maxClean*100,x.col,14)+'</div>';
    });

    /* CV安定度 */
    var maxCV=Math.max.apply(null,allStats.map(function(x){return x.s?x.s.cv:0;}))||1;
    h+='<p style="font-size:10px;color:#64748b;font-weight:700;margin:12px 0 6px">変動係数 CV（低いほど安定）</p>';
    allStats.forEach(function(x){
      if(!x.s)return;
      h+='<div class="cmp-wrap"><div class="cmp-lbl"><span style="color:'+x.col+'">'+x.lbl+'</span><span style="color:'+(x.s.cv>=80?'#f87171':x.s.cv>=50?'#facc15':'#4ade80')+'">'+x.s.cv+'% '+(x.s.cv>=80?'超ばらつき':x.s.cv>=50?'ばらつき大':'安定')+'</span></div>'+bar(x.s.cv/maxCV*100,x.col+'99',14)+'</div>';
    });

    /* おばけ件数 */
    var maxGh=Math.max.apply(null,allStats.map(function(x){return x.s?x.s.ghosts.length:0;}))||1;
    h+='<p style="font-size:10px;color:#64748b;font-weight:700;margin:12px 0 6px">おばけ件数（±2σ超）</p>';
    allStats.forEach(function(x){
      if(!x.s)return;
      h+='<div class="cmp-wrap"><div class="cmp-lbl"><span style="color:'+x.col+'">'+x.lbl+'</span><span style="color:#f87171">'+x.s.ghosts.length+'件（¥'+x.s.mu2hi.toLocaleString()+'超）</span></div>'+bar(x.s.ghosts.length/maxGh*100,'#f8717199',14)+'</div>';
    });

    /* 総評 */
    var ranks=[{n:'GO',v:goS?goS.cleanAvg2:0},{n:'スマ配',v:smaS?smaS.cleanAvg2:0},{n:'流し',v:nagS?nagS.cleanAvg2:0}]
      .filter(function(x){return x.v>0;}).sort(function(a,b){return b.v-a.v;});
    var stableRanks=[{n:'GO',v:goS?goS.cv:999},{n:'スマ配',v:smaS?smaS.cv:999},{n:'流し',v:nagS?nagS.cv:999}]
      .filter(function(x){return x.v<999;}).sort(function(a,b){return a.v-b.v;});
    h+='</div>';
    h+='<div class="card" style="border-color:#f59e0b55;background:#f59e0b08">';
    h+='<div class="card-ttl" style="color:#f59e0b">💡 3ステータスの性格まとめ</div>';
    h+='<div style="font-size:12px;color:#cbd5e1;line-height:2.1">';
    h+='単価ランク：<strong style="color:#facc15">'+ranks.map(function(r,i){return(i+1)+'位 '+r.n+' ¥'+r.v.toLocaleString();}).join(' / ')+'</strong><br>';
    h+='安定度ランク：<strong style="color:#60a5fa">'+stableRanks.map(function(r,i){return(i+1)+'位 '+r.n+' CV'+r.v+'%';}).join(' / ')+'</strong>';
    h+='</div></div>';
    document.getElementById('p-compare').innerHTML=h;

    /* ── プレタク比較タブ ── */
    h='';
    h+='<div class="card" style="border-color:#f59e0b55;background:#f59e0b08">';
    h+='<div class="card-ttl" style="color:#f59e0b">⭐ プレタク vs プレタクP 直接比較</div>';
    h+='<p style="font-size:11px;color:#94a3b8;margin-bottom:12px;line-height:1.8">';
    h+='プレタク = 通常GO案件が自動アップグレード<br>';
    h+='プレタクP = 客がチャージ払って指名';
    h+='</p>';

    var ptStats=[
      {lbl:'⭐ プレタク', s:ptS, col:'#f59e0b'},
      {lbl:'✨ プレタクP',s:ptpS,col:'#fb923c'},
    ];

    /* 件数 */
    h+='<p style="font-size:10px;color:#64748b;font-weight:700;margin-bottom:6px">件数</p>';
    var maxPtCnt=Math.max(ptS?ptS.n:0,ptpS?ptpS.n:0)||1;
    ptStats.forEach(function(x){
      if(!x.s)return;
      h+='<div class="cmp-wrap"><div class="cmp-lbl"><span style="color:'+x.col+'">'+x.lbl+'</span><span style="color:#475569">'+x.s.n+'件</span></div>'+bar(x.s.n/maxPtCnt*100,x.col,14)+'</div>';
    });

    /* 中央値 */
    h+='<p style="font-size:10px;color:#64748b;font-weight:700;margin:12px 0 6px">中央値（実態単価）</p>';
    var maxPtMed=Math.max(ptS?ptS.med:0,ptpS?ptpS.med:0)||1;
    ptStats.forEach(function(x){
      if(!x.s)return;
      h+='<div class="cmp-wrap"><div class="cmp-lbl"><span style="color:'+x.col+'">'+x.lbl+'</span><span style="font-weight:700;color:'+x.col+'">¥'+x.s.med.toLocaleString()+'</span></div>'+bar(x.s.med/maxPtMed*100,x.col,14)+'</div>';
    });

    /* 実態平均 */
    h+='<p style="font-size:10px;color:#64748b;font-weight:700;margin:12px 0 6px">実態平均（±2σ除外後）</p>';
    var maxPtClean=Math.max(ptS?ptS.cleanAvg2:0,ptpS?ptpS.cleanAvg2:0)||1;
    ptStats.forEach(function(x){
      if(!x.s)return;
      h+='<div class="cmp-wrap"><div class="cmp-lbl"><span style="color:'+x.col+'">'+x.lbl+'</span><span style="font-weight:700;color:'+x.col+'">¥'+x.s.cleanAvg2.toLocaleString()+' <span style="font-size:10px;color:'+(x.s.diffAll>=0?'#4ade80':'#f87171')+'">'+(x.s.diffAll>=0?'↑+':'↓')+'¥'+Math.abs(x.s.diffAll).toLocaleString()+'</span></span></div>'+bar(x.s.cleanAvg2/maxPtClean*100,x.col,14)+'</div>';
    });

    /* CV */
    h+='<p style="font-size:10px;color:#64748b;font-weight:700;margin:12px 0 6px">変動係数 CV</p>';
    var maxPtCV=Math.max(ptS?ptS.cv:0,ptpS?ptpS.cv:0)||1;
    ptStats.forEach(function(x){
      if(!x.s)return;
      h+='<div class="cmp-wrap"><div class="cmp-lbl"><span style="color:'+x.col+'">'+x.lbl+'</span><span style="color:'+(x.s.cv>=80?'#f87171':x.s.cv>=50?'#facc15':'#4ade80')+'">'+x.s.cv+'%</span></div>'+bar(x.s.cv/maxPtCV*100,x.col+'99',14)+'</div>';
    });

    /* パーセンタイル横並び比較 */
    h+='</div>';
    h+='<div class="card">';
    h+='<div class="card-ttl" style="color:#e2e8f0">📈 パーセンタイル比較</div>';
    h+='<table style="width:100%;border-collapse:collapse;font-size:11px">';
    h+='<thead><tr><th style="text-align:left;color:#475569;padding:4px 6px;border-bottom:1px solid #1e2d40">パーセンタイル</th><th style="text-align:right;color:#f59e0b;padding:4px 6px;border-bottom:1px solid #1e2d40">⭐ プレタク</th><th style="text-align:right;color:#fb923c;padding:4px 6px;border-bottom:1px solid #1e2d40">✨ プレタクP</th></tr></thead><tbody>';
    [
      {lbl:'25%（下位）',pa:'p25',pb:'p25'},
      {lbl:'50%（中央値）',pa:'p50',pb:'p50'},
      {lbl:'75%（上位25%）',pa:'p75',pb:'p75'},
      {lbl:'90%（上位10%）',pa:'p90',pb:'p90'},
      {lbl:'95%（上位5%）',pa:'p95',pb:'p95'},
    ].forEach(function(row){
      var va=ptS?ptS[row.pa]:0,vb=ptpS?ptpS[row.pb]:0;
      var higher=va>vb?'pt':'ptp';
      h+='<tr><td style="color:#64748b;padding:6px 6px;border-bottom:1px solid #0d1220">'+row.lbl+'</td>';
      h+='<td style="text-align:right;padding:6px 6px;border-bottom:1px solid #0d1220;font-weight:'+(higher==='pt'?800:400)+';color:'+(higher==='pt'?'#f59e0b':'#94a3b8')+'">¥'+(va||0).toLocaleString()+(higher==='pt'?' ↑':'')+'</td>';
      h+='<td style="text-align:right;padding:6px 6px;border-bottom:1px solid #0d1220;font-weight:'+(higher==='ptp'?800:400)+';color:'+(higher==='ptp'?'#fb923c':'#94a3b8')+'">¥'+(vb||0).toLocaleString()+(higher==='ptp'?' ↑':'')+'</td></tr>';
    });
    h+='</tbody></table></div>';

    /* 結論 */
    h+='<div class="card" style="border-color:#f59e0b55;background:#f59e0b08">';
    h+='<div class="card-ttl" style="color:#f59e0b">💡 プレタク vs プレタクP 結論</div>';
    h+='<div style="font-size:12px;color:#cbd5e1;line-height:2">';
    if(ptS&&ptpS){
      var winner=ptS.cleanAvg2>=ptpS.cleanAvg2?'プレタク':'プレタクP';
      var loser=winner==='プレタク'?'プレタクP':'プレタク';
      var winV=winner==='プレタク'?ptS.cleanAvg2:ptpS.cleanAvg2;
      var losV=loser==='プレタク'?ptS.cleanAvg2:ptpS.cleanAvg2;
      h+='実態平均が高いのは <strong style="color:#f59e0b">'+winner+'</strong>（¥'+winV.toLocaleString()+'）<br>';
      h+=loser+'との差：<strong style="color:'+(winV-losV>0?'#4ade80':'#94a3b8')+'">+¥'+(winV-losV).toLocaleString()+'</strong><br>';
      if(winner==='プレタク'){
        h+='→ <strong style="color:#facc15">「自動アップグレード = 売上見込みの高い案件が振られる」</strong>という仮説をデータが裏付けています。';
      }else{
        h+='→ プレタクPのほうが単価が高い結果に。チャージを払う層の利用距離が長い可能性があります。';
      }
    }
    h+='</div></div>';
    document.getElementById('p-pretax').innerHTML=h;

    /* 各詳細タブ */
    document.getElementById('p-go') .innerHTML=buildPage(goS, '#4ade80','🟢 GO',allAvg);
    document.getElementById('p-sma').innerHTML=buildPage(smaS,'#60a5fa','📱 スマ配',allAvg);
    document.getElementById('p-nag').innerHTML=buildPage(nagS,'#facc15','🚕 流し',allAvg);
    document.getElementById('p-pt') .innerHTML=buildPage(ptS, '#f59e0b','⭐ プレタク',allAvg);
    document.getElementById('p-ptp').innerHTML=buildPage(ptpS,'#fb923c','✨ プレタクP',allAvg);

    document.getElementById('msgbox').style.display='none';
    document.getElementById('dashboard').style.display='';
  }catch(e){
    document.getElementById('msgbox').innerHTML='⚠️ <strong style="color:#f87171">エラー</strong><br>'+String(e);
    document.getElementById('msgbox').style.borderColor='#f87171';
    document.getElementById('rbtn').style.display='';
  }
}

function sw(id,btn){
  document.querySelectorAll('.tab').forEach(function(b){b.classList.remove('on');});
  btn.classList.add('on');
  document.querySelectorAll('.panel').forEach(function(p){p.classList.remove('on');});
  document.getElementById('p-'+id).classList.add('on');
}

run();
</script>
</body>
</html>
