<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>V列確認</title>
<style>body{background:#090912;color:#e2e8f0;font-family:monospace;padding:16px;font-size:12px;line-height:1.8}.box{background:#161626;border:1px solid #1e2d40;border-radius:8px;padding:12px;white-space:pre-wrap;word-break:break-all}</style></head>
<body><h2>🔍 出番(V列)の値確認</h2><div class="box" id="out">⏳...</div>
<script>
var U1='https://docs.google.com/spreadsheets/d/e/2PACX-1vT2iLNU2ehDRMl7CQt2ETLkVwIeIRMAEpNsFjImdrWDBGuiTWLiwXc9aTtnhbJzWl0uvN0kEPw9Bd-0/pub?gid=0&single=true&output=csv';
function csvArr(text){var lines=text.trim().split(/\r?\n/).filter(function(l){return l.trim();});function sp(line){var c=[],cur='',q=false;for(var i=0;i<line.length;i++){var ch=line[i];if(ch==='"'){q=!q;}else if(ch===','&&!q){c.push(cur.trim());cur='';}else{cur+=ch;}}c.push(cur.trim());return c;}return lines.map(sp);}
(async function(){
  var out=document.getElementById('out');
  try{
    var a=csvArr(await (await fetch(U1)).text());var h=a[0];
    function idx(n){return h.findIndex(function(c){return c.replace(/：/g,':').trim()===n;});}
    var iV=idx('出番'),iW=idx('出勤'),iD=idx('日付'),iWk=idx('曜');
    var s='出番列index='+iV+' / 出勤列index='+iW+'\n\n';
    s+='=== 出番(V列)の値の分布 ===\n';
    var dist={};
    a.slice(1).forEach(function(r){var v=String(r[iV]||'(空)').trim()||'(空)';dist[v]=(dist[v]||0)+1;});
    Object.entries(dist).sort(function(x,y){return y[1]-x[1];}).forEach(function(e){s+='「'+e[0]+'」: '+e[1]+'日\n';});
    s+='\n=== 最初の10日の 日付/曜/出番/出勤 ===\n';
    a.slice(1,11).forEach(function(r){s+=r[iD]+' ('+r[iWk]+') 出番['+r[iV]+'] 出勤['+r[iW]+']\n';});
    out.textContent=s;
  }catch(e){out.textContent='エラー:'+e;}
})();
</script></body></html>
