<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>デバッグ2</title>
<style>body{background:#090912;color:#e2e8f0;font-family:monospace;padding:16px;font-size:12px;line-height:1.8}
.box{background:#161626;border:1px solid #1e2d40;border-radius:8px;padding:12px;white-space:pre-wrap;word-break:break-all}</style></head>
<body><h2>🔍 デバッグ2：A列の中身</h2><div class="box" id="out">⏳...</div>
<script>
var U2='https://docs.google.com/spreadsheets/d/e/2PACX-1vTm1IwbqhN5odntM8GhM4xHZwR3h1a4WKeWpt-4eLDczrGTTAVz8Bl49SI_c0jGEVrp0t_8iRMTN77A/pub?gid=0&single=true&output=csv';
(async function(){
  var out=document.getElementById('out');
  try{
    var t=await (await fetch(U2)).text();
    var lines=t.trim().split(/\r?\n/);
    var s='=== ヘッダー行（生）===\n'+lines[0]+'\n\n';
    function sp(line){var c=[],cur='',q=false;for(var i=0;i<line.length;i++){var ch=line[i];if(ch==='"'){q=!q;}else if(ch===','&&!q){c.push(cur);cur='';}else{cur+=ch;}}c.push(cur);return c;}
    var h=sp(lines[0]);
    s+='=== ヘッダー各列（'+h.length+'列）===\n';
    h.forEach(function(col,i){s+='['+i+'] "'+col+'"\n';});
    s+='\n=== データ行1（生）===\n'+lines[1]+'\n\n';
    s+='=== データ行1 各列 ===\n';
    var v=sp(lines[1]);
    v.forEach(function(val,i){s+='['+i+'] "'+val+'"\n';});
    s+='\n=== データ行2 各列 ===\n';
    var v2=sp(lines[2]);
    v2.forEach(function(val,i){s+='['+i+'] "'+val+'"\n';});
    out.textContent=s;
  }catch(e){out.textContent='エラー:'+e;}
})();
</script></body></html>
