<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>EventRadar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
:root {
  --bg:       #080c18;
  --surface:  #0f1623;
  --surface2: #162030;
  --border:   #1c2d42;
  --accent:   #00c8f0;
  --amber:    #f0a000;
  --red:      #f03040;
  --green:    #20c870;
  --text:     #dde6f0;
  --muted:    #506070;
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { background:var(--bg); color:var(--text); font-family:'Noto Sans JP',sans-serif; min-height:100vh; }

/* ── HEADER ── */
.hdr {
  display:flex; align-items:center; justify-content:space-between;
  padding:12px 16px; background:var(--surface);
  border-bottom:1px solid var(--border); position:sticky; top:0; z-index:200;
}
.hdr-logo { font-family:'Rajdhani',sans-serif; font-size:19px; font-weight:700; letter-spacing:3px; color:var(--accent); }
.hdr-logo em { color:var(--amber); font-style:normal; }
.hdr-right { display:flex; align-items:center; gap:10px; }
.clock { font-family:'Rajdhani',sans-serif; font-size:15px; color:var(--accent); letter-spacing:2px; }
.gps-pill {
  display:flex; align-items:center; gap:5px; font-size:10px;
  border:1px solid var(--border); border-radius:20px; padding:3px 9px; color:var(--muted);
}
.gps-pill.on { color:var(--green); border-color:var(--green); }
.gps-pip { width:5px; height:5px; border-radius:50%; background:currentColor; }

/* ── TAB BAR ── */
.tabs {
  display:flex; background:var(--surface); border-bottom:1px solid var(--border);
  position:sticky; top:49px; z-index:190;
}
.tab {
  flex:1; padding:11px 0; text-align:center; font-size:12px; font-weight:700;
  color:var(--muted); cursor:pointer; border-bottom:2px solid transparent;
  transition:color .15s, border-color .15s; letter-spacing:.5px;
}
.tab.active { color:var(--accent); border-color:var(--accent); }

/* ── MAP ── */
#map { width:100%; height:240px; }
.leaflet-container { background:#08111e; }

/* ── FILTER BAR ── */
.filter-bar {
  display:flex; gap:6px; padding:8px 14px; overflow-x:auto;
  background:var(--bg); border-bottom:1px solid var(--border);
}
.filter-bar::-webkit-scrollbar { display:none; }
.chip {
  flex-shrink:0; font-size:11px; padding:4px 12px; border-radius:20px;
  border:1px solid var(--border); color:var(--muted); background:var(--surface);
  cursor:pointer; white-space:nowrap; transition:all .15s;
}
.chip.on { border-color:var(--accent); color:var(--accent); background:rgba(0,200,240,.08); }

/* ── SORT BAR ── */
.sort-bar { display:flex; align-items:center; gap:10px; padding:8px 14px; background:var(--bg); border-bottom:1px solid var(--border); }
.sort-label { font-size:11px; color:var(--muted); }
.sort-btn { font-size:12px; font-weight:700; padding:5px 14px; border-radius:8px; border:1px solid var(--accent); background:rgba(0,200,240,.1); color:var(--accent); cursor:pointer; white-space:nowrap; }
.sort-btn:active { transform:scale(.97); }
.sort-hint { font-size:10px; color:var(--muted); margin-left:auto; }
.cp-btn { font-size:11px; font-weight:700; padding:5px 11px; border-radius:8px; border:1px solid var(--border); background:var(--surface2); color:var(--muted); cursor:pointer; white-space:nowrap; }
.cp-btn.on { border-color:#9b7cff; background:rgba(120,90,240,.12); color:#9b7cff; }

/* ── VENUE TAB ── */
.venue-controls { display:flex; gap:8px; padding:12px 14px; background:var(--surface); border-bottom:1px solid var(--border); align-items:center; flex-wrap:wrap; }
.venue-urlonly { font-size:11px; color:var(--muted); display:flex; align-items:center; gap:4px; cursor:pointer; }
.venue-status { padding:8px 16px; font-size:12px; color:var(--muted); background:var(--bg); border-bottom:1px solid var(--border); min-height:32px; display:flex; align-items:center; }
.venue-status.ok { color:var(--green); }
.venue-list { padding:10px 14px 90px; display:flex; flex-direction:column; gap:8px; }
.venue-card { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:12px 14px; display:flex; flex-direction:column; gap:7px; }
.venue-card-top { display:flex; align-items:flex-start; justify-content:space-between; gap:8px; }
.venue-name { font-size:13px; font-weight:700; line-height:1.4; flex:1; }
.venue-cat-tag { flex-shrink:0; font-size:10px; padding:2px 7px; border-radius:5px; background:var(--surface2); color:var(--muted); border:1px solid var(--border); }
.venue-meta { display:flex; flex-wrap:wrap; gap:6px 12px; font-size:11px; color:var(--muted); }
.venue-meta .dist { color:var(--accent); font-weight:700; }
.venue-foot { display:flex; gap:8px; align-items:center; }
.venue-url-btn { flex:1; text-align:center; font-size:12px; font-weight:700; padding:8px; border-radius:8px; background:rgba(0,200,240,.1); border:1px solid var(--accent); color:var(--accent); text-decoration:none; transition:background .15s; }
.venue-url-btn:active { background:rgba(0,200,240,.2); }
.venue-url-btn.disabled { background:var(--surface2); border-color:var(--border); color:var(--muted); pointer-events:none; }
.venue-map-btn { flex-shrink:0; font-size:12px; padding:8px 12px; border-radius:8px; background:var(--surface2); border:1px solid var(--border); color:var(--text); cursor:pointer; }

/* ── EVENT LIST ── */
.evt-list { padding:10px 14px 90px; display:flex; flex-direction:column; gap:9px; }

.evt-card {
  background:var(--surface); border:1px solid var(--border); border-radius:11px;
  padding:13px 14px; display:flex; flex-direction:column; gap:7px;
  cursor:pointer; position:relative; overflow:hidden; transition:border-color .15s, transform .1s;
}
.evt-card::before {
  content:''; position:absolute; left:0; top:0; bottom:0; width:3px;
}
.evt-card.u-now::before   { background:var(--red); }
.evt-card.u-soon::before  { background:var(--amber); }
.evt-card.u-later::before { background:var(--accent); }
.evt-card.u-ended::before { background:var(--muted); }
.evt-card.u-ended { opacity:.45; }
.evt-card:active { transform:scale(.99); }

.evt-top { display:flex; align-items:flex-start; justify-content:space-between; gap:8px; }
.evt-name { font-size:13px; font-weight:700; line-height:1.4; flex:1; }
.badge {
  flex-shrink:0; font-size:10px; font-weight:700; padding:2px 8px;
  border-radius:20px; letter-spacing:.5px;
}
.badge.now  { background:rgba(240,48,64,.18); color:var(--red);   border:1px solid var(--red);   }
.badge.soon { background:rgba(240,160,0,.18);  color:var(--amber); border:1px solid var(--amber); }
.badge.later{ background:rgba(0,200,240,.13);  color:var(--accent);border:1px solid var(--accent);}
.badge.ended{ background:var(--surface2); color:var(--muted); border:1px solid var(--border); }
.src-badge { flex-shrink:0; font-size:9px; font-weight:700; padding:2px 6px; border-radius:5px; letter-spacing:.3px; }
.src-badge.connpass { background:rgba(120,90,240,.18); color:#9b7cff; border:1px solid #6a4dd0; }
.src-badge.manual   { background:rgba(32,200,112,.15); color:var(--green); border:1px solid var(--green); }
.hole-badge { flex-shrink:0; font-size:10px; font-weight:700; padding:2px 7px; border-radius:5px; letter-spacing:.3px; }
.hole-badge.hole-high { background:rgba(240,160,0,.22); color:#ffc850; border:1px solid var(--amber); }
.hole-badge.hole-mid  { background:rgba(0,200,240,.15); color:var(--accent); border:1px solid var(--accent); }
.hole-badge.hole-low  { background:var(--surface2); color:var(--muted); border:1px solid var(--border); }

.evt-meta { display:flex; flex-wrap:wrap; gap:6px 12px; font-size:11px; color:var(--muted); }
.evt-meta .hi   { color:var(--text); }
.evt-meta .acc  { color:var(--accent); font-weight:700; }
.evt-meta .warn { color:var(--amber); font-weight:700; }
.evt-meta .dngr { color:var(--red);   font-weight:700; }

.evt-foot { display:flex; align-items:center; justify-content:space-between; }
.scale-bar { display:flex; gap:3px; align-items:center; }
.scale-pip { width:7px; height:7px; border-radius:2px; background:var(--border); }
.scale-pip.on { background:var(--amber); }
.scale-lbl { font-size:10px; color:var(--muted); margin-left:5px; }
.detail-btn {
  font-size:11px; color:var(--accent); border:1px solid rgba(0,200,240,.3);
  background:rgba(0,200,240,.08); border-radius:6px; padding:4px 10px;
  text-decoration:none; transition:background .15s;
}
.detail-btn:hover { background:rgba(0,200,240,.16); }

/* ── EMPTY ── */
.empty {
  display:flex; flex-direction:column; align-items:center;
  padding:56px 20px; gap:10px; color:var(--muted); text-align:center;
}
.empty-ico { font-size:44px; opacity:.25; }
.empty-ttl { font-size:14px; }
.empty-sub { font-size:12px; line-height:1.7; opacity:.7; }

/* ── SKELETON ── */
.skel-card { background:var(--surface); border:1px solid var(--border); border-radius:11px; padding:13px 14px; display:flex; flex-direction:column; gap:9px; }
.skel { border-radius:5px; background:linear-gradient(90deg,var(--surface) 25%,var(--surface2) 50%,var(--surface) 75%); background-size:200% 100%; animation:sh 1.4s infinite; }
@keyframes sh { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

/* ── REGISTER FORM ── */
.reg-wrap { padding:14px 16px 90px; display:flex; flex-direction:column; gap:14px; }

.reg-section { background:var(--surface); border:1px solid var(--border); border-radius:12px; overflow:hidden; }
.reg-section-hd {
  padding:10px 14px; font-size:11px; font-weight:700; letter-spacing:1.5px;
  color:var(--muted); border-bottom:1px solid var(--border); text-transform:uppercase;
}
.reg-fields { padding:12px 14px; display:flex; flex-direction:column; gap:10px; }

.fld { display:flex; flex-direction:column; gap:5px; }
.fld label { font-size:11px; color:var(--muted); font-weight:700; letter-spacing:.5px; }
.fld input, .fld select, .fld textarea {
  background:var(--surface2); border:1px solid var(--border); border-radius:8px;
  padding:10px 12px; color:var(--text); font-family:'Noto Sans JP',sans-serif;
  font-size:13px; outline:none; width:100%;
  transition:border-color .15s;
}
.fld input:focus, .fld select:focus, .fld textarea:focus { border-color:var(--accent); }
.fld textarea { resize:none; height:60px; }
.fld-row { display:flex; gap:10px; }
.fld-row .fld { flex:1; }

.scale-select { display:flex; gap:6px; }
.scale-opt {
  flex:1; padding:8px 4px; text-align:center; font-size:11px; border-radius:8px;
  border:1px solid var(--border); color:var(--muted); cursor:pointer; transition:all .15s;
  background:var(--surface2); line-height:1.4;
}
.scale-opt.on { border-color:var(--amber); color:var(--amber); background:rgba(240,160,0,.1); }

.geo-row { display:flex; gap:8px; align-items:flex-end; }
.geo-row .fld { flex:1; }
.geo-btn {
  flex-shrink:0; padding:10px 12px; background:var(--surface2); border:1px solid var(--border);
  border-radius:8px; color:var(--accent); font-size:12px; cursor:pointer;
  white-space:nowrap; transition:background .15s;
}
.geo-btn:hover { background:rgba(0,200,240,.1); }

.reg-list { padding:8px 14px 12px; display:flex; flex-direction:column; gap:6px; max-height:240px; overflow-y:auto; }
.reg-item {
  display:flex; align-items:center; gap:8px; padding:8px 10px;
  background:var(--surface2); border-radius:8px; font-size:12px;
}
.reg-item-name { flex:1; font-weight:700; }
.reg-item-time { color:var(--amber); font-family:'Rajdhani',sans-serif; font-size:13px; }
.reg-del { color:var(--red); background:none; border:none; font-size:16px; cursor:pointer; padding:0 2px; }

/* ── ACTION BUTTONS ── */
.action-bar {
  position:fixed; bottom:0; left:0; right:0; z-index:300;
  padding:12px 16px 20px; background:linear-gradient(transparent,var(--bg) 35%);
  display:flex; gap:10px;
}
.btn-primary {
  flex:1; display:flex; align-items:center; justify-content:center; gap:7px;
  background:linear-gradient(135deg,#005fa3,#00c8f0); border:none; border-radius:11px;
  padding:13px; color:#fff; font-family:'Noto Sans JP',sans-serif; font-size:14px;
  font-weight:700; cursor:pointer; transition:opacity .15s, transform .1s;
}
.btn-primary:active { transform:scale(.98); opacity:.9; }
.btn-primary:disabled { background:var(--border); cursor:not-allowed; transform:none; }
.btn-primary.spin .btn-ico { animation:spin 1s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
.btn-secondary {
  padding:13px 16px; background:var(--surface); border:1px solid var(--border);
  border-radius:11px; color:var(--text); font-size:13px; cursor:pointer;
  font-family:'Noto Sans JP',sans-serif; transition:border-color .15s;
}
.btn-secondary:hover { border-color:var(--accent); }

/* ── STATUS ── */
.status-bar {
  padding:7px 16px; font-size:11px; color:var(--muted);
  background:var(--bg); border-bottom:1px solid var(--border); min-height:30px;
  display:flex; align-items:center; gap:6px;
}
.status-bar.loading { color:var(--accent); }
.status-bar.ok  { color:var(--green); }
.status-bar.err { color:var(--red); }

/* ── LEAFLET OVERRIDES ── */
.my-dot { width:14px; height:14px; border-radius:50%; background:var(--accent); border:3px solid #fff; box-shadow:0 0 0 4px rgba(0,200,240,.25); }
.ev-pin { width:28px; height:28px; border-radius:50% 50% 50% 0; transform:rotate(-45deg); display:flex; align-items:center; justify-content:center; border:2px solid rgba(255,255,255,.8); font-size:12px; box-shadow:0 2px 8px rgba(0,0,0,.5); }
.ev-pin span { transform:rotate(45deg); display:block; }
.leaflet-popup-content-wrapper { background:var(--surface2); border:1px solid var(--border); color:var(--text); border-radius:10px; box-shadow:0 4px 20px rgba(0,0,0,.6); }
.leaflet-popup-tip { background:var(--surface2); }
.pop { font-size:12px; line-height:1.7; min-width:160px; }
.pop strong { font-size:13px; display:block; }
.pop .pt { color:var(--amber); font-weight:700; }
.pop .pd { color:var(--accent); font-size:11px; }
.pop-nav { display:block; margin-top:8px; text-align:center; font-size:12px; font-weight:700; padding:8px; border-radius:7px; background:#1a73e8; color:#ffffff !important; text-decoration:none; }
.pop-nav:active { opacity:.85; }
.leaflet-popup-content a.pop-nav { color:#ffffff !important; }
</style>
</head>
<body>

<header class="hdr">
  <div class="hdr-logo">EVENT<em>RADAR</em></div>
  <div class="hdr-right">
    <div class="gps-pill" id="gpsPill"><div class="gps-pip"></div><span id="gpsLbl">--</span></div>
    <div class="clock" id="clock">--:--</div>
  </div>
</header>

<div class="tabs">
  <div class="tab active" id="tabRadar" onclick="switchTab('radar')">📡 レーダー</div>
  <div class="tab" id="tabVenue" onclick="switchTab('venue')">🏛 会場</div>
  <div class="tab" id="tabReg"   onclick="switchTab('reg')">＋ 登録</div>
</div>

<!-- ═══════════ RADAR TAB ═══════════ -->
<div id="viewRadar">
  <div id="map"></div>
  <div class="status-bar" id="statusBar">スキャンボタンで周辺のイベントを確認</div>
  <div class="sort-bar" id="sortBar" style="display:none">
    <span class="sort-label">並び順</span>
    <button class="sort-btn" id="sortBtn" onclick="toggleSort()">⏰ 終了が近い順</button>
    <button class="cp-btn on" id="cpBtn" onclick="toggleConnpass()">Connpass表示</button>
    <span class="sort-hint">🎯=競合が薄い穴</span>
  </div>
  <div class="filter-bar" id="filterBar" style="display:none">
    <div class="chip on"  data-f="all"   onclick="setFilter('all')">すべて</div>
    <div class="chip"     data-f="now"   onclick="setFilter('now')">🔴 30分以内</div>
    <div class="chip"     data-f="soon"  onclick="setFilter('soon')">🟡 1時間以内</div>
    <div class="chip"     data-f="later" onclick="setFilter('later')">🔵 開催中</div>
    <div class="chip"     data-f="ended" onclick="setFilter('ended')">⚫ 終了済み</div>
  </div>
  <div id="evtList">
    <div class="empty">
      <div class="empty-ico">📡</div>
      <div class="empty-ttl">スキャン待機中</div>
      <div class="empty-sub">下のボタンで現在地周辺の<br>登録イベントを表示します</div>
    </div>
  </div>
  <div class="action-bar">
    <select id="rangeSelect" class="btn-secondary" style="padding:13px 10px; font-size:13px;">
      <option value="5">5km</option>
      <option value="10" selected>10km</option>
      <option value="20">20km</option>
      <option value="50">全件</option>
    </select>
    <button class="btn-primary" id="scanBtn" onclick="startScan()">
      <span class="btn-ico">⚡</span>
      <span id="scanTxt">スキャン</span>
    </button>
  </div>
</div>

<!-- ═══════════ VENUE TAB ═══════════ -->
<div id="viewVenue" style="display:none">
  <div class="venue-controls">
    <select class="range-select" id="venueRange" onchange="renderVenues()">
      <option value="3">3km以内</option>
      <option value="5" selected>5km以内</option>
      <option value="10">10km以内</option>
      <option value="999">全件</option>
    </select>
    <select class="range-select" id="venueCat" onchange="renderVenues()">
      <option value="all">全カテゴリ</option>
      <option value="arena">アリーナ/ドーム</option>
      <option value="hall">ホール</option>
      <option value="livehouse">ライブハウス</option>
      <option value="theater">劇場</option>
      <option value="park">公園/屋外</option>
      <option value="sports">スポーツ施設</option>
      <option value="expo">展示/見本市</option>
      <option value="hotel">ホテル宴会場</option>
    </select>
    <label class="venue-urlonly"><input type="checkbox" id="venueUrlOnly" onchange="renderVenues()"> URL有のみ</label>
  </div>
  <div class="venue-status" id="venueStatus">📍 位置情報ボタンで近くの会場を表示</div>
  <div id="venueList">
    <div class="empty">
      <div class="empty-ico">🏛</div>
      <div class="empty-ttl">会場台帳</div>
      <div class="empty-sub">下のボタンで現在地周辺の<br>イベント会場を距離順に表示</div>
    </div>
  </div>
  <div class="action-bar">
    <button class="btn-primary" id="venueGpsBtn" onclick="loadVenuesNearby()">
      <span class="btn-ico">📍</span>
      <span id="venueGpsTxt">近くの会場を表示</span>
    </button>
  </div>
</div>

<!-- ═══════════ REGISTER TAB ═══════════ -->
<div id="viewReg" style="display:none">
  <div class="reg-wrap">

    <div class="reg-section">
      <div class="reg-section-hd">イベント情報</div>
      <div class="reg-fields">
        <div class="fld">
          <label>イベント名 *</label>
          <input type="text" id="fName" placeholder="例：武道館ライブ / 神宮球場ナイター">
        </div>
        <div class="fld">
          <label>会場名 *</label>
          <input type="text" id="fVenue" placeholder="例：日本武道館 / 明治神宮野球場">
        </div>
        <div class="fld">
          <label>住所（区・町まで）*</label>
          <div class="geo-row">
            <div class="fld" style="margin:0">
              <input type="text" id="fAddr" placeholder="例：千代田区北の丸公園2-3">
            </div>
            <button class="geo-btn" onclick="geocodeAddr()">📍 座標取得</button>
          </div>
        </div>
        <div class="fld-row">
          <div class="fld">
            <label>緯度</label>
            <input type="number" id="fLat" placeholder="35.6938" step="0.0001">
          </div>
          <div class="fld">
            <label>経度</label>
            <input type="number" id="fLng" placeholder="139.7498" step="0.0001">
          </div>
        </div>
      </div>
    </div>

    <div class="reg-section">
      <div class="reg-section-hd">日時</div>
      <div class="reg-fields">
        <div class="fld">
          <label>開催日</label>
          <input type="date" id="fDate">
        </div>
        <div class="fld-row">
          <div class="fld">
            <label>開始時刻</label>
            <input type="time" id="fStart">
          </div>
          <div class="fld">
            <label>終了時刻 *</label>
            <input type="time" id="fEnd">

</div>

<script>
// ═══ STATE ═══
let userLat=null, userLng=null, map=null, userMarker=null;
let evMarkers=[], allEvents=[], filtered=[], curFilter='all';
let scaleVal=1;
const STORAGE_KEY='event_radar_events';
// Connpass自動取得データ（GitHub Actionsが毎時更新）
const CONNPASS_URL='https://raw.githubusercontent.com/odmk0791/taxi-radar/main/data/connpass_events.json';
const MANUAL_URL='https://raw.githubusercontent.com/odmk0791/taxi-radar/main/data/manual_events.json';
const VENUE_MASTER_URL='https://raw.githubusercontent.com/odmk0791/taxi-radar/main/data/venue_master.json';
// 会場台帳スプレッドシート（HironoriさんがURL等を追記）
const VENUE_SHEET_URL='https://docs.google.com/spreadsheets/d/e/2PACX-1vS7U-m7Q6G76MsSeIaJRZRmtnjwsJpWYeIo9MRJNhjv-OaDvYCRmJ-9dDHslnc1J6D5plIVEbxx5zZz/pub?gid=342590463&single=true&output=csv';
let venueSheet=[]; // スプレッドシートから読んだ会場台帳
let venueMaster=[]; // 会場マスタ（穴スコア計算用）
let sortMode='urgency'; // 'urgency'(終了が近い順) or 'hole'(穴スコア順)
let showConnpass=true; // Connpass(IT勉強会)を表示するか

// ─ Google Form placeholder（後で差し込む）─
const FORM_ACTION = 'FORM_ACTION_PLACEHOLDER';
const FIELDS = {
  name:    'FIELD_NAME',
  venue:   'FIELD_VENUE',
  address: 'FIELD_ADDR',
  lat:     'FIELD_LAT',
  lng:     'FIELD_LNG',
  date:    'FIELD_DATE',
  start:   'FIELD_START',
  end:     'FIELD_END',
  scale:   'FIELD_SCALE',
};

// ═══ CLOCK ═══
function tick(){
  const n=new Date();
  document.getElementById('clock').textContent=
    String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');
}
setInterval(tick,1000); tick();

// ═══ TAB ═══
function switchTab(t){
  document.getElementById('viewRadar').style.display = t==='radar'?'':'none';
  document.getElementById('viewVenue').style.display = t==='venue'?'':'none';
  document.getElementById('viewReg').style.display   = t==='reg'?'':'none';
  document.getElementById('tabRadar').classList.toggle('active', t==='radar');
  document.getElementById('tabVenue').classList.toggle('active', t==='venue');
  document.getElementById('tabReg').classList.toggle('active',   t==='reg');
  if(t==='reg') renderRegList();
  if(t==='radar' && map) setTimeout(()=>map.invalidateSize(),50);
}

// ═══ MAP ═══
function initMap(lat,lng){
  if(map){ map.setView([lat,lng],12); return; }
  map=L.map('map',{zoomControl:true,attributionControl:false}).setView([lat,lng],12);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{maxZoom:19}).addTo(map);
}
function setMyMarker(lat,lng){
  const ic=L.divIcon({html:'<div class="my-dot"></div>',className:'',iconSize:[14,14],iconAnchor:[7,7]});
  if(userMarker) userMarker.setLatLng([lat,lng]);
  else userMarker=L.marker([lat,lng],{icon:ic}).addTo(map).bindPopup('<div class="pop"><strong>現在地</strong></div>');
}

// ═══ GPS ═══
function getGPS(){
  return new Promise((res,rej)=>{
    if(!navigator.geolocation){ rej('GPS非対応'); return; }
    navigator.geolocation.getCurrentPosition(
      p=>res({lat:p.coords.latitude,lng:p.coords.longitude}),
      e=>rej(e.message), {timeout:10000,enableHighAccuracy:true}
    );
  });
}

// ═══ UTILS ═══
function dist(la1,lo1,la2,lo2){
  const R=6371, dL=(la2-la1)*Math.PI/180, dO=(lo2-lo1)*Math.PI/180;
  const a=Math.sin(dL/2)**2+Math.cos(la1*Math.PI/180)*Math.cos(la2*Math.PI/180)*Math.sin(dO/2)**2;
  return R*2*Math.asin(Math.sqrt(a));
}
function urgency(endISO){
  if(!endISO) return 'later';
  const m=(new Date(endISO)-Date.now())/60000;
  if(m<0) return 'ended'; if(m<=30) return 'now'; if(m<=60) return 'soon'; return 'later';
}
function timeLeft(endISO){
  if(!endISO) return '';
  const m=Math.round((new Date(endISO)-Date.now())/60000);
  if(m<0) return Math.abs(m)+'分前終了';
  if(m<60) return 'あと'+m+'分';
  return 'あと'+Math.floor(m/60)+'時間'+(m%60?m%60+'分':'');
}
function fmtT(iso){ if(!iso) return '--'; const d=new Date(iso); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function setStatus(msg,t){ const b=document.getElementById('statusBar'); b.textContent=msg; b.className='status-bar'+(t?' '+t:''); }

// ソート適用（urgency=終了が近い順 / hole=穴スコア順）
function applySorting(){
  if(sortMode==='hole'){
    allEvents.sort((a,b)=>{
      const ah=a._hole==null?-99:a._hole, bh=b._hole==null?-99:b._hole;
      return bh-ah || a._dist-b._dist; // 穴スコア高い順、同点は近い順
    });
  } else {
    allEvents.sort((a,b)=>{
      const o={now:0,soon:1,later:2,ended:3};
      return (o[a._u]??2)-(o[b._u]??2) || a._dist-b._dist;
    });
  }
}
function toggleSort(){
  sortMode = sortMode==='hole' ? 'urgency' : 'hole';
  const btn=document.getElementById('sortBtn');
  if(btn) btn.textContent = sortMode==='hole' ? '🎯 穴スコア順' : '⏰ 終了が近い順';
  applySorting();
  renderList();
}
function toggleConnpass(){
  showConnpass = !showConnpass;
  const btn=document.getElementById('cpBtn');
  if(btn){
    btn.textContent = showConnpass ? 'Connpass表示' : 'Connpass非表示';
    btn.classList.toggle('on', showConnpass);
  }
  renderList();
  // 地図ピンも連動
  const shown = showConnpass ? allEvents : allEvents.filter(e=>e._source!=='connpass');
  drawMarkers(shown);
}

const scaleLabels=['','〜500人','〜2000人','〜1万人','1万人超'];

// ═══ 穴スコア ═══
// 会場マスタを読み込む
async function loadVenueMaster(){
  if(venueMaster.length) return venueMaster;
  try{
    const r=await fetch(VENUE_MASTER_URL+'?t='+Date.now(),{signal:AbortSignal.timeout(8000)});
    if(r.ok){ const d=await r.json(); venueMaster=d.venues||[]; }
  }catch(e){}
  return venueMaster;
}
// 会場名でマスタを引く（部分一致も許容）
function findVenue(name){
  if(!name) return null;
  let v=venueMaster.find(x=>x.name===name);
  if(v) return v;
  // 部分一致（「Zepp Haneda(TOKYO)」⇔「Zepp Haneda」など）
  const norm=s=>s.replace(/[\s　()（）]/g,'').toLowerCase();
  const n=norm(name);
  v=venueMaster.find(x=>norm(x.name).includes(n)||n.includes(norm(x.name)));
  return v||null;
}
// 客層タグ→タクシー利用度
function guestScore(tag){
  if(!tag) return 2.0;
  if(tag.includes('高所得')||tag.includes('年配')) return 5.0;
  if(tag.includes('クラシック')||tag.includes('オペラ')||tag.includes('バレエ')) return 4.5;
  if(tag.includes('歌舞伎')||tag.includes('ミュージカル')||tag.includes('演劇')) return 4.0;
  if(tag.includes('宴会')||tag.includes('ビジネス')||tag.includes('学会')||tag.includes('式典')) return 4.5;
  if(tag.includes('スポーツ')) return 3.0;
  if(tag.includes('アイドル')) return 1.5;
  if(tag.includes('ライブ')) return 2.5;
  return 2.5;
}
// 終演時刻→時間点（遅いほど高い、22時以降が穴）
function timeScore(endISO){
  if(!endISO) return 0;
  const h=new Date(endISO).getHours();
  if(h>=23||h<4) return 3.0;   // 深夜＝競合激減
  if(h>=22) return 2.5;
  if(h>=21) return 1.0;        // ゴールデン＝競合集中
  if(h>=20) return 1.5;
  if(h>=19) return 2.0;        // 中途半端＝競合少なめ
  return 1.5;
}
// イベントの穴スコアを計算（会場マスタとマッチした場合のみ）
function calcHoleScore(ev){
  const v=findVenue(ev.venue);
  if(!v||v.walk_min==null||v.crowd_lv==null){ ev._venue=v; ev._hole=null; return null; }
  const walkPt=Math.min(v.walk_min/2,5);
  const locPt=(walkPt+v.rail_weak)/2;
  const gPt=guestScore(v.guest_type);
  const tPt=timeScore(ev.end_iso);
  const hole=Math.round((locPt+gPt+tPt-v.crowd_lv*1.5)*10)/10;
  ev._venue=v; ev._hole=hole;
  return hole;
}

// ═══ MARKERS ═══
function drawMarkers(evs){
  evMarkers.forEach(m=>map.removeLayer(m)); evMarkers=[];
  evs.forEach((ev,i)=>{
    if(!ev.lat||!ev.lng) return;
    const col={now:'#f03040',soon:'#f0a000',later:'#00c8f0',ended:'#404050'}[ev._u]||'#00c8f0';
    const ic=L.divIcon({
      html:'<div class="ev-pin" style="background:'+col+'"><span>📍</span></div>',
      className:'',iconSize:[28,28],iconAnchor:[14,28],popupAnchor:[0,-28]
    });
    const m=L.marker([ev.lat,ev.lng],{icon:ic}).addTo(map).bindPopup(
      '<div class="pop"><strong>'+ev.name+'</strong>'
      +'<div>'+ev.venue+'</div>'
      +'<div class="pt">終了 '+fmtT(ev.end_iso)+' ('+timeLeft(ev.end_iso)+')</div>'
      +'<div class="pd">📍 '+(ev._dist?ev._dist.toFixed(1)+'km':'')+'</div>'
      +'<a class="pop-nav" href="https://www.google.com/maps/dir/?api=1&destination='+ev.lat+','+ev.lng+'&travelmode=driving" target="_blank" rel="noopener">🚗 Googleマップで経路</a>'
      +'</div>'
    );
    evMarkers.push(m);
  });
}

// ═══ FILTER ═══
function setFilter(f){
  curFilter=f;
  document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.f===f));
  renderList();
}

// ═══ RENDER EVENT LIST ═══
function renderList(){
  const list=document.getElementById('evtList');
  let evs=curFilter==='all'?allEvents:allEvents.filter(e=>e._u===curFilter);
  if(!showConnpass) evs=evs.filter(e=>e._source!=='connpass');
  if(!evs.length){
    list.innerHTML='<div class="empty"><div class="empty-ico">🔍</div><div class="empty-ttl">該当なし</div></div>';
    return;
  }
  const ul={now:'まもなく終了',soon:'1時間以内',later:'開催中',ended:'終了済み'};
  let h='<div class="evt-list">';
  evs.forEach(ev=>{
    const u=ev._u, tc=u==='now'?'dngr':u==='soon'?'warn':'acc';
    const idx=allEvents.indexOf(ev);
    const sc=parseInt(ev.scale)||1;
    const pips=Array(4).fill(0).map((_,j)=>'<div class="scale-pip'+(j<sc?' on':'')+'"></div>').join('');
    // 穴スコアバッジ（マスタにある会場のみ）
    let holeBadge='';
    if(ev._hole!=null){
      const hcls = ev._hole>=4?'hole-high' : ev._hole>=2?'hole-mid' : 'hole-low';
      holeBadge='<span class="hole-badge '+hcls+'">穴 '+ev._hole+'</span>';
    }
    h+='<div class="evt-card u-'+u+'" onclick="focusEv('+idx+')">'
      +'<div class="evt-top"><div class="evt-name">'+ev.name+'</div>'
      +'<div style="display:flex;gap:5px;align-items:center;flex-shrink:0">'+holeBadge+'<div class="badge '+u+'">'+ul[u]+'</div></div></div>'
      +'<div class="evt-meta">'
      +'<span class="hi">🏛 '+ev.venue+'</span>'
      +'<span class="'+tc+'">⏰ <strong>'+fmtT(ev.end_iso)+'</strong>終了'+(timeLeft(ev.end_iso)?' ('+timeLeft(ev.end_iso)+')':'')+'</span>'
      +(ev._dist<900?'<span>📍 '+ev._dist.toFixed(1)+'km</span>':'')
      +'</div>'
      +'<div class="evt-foot">'
      +'<div class="scale-bar">'+pips+'<span class="scale-lbl">'+scaleLabels[sc]+'</span></div>'
      +'<button class="detail-btn" onclick="event.stopPropagation();focusEv('+idx+')">地図で見る</button>'
      +'</div></div>';
  });
  h+='</div>';
  list.innerHTML=h;
}

function focusEv(i){
  const ev=allEvents[i];
  if(!ev||!ev.lat||!ev.lng||!map) return;
  map.setView([ev.lat,ev.lng],15);
  evMarkers[i]?.openPopup();
  switchTab('radar');
  document.getElementById('viewRadar').scrollIntoView({behavior:'smooth'});
}

// ═══ 会場タブ ═══
const VENUE_CAT_JP={arena:'アリーナ',hall:'ホール',livehouse:'ライブH',theater:'劇場',
  park:'公園',sports:'スポーツ',expo:'展示',hotel:'ホテル',univ:'大学',club:'クラブ',
  cinema:'映画',shrine:'神社',mall:'商業',aquarium:'水族',terminal:'港'};

// スプレッドシートから会場台帳を読み込み
async function loadVenueSheet(){
  if(venueSheet.length) return venueSheet;
  return new Promise((resolve)=>{
    Papa.parse(VENUE_SHEET_URL+'&t='+Date.now(),{
      download:true, header:true, skipEmptyLines:true,
      complete:(res)=>{
        venueSheet=(res.data||[]).filter(v=>v.name&&v.lat&&v.lng).map(v=>({
          name:v.name, ward:v.ward||'', category:v.category||'',
          capacity:parseInt(v.capacity)||0,
          lat:parseFloat(v.lat), lng:parseFloat(v.lng),
          schedule_url:(v.schedule_url||'').trim(),
          guest_type:v.guest_type||''
        }));
        resolve(venueSheet);
      },
      error:()=>resolve([])
    });
  });
}

async function loadVenuesNearby(){
  const btn=document.getElementById('venueGpsBtn');
  btn.disabled=true; btn.classList.add('spin');
  document.getElementById('venueGpsTxt').textContent='取得中...';
  const vs=document.getElementById('venueStatus');

  vs.textContent='📍 現在地を取得中...'; vs.className='venue-status';
  try{
    const p=await getGPS();
    userLat=p.lat; userLng=p.lng;
    const pill=document.getElementById('gpsPill');
    pill.className='gps-pill on';
    document.getElementById('gpsLbl').textContent=userLat.toFixed(3)+','+userLng.toFixed(3);
  }catch(e){
    userLat=35.6812; userLng=139.7671;
    vs.textContent='⚠ GPS失敗（東京中心で表示）';
  }

  vs.textContent='📂 会場台帳を読み込み中...';
  await loadVenueSheet();
  renderVenues();

  btn.disabled=false; btn.classList.remove('spin');
  document.getElementById('venueGpsTxt').textContent='再取得';
}

function renderVenues(){
  if(!venueSheet.length) return;
  const range=parseInt(document.getElementById('venueRange').value);
  const cat=document.getElementById('venueCat').value;
  const urlOnly=document.getElementById('venueUrlOnly').checked;
  const vs=document.getElementById('venueStatus');

  let list=venueSheet.map(v=>({
    ...v,
    _dist:(userLat&&v.lat&&v.lng)?dist(userLat,userLng,v.lat,v.lng):999
  }));

  list=list.filter(v=>v._dist<=range);
  if(cat!=='all') list=list.filter(v=>v.category===cat);
  if(urlOnly) list=list.filter(v=>v.schedule_url);
  list.sort((a,b)=>a._dist-b._dist);

  const el=document.getElementById('venueList');
  if(!list.length){
    el.innerHTML='<div class="empty"><div class="empty-ico">🔍</div><div class="empty-ttl">該当会場なし</div><div class="empty-sub">範囲やカテゴリを変えてお試しください</div></div>';
    vs.textContent='0件'; vs.className='venue-status';
    return;
  }
  vs.textContent='✅ '+list.length+'会場（近い順）'; vs.className='venue-status ok';

  let h='<div class="venue-list">';
  list.forEach(v=>{
    const cap=v.capacity>0?v.capacity.toLocaleString()+'人':'';
    const urlBtn=v.schedule_url
      ? '<a class="venue-url-btn" href="'+v.schedule_url+'" target="_blank" rel="noopener">📅 スケジュールを見る</a>'
      : '<span class="venue-url-btn disabled">URL未登録</span>';
    h+='<div class="venue-card">'
      +'<div class="venue-card-top"><div class="venue-name">'+v.name+'</div>'
      +'<span class="venue-cat-tag">'+(VENUE_CAT_JP[v.category]||v.category)+'</span></div>'
      +'<div class="venue-meta">'
      +'<span class="dist">📍 '+v._dist.toFixed(1)+'km</span>'
      +'<span>'+v.ward+'</span>'
      +(cap?'<span>👥 '+cap+'</span>':'')
      +(v.guest_type?'<span>'+v.guest_type+'</span>':'')
      +'</div>'
      +'<div class="venue-foot">'+urlBtn
      +'<button class="venue-map-btn" onclick="venueOnMap('+v.lat+','+v.lng+",'"+v.name.replace(/'/g,"\\'")+"')\">🗺</button>"
      +'</div></div>';
  });
  h+='</div>';
  el.innerHTML=h;
}

function venueOnMap(lat,lng,name){
  switchTab('radar');
  if(!map) initMap(lat,lng);
  setTimeout(()=>{
    map.invalidateSize();
    map.setView([lat,lng],15);
    L.popup().setLatLng([lat,lng]).setContent('<div class="pop"><strong>'+name+'</strong><a class="pop-nav" href="https://www.google.com/maps/dir/?api=1&destination='+lat+','+lng+'&travelmode=driving" target="_blank" rel="noopener">🚗 Googleマップで経路</a></div>').openOn(map);
  },100);
  document.getElementById('viewRadar').scrollIntoView({behavior:'smooth'});
}

// ═══ SCAN ═══
async function startScan(){
  const btn=document.getElementById('scanBtn');
  btn.disabled=true; btn.classList.add('spin');
  document.getElementById('scanTxt').textContent='取得中...';

  setStatus('📡 現在地を取得中...','loading');
  try{
    const p=await getGPS();
    userLat=p.lat; userLng=p.lng;
    const pill=document.getElementById('gpsPill');
    pill.className='gps-pill on';
    document.getElementById('gpsLbl').textContent=userLat.toFixed(3)+','+userLng.toFixed(3);
    initMap(userLat,userLng); setMyMarker(userLat,userLng);
  }catch(e){
    userLat=35.6812; userLng=139.7671;
    initMap(userLat,userLng); setMyMarker(userLat,userLng);
    setStatus('⚠ GPS失敗（東京中心で表示）');
  }

  // ── データ収集：手動登録 + Connpass自動取得をマージ ──
  const range=parseInt(document.getElementById('rangeSelect').value);
  const today=new Date().toISOString().slice(0,10);

  // 1) 手動登録イベント（localStorage）
  const manualEvents=loadEvents()
    .filter(ev=>ev.date===today || !ev.date)
    .map(ev=>({...ev, _source:'manual'}));

  // 2) Connpass自動取得イベント（GitHub Actions JSON）
  let connpassEvents=[];
  setStatus('📂 Connpassデータを取得中...','loading');
  try{
    const r=await fetch(CONNPASS_URL+'?t='+Date.now(),{signal:AbortSignal.timeout(8000)});
    if(r.ok){
      const data=await r.json();
      connpassEvents=(data.events||[])
        .filter(ev=>ev.ended_at)
        .map(ev=>({
          id: 'cp_'+ev.id,
          name: ev.title,
          venue: ev.place||'(会場未定)',
          address: ev.address||'',
          lat: parseFloat(ev.lat)||null,
          lng: parseFloat(ev.lon)||null,
          date: (ev.started_at||'').slice(0,10),
          start_iso: ev.started_at,
          end_iso: ev.ended_at,
          scale: ev.accepted>500?3:ev.accepted>200?2:1,
          accepted: ev.accepted,
          url: ev.url,
          _source:'connpass'
        }))
        .filter(ev=>ev.date===today || !ev.date);
    }
  }catch(e){ /* Connpass取得失敗時は手動のみで継続 */ }

  // 2.5) サーバー側の手動イベント（data/manual_events.json）
  let serverEvents=[];
  try{
    const r=await fetch(MANUAL_URL+'?t='+Date.now(),{signal:AbortSignal.timeout(8000)});
    if(r.ok){
      const data=await r.json();
      serverEvents=(data.events||[])
        .filter(ev=>ev.ended_at)
        .map(ev=>({
          id: ev.id,
          name: ev.name,
          venue: ev.venue||'(会場未定)',
          address: ev.address||'',
          lat: parseFloat(ev.lat)||null,
          lng: parseFloat(ev.lon)||null,
          date: (ev.started_at||'').slice(0,10),
          start_iso: ev.started_at,
          end_iso: ev.ended_at,
          scale: ev.accepted>10000?4:ev.accepted>2000?3:ev.accepted>500?2:1,
          accepted: ev.accepted,
          url: ev.url||'',
          _source:'manual'
        }))
        .filter(ev=>ev.date===today || !ev.date);
    }
  }catch(e){ /* 取得失敗時はスキップ */ }

  // 会場マスタを読み込み（穴スコア計算用）
  await loadVenueMaster();

  // 3) マージ → 距離・緊急度・穴スコアを計算 → 絞り込み → ソート
  allEvents = [...manualEvents, ...serverEvents, ...connpassEvents]
    .map(ev=>{
      const e={
        ...ev,
        _dist: (userLat&&ev.lat&&ev.lng) ? dist(userLat,userLng,ev.lat,ev.lng) : 999,
        _u: urgency(ev.end_iso)
      };
      calcHoleScore(e); // e._hole に穴スコア、e._venue にマスタ会場
      return e;
    })
    .filter(ev=>range>=50 || ev._dist<=range);

  applySorting();

  if(!allEvents.length){
    setStatus('本日のイベントなし — 手動登録するかConnpass更新を待ってください','err');
    document.getElementById('evtList').innerHTML=
      '<div class="empty"><div class="empty-ico">📋</div>'
      +'<div class="empty-ttl">本日のイベントなし</div>'
      +'<div class="empty-sub">「＋ イベント登録」タブから追加するか<br>Connpassの自動更新（毎時）をお待ちください</div></div>';
  } else {
    const mc=manualEvents.length+serverEvents.length, cc=connpassEvents.length;
    setStatus('✅ '+allEvents.length+'件表示中（手動'+mc+' / Connpass'+cc+'）','ok');
    document.getElementById('filterBar').style.display='flex';
    document.getElementById('sortBar').style.display='flex';
    renderList();
    drawMarkers(allEvents);
    if(allEvents.length>0){
      const pts=allEvents.filter(e=>e.lat&&e.lng).map(e=>[e.lat,e.lng]);
      if(userLat) pts.push([userLat,userLng]);
      if(pts.length>1) map.fitBounds(L.latLngBounds(pts).pad(0.2));
    }
  }

  btn.disabled=false; btn.classList.remove('spin');
  document.getElementById('scanTxt').textContent='スキャン';
}

// ═══ LOCAL STORAGE ═══
function loadEvents(){ try{ return JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]'); }catch{ return []; } }
function saveEvents(evs){ localStorage.setItem(STORAGE_KEY, JSON.stringify(evs)); }

// ═══ SCALE ═══
function setScale(v){
  scaleVal=v;
  document.querySelectorAll('.scale-opt').forEach(o=>o.classList.toggle('on',parseInt(o.dataset.v)===v));
}

// ═══ GEOCODE ═══
async function geocodeAddr(){
  const addr=document.getElementById('fAddr').value.trim();
  if(!addr){ alert('住所を入力してください'); return; }
  const url='https://nominatim.openstreetmap.org/search?format=json&q='+encodeURIComponent(addr+'、日本')+'&limit=1';
  try{
    const r=await fetch(url,{headers:{'Accept-Language':'ja'}});
    const d=await r.json();
    if(!d.length){ alert('座標が見つかりませんでした'); return; }
    document.getElementById('fLat').value=parseFloat(d[0].lat).toFixed(5);
    document.getElementById('fLng').value=parseFloat(d[0].lon).toFixed(5);
  }catch(e){ alert('取得失敗: '+e.message); }
}

// ═══ REGISTER ═══
function registerEvent(){
  const name=document.getElementById('fName').value.trim();
  const venue=document.getElementById('fVenue').value.trim();
  const addr=document.getElementById('fAddr').value.trim();
  const lat=parseFloat(document.getElementById('fLat').value)||null;
  const lng=parseFloat(document.getElementById('fLng').value)||null;
  const date=document.getElementById('fDate').value;
  const start=document.getElementById('fStart').value;
  const end=document.getElementById('fEnd').value;

  if(!name||!venue||!end){ alert('イベント名・会場名・終了時刻は必須です'); return; }

  const endISO = date && end ? date+'T'+end+':00' : null;
  const startISO = date && start ? date+'T'+start+':00' : null;

  const ev={
    id: Date.now(),
    name, venue, address:addr,
    lat, lng,
    date: date||new Date().toISOString().slice(0,10),
    start_iso: startISO,
    end_iso: endISO,
    scale: scaleVal,
  };

  const evs=loadEvents();
  evs.push(ev);
  saveEvents(evs);

  // Googleフォームにも送信（フォームID設定後に有効化）
  if(FORM_ACTION !== 'FORM_ACTION_PLACEHOLDER'){
    const fd=new FormData();
    fd.append(FIELDS.name,   name);
    fd.append(FIELDS.venue,  venue);
    fd.append(FIELDS.address,addr);
    fd.append(FIELDS.lat,    lat||'');
    fd.append(FIELDS.lng,    lng||'');
    fd.append(FIELDS.date,   date);
    fd.append(FIELDS.start,  start);
    fd.append(FIELDS.end,    end);
    fd.append(FIELDS.scale,  scaleVal);
    fetch(FORM_ACTION,{method:'POST',mode:'no-cors',body:fd}).catch(()=>{});
  }

  renderRegList();
  clearForm();
  alert('登録しました：'+name);
}

// ═══ REGISTER LIST ═══
function renderRegList(){
  const evs=loadEvents();
  const today=new Date().toISOString().slice(0,10);
  const todayEvs=evs.filter(e=>e.date===today||!e.date);
  const el=document.getElementById('regList');
  if(!todayEvs.length){
    el.innerHTML='<div class="empty" style="padding:20px"><div class="empty-sub">まだ登録がありません</div></div>';
    return;
  }
  el.innerHTML='<div class="reg-list">'+todayEvs.map(ev=>
    '<div class="reg-item">'
    +'<div class="reg-item-name">'+ev.name+'</div>'
    +'<div class="reg-item-time">〜'+fmtT(ev.end_iso)+'</div>'
    +'<button class="reg-del" onclick="deleteEv('+ev.id+')">✕</button>'
    +'</div>'
  ).join('')+'</div>';
}

function deleteEv(id){
  if(!confirm('削除しますか？')) return;
  saveEvents(loadEvents().filter(e=>e.id!==id));
  renderRegList();
}

// ═══ FORM UTILS ═══
function clearForm(){
  ['fName','fVenue','fAddr','fLat','fLng','fStart','fEnd'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('fDate').value=new Date().toISOString().slice(0,10);
  setScale(1);
}

// ═══ INIT ═══
(function init(){
  // デフォルト日付を今日に
  document.getElementById('fDate').value=new Date().toISOString().slice(0,10);
  // 地図初期化
  initMap(35.6812,139.7671);
  // 登録リスト表示
  renderRegList();
})();
</script>
