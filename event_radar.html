<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>イベントレーダー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root {
    --bg: #0a0e1a;
    --surface: #111827;
    --surface2: #1a2235;
    --border: #1e2d45;
    --accent: #00d4ff;
    --accent2: #ff6b35;
    --accent3: #7fff6b;
    --text: #e2e8f0;
    --text-muted: #64748b;
    --danger: #ff4444;
    --warn: #ffbb33;
    --green: #22c55e;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans JP', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Grid noise texture */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,212,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,212,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .header {
    position: relative;
    z-index: 10;
    padding: 16px 20px 12px;
    border-bottom: 1px solid var(--border);
    background: rgba(10,14,26,0.95);
    backdrop-filter: blur(8px);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .logo {
    font-family: 'Rajdhani', sans-serif;
    font-size: 22px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .logo span {
    color: var(--accent2);
  }

  .pulse-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
    animation: pulse-anim 2s infinite;
  }

  @keyframes pulse-anim {
    0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(0,212,255,0.4); }
    50% { opacity: 0.6; box-shadow: 0 0 0 6px rgba(0,212,255,0); }
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .gps-badge {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    color: var(--text-muted);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 4px 10px;
  }

  .gps-badge.active { color: var(--green); border-color: var(--green); }
  .gps-badge.active .gps-dot { background: var(--green); }
  .gps-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-muted); }

  .now-time {
    font-family: 'Rajdhani', sans-serif;
    font-size: 13px;
    color: var(--accent);
    letter-spacing: 1px;
  }

  /* Map */
  #map {
    position: relative;
    z-index: 1;
    width: 100%;
    height: 280px;
    border-bottom: 1px solid var(--border);
  }

  /* Scan button */
  .scan-area {
    position: relative;
    z-index: 10;
    padding: 14px 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 10px;
    align-items: center;
  }

  .btn-scan {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: linear-gradient(135deg, #0066cc, #00d4ff);
    border: none;
    border-radius: 10px;
    padding: 12px 20px;
    color: #fff;
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.5px;
  }

  .btn-scan:hover { opacity: 0.85; transform: translateY(-1px); }
  .btn-scan:active { transform: translateY(0); }
  .btn-scan:disabled { background: var(--border); cursor: not-allowed; transform: none; }

  .btn-scan .scan-icon {
    font-size: 16px;
    animation: none;
  }

  .btn-scan.scanning .scan-icon {
    animation: spin 1s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .range-select {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    color: var(--text);
    font-size: 13px;
    outline: none;
  }

  /* Status bar */
  .status-bar {
    position: relative;
    z-index: 10;
    padding: 8px 20px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    font-size: 12px;
    color: var(--text-muted);
    min-height: 32px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .status-bar.loading { color: var(--accent); }
  .status-bar.error { color: var(--danger); }
  .status-bar.success { color: var(--green); }

  /* Event list */
  .event-list {
    position: relative;
    z-index: 1;
    padding: 12px 16px 80px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .event-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    transition: border-color 0.2s, transform 0.15s;
    cursor: pointer;
    position: relative;
    overflow: hidden;
  }

  .event-card::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    border-radius: 3px 0 0 3px;
  }

  .event-card.urgency-now::before { background: var(--danger); }
  .event-card.urgency-soon::before { background: var(--warn); }
  .event-card.urgency-later::before { background: var(--accent); }
  .event-card.urgency-ended::before { background: var(--text-muted); }

  .event-card:hover {
    border-color: var(--accent);
    transform: translateY(-1px);
  }

  .event-card.urgency-ended { opacity: 0.5; }

  .card-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 8px;
  }

  .event-name {
    font-size: 14px;
    font-weight: 700;
    line-height: 1.4;
    flex: 1;
  }

  .urgency-badge {
    flex-shrink: 0;
    font-size: 11px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 20px;
    letter-spacing: 0.5px;
  }

  .urgency-badge.now { background: rgba(255,68,68,0.2); color: var(--danger); border: 1px solid var(--danger); }
  .urgency-badge.soon { background: rgba(255,187,51,0.2); color: var(--warn); border: 1px solid var(--warn); }
  .urgency-badge.later { background: rgba(0,212,255,0.15); color: var(--accent); border: 1px solid var(--accent); }
  .urgency-badge.ended { background: var(--surface2); color: var(--text-muted); border: 1px solid var(--border); }

  .card-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    font-size: 12px;
    color: var(--text-muted);
  }

  .meta-item {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .meta-item.highlight { color: var(--text); }
  .meta-item.accent-color { color: var(--accent); }
  .meta-item.warn-color { color: var(--warn); }
  .meta-item.danger-color { color: var(--danger); }

  .venue-tag {
    font-size: 11px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 2px 8px;
    color: var(--text-muted);
  }

  .card-bottom {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .crowd-bar {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: var(--text-muted);
  }

  .crowd-dots {
    display: flex;
    gap: 3px;
  }

  .crowd-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--border);
  }

  .crowd-dot.filled { background: var(--accent2); }

  .nav-btn {
    font-size: 11px;
    color: var(--accent);
    background: rgba(0,212,255,0.1);
    border: 1px solid rgba(0,212,255,0.3);
    border-radius: 6px;
    padding: 4px 10px;
    cursor: pointer;
    text-decoration: none;
    transition: background 0.2s;
  }

  .nav-btn:hover { background: rgba(0,212,255,0.2); }

  /* Empty state */
  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 60px 20px;
    gap: 12px;
    color: var(--text-muted);
    text-align: center;
  }

  .empty-icon { font-size: 48px; opacity: 0.3; }
  .empty-text { font-size: 14px; }
  .empty-hint { font-size: 12px; opacity: 0.6; }

  /* Skeleton */
  .skeleton {
    background: linear-gradient(90deg, var(--surface) 25%, var(--surface2) 50%, var(--surface) 75%);
    background-size: 200% 100%;
    animation: shimmer 1.5s infinite;
    border-radius: 6px;
  }

  @keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  .skeleton-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  /* Leaflet custom */
  .leaflet-container { background: #0d1520; }

  .event-marker-icon {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    border-radius: 50% 50% 50% 0;
    transform: rotate(-45deg);
    border: 2px solid #fff;
    font-size: 14px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.5);
  }

  .event-marker-icon span {
    transform: rotate(45deg);
    display: block;
    line-height: 1;
  }

  .my-loc-icon {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--accent);
    border: 3px solid #fff;
    box-shadow: 0 0 0 4px rgba(0,212,255,0.3), 0 2px 8px rgba(0,0,0,0.5);
  }

  /* Popup */
  .leaflet-popup-content-wrapper {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 10px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  }

  .leaflet-popup-tip { background: var(--surface2); }

  .popup-inner { font-size: 13px; line-height: 1.6; min-width: 180px; }
  .popup-inner strong { font-size: 14px; display: block; margin-bottom: 4px; }
  .popup-end { color: var(--warn); font-weight: 700; }
  .popup-dist { color: var(--accent); font-size: 12px; }

  /* Sort/filter bar */
  .filter-bar {
    position: relative;
    z-index: 10;
    padding: 8px 16px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 6px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }

  .filter-bar::-webkit-scrollbar { display: none; }

  .filter-chip {
    flex-shrink: 0;
    font-size: 11px;
    padding: 5px 12px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-muted);
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }

  .filter-chip.active {
    border-color: var(--accent);
    background: rgba(0,212,255,0.1);
    color: var(--accent);
  }

  .section-title {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    color: var(--text-muted);
    text-transform: uppercase;
    padding: 10px 16px 4px;
    position: relative;
    z-index: 1;
  }

  @media (max-width: 400px) {
    .logo { font-size: 18px; }
    #map { height: 220px; }
  }
</style>
</head>
<body>

<header class="header">
  <div class="header-left">
    <div class="pulse-dot"></div>
    <div class="logo">Event<span>Radar</span></div>
  </div>
  <div class="header-right">
    <div class="gps-badge" id="gpsBadge">
      <div class="gps-dot"></div>
      <span id="gpsLabel">GPS待機中</span>
    </div>
    <div class="now-time" id="nowTime"></div>
  </div>
</header>

<div id="map"></div>

<div class="scan-area">
  <select class="range-select" id="rangeSelect">
    <option value="5">5km圏内</option>
    <option value="10" selected>10km圏内</option>
    <option value="20">20km圏内</option>
    <option value="50">50km圏内</option>
  </select>
  <button class="btn-scan" id="scanBtn" onclick="startScan()">
    <span class="scan-icon">⚡</span>
    <span id="scanBtnText">イベントをスキャン</span>
  </button>
</div>

<div class="status-bar" id="statusBar">
  準備完了 — スキャンボタンで都内のイベントを検索
</div>

<div class="filter-bar" id="filterBar" style="display:none">
  <div class="filter-chip active" data-filter="all" onclick="setFilter('all')">すべて</div>
  <div class="filter-chip" data-filter="now" onclick="setFilter('now')">🔴 まもなく終了</div>
  <div class="filter-chip" data-filter="soon" onclick="setFilter('soon')">🟡 1時間以内</div>
  <div class="filter-chip" data-filter="later" onclick="setFilter('later')">🔵 開催中</div>
  <div class="filter-chip" data-filter="ended" onclick="setFilter('ended')">⚫ 終了済み</div>
</div>

<div id="eventContainer">
  <div class="empty-state">
    <div class="empty-icon">📡</div>
    <div class="empty-text">スキャン待機中</div>
    <div class="empty-hint">上のボタンを押して現在地周辺の<br>イベント終了時間を取得</div>
  </div>
</div>

<script>
const ANTHROPIC_SYSTEM = `あなたは東京都内のイベント情報を収集するアシスタントです。
web_searchツールを使って、現在開催中または本日開催予定の都内イベントを調べてください。

以下の形式のJSONのみを返してください（前後に説明文・コードブロック不要）:
{
  "events": [
    {
      "name": "イベント名",
      "venue": "会場名",
      "address": "住所（区まで）",
      "lat": 緯度(数値),
      "lng": 経度(数値),
      "start_time": "HH:MM",
      "end_time": "HH:MM",
      "crowd_level": 1〜5の数値（予想来場者規模：1=〜100人, 2=〜500人, 3=〜2000人, 4=〜10000人, 5=10000人超）,
      "category": "コンサート|スポーツ|花火|祭り|展示会|演劇|その他",
      "note": "簡単な補足（任意）"
    }
  ],
  "searched_at": "YYYY-MM-DD HH:MM",
  "summary": "検索結果の要約（1〜2文）"
}

- 今日の日付・現在時刻を考慮して、終了時刻が過去のものも含めて10件程度返す
- lat/lngは実際の会場の座標を使う
- 情報が不明な場合はその会場の代表座標を使う
- JSONのみ返すこと。絶対に余分なテキストを含めない`;

let userLat = null, userLng = null;
let map = null, userMarker = null;
let eventMarkers = [];
let allEvents = [];
let currentFilter = 'all';

// Clock
function updateClock() {
  const now = new Date();
  const h = String(now.getHours()).padStart(2, '0');
  const m = String(now.getMinutes()).padStart(2, '0');
  document.getElementById('nowTime').textContent = `${h}:${m}`;
}
setInterval(updateClock, 1000);
updateClock();

// Map init
function initMap(lat, lng) {
  if (map) {
    map.setView([lat, lng], 12);
    return;
  }
  map = L.map('map', { zoomControl: true, attributionControl: false }).setView([lat, lng], 12);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    maxZoom: 19
  }).addTo(map);
}

function setUserMarker(lat, lng) {
  const icon = L.divIcon({
    html: '<div class="my-loc-icon"></div>',
    className: '',
    iconSize: [16, 16],
    iconAnchor: [8, 8]
  });
  if (userMarker) userMarker.setLatLng([lat, lng]);
  else userMarker = L.marker([lat, lng], { icon }).addTo(map).bindPopup('<div class="popup-inner"><strong>現在地</strong></div>');
}

// GPS
function getGPS() {
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) { reject('GPS未対応'); return; }
    navigator.geolocation.getCurrentPosition(
      p => resolve({ lat: p.coords.latitude, lng: p.coords.longitude }),
      e => reject(e.message),
      { timeout: 10000, enableHighAccuracy: true }
    );
  });
}

// Haversine distance km
function calcDist(lat1, lng1, lat2, lng2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLng = (lng2 - lng1) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return R * 2 * Math.asin(Math.sqrt(a));
}

// Time helpers
function parseTime(timeStr) {
  if (!timeStr) return null;
  const [h, m] = timeStr.split(':').map(Number);
  const now = new Date();
  now.setHours(h, m, 0, 0);
  return now;
}

function getUrgency(endTimeStr) {
  if (!endTimeStr) return 'later';
  const end = parseTime(endTimeStr);
  const now = new Date();
  const diff = (end - now) / 60000; // minutes
  if (diff < 0) return 'ended';
  if (diff <= 30) return 'now';
  if (diff <= 60) return 'soon';
  return 'later';
}

function timeUntilEnd(endTimeStr) {
  if (!endTimeStr) return '';
  const end = parseTime(endTimeStr);
  const now = new Date();
  const diff = Math.round((end - now) / 60000);
  if (diff < 0) return `${Math.abs(diff)}分前に終了`;
  if (diff < 60) return `あと${diff}分`;
  return `あと${Math.floor(diff/60)}時間${diff%60}分`;
}

// Markers
function addEventMarkers(events) {
  eventMarkers.forEach(m => map.removeLayer(m));
  eventMarkers = [];

  events.forEach((ev, i) => {
    if (!ev.lat || !ev.lng) return;
    const urgency = ev._urgency || getUrgency(ev.end_time);
    const colors = { now: '#ff4444', soon: '#ffbb33', later: '#00d4ff', ended: '#555' };
    const color = colors[urgency] || '#00d4ff';
    const emoji = { コンサート:'🎵', スポーツ:'🏟', 花火:'🎆', 祭り:'🎋', 展示会:'🖼', 演劇:'🎭' };
    const icon = emoji[ev.category] || '📍';

    const divIcon = L.divIcon({
      html: `<div class="event-marker-icon" style="background:${color}"><span>${icon}</span></div>`,
      className: '',
      iconSize: [32, 32],
      iconAnchor: [16, 32],
      popupAnchor: [0, -32]
    });

    const marker = L.marker([ev.lat, ev.lng], { icon: divIcon })
      .addTo(map)
      .bindPopup(`<div class="popup-inner">
        <strong>${ev.name}</strong>
        <div>${ev.venue}</div>
        <div class="popup-end">終了: ${ev.end_time || '不明'} (${timeUntilEnd(ev.end_time)})</div>
        <div class="popup-dist">📍 ${ev._dist ? ev._dist.toFixed(1)+'km' : ''}</div>
      </div>`);

    eventMarkers.push(marker);
  });
}

// Filter
function setFilter(f) {
  currentFilter = f;
  document.querySelectorAll('.filter-chip').forEach(c => c.classList.toggle('active', c.dataset.filter === f));
  renderEvents(allEvents);
}

// Render
function renderEvents(events) {
  const container = document.getElementById('eventContainer');

  const filtered = currentFilter === 'all' ? events : events.filter(e => e._urgency === currentFilter);

  if (filtered.length === 0) {
    container.innerHTML = `<div class="empty-state"><div class="empty-icon">🔍</div><div class="empty-text">該当イベントなし</div></div>`;
    return;
  }

  const urgencyLabels = { now: 'まもなく終了', soon: '1時間以内', later: '開催中', ended: '終了済み' };
  const urgencyBadge = { now: 'now', soon: 'soon', later: 'later', ended: 'ended' };

  let html = '<div class="event-list">';

  filtered.forEach((ev, i) => {
    const urgency = ev._urgency;
    const badge = urgencyLabels[urgency] || '';
    const badgeCls = urgencyBadge[urgency] || 'later';
    const dist = ev._dist ? `${ev._dist.toFixed(1)}km` : '距離不明';
    const timeLeft = timeUntilEnd(ev.end_time);

    const crowdDots = Array(5).fill(0).map((_, j) => `<div class="crowd-dot${j < ev.crowd_level ? ' filled' : ''}"></div>`).join('');

    const navUrl = `https://www.google.com/maps/dir/?api=1&destination=${ev.lat},${ev.lng}&travelmode=driving`;

    html += `
    <div class="event-card urgency-${urgency}" onclick="focusEvent(${i})">
      <div class="card-top">
        <div class="event-name">${ev.name}</div>
        <div class="urgency-badge ${badgeCls}">${badge}</div>
      </div>
      <div class="card-meta">
        <div class="meta-item"><span>🏛</span><span>${ev.venue}</span></div>
        <div class="meta-item ${urgency === 'now' ? 'danger-color' : urgency === 'soon' ? 'warn-color' : 'accent-color'}">
          <span>⏰</span><span><strong>${ev.end_time || '不明'}</strong>終了 ${timeLeft ? '('+timeLeft+')' : ''}</span>
        </div>
        <div class="meta-item"><span>📍</span><span>${dist}</span></div>
        <div class="venue-tag">${ev.category || 'その他'}</div>
      </div>
      ${ev.note ? `<div style="font-size:12px;color:var(--text-muted);padding-left:4px">${ev.note}</div>` : ''}
      <div class="card-bottom">
        <div class="crowd-bar">
          <div class="crowd-dots">${crowdDots}</div>
          <span>来場規模 ${['', '〜100人','〜500人','〜2000人','〜1万人','1万人超'][ev.crowd_level] || ''}</span>
        </div>
        <a class="nav-btn" href="${navUrl}" target="_blank" onclick="event.stopPropagation()">ナビ →</a>
      </div>
    </div>`;
  });

  html += '</div>';
  container.innerHTML = html;
}

function focusEvent(idx) {
  const ev = allEvents[idx];
  if (!ev || !ev.lat || !ev.lng || !map) return;
  map.setView([ev.lat, ev.lng], 14);
  eventMarkers[idx]?.openPopup();
}

// Skeletons
function showSkeletons() {
  const container = document.getElementById('eventContainer');
  let html = '<div class="event-list">';
  for (let i = 0; i < 5; i++) {
    html += `<div class="skeleton-card">
      <div class="skeleton" style="height:18px;width:70%"></div>
      <div class="skeleton" style="height:13px;width:50%"></div>
      <div class="skeleton" style="height:13px;width:40%"></div>
    </div>`;
  }
  html += '</div>';
  container.innerHTML = html;
}

function setStatus(msg, type = '') {
  const bar = document.getElementById('statusBar');
  bar.textContent = msg;
  bar.className = 'status-bar' + (type ? ' ' + type : '');
}

// Main scan
async function startScan() {
  const btn = document.getElementById('scanBtn');
  const btnText = document.getElementById('scanBtnText');

  btn.disabled = true;
  btn.classList.add('scanning');
  btn.querySelector('.scan-icon').textContent = '🔄';
  btnText.textContent = 'スキャン中...';

  // Step 1: GPS
  setStatus('📡 現在地を取得中...', 'loading');
  try {
    const pos = await getGPS();
    userLat = pos.lat;
    userLng = pos.lng;

    const gpsBadge = document.getElementById('gpsBadge');
    const gpsLabel = document.getElementById('gpsLabel');
    gpsBadge.className = 'gps-badge active';
    gpsLabel.textContent = `${userLat.toFixed(4)}, ${userLng.toFixed(4)}`;

    initMap(userLat, userLng);
    setUserMarker(userLat, userLng);
    setStatus('✅ 現在地取得済み — イベント情報を検索中...', 'loading');
  } catch (e) {
    // Fallback to Tokyo center
    userLat = 35.6812;
    userLng = 139.7671;
    initMap(userLat, userLng);
    setUserMarker(userLat, userLng);
    setStatus('⚠ GPS取得失敗（東京中心部で検索）— AIが検索中...', 'loading');
  }

  showSkeletons();

  // Step 2: Claude API with web search
  const now = new Date();
  const dateStr = `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日（${'日月火水木金土'[now.getDay()]}）`;
  const timeStr = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;

  const userPrompt = `現在日時: ${dateStr} ${timeStr}
現在地周辺: 緯度${userLat.toFixed(4)}, 経度${userLng.toFixed(4)}（東京都内）

本日開催中・開催予定の東京都内のイベント（コンサート、スポーツ観戦、花火大会、お祭り、展示会、演劇など）をweb_searchで調べて、終了時刻が近い順も含め10件程度をJSONで返してください。`;

  try {
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 4000,
        system: ANTHROPIC_SYSTEM,
        tools: [{ type: 'web_search_20250305', name: 'web_search' }],
        messages: [{ role: 'user', content: userPrompt }]
      })
    });

    const data = await response.json();

    if (data.error) throw new Error(data.error.message);

    // Extract text from response (may be after tool_use blocks)
    const textBlocks = (data.content || []).filter(b => b.type === 'text');
    const rawText = textBlocks.map(b => b.text).join('');

    // Parse JSON
    let parsed;
    try {
      const clean = rawText.replace(/```json|```/g, '').trim();
      // Find JSON object
      const jsonStart = clean.indexOf('{');
      const jsonEnd = clean.lastIndexOf('}');
      const jsonStr = clean.substring(jsonStart, jsonEnd + 1);
      parsed = JSON.parse(jsonStr);
    } catch (e) {
      throw new Error('JSON解析失敗: ' + rawText.substring(0, 100));
    }

    const range = parseInt(document.getElementById('rangeSelect').value);
    const events = (parsed.events || []).map(ev => {
      const dist = (userLat && userLng && ev.lat && ev.lng)
        ? calcDist(userLat, userLng, ev.lat, ev.lng)
        : 999;
      return { ...ev, _dist: dist, _urgency: getUrgency(ev.end_time) };
    })
    .filter(ev => ev._dist <= range)
    .sort((a, b) => {
      // Sort: ended last, then by distance within urgency groups
      const urgencyOrder = { now: 0, soon: 1, later: 2, ended: 3 };
      const ao = urgencyOrder[a._urgency] ?? 2;
      const bo = urgencyOrder[b._urgency] ?? 2;
      if (ao !== bo) return ao - bo;
      return a._dist - b._dist;
    });

    allEvents = events;

    if (events.length === 0) {
      setStatus(`🔍 ${range}km圏内にイベントが見つかりませんでした`, 'error');
      document.getElementById('eventContainer').innerHTML = `<div class="empty-state"><div class="empty-icon">🔍</div><div class="empty-text">${range}km圏内のイベントなし</div><div class="empty-hint">範囲を広げるか、時間帯を変えてお試しください</div></div>`;
    } else {
      setStatus(`✅ ${events.length}件取得 — ${parsed.summary || ''}`, 'success');
      document.getElementById('filterBar').style.display = 'flex';
      renderEvents(events);
      addEventMarkers(events);

      // Fit map to all markers
      if (map && events.length > 0) {
        const points = events.filter(e => e.lat && e.lng).map(e => [e.lat, e.lng]);
        if (userLat) points.push([userLat, userLng]);
        if (points.length > 1) map.fitBounds(L.latLngBounds(points).pad(0.15));
      }
    }

  } catch (e) {
    setStatus('❌ 取得失敗: ' + e.message, 'error');
    document.getElementById('eventContainer').innerHTML = `<div class="empty-state"><div class="empty-icon">⚠️</div><div class="empty-text">エラーが発生しました</div><div class="empty-hint">${e.message}</div></div>`;
  }

  btn.disabled = false;
  btn.classList.remove('scanning');
  btn.querySelector('.scan-icon').textContent = '⚡';
  btnText.textContent = 'イベントを再スキャン';
}

// Init map with Tokyo on load
initMap(35.6812, 139.7671);
</script>
</body>
</html>
