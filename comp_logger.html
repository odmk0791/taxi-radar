<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>競合記録</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#0a1628;--s:#0f2040;--s2:#162850;--bd:#2a3f6f;--tx:#e6edf3;--tx2:#8b949e;--g:#39d353;--am:#d29922;--rd:#f85149}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:-apple-system,sans-serif}
body{display:flex;flex-direction:column;max-width:480px;margin:0 auto;padding:0}

/* ヘッダー */
.hdr{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:var(--s);border-bottom:1px solid var(--bd)}
.hdr-title{font-size:16px;font-weight:700}
.hdr-time{font-size:22px;font-weight:800;color:var(--g);font-variant-numeric:tabular-nums}

/* エリア */
.area-box{margin:12px 16px;background:var(--s);border:1px solid var(--bd);border-radius:12px}
.area-row{display:flex;align-items:center;padding:12px 14px;gap:10px}
.area-label{font-size:11px;color:var(--tx2);margin-bottom:2px}
.area-name{font-size:15px;font-weight:600;color:var(--tx)}
.area-change{background:var(--s2);border:1px solid var(--bd);border-radius:8px;color:var(--tx2);font-size:12px;padding:6px 12px;cursor:pointer;white-space:nowrap;flex-shrink:0}
.search-box{padding:0 14px 12px}
.search-input{width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--bd);background:var(--s2);color:var(--tx);font-size:15px;outline:none}
.search-results{max-height:180px;overflow-y:auto;-webkit-overflow-scrolling:touch;margin-top:6px}
.result-item{padding:11px 4px;font-size:14px;color:var(--tx);cursor:pointer;border-bottom:0.5px solid var(--bd)}
.result-item:active{background:var(--s2)}
.no-result{font-size:12px;color:var(--tx2);padding:8px 4px}

/* カウントボタン */
.count-section{padding:0 16px;flex:1}
.count-label{font-size:12px;color:var(--tx2);margin-bottom:10px}
.count-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.count-btn{padding:22px 8px;border-radius:14px;border:1.5px solid var(--bd);background:var(--s);color:var(--tx);font-size:22px;font-weight:800;cursor:pointer;transition:transform .1s,background .1s;text-align:center}
.count-btn:active{transform:scale(.95);background:var(--s2)}
.count-btn.many{grid-column:1/-1;background:rgba(255,90,0,.08);border-color:rgba(255,90,0,.35);color:#ff7a30}
.count-btn.many:active{background:rgba(255,90,0,.18)}

/* 履歴 */
.history{margin:12px 16px 0;background:var(--s);border:1px solid var(--bd);border-radius:12px;overflow:hidden}
.history-hdr{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:0.5px solid var(--bd)}
.history-title{font-size:12px;font-weight:600;color:var(--tx2)}
.history-clear{font-size:11px;color:var(--rd);cursor:pointer;padding:2px 6px}
.history-list{max-height:120px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.history-item{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;border-bottom:0.5px solid var(--bd);font-size:12px}
.history-item:last-child{border-bottom:none}
.h-time{color:var(--tx2);font-variant-numeric:tabular-nums;min-width:42px}
.h-area{color:var(--tx);flex:1;padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.h-count{font-weight:700;color:var(--g)}
.h-count.many{color:#ff7a30}
.pri-seg-title{font-size:11px;color:var(--tx2);margin-bottom:6px}
.pri-grid{display:flex;flex-wrap:wrap;gap:6px}
.pri-btn{padding:6px 10px;border-radius:8px;border:1px solid var(--bd);background:var(--s2);color:var(--tx);font-size:12px;cursor:pointer;white-space:nowrap}
.pri-btn:active{background:var(--bd)}
.pri-btn.done{border-color:var(--g);color:var(--g);opacity:.7}

/* AI解析 */
.ai-box{background:var(--s);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:4px}
.ai-label{font-size:11px;color:var(--tx2);margin-bottom:10px}
.ai-upload-btn{display:block;text-align:center;padding:14px;background:var(--s2);border:1.5px dashed var(--bd);border-radius:10px;color:var(--tx);font-size:15px;cursor:pointer}
.ai-upload-btn:active{background:var(--bd)}
.ai-result{margin-top:12px;background:var(--s2);border-radius:10px;padding:12px;border:1px solid var(--g)}
.ai-result-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:0.5px solid var(--bd)}
.ai-result-row:last-of-type{border-bottom:none}
.ai-result-label{font-size:12px;color:var(--tx2)}
.ai-result-val{font-size:14px;font-weight:600;color:var(--tx)}
.ai-save-btn{width:100%;margin-top:12px;padding:14px;background:var(--g);color:#000;font-size:16px;font-weight:800;border:none;border-radius:10px;cursor:pointer}
.ai-save-btn:active{opacity:.85}
.ai-loading{margin-top:10px;text-align:center;font-size:13px;color:var(--tx2)}
.ai-error{margin-top:10px;font-size:12px;color:var(--rd);text-align:center}
.hidden{display:none}

/* フラッシュ */
.flash{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--g);color:#000;font-size:20px;font-weight:800;padding:16px 32px;border-radius:16px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:100}
.flash.show{opacity:1}

/* 記録件数 */
.total{text-align:center;font-size:11px;color:var(--tx2);padding:8px 0 16px}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-title">👥 競合記録</div>
  <div id="clock" class="hdr-time">--:--</div>
</div>

<div class="area-box">
  <div class="area-row">
    <div style="flex:1;min-width:0">
      <div class="area-label">記録エリア</div>
      <div id="area-name" class="area-name">エリア未設定</div>
    </div>
    <button id="gps-btn" class="area-change" onclick="getGPS()" style="margin-right:6px">📡 現在地</button>
    <button class="area-change" onclick="toggleSearch()">変更</button>
  </div>

  <!-- 優先エリアボタン -->
  <div style="padding:0 14px 12px;border-top:0.5px solid var(--bd);margin-top:4px;padding-top:10px">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
      <span style="font-size:11px;color:var(--tx2)">⭐ 優先エリア（タップで選択）</span>
      <span id="pri-toggle" onclick="togglePriority()" style="font-size:11px;color:var(--am);cursor:pointer">▼ 開く</span>
    </div>
    <div id="priority-panel" style="display:none">
      <div class="pri-seg-title">🌙 明け方 26〜34時</div>
      <div class="pri-grid" id="pri-late"></div>
      <div class="pri-seg-title" style="margin-top:8px">🌆 夜前半 18〜22時</div>
      <div class="pri-grid" id="pri-eve"></div>
      <div class="pri-seg-title" style="margin-top:8px">🌃 深夜 22〜26時</div>
      <div class="pri-grid" id="pri-night"></div>
    </div>
  </div>
  <div id="search-box" style="display:none" class="search-box">
    <input id="search-input" class="search-input" type="text" placeholder="区・地名で検索（例：六本木、渋谷）" oninput="doSearch(this.value)">
    <div id="search-results" class="search-results"></div>
  </div>
</div>

<div class="count-section">

  <!-- AI解析セクション -->
  <div class="ai-box" id="ai-box">
    <div class="ai-label">📸 スクリーンショットから自動入力</div>
    <div id="ai-key-box" class="hidden" style="margin-bottom:10px">
      <input id="ai-key-input" type="password" placeholder="Anthropic APIキーを入力（sk-ant-...）"
        style="width:100%;box-sizing:border-box;padding:10px;border-radius:8px;border:1px solid var(--bd);background:var(--s2);color:var(--tx);font-size:13px">
      <button onclick="saveApiKey()" style="width:100%;margin-top:6px;padding:10px;background:var(--s2);border:1px solid var(--bd);border-radius:8px;color:var(--tx);font-size:13px;cursor:pointer">保存</button>
      <div style="font-size:11px;color:var(--tx2);margin-top:6px">console.anthropic.com で取得できます。端末内のみに保存されます。</div>
    </div>
    <label class="ai-upload-btn" for="ai-file-input">
      📂 写真を選択して解析
      <input id="ai-file-input" type="file" accept="image/*" style="display:none" onchange="analyzeImage(this)">
    </label>
    <div style="text-align:right;margin-top:6px">
      <span onclick="toggleApiKey()" style="font-size:11px;color:var(--tx2);cursor:pointer">🔑 APIキー設定</span>
    </div>
    <div id="ai-result" class="ai-result hidden">
      <div class="ai-result-row"><span class="ai-result-label">🕐 時刻</span><span id="ai-time" class="ai-result-val">--</span></div>
      <div class="ai-result-row"><span class="ai-result-label">📍 エリア</span><span id="ai-area-val" class="ai-result-val">--</span></div>
      <div class="ai-result-row"><span class="ai-result-label">🚕 台数</span><span id="ai-count-val" class="ai-result-val">--</span></div>
      <button class="ai-save-btn" onclick="saveFromAI()">✅ この内容で保存</button>
    </div>
    <div id="ai-loading" class="ai-loading hidden">⏳ AI解析中...</div>
    <div id="ai-error" class="ai-error hidden"></div>
  </div>

  <div class="count-label" style="margin-top:14px">または手動で入力</div>
  <div class="count-grid">
    <button class="count-btn" onclick="record('0台')">0台</button>
    <button class="count-btn" onclick="record('1台')">1台</button>
    <button class="count-btn" onclick="record('2〜3台')">2〜3台</button>
    <button class="count-btn" onclick="record('4〜5台')">4〜5台</button>
    <button class="count-btn many" onclick="record('6台以上')">6台以上</button>
  </div>
</div>

<div class="history">
  <div class="history-hdr">
    <span class="history-title" id="history-title">最近の記録</span>
    <span onclick="bulkSubmit()" style="font-size:11px;color:#58a6ff;cursor:pointer;margin-right:6px" title="過去データを一括送信">☁️ 過去データ送信</span>
    <span onclick="exportCSV()" style="font-size:11px;color:var(--am);cursor:pointer;margin-right:6px">📥 CSV</span>
    <span class="history-clear" id="undo-btn" onclick="undoLast()" style="color:var(--am);margin-right:8px">↩ 直前を削除</span>
    <span class="history-clear" onclick="clearHistory()">クリア</span>
  </div>
  <div id="history-list" class="history-list"></div>
</div>

<div id="total" class="total" onclick="checkData()" style="cursor:pointer">👆 タップしてデータ確認</div>
<div id="flash" class="flash">✓ 保存</div>

<script>
var KEY = 'taxiradar_complog';
var COORDS_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSpOj4QzyarqZtTDM5bld8QDEIzRodRLUwAfF8u42CbgTuGPoKqWrOKtw2Ddrhm0OnONlVnzwc8c1BX/pub?gid=657495537&single=true&output=csv';
var COORDS_CACHE = 'taxiradar_coords_cache';
var coords = {};
var currentArea = '';
var currentLat = null, currentLng = null;
var searchOpen = false;

// 時計
function updateClock(){
  var now = new Date();
  var h = now.getHours(), m = now.getMinutes();
  document.getElementById('clock').textContent = (h<10?'0':'')+h+':'+(m<10?'0':'')+m;
}
updateClock();
setInterval(updateClock, 5000);

// 座標DB読み込み
function loadCoords(){
  try{
    var cached = localStorage.getItem(COORDS_CACHE);
    if(cached){ coords = JSON.parse(cached); }
  }catch(e){}
  fetch(COORDS_URL).then(function(r){return r.text();}).then(function(text){
    var lines = text.replace(/^\uFEFF/,'').split(/\r?\n/);
    var nc = {};
    for(var i=1;i<lines.length;i++){
      var cols = lines[i].split(',');
      if(cols.length<3) continue;
      var addr = cols[0].trim();
      var lat = parseFloat(cols[1]), lng = parseFloat(cols[2]);
      if(addr && !isNaN(lat) && !isNaN(lng)) nc[addr] = [lat,lng];
    }
    if(Object.keys(nc).length > 0){
      coords = nc;
      localStorage.setItem(COORDS_CACHE, JSON.stringify(nc));
    }
  }).catch(function(){});
}
loadCoords();

// 優先エリアリスト
var PRIORITY_AREAS = {
  late: [
    '港区芝浦四丁目','港区六本木一丁目','千代田区平河町二丁目',
    '渋谷区円山町','渋谷区猿楽町','渋谷区神宮前二丁目',
    '港区六本木六丁目','品川区東品川四丁目','目黒区駒場一丁目'
  ],
  eve: [
    '新宿区新宿六丁目','港区南青山四丁目','港区高輪一丁目',
    '港区虎ノ門四丁目','新宿区北新宿一丁目','渋谷区恵比寿二丁目'
  ],
  night: [
    '渋谷区南平台町','品川区西五反田三丁目','渋谷区笹塚二丁目',
    '新宿区西新宿五丁目','港区芝浦一丁目'
  ]
};

function buildPriority(){
  ['late','eve','night'].forEach(function(seg){
    var el = document.getElementById('pri-'+seg);
    var logs = JSON.parse(localStorage.getItem(KEY)||'[]');
    var done = {};
    logs.forEach(function(r){ done[r.area.replace(' ','')] = true; });
    el.innerHTML = '';
    PRIORITY_AREAS[seg].forEach(function(k){
      var btn = document.createElement('button');
      // 表示用に区と地名の間にスペースを入れる
      var display = k.replace(/^(..区|...区|..市)/,function(m){return m+' ';});
      btn.textContent = display;
      btn.className = 'pri-btn' + (done[k] ? ' done' : '');
      btn.addEventListener('click', function(){
        currentArea = display;
        if(window.COORDS&&window.COORDS[k]){
          currentLat=window.COORDS[k][0];currentLng=window.COORDS[k][1];
        }
        document.getElementById('area-name').textContent = display;
        document.getElementById('priority-panel').style.display='none';
        document.getElementById('pri-toggle').textContent='▼ 開く';
      });
      el.appendChild(btn);
    });
  });
}

function togglePriority(){
  var panel = document.getElementById('priority-panel');
  var toggle = document.getElementById('pri-toggle');
  var isOpen = panel.style.display !== 'none';
  if(isOpen){
    panel.style.display='none';
    toggle.textContent='▼ 開く';
  } else {
    buildPriority();
    panel.style.display='block';
    toggle.textContent='▲ 閉じる';
  }
}

var API_KEY_STORAGE = 'taxiradar_apikey';

function toggleApiKey(){
  var box = document.getElementById('ai-key-box');
  box.classList.toggle('hidden');
  if(!box.classList.contains('hidden')){
    var saved = localStorage.getItem(API_KEY_STORAGE)||'';
    document.getElementById('ai-key-input').value = saved;
  }
}
function saveApiKey(){
  var key = document.getElementById('ai-key-input').value.trim();
  if(key) localStorage.setItem(API_KEY_STORAGE, key);
  document.getElementById('ai-key-box').classList.add('hidden');
  showFlash('APIキー保存');
}

// AI画像解析
var _aiData = {};

function analyzeImage(input){
  var apiKey = localStorage.getItem(API_KEY_STORAGE)||'';
  if(!apiKey){
    document.getElementById('ai-key-box').classList.remove('hidden');
    document.getElementById('ai-error').textContent = '🔑 先にAPIキーを設定してください';
    document.getElementById('ai-error').classList.remove('hidden');
    return;
  }
  if(!input.files||!input.files[0]) return;
  var file = input.files[0];
  var reader = new FileReader();
  reader.onload = function(e){
    var b64 = e.target.result.split(',')[1];
    var mediaType = file.type || 'image/jpeg';
    document.getElementById('ai-loading').classList.remove('hidden');
    document.getElementById('ai-result').classList.add('hidden');
    document.getElementById('ai-error').classList.add('hidden');

    fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'x-api-key': apiKey,
        'anthropic-version':'2023-06-01',
        'anthropic-dangerous-direct-browser-access':'true'
      },
      body: JSON.stringify({
        model:'claude-sonnet-4-20250514',
        max_tokens:200,
        messages:[{
          role:'user',
          content:[
            {type:'image',source:{type:'base64',media_type:mediaType,data:b64}},
            {type:'text',text:'このGOタクシーアプリのスクリーンショットを解析してください。必ずJSON形式のみで回答し、他のテキストは一切含めないでください。\n{"time":"ステータスバーの時刻HH:MM","area":"乗車地または現在地のエリア名（港区六本木一丁目など）","count":"地図上の空車タクシーアイコンの台数（0台/1台/2〜3台/4〜5台/6台以上のいずれか）"}'}
          ]
        }]
      })
    })
    .then(function(r){return r.json();})
    .then(function(data){
      document.getElementById('ai-loading').classList.add('hidden');
      var text = data.content&&data.content[0]&&data.content[0].text;
      if(!text) throw new Error('解析失敗');
      var clean = text.replace(/```json|```/g,'').trim();
      var result = JSON.parse(clean);
      _aiData = result;
      document.getElementById('ai-time').textContent = result.time||'--';
      document.getElementById('ai-area-val').textContent = result.area||'--';
      document.getElementById('ai-count-val').textContent = result.count||'--';
      document.getElementById('ai-result').classList.remove('hidden');
      if(result.area){ currentArea=result.area; document.getElementById('area-name').textContent=result.area; }
    })
    .catch(function(err){
      document.getElementById('ai-loading').classList.add('hidden');
      document.getElementById('ai-error').textContent = '解析エラー: '+err.message;
      document.getElementById('ai-error').classList.remove('hidden');
    });
  };
  reader.readAsDataURL(file);
  input.value='';
}

function saveFromAI(){
  if(!_aiData.count) return;
  var savedCount = _aiData.count;
  var now = new Date();
  var disp = _aiData.time || ((now.getHours()<10?'0':'')+now.getHours()+':'+(now.getMinutes()<10?'0':'')+now.getMinutes());
  var area = _aiData.area || currentArea || '未設定';
  var rec = {
    ts: now.toISOString(),
    disp: disp,
    area: area,
    lat: currentLat, lng: currentLng,
    count: savedCount,
    hour: parseInt(disp.split(':')[0])||now.getHours(),
    source: 'ai'
  };
  try{
    var logs = JSON.parse(localStorage.getItem(KEY)||'[]');
    logs.push(rec);
    if(logs.length>2000) logs=logs.slice(-2000);
    localStorage.setItem(KEY, JSON.stringify(logs));
  }catch(e){}
  _aiData = {};
  document.getElementById('ai-result').classList.add('hidden');
  showFlash(savedCount);
  renderHistory();
}

// GPS現在地取得
function getGPS(){
  if(!navigator.geolocation){ alert('GPS非対応です'); return; }
  var btn = document.getElementById('gps-btn');
  btn.textContent = '⏳';
  btn.disabled = true;
  navigator.geolocation.getCurrentPosition(
    function(pos){
      currentLat = pos.coords.latitude;
      currentLng = pos.coords.longitude;
      btn.textContent = '📡 現在地';
      btn.disabled = false;
      // まずCOORDS最近傍でセット
      var best = null, bestD = Infinity;
      var keys = Object.keys(coords);
      for(var i=0;i<keys.length;i++){
        var c = coords[keys[i]];
        var d = Math.pow(c[0]-currentLat,2) + Math.pow(c[1]-currentLng,2);
        if(d < bestD){ bestD = d; best = keys[i]; }
      }
      if(best){
        currentArea = best;
        document.getElementById('area-name').textContent = best;
        document.getElementById('area-name').style.color = '';
      }
      // Nominatimでより正確な住所を取得
      fetch('https://nominatim.openstreetmap.org/reverse?lat='+currentLat+'&lon='+currentLng+'&format=json&accept-language=ja')
        .then(function(r){return r.json();})
        .then(function(data){
          var a = data.address||{};
          // 区名を取得
          var ward = a.city_district||a.county||'';
          // 丁目を取得（neighbourhood > quarterの優先順）
          var chome = a.neighbourhood||a.quarter||a.suburb||'';
          // 区名が丁目に含まれていたら除去
          if(chome.indexOf(ward)===0) chome = chome.replace(ward,'');
          var fullAddr = ward && chome ? ward+chome : (ward||chome);
          if(fullAddr){
            currentArea = fullAddr;
            document.getElementById('area-name').textContent = fullAddr;
          }
        }).catch(function(){});
    },
    function(err){
      btn.textContent = '📡 現在地';
      btn.disabled = false;
      alert('GPS取得失敗。設定から位置情報を許可してください。');
    },
    {enableHighAccuracy:true, timeout:12000, maximumAge:0}
  );
}

// エリア検索
function toggleSearch(){
  searchOpen = !searchOpen;
  var box = document.getElementById('search-box');
  box.style.display = searchOpen ? 'block' : 'none';
  if(searchOpen){
    var inp = document.getElementById('search-input');
    inp.value = '';
    document.getElementById('search-results').innerHTML = '';
    setTimeout(function(){inp.focus();}, 50);
  }
}
function doSearch(q){
  var res = document.getElementById('search-results');
  res.innerHTML = '';
  if(!q){ return; }
  var keys = Object.keys(coords);
  var matches = [];
  for(var i=0;i<keys.length;i++){
    if(keys[i].indexOf(q)>=0){ matches.push(keys[i]); if(matches.length>=10) break; }
  }
  if(!matches.length){
    res.innerHTML = '<div class="no-result">見つかりません</div>';
    return;
  }
  matches.forEach(function(k){
    var d = document.createElement('div');
    d.className = 'result-item';
    d.textContent = k;
    d.addEventListener('click', function(){
      currentArea = k;
      if(coords[k]){ currentLat = coords[k][0]; currentLng = coords[k][1]; }
      document.getElementById('area-name').textContent = k;
      searchOpen = false;
      document.getElementById('search-box').style.display = 'none';
    });
    res.appendChild(d);
  });
}

// Googleフォーム送信
var FORM_URL = 'https://docs.google.com/forms/d/e/1FAIpQLSecTUrQBDC4GLyM4meAsvdF_vi3Y3kh03WfMuLPzVLSkVo3Yw/formResponse';
function submitToForm(rec){
  var params = new URLSearchParams({
    'entry.85957826':  rec.ts,
    'entry.1300013482': rec.area,
    'entry.1638910415': rec.count,
    'entry.1273362015': String(rec.hour)
  });
  fetch(FORM_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: {'Content-Type': 'application/x-www-form-urlencoded'},
    body: params.toString()
  }).catch(function(){});
}

// 記録
function record(val){
  if(!currentArea) currentArea = '未設定';
  var now = new Date();
  var h = now.getHours(), m = now.getMinutes();
  var sh = h < 12 ? h + 24 : h; // 36時間制変換（0-11時 → 24-35時）
  var rec = {
    ts: now.toISOString(),
    disp: (h<10?'0':'')+h+':'+(m<10?'0':'')+m,
    area: currentArea,
    lat: currentLat, lng: currentLng,
    count: val, hour: sh
  };
  try{
    var logs = JSON.parse(localStorage.getItem(KEY)||'[]');
    logs.push(rec);
    if(logs.length > 2000) logs = logs.slice(-2000);
    localStorage.setItem(KEY, JSON.stringify(logs));
  }catch(e){}
  submitToForm(rec);
  showFlash(val);
  renderHistory();
}

function showFlash(val){
  var f = document.getElementById('flash');
  f.textContent = '✓ ' + val + ' 保存';
  f.classList.add('show');
  setTimeout(function(){ f.classList.remove('show'); }, 900);
}

// 履歴表示
function renderHistory(){
  try{
    var logs = JSON.parse(localStorage.getItem(KEY)||'[]');
    var recent = logs.slice(-8).reverse();
    var list = document.getElementById('history-list');
    if(!recent.length){ list.innerHTML = '<div style="padding:12px 14px;font-size:12px;color:var(--tx2)">記録なし</div>'; return; }
    list.innerHTML = recent.map(function(r){
      var many = r.count === '6台以上';
      return '<div class="history-item">'
        + '<span class="h-time">'+r.disp+'</span>'
        + '<span class="h-area">'+r.area+'</span>'
        + '<span class="h-count'+(many?' many':'')+'">'+r.count+'</span>'
        + '</div>';
    }).join('');
    document.getElementById('history-title').textContent = '最近の記録（計'+logs.length+'件）';
    document.getElementById('total').textContent = '累計 '+logs.length+' 件のデータが蓄積されています';
  }catch(e){}
}

function bulkSubmit(){
  var logs = JSON.parse(localStorage.getItem(KEY)||'[]');
  if(!logs.length){ alert('送信するデータがありません'); return; }
  if(!confirm(logs.length+'件をスプレッドシートに送信します。\n（数分かかる場合があります）')) return;

  var total = logs.length, done = 0;
  var statusEl = document.getElementById('history-title');
  var original = statusEl.textContent;

  function sendNext(i){
    if(i >= logs.length){
      statusEl.textContent = original;
      showFlash('送信完了 '+total+'件');
      return;
    }
    statusEl.textContent = '送信中... '+done+'/'+total;
    submitToForm(logs[i]);
    done++;
    setTimeout(function(){ sendNext(i+1); }, 300);
  }
  sendNext(0);
}

function exportCSV(){
  try{
    var logs = JSON.parse(localStorage.getItem(KEY)||'[]');
    if(!logs.length){ alert('データがありません'); return; }
    var csv = '日時,エリア,台数,時間\n';
    logs.forEach(function(r){
      csv += '"'+r.ts+'","'+r.area+'","'+r.count+'",'+r.hour+'\n';
    });
    var blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'comp_log_'+new Date().toISOString().slice(0,10)+'.csv';
    a.click();
    URL.revokeObjectURL(url);
  }catch(e){ alert('エラー: '+e); }
}

function undoLast(){
  try{
    var logs = JSON.parse(localStorage.getItem(KEY)||'[]');
    if(!logs.length){ alert('削除できる記録がありません'); return; }
    var last = logs[logs.length-1];
    if(!confirm(last.disp+' '+last.area+' '+last.count+'\nこの記録を削除しますか？')) return;
    logs.pop();
    localStorage.setItem(KEY, JSON.stringify(logs));
    renderHistory();
  }catch(e){}
}

function clearHistory(){
  if(!confirm('記録をすべて削除しますか？')) return;
  localStorage.removeItem(KEY);
  renderHistory();
}

function checkData(){
  try{
    var logs = JSON.parse(localStorage.getItem(KEY)||'[]');
    var msg = '保存件数: '+logs.length+'件\n\n最新5件:\n';
    logs.slice(-5).reverse().forEach(function(r){
      msg += r.disp+' '+r.area+' '+r.count+'\n';
    });
    alert(msg);
  }catch(e){ alert('エラー: '+e); }
}

renderHistory();
