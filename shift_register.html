<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>出勤日登録</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c232c; --border:#2d3640;
    --txt:#e6edf3; --dim:#8b949e; --accent:#3fb950; --accent2:#58a6ff;
    --warn:#d29922; --danger:#f85149; --gold:#e3b341; --mono:'SF Mono',ui-monospace,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI",sans-serif;
    padding:14px;max-width:560px;margin:0 auto;line-height:1.5;}
  h1{font-size:1.1rem;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:2px;}
  h1 .tag{font-size:.6rem;background:var(--accent2);color:#04203f;padding:2px 7px;border-radius:10px;font-weight:700;}
  .sub{color:var(--dim);font-size:.72rem;margin-bottom:14px;}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:15px;margin-bottom:14px;}
  .controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px;}
  button,select{background:var(--panel2);color:var(--txt);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:.84rem;font-family:inherit;cursor:pointer;}
  button.ghost:hover{border-color:var(--accent2);}
  button.primary{background:var(--accent2);color:#04203f;border:none;font-weight:800;font-size:.92rem;padding:13px;width:100%;}
  button.primary:disabled{background:var(--panel2);color:var(--dim);cursor:not-allowed;}
  button.primary:not(:disabled):hover{opacity:.9;}
  /* カレンダー */
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .cal-dow{text-align:center;font-size:.66rem;color:var(--dim);padding:3px 0;font-weight:600;}
  .cal-dow.sat{color:var(--accent2);} .cal-dow.sun{color:var(--danger);}
  .cal-cell{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;border-radius:9px;font-size:.92rem;
    font-family:var(--mono);cursor:pointer;border:1px solid transparent;background:var(--panel2);position:relative;user-select:none;
    transition:transform .08s;}
  .cal-cell.empty{background:transparent;cursor:default;}
  .cal-cell:active:not(.empty){transform:scale(.92);}
  .cal-cell:hover:not(.empty):not(.sent){border-color:var(--accent2);}
  .cal-cell.sel{background:var(--accent2);color:#04203f;font-weight:800;}
  .cal-cell.sent{background:rgba(63,185,80,.18);color:var(--accent);border-color:var(--accent);font-weight:700;cursor:default;}
  .cal-cell.sent::after{content:'✓';position:absolute;top:2px;right:4px;font-size:.55rem;}
  .cal-cell.sat{color:var(--accent2);} .cal-cell.sun{color:var(--danger);}
  .cal-cell.sel.sat,.cal-cell.sel.sun{color:#04203f;}
  .cal-cell.today{box-shadow:inset 0 0 0 2px var(--gold);}
  /* 選択リスト */
  .selbox{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:12px;margin-top:12px;}
  .selbox .head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;}
  .selbox .count{font-size:.78rem;color:var(--dim);}
  .selbox .count b{color:var(--accent2);font-size:1.1rem;font-family:var(--mono);}
  .chips{display:flex;flex-wrap:wrap;gap:5px;}
  .chip{display:inline-flex;align-items:center;gap:5px;background:var(--panel);border:1px solid var(--border);border-radius:7px;padding:4px 7px 4px 10px;font-size:.78rem;font-family:var(--mono);}
  .chip .x{cursor:pointer;color:var(--dim);padding:0 2px;}
  .chip .x:hover{color:var(--danger);}
  .legend{font-size:.66rem;color:var(--dim);margin-top:10px;line-height:1.7;}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--accent);
    color:var(--txt);padding:12px 20px;border-radius:10px;font-size:.85rem;box-shadow:0 6px 24px rgba(0,0,0,.5);opacity:0;
    transition:opacity .3s,transform .3s;pointer-events:none;z-index:100;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}
  .toast.err{border-color:var(--danger);}
  .progress{height:8px;background:#0a0d12;border-radius:5px;overflow:hidden;margin-top:10px;border:1px solid var(--border);display:none;}
  .progress.show{display:block;}
  .progress > i{display:block;height:100%;background:var(--accent2);width:0;transition:width .2s;}
  a.dash{color:var(--accent2);font-size:.76rem;text-decoration:none;}
  a.dash:hover{text-decoration:underline;}
</style>
</head>
<body>
<h1>出勤日登録 <span class="tag">⑦</span></h1>
<div class="sub">勤務表が出たら、出番日をタップして選び、まとめて登録します。</div>

<div class="panel">
  <div class="controls">
    <button class="ghost" id="calPrev">‹ 前月</button>
    <strong id="calTitle" style="font-size:1rem;min-width:120px;text-align:center"></strong>
    <button class="ghost" id="calNext">翌月 ›</button>
  </div>
  <div id="calendar"></div>

  <div class="selbox">
    <div class="head">
      <span class="count">選択中 <b id="selCount">0</b> 日</span>
      <button class="ghost" id="clearSel" style="padding:4px 10px;font-size:.74rem">全部はずす</button>
    </div>
    <div class="chips" id="selChips"><span style="font-size:.76rem;color:var(--dim)">日付をタップして選択</span></div>
  </div>

  <div class="progress" id="progress"><i id="progressBar"></i></div>
  <button class="primary" id="submitBtn" style="margin-top:12px" disabled>登録する</button>
  <div class="legend">
    選んだ日付を出勤入力フォームにまとめて送信します。送信済みの日は<b style="color:var(--accent)">緑✓</b>になります。<br>
    登録後 → <a class="dash" href="salary_dashboard.html">出番表・給与・拘束時間ダッシュボードを開く</a>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ===== フォーム設定 =====
const FORM_ID = "1FAIpQLScKMLINWcY-31ahYftBQEJUWw9JhgyFEbbHk7dxLnlSkkEWjA";
const FORM_ACTION = `https://docs.google.com/forms/d/e/${FORM_ID}/formResponse`;
const E_DATE = "entry.390989495";   // 出勤予定日（日付型 → _year/_month/_day）
const E_TYPE = "entry.1811568862";  // 出番種別
const E_MEMO = "entry.107237470";   // メモ
const DEFAULT_TYPE = "J";

// ===== 状態 =====
let CAL_Y, CAL_M;
let selected = new Set();   // 'YYYY/MM/DD'
let sent = new Set();       // 送信済み（このセッション）

const WD=['日','月','火','水','木','金','土'];
function localToday(){ const d=new Date(); return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`; }

// ===== カレンダー =====
function initCal(){
  const t=new Date(); CAL_Y=t.getFullYear(); CAL_M=t.getMonth()+1;
  document.getElementById('calPrev').onclick=()=>{CAL_M--;if(CAL_M<1){CAL_M=12;CAL_Y--;}renderCal();};
  document.getElementById('calNext').onclick=()=>{CAL_M++;if(CAL_M>12){CAL_M=1;CAL_Y++;}renderCal();};
  document.getElementById('clearSel').onclick=()=>{ selected.clear(); renderCal(); renderSel(); };
  document.getElementById('submitBtn').onclick=submitAll;
  renderCal(); renderSel();
}
function renderCal(){
  document.getElementById('calTitle').textContent=`${CAL_Y}年 ${CAL_M}月`;
  const today=localToday();
  const startDow=new Date(CAL_Y,CAL_M-1,1).getDay();
  const days=new Date(CAL_Y,CAL_M,0).getDate();
  let html='<div class="cal-grid">';
  WD.forEach((w,i)=>html+=`<div class="cal-dow ${i===0?'sun':i===6?'sat':''}">${w}</div>`);
  for(let i=0;i<startDow;i++) html+='<div class="cal-cell empty"></div>';
  for(let d=1;d<=days;d++){
    const iso=`${CAL_Y}/${String(CAL_M).padStart(2,'0')}/${String(d).padStart(2,'0')}`;
    const dow=new Date(CAL_Y,CAL_M-1,d).getDay();
    const cls=['cal-cell']; if(dow===0)cls.push('sun'); if(dow===6)cls.push('sat');
    if(sent.has(iso))cls.push('sent'); else if(selected.has(iso))cls.push('sel');
    if(iso===today)cls.push('today');
    html+=`<div class="${cls.join(' ')}" data-iso="${iso}">${d}</div>`;
  }
  html+='</div>';
  document.getElementById('calendar').innerHTML=html;
  document.querySelectorAll('#calendar .cal-cell:not(.empty):not(.sent)').forEach(c=>c.onclick=()=>{
    const iso=c.dataset.iso;
    if(selected.has(iso)) selected.delete(iso); else selected.add(iso);
    renderCal(); renderSel();
  });
}
function renderSel(){
  const arr=[...selected].sort();
  document.getElementById('selCount').textContent=arr.length;
  const box=document.getElementById('selChips');
  if(!arr.length){ box.innerHTML='<span style="font-size:.76rem;color:var(--dim)">日付をタップして選択</span>'; }
  else{
    box.innerHTML=arr.map(iso=>{
      const[y,m,d]=iso.split('/').map(Number);
      const w=WD[new Date(y,m-1,d).getDay()];
      return `<span class="chip"><b>${m}/${d}(${w})</b><span class="x" data-iso="${iso}">✕</span></span>`;
    }).join('');
    box.querySelectorAll('.x').forEach(x=>x.onclick=()=>{ selected.delete(x.dataset.iso); renderCal(); renderSel(); });
  }
  document.getElementById('submitBtn').disabled = arr.length===0;
  document.getElementById('submitBtn').textContent = arr.length? `${arr.length}日分を登録する` : '登録する';
}

// ===== 送信 =====
function postOne(iso){
  const[y,m,d]=iso.split('/').map(Number);
  const fd=new FormData();
  // 日付型フィールドの正式な送信形式は _year/_month/_day 分割
  fd.append(E_DATE+'_year', y);
  fd.append(E_DATE+'_month', m);
  fd.append(E_DATE+'_day', d);
  fd.append(E_TYPE, DEFAULT_TYPE);
  fd.append(E_MEMO, '');
  fd.append('fvv','1'); fd.append('pageHistory','0'); fd.append('fbzx','0');
  return fetch(FORM_ACTION, {method:'POST', mode:'no-cors', body:fd})
    .then(()=>true).catch(()=>false);
}
async function submitAll(){
  const arr=[...selected].sort().filter(iso=>!sent.has(iso));
  if(!arr.length) return;
  const btn=document.getElementById('submitBtn'); btn.disabled=true; btn.textContent='送信中…';
  const prog=document.getElementById('progress'), bar=document.getElementById('progressBar');
  prog.classList.add('show'); bar.style.width='0';
  let ok=0;
  for(let i=0;i<arr.length;i++){
    const r=await postOne(arr[i]);
    if(r){ ok++; sent.add(arr[i]); selected.delete(arr[i]); }
    bar.style.width=Math.round((i+1)/arr.length*100)+'%';
    renderCal(); renderSel();
    await new Promise(res=>setTimeout(res,250)); // フォーム側への配慮
  }
  setTimeout(()=>prog.classList.remove('show'),600);
  toast(`${ok}日分を登録しました。ダッシュボードに反映されます`, ok===arr.length?'':'err');
  btn.textContent='登録する';
}
function toast(msg,cls){
  const t=document.getElementById('toast'); t.textContent=msg; t.className='toast show '+(cls||'');
  setTimeout(()=>t.className='toast '+(cls||''),3500);
}

initCal();
</script>
</body>
</html>
