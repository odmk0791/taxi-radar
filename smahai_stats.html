<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>スマ配 統計分析</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#090912;color:#e2e8f0;font-family:'Hiragino Sans',sans-serif;padding-bottom:48px}
#hdr{background:linear-gradient(135deg,#1c0a3a,#0f1e40);border-bottom:1px solid #60a5fa44;padding:18px 16px 14px}
.sub{font-size:10px;color:#60a5fa;letter-spacing:3px;text-transform:uppercase;margin-bottom:2px}
h1{font-size:18px;font-weight:800}
#msgbox{margin:20px 16px;padding:14px;background:#161626;border:2px solid #60a5fa;border-radius:12px;font-size:13px;line-height:1.9;word-break:break-all;min-height:60px}
@keyframes sp{to{transform:rotate(360deg)}}
.spin{display:inline-block;animation:sp 1s linear infinite}
.rbtn{display:block;width:calc(100% - 32px);margin:0 16px 16px;padding:13px;background:#1a2035;border:1px solid #f87171;border-radius:12px;color:#f87171;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.card{background:#161626;border:1px solid #1e2d40;border-radius:12px;padding:14px;margin:0 16px 12px}
.card-ttl{font-size:12px;font-weight:700;margin-bottom:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:8px}
.cell{background:#0d1220;border-radius:8px;padding:8px 10px}
.cell .lbl{font-size:9px;color:#475569;margin-bottom:3px}
.cell .val{font-size:13px;font-weight:800;line-height:1.3}
.cell .sub{font-size:9px;color:#64748b;margin-top:2px}
.bwrap{height:14px;background:#151e30;border-radius:4px;overflow:hidden;margin-top:3px}
.binner{height:100%;border-radius:4px}
.row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #0d1220;font-size:12px}
.row:last-child{border:none}
.highlight{background:#f59e0b12;border:1px solid #f59e0b44;border-radius:8px;padding:10px 12px;margin-top:8px;font-size:12px;color:#cbd5e1;line-height:1.9}
.sigma-box{border-radius:10px;padding:12px;margin-bottom:8px}
</style>
</head>
<body>
<div id="hdr">
  <div class="sub">Statistical Analysis</div>
  <h1>📊 スマ配 標準偏差・外れ値分析</h1>
</div>
<div id="msgbox"><span class="spin">⏳</span> データ取得中...</div>
<button class="rbtn" id="rbtn" onclick="run()" style="display:none">🔄 再試行</button>
<div id="out"></div>

<script>
var U2='https://docs.google.com/spreadsheets/d/e/2PACX-1vTm1IwbqhN5odntM8GhM4xHZwR3h1a4WKeWpt-4eLDczrGTTAVz8Bl49SI_c0jGEVrp0t_8iRMTN77A/pub?gid=0&single=true&output=csv';

function parseCSV(text){
  var lines=text.trim().split(/\r?\n/).filter(function(l){return l.trim();});
  function sp(line){var cols=[],cur='',q=false;for(var i=0;i<line.length;i++){var c=line[i];if(c==='"'){q=!q;}else if(c===','&&!q){cols.push(cur.trim());cur='';}else{cur+=c;}}cols.push(cur.trim());return cols;}
  var h=sp(lines[0]);
  return lines.slice(1).map(function(l){var v=sp(l),o={};h.forEach(function(k,i){o[k]=v[i]||'';});return o;});
}
function toN(v){return parseInt(String(v||'').replace(/[^\d]/g,''))||0;}
function es(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function bar(pct,col,h){h=h||14;return '<div class="bwrap" style="height:'+h+'px"><div class="binner" style="width:'+Math.min(pct,100)+'%;background:'+col+'"></div></div>';}

/* 統計関数 */
function mean(a){return a.length?a.reduce(function(x,y){return x+y;},0)/a.length:0;}
function median(a){
  var s=[].concat(a).sort(function(x,y){return x-y;});
  var m=Math.floor(s.length/2);
  return s.length%2?s[m]:Math.round((s[m-1]+s[m])/2);
}
function stddev(a){
  var m=mean(a);
  var v=a.reduce(function(s,x){return s+(x-m)*(x-m);},0)/a.length;
  return Math.sqrt(v);
}
function percentile(a,p){
  var s=[].concat(a).sort(function(x,y){return x-y;});
  var idx=(p/100)*(s.length-1);
  var lo=Math.floor(idx),hi=Math.ceil(idx);
  return Math.round(s[lo]+(s[hi]-s[lo])*(idx-lo));
}

async function run(){
  document.getElementById('msgbox').style.display='';
  document.getElementById('msgbox').innerHTML='<span class="spin">⏳</span> データ取得中...';
  document.getElementById('msgbox').style.borderColor='#60a5fa';
  document.getElementById('rbtn').style.display='none';
  try{
    var r=await fetch(U2);
    if(!r.ok)throw new Error('HTTP '+r.status);
    var text=await r.text();
    document.getElementById('msgbox').innerHTML='<span class="spin">⏳</span> 統計計算中...';

    var rows=parseCSV(text);
    var sma=rows.filter(function(r){return(r['ステータス']||'').trim()==='スマ配';});
    var allRows=rows.filter(function(r){return toN(r['料金'])>0;});

    var smaF=sma.map(function(r){return toN(r['料金']);}).filter(function(v){return v>0;}).sort(function(a,b){return a-b;});
    var allF=allRows.map(function(r){return toN(r['料金']);}).filter(function(v){return v>0;});

    /* 基本統計 */
    var n=smaF.length;
    var avg=Math.round(mean(smaF));
    var med=median(smaF);
    var sd=Math.round(stddev(smaF));
    var allAvg=Math.round(mean(allF));
    var allMed=median(allF);

    /* σ区間 */
    var mu1lo=Math.round(avg-sd),   mu1hi=Math.round(avg+sd);
    var mu2lo=Math.round(avg-2*sd), mu2hi=Math.round(avg+2*sd);
    var mu3lo=Math.round(avg-3*sd), mu3hi=Math.round(avg+3*sd);

    /* 外れ値（±2σ外） */
    var inliers2=smaF.filter(function(f){return f>=mu2lo&&f<=mu2hi;});
    var outliers2=smaF.filter(function(f){return f<mu2lo||f>mu2hi;});
    var inliers3=smaF.filter(function(f){return f>=mu3lo&&f<=mu3hi;});
    var outliers3=smaF.filter(function(f){return f<mu3lo||f>mu3hi;});

    /* 外れ値除外後の平均 */
    var cleanAvg2=inliers2.length?Math.round(mean(inliers2)):0;
    var cleanAvg3=inliers3.length?Math.round(mean(inliers3)):0;

    /* パーセンタイル */
    var p25=percentile(smaF,25);
    var p50=percentile(smaF,50);
    var p75=percentile(smaF,75);
    var p90=percentile(smaF,90);
    var p95=percentile(smaF,95);
    var iqr=p75-p25;
    var iqrLo=Math.max(0,p25-1.5*iqr);
    var iqrHi=p75+1.5*iqr;
    var iqrOutliers=smaF.filter(function(f){return f<iqrLo||f>iqrHi;});
    var iqrInliers=smaF.filter(function(f){return f>=iqrLo&&f<=iqrHi;});
    var cleanAvgIqr=iqrInliers.length?Math.round(mean(iqrInliers)):0;

    /* 高額おばけリスト（+2σ超） */
    var ghosts=smaF.filter(function(f){return f>mu2hi;}).sort(function(a,b){return b-a;});

    /* HTML */
    var h='';

    /* ① 基本統計 */
    h+='<div class="card" style="border-color:#60a5fa44">';
    h+='<div class="card-ttl" style="color:#60a5fa">📐 基本統計量（スマ配 '+n+'件）</div>';
    h+='<div class="grid2">';
    h+='<div class="cell"><div class="lbl">平均値（mean）</div><div class="val" style="color:#f87171">¥'+avg.toLocaleString()+'</div><div class="sub">おばけに引き上げられている</div></div>';
    h+='<div class="cell"><div class="lbl">中央値（median）</div><div class="val" style="color:#4ade80">¥'+med.toLocaleString()+'</div><div class="sub">実態に近い数字</div></div>';
    h+='</div>';
    h+='<div class="grid2">';
    h+='<div class="cell"><div class="lbl">標準偏差（σ）</div><div class="val" style="color:#facc15">¥'+sd.toLocaleString()+'</div><div class="sub">バラつきの大きさ</div></div>';
    h+='<div class="cell"><div class="lbl">変動係数（CV）</div><div class="val" style="color:#facc15">'+(avg>0?(sd/avg*100).toFixed(1):0)+'%</div><div class="sub">50%超は"超ばらつき大"</div></div>';
    h+='</div>';
    h+='<div class="grid3" style="margin-top:8px">';
    h+='<div class="cell"><div class="lbl">全体 平均</div><div class="val" style="color:#94a3b8">¥'+allAvg.toLocaleString()+'</div></div>';
    h+='<div class="cell"><div class="lbl">全体 中央値</div><div class="val" style="color:#94a3b8">¥'+allMed.toLocaleString()+'</div></div>';
    h+='<div class="cell"><div class="lbl">スマ配 vs 全体</div><div class="val" style="color:'+(med-allMed<0?'#f87171':'#4ade80')+'">'+(med-allMed>=0?'+':'')+'¥'+(med-allMed).toLocaleString()+'</div><div class="sub">中央値の差</div></div>';
    h+='</div></div>';

    /* ② σ区間 */
    h+='<div class="card"><div class="card-ttl" style="color:#facc15">📊 σ区間と外れ値</div>';
    [
      {lbl:'±1σ（68%区間）',lo:mu1lo,hi:mu1hi,col:'#60a5fa',
       cnt:smaF.filter(function(f){return f>=mu1lo&&f<=mu1hi;}).length},
      {lbl:'±2σ（95%区間）',lo:mu2lo,hi:mu2hi,col:'#4ade80',
       cnt:inliers2.length},
      {lbl:'±3σ（99.7%区間）',lo:mu3lo,hi:mu3hi,col:'#a78bfa',
       cnt:inliers3.length},
    ].forEach(function(s){
      var pct=n>0?s.cnt/n*100:0;
      h+='<div class="sigma-box" style="background:'+s.col+'0d;border:1px solid '+s.col+'33">';
      h+='<div style="display:flex;justify-content:space-between;margin-bottom:6px;align-items:center">';
      h+='<span style="font-size:11px;font-weight:700;color:'+s.col+'">'+s.lbl+'</span>';
      h+='<span style="font-size:11px;color:#475569">'+s.cnt+'件 ('+pct.toFixed(1)+'%)</span></div>';
      h+='<div style="font-size:12px;color:#cbd5e1;margin-bottom:6px">¥'+Math.max(0,s.lo).toLocaleString()+' 〜 ¥'+s.hi.toLocaleString()+'</div>';
      h+=bar(pct,s.col,10);
      h+='</div>';
    });
    h+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px">';
    h+='<div class="cell" style="border-color:#f8717133"><div class="lbl">±2σ外れ値</div><div class="val" style="color:#f87171">'+outliers2.length+'件</div><div class="sub">¥'+mu2hi.toLocaleString()+'超 or ¥'+Math.max(0,mu2lo).toLocaleString()+'未満</div></div>';
    h+='<div class="cell" style="border-color:#f8717133"><div class="lbl">±3σ外れ値</div><div class="val" style="color:#f87171">'+outliers3.length+'件</div><div class="sub">¥'+mu3hi.toLocaleString()+'超</div></div>';
    h+='</div></div>';

    /* ③ 外れ値除外後の実態平均 */
    h+='<div class="card" style="border-color:#4ade8044">';
    h+='<div class="card-ttl" style="color:#4ade80">✅ 外れ値除外後の「実態平均」</div>';
    h+='<div class="grid3">';
    h+='<div class="cell"><div class="lbl">全件平均</div><div class="val" style="color:#f87171">¥'+avg.toLocaleString()+'</div><div class="sub">おばけ込み</div></div>';
    h+='<div class="cell"><div class="lbl">±2σ除外後</div><div class="val" style="color:#4ade80">¥'+cleanAvg2.toLocaleString()+'</div><div class="sub">'+inliers2.length+'件で計算</div></div>';
    h+='<div class="cell"><div class="lbl">IQR法除外後</div><div class="val" style="color:#4ade80">¥'+cleanAvgIqr.toLocaleString()+'</div><div class="sub">'+iqrInliers.length+'件で計算</div></div>';
    h+='</div>';
    h+='<div class="highlight">';
    h+='スマ配の<strong style="color:#4ade80">実態単価は¥'+cleanAvg2.toLocaleString()+'〜¥'+cleanAvgIqr.toLocaleString()+'</strong>が正直なところ。<br>';
    h+='全体平均¥'+allAvg.toLocaleString()+'との差：<strong style="color:'+(cleanAvg2-allAvg<0?'#f87171':'#4ade80')+'">'+(cleanAvg2-allAvg>=0?'+':'')+'¥'+(cleanAvg2-allAvg).toLocaleString()+'</strong>';
    h+='</div></div>';

    /* ④ パーセンタイル */
    h+='<div class="card"><div class="card-ttl" style="color:#a78bfa">📈 パーセンタイル分布</div>';
    var pData=[
      {lbl:'25%tile（下位25%）',val:p25,col:'#f87171'},
      {lbl:'50%tile（中央値）', val:p50,col:'#facc15'},
      {lbl:'75%tile（上位25%）',val:p75,col:'#60a5fa'},
      {lbl:'90%tile（上位10%）',val:p90,col:'#4ade80'},
      {lbl:'95%tile（上位5%）', val:p95,col:'#a78bfa'},
    ];
    var maxP=p95;
    pData.forEach(function(p){
      h+='<div style="margin-bottom:8px"><div style="display:flex;justify-content:space-between;margin-bottom:2px"><span style="font-size:11px;color:#94a3b8">'+p.lbl+'</span><span style="font-size:12px;font-weight:700;color:'+p.col+'">¥'+p.val.toLocaleString()+'</span></div>'+bar(p.val/maxP*100,p.col)+'</div>';
    });
    h+='<div style="margin-top:8px;padding:9px;background:#a78bfa0d;border:1px solid #a78bfa33;border-radius:8px;font-size:11px;color:#cbd5e1;line-height:1.9">';
    h+='IQR（四分位範囲）= ¥'+p25.toLocaleString()+' 〜 ¥'+p75.toLocaleString()+'<br>';
    h+='IQR法の外れ値ライン：¥'+Math.round(iqrHi).toLocaleString()+'超（'+iqrOutliers.length+'件がおばけ）';
    h+='</div></div>';

    /* ⑤ おばけリスト */
    if(ghosts.length){
      h+='<div class="card" style="border-color:#f8717144">';
      h+='<div class="card-ttl" style="color:#f87171">👻 おばけ案件（±2σ超：¥'+mu2hi.toLocaleString()+'超）</div>';
      h+='<p style="font-size:11px;color:#64748b;margin-bottom:10px">計'+ghosts.length+'件。これらが平均を引き上げている原因。</p>';
      ghosts.forEach(function(f,i){
        h+='<div class="row"><span style="font-size:12px;color:#f87171">'+(i+1)+'位</span><span style="font-size:14px;font-weight:800;color:#f87171">¥'+f.toLocaleString()+'</span></div>';
      });
      h+='</div>';
    }

    /* ⑥ 結論 */
    h+='<div class="card" style="border-color:#f59e0b55;background:#f59e0b08">';
    h+='<div class="card-ttl" style="color:#f59e0b">💡 スマ配の実態評価</div>';
    h+='<div style="font-size:12px;color:#cbd5e1;line-height:2">';
    var judge=cleanAvg2<allAvg?'below':'above';
    h+='外れ値を除いた実態平均：<strong style="color:#4ade80">¥'+cleanAvg2.toLocaleString()+'</strong><br>';
    h+='全体の平均単価：<strong style="color:#94a3b8">¥'+allAvg.toLocaleString()+'</strong><br>';
    if(judge==='below'){
      h+='→ スマ配は<strong style="color:#f87171">全体平均より¥'+(allAvg-cleanAvg2).toLocaleString()+'低い</strong>。<br>';
      h+='「新人には良い案件が来ない」という感覚はデータで裏付けられています。<br>';
      h+='<strong style="color:#facc15">スマ配への依存度を下げ、GOアプリ・流しに注力するのが合理的。</strong>';
    }else{
      h+='→ スマ配は全体平均より高め。積極活用が有効。';
    }
    h+='</div></div>';

    document.getElementById('msgbox').style.display='none';
    document.getElementById('rbtn').style.display='none';
    document.getElementById('out').innerHTML=h;

  }catch(e){
    document.getElementById('msgbox').innerHTML='⚠️ <strong style="color:#f87171">エラー</strong><br>'+String(e);
    document.getElementById('msgbox').style.borderColor='#f87171';
    document.getElementById('rbtn').style.display='';
  }
}
run();
</script>
</body>
</html>
