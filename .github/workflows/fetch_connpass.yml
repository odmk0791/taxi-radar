name: Fetch Connpass Events

on:
  schedule:
    - cron: '0 * * * *'   # 毎時0分(UTC) = JST毎時9分
  workflow_dispatch:        # 手動実行も可能

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Fetch Connpass Events
        env:
          CONNPASS_API_KEY: ${{ secrets.CONNPASS_API_KEY }}
        run: python3 scripts/fetch_connpass.py

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/connpass_events.json
          git diff --staged --quiet || git commit -m "Auto: update connpass events $(date '+%Y-%m-%d %H:%M JST')"
          git push
