<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>月曜日 売上向上ダッシュボード</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#090912;color:#e2e8f0;font-family:'Hiragino Sans',sans-serif;padding-bottom:40px}
#hdr{background:linear-gradient(135deg,#1c0a3a,#0f1e40,#0a2050);border-bottom:1px solid #f8717155;padding:18px 16px 14px}
#hdr .sub{font-size:10px;color:#f87171;letter-spacing:3px;text-transform:uppercase;margin-bottom:2px}
#hdr h1{font-size:19px;font-weight:800}
#hdr .desc{font-size:11px;color:#475569;margin-top:3px}
#wrap{padding:20px 16px}
#msg{background:#161626;border:1px solid #1e2d40;border-radius:12px;padding:16px;margin-bottom:16px;font-size:13px;line-height:1.8;word-break:break-all}
#log{background:#0d1117;border:1px solid #1e2d40;border-radius:8px;padding:12px;font-size:11px;color:#94a3b8;line-height:2;word-break:break-all;white-space:pre-wrap;max-height:300px;overflow-y:auto}
button{background:linear-gradient(135deg,#f87171,#fb923c);border:none;border-radius:12px;padding:12px 28px;color:#fff;font-size:14px;font-weight:700;cursor:pointer;margin-top:12px;width:100%}
@keyframes sp{to{transform:rotate(360deg)}}
.spin{display:inline-block;animation:sp 1s linear infinite}
</style>
</head>
<body>
<div id="hdr">
  <div class="sub">Monday Performance Analysis</div>
  <h1>🔴 月曜日 売上向上ダッシュボード</h1>
  <div class="desc">日報データをリアルタイム分析</div>
</div>
<div id="wrap">
  <div id="msg"><span class="spin">⏳</span> 初期化中...</div>
  <div id="log"></div>
  <button onclick="loadAll()">🔄 再試行</button>
</div>
<script>
var URL1='https://docs.google.com/spreadsheets/d/e/2PACX-1vT2iLNU2ehDRMl7CQt2ETLkVwIeIRMAEpNsFjImdrWDBGuiTWLiwXc9aTtnhbJzWl0uvN0kEPw9Bd-0/pub?gid=0&single=true&output=csv';
var URL2='https://docs.google.com/spreadsheets/d/e/2PACX-1vTm1IwbqhN5odntM8GhM4xHZwR3h1a4WKeWpt-4eLDczrGTTAVz8Bl49SI_c0jGEVrp0t_8iRMTN77A/pub?gid=0&single=true&output=csv';

var logs=[];
function log(s){
  logs.push(new Date().toLocaleTimeString('ja-JP')+' '+s);
  document.getElementById('log').textContent=logs.join('\n');
}
function msg(s,col){
  var el=document.getElementById('msg');
  el.innerHTML=s;
  el.style.borderColor=col||'#1e2d40';
  el.style.color=col?'#fff':'#e2e8f0';
  if(col)el.style.background=col+'22';
}

async function loadAll(){
  logs=[];
  log('loadAll() 開始');
  msg('<span class="spin">⏳</span> 処理中...','');

  try{
    log('fetch URL1 開始');
    msg('<span class="spin">⏳</span> 日報CSV取得中...');
    var r1=await fetch(URL1);
    log('fetch URL1 完了 status='+r1.status+' ok='+r1.ok);
    if(!r1.ok)throw new Error('URL1 HTTP '+r1.status);
    var t1=await r1.text();
    log('URL1 テキスト取得 length='+t1.length+' 先頭='+t1.slice(0,80).replace(/\n/g,'↵'));

    log('fetch URL2 開始');
    msg('<span class="spin">⏳</span> 日報詳細CSV取得中...');
    var r2=await fetch(URL2);
    log('fetch URL2 完了 status='+r2.status+' ok='+r2.ok);
    if(!r2.ok)throw new Error('URL2 HTTP '+r2.status);
    var t2=await r2.text();
    log('URL2 テキスト取得 length='+t2.length+' 先頭='+t2.slice(0,80).replace(/\n/g,'↵'));

    var lines1=t1.trim().split('\n');
    var lines2=t2.trim().split('\n');
    log('URL1 行数='+lines1.length+' ヘッダー='+lines1[0].slice(0,100));
    log('URL2 行数='+lines2.length+' ヘッダー='+lines2[0].slice(0,100));

    msg('✅ CSV取得成功！\n\n日報: '+lines1.length+'行\nヘッダー: '+lines1[0]+'\n\n詳細: '+lines2.length+'行\nヘッダー: '+lines2[0],'#4ade80');

  }catch(e){
    log('ERROR: '+String(e));
    msg('⚠️ エラー: '+String(e),'#f87171');
  }
}

window.onerror=function(msg,src,line,col,err){
  log('JSエラー: '+msg+' ('+src+':'+line+')');
};

log('スクリプト読み込み完了');
loadAll();
</script>
</body>
</html>
