<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>月曜日 売上向上ダッシュボード</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#090912;color:#e2e8f0;font-family:'Hiragino Sans','Noto Sans JP',sans-serif;padding-bottom:48px}
#hdr{background:linear-gradient(135deg,#1c0a3a,#0f1e40,#0a2050);border-bottom:1px solid #f8717155;padding:18px 16px 14px;position:sticky;top:0;z-index:100}
.sub{font-size:10px;color:#f87171;letter-spacing:3px;text-transform:uppercase;margin-bottom:2px}
h1{font-size:19px;font-weight:800}
.desc{font-size:11px;color:#475569;margin-top:3px}
#msgbox{margin:20px 16px;padding:14px;background:#161626;border:2px solid #60a5fa;border-radius:12px;font-size:13px;line-height:1.9;word-break:break-all;min-height:60px}
@keyframes sp{to{transform:rotate(360deg)}}
.spin{display:inline-block;animation:sp 1s linear infinite}
.rbtn{display:block;width:calc(100% - 32px);margin:0 16px 16px;padding:13px;background:#1a2035;border:1px solid #f87171;border-radius:12px;color:#f87171;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.kpi-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:0 14px 14px}
.kpi{background:#161626;border-radius:12px;padding:10px}
.tabs{display:flex;gap:5px;padding:0 14px 12px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tab{padding:7px 12px;border-radius:20px;border:none;background:#151e30;color:#64748b;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap;font-family:inherit;flex-shrink:0}
.tab.on{background:#f87171;color:#fff}
.tab.gold{color:#fff}
.panel{padding:0 14px;display:none}
.panel.on{display:block}
.card{background:#161626;border:1px solid #1e2d40;border-radius:12px;padding:13px 14px;margin-bottom:10px}
.bwrap{background:#151e30;border-radius:4px;overflow:hidden;position:relative;margin-top:3px}
.binner{border-radius:4px;display:flex;align-items:center}
.mbar{height:6px;background:#151e30;border-radius:4px;overflow:hidden;margin-top:4px}
.mbari{height:6px;border-radius:4px}
.spot{border:1px solid #1e2d40;border-radius:10px;padding:9px 12px;margin-bottom:7px;background:#161626}
.spot.t{border-color:#facc1555;background:#facc1508}
.strat{background:#161626;border-radius:12px;overflow:hidden;margin-bottom:9px}
.gap-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.gcell{background:#0d1220;border-radius:8px;padding:8px 10px}
.ggrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-bottom:10px}
.gcell2{background:#0d1220;border-radius:8px;padding:8px;text-align:center}
.to-row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #1e2d40;align-items:center}
.tl-item{border-radius:12px;overflow:hidden;margin-bottom:10px}
.tl-head{padding:10px 14px;display:flex;align-items:center;gap:8px}
.tl-body{padding:10px 14px}
.tl-time{font-size:14px;font-weight:900;min-width:80px}
.tl-ttl{font-size:13px;font-weight:800}
.tl-row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #1e2035;font-size:11px;color:#94a3b8}
.tl-row:last-child{border:none}
.kpi-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:8px}
.kpi-mini{background:#0d1220;border-radius:8px;padding:7px 8px;text-align:center}
#reloadbtn{background:#151e30;border:1px solid #1e2d40;border-radius:10px;padding:9px 22px;color:#64748b;font-size:12px;cursor:pointer;font-family:inherit;display:block;margin:20px auto 0}
</style>
</head>
<body>
<div id="hdr">
  <div class="sub">Monday Performance Analysis</div>
  <h1>🔴 月曜日 売上向上ダッシュボード</h1>
  <div class="desc">JPN TAXI専用 / GO中心戦略 / サンキュー24時解放</div>
</div>
<div id="msgbox"><span class="spin">⏳</span> データ取得中...</div>
<button class="rbtn" id="rbtn" onclick="init()" style="display:none">🔄 再試行</button>
<div id="dashboard" style="display:none">
  <div class="kpi-grid" id="kpis"></div>
  <div class="tabs">
    <button class="tab on"   onclick="sw('compare',this)">📊 曜日比較</button>
    <button class="tab"      onclick="sw('hourly',this)">🕐 時間帯</button>
    <button class="tab"      onclick="sw('spots',this)">📍 乗車地</button>
    <button class="tab"      onclick="sw('status',this)">🚦 状態別</button>
    <button class="tab gold" onclick="sw('best',this)" style="background:#f59e0b">🏆 10万超え</button>
    <button class="tab gold" onclick="sw('strategy',this)" style="background:#f87171">🎯 月曜戦略</button>
  </div>
  <div class="panel on" id="p-compare"></div>
  <div class="panel"    id="p-hourly"></div>
  <div class="panel"    id="p-spots"></div>
  <div class="panel"    id="p-status"></div>
  <div class="panel"    id="p-best"></div>
  <div class="panel"    id="p-strategy"></div>
  <button id="reloadbtn" onclick="init()">🔄 データ再読み込み</button>
</div>

<script>
var U1='https://docs.google.com/spreadsheets/d/e/2PACX-1vT2iLNU2ehDRMl7CQt2ETLkVwIeIRMAEpNsFjImdrWDBGuiTWLiwXc9aTtnhbJzWl0uvN0kEPw9Bd-0/pub?gid=0&single=true&output=csv';
var U2='https://docs.google.com/spreadsheets/d/e/2PACX-1vTm1IwbqhN5odntM8GhM4xHZwR3h1a4WKeWpt-4eLDczrGTTAVz8Bl49SI_c0jGEVrp0t_8iRMTN77A/pub?gid=0&single=true&output=csv';
var DOW=['月','火','水','木','金','土','日'];
var DC={月:'#f87171',火:'#fb923c',水:'#facc15',木:'#4ade80',金:'#60a5fa',土:'#a78bfa',日:'#f472b6'};

function msg(t,c){var el=document.getElementById('msgbox');el.innerHTML=t;el.style.borderColor=c||'#60a5fa';}
function showDash(){document.getElementById('msgbox').style.display='none';document.getElementById('rbtn').style.display='none';document.getElementById('dashboard').style.display='';}
function showErr(e){msg('⚠️ <strong style="color:#f87171">エラー</strong><br>'+String(e),'#f87171');document.getElementById('rbtn').style.display='';}

function csv(text){
  var lines=text.trim().split(/\r?\n/).filter(function(l){return l.trim();});
  function sp(line){var cols=[],cur='',q=false;for(var i=0;i<line.length;i++){var c=line[i];if(c==='"'){q=!q;}else if(c===','&&!q){cols.push(cur.trim());cur='';}else{cur+=c;}}cols.push(cur.trim());return cols;}
  var h=sp(lines[0]);
  var r=lines.slice(1).map(function(l){var v=sp(l),o={};h.forEach(function(k,i){o[k]=v[i]||'';});return o;});
  return{h:h,r:r};
}
function toN(v){return parseInt(String(v||'').replace(/[^\d]/g,''))||0;}
function av(a){return a.length?Math.round(a.reduce(function(x,y){return x+y;},0)/a.length):0;}
function es(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function bar(pct,col,h,rt){pct=Math.min(pct||0,100);h=h||18;var lbl=pct>16?'<span style="font-size:9px;color:#fff;padding-left:8px;font-weight:700">'+Math.round(pct)+'%</span>':'';var right=rt?'<div style="position:absolute;top:0;right:0;bottom:0;display:flex;align-items:center;padding-right:8px"><span style="font-size:9px;color:#f87171;font-weight:700">'+rt+'</span></div>':'';return '<div class="bwrap" style="height:'+h+'px"><div class="binner" style="width:'+pct+'%;height:'+h+'px;background:'+col+'">'+lbl+'</div>'+right+'</div>';}
function mbar(pct,col){pct=Math.min(pct||0,100);return '<div class="mbar"><div class="mbari" style="width:'+pct+'%;background:'+col+'"></div></div>';}
function kpi(ico,lbl,val,sub,col){return '<div class="kpi" style="border:1px solid '+col+'33;border-top:3px solid '+col+'"><p style="font-size:13px;margin-bottom:2px">'+ico+'</p><p style="font-size:9px;color:#475569;letter-spacing:1px;margin-bottom:3px">'+lbl+'</p><p style="font-size:14px;font-weight:800;color:'+col+';line-height:1.2">'+val+'</p><p style="font-size:9px;color:#475569;margin-top:3px">'+sub+'</p></div>';}

async function init(){
  msg('<span class="spin">⏳</span> 日報CSV 取得中...','#60a5fa');
  document.getElementById('rbtn').style.display='none';
  document.getElementById('dashboard').style.display='none';
  document.getElementById('msgbox').style.display='';
  try{
    var r1=await fetch(U1);if(!r1.ok)throw new Error('日報 HTTP '+r1.status);var t1=await r1.text();
    msg('<span class="spin">⏳</span> 日報詳細CSV 取得中...','#60a5fa');
    var r2=await fetch(U2);if(!r2.ok)throw new Error('詳細 HTTP '+r2.status);var t2=await r2.text();
    msg('<span class="spin">⏳</span> 集計中...','#60a5fa');
    var R=analyze(t1,t2);render(R);showDash();
  }catch(e){showErr(e);}
}

function analyze(t1,t2){
  var d1=csv(t1),d2=csv(t2);

  /* 日報① */
  var bd={};DOW.forEach(function(d){bd[d]={f:[],tr:[],re:[],rows:[]};});
  d1.r.forEach(function(r){
    var dow=(r['曜']||'').trim();if(!dow||!bd[dow])return;
    var f=toN(r['営収']);if(f<=0)return;
    bd[dow].f.push(f);bd[dow].rows.push(r);
    var tr=toN(r['回数']);if(tr>0)bd[dow].tr.push(tr);
    var re=parseFloat(r['実車率'])||0;if(re>0)bd[dow].re.push(re);
  });
  var ds=DOW.map(function(d){
    var x=bd[d];
    return{d:d,cnt:x.f.length,avg:av(x.f),max:x.f.length?Math.max.apply(null,x.f):0,
      tavg:av(x.tr),ravg:x.re.length?Math.round(av(x.re)*10)/10:0,
      over100:x.f.filter(function(v){return v>=100000;}).length,rows:x.rows};
  });

  /* 月曜10万超え日 */
  var monOver=[];
  bd['月'].rows.forEach(function(r){
    var f=toN(r['営収']);
    if(f>=100000)monOver.push({date:r['日付']||'',fare:f,trips:toN(r['回数']),real:parseFloat(r['実車率'])||0});
  });
  monOver.sort(function(a,b){return b.fare-a.fare;});
  var monNormF=bd['月'].rows.filter(function(r){var f=toN(r['営収']);return f>0&&f<100000;}).map(function(r){return toN(r['営収']);});

  /* 日報② */
  var mon2=d2.r.filter(function(r){return(r['曜日']||'').trim()==='月';});
  /* プレタク除外（サンキュー列がプレタク/プレタクPの行を除外） */
  var mon2jpn=mon2.filter(function(r){
    var sk=(r['サンキュー']||'').trim();
    return sk!=='プレタク'&&sk!=='プレタクP';
  });

  var overDates=new Set(monOver.map(function(x){return x.date;}));
  var monHi=mon2jpn.filter(function(r){return overDates.has(r['日付']||'');});
  var monLo=mon2jpn.filter(function(r){return!overDates.has(r['日付']||'');});

  function hourDist(rows){
    var m={};
    rows.forEach(function(r){
      var ts=(r['乗車時間']||'').trim();var m2=ts.match(/^(\d{1,2}):/);if(!m2)return;
      var h=+m2[1],f=toN(r['料金']);if(f<=0)return;
      var lbl=h>=24?'翌'+(h-24)+'時台':h+'時台';
      if(!m[lbl])m[lbl]={tot:0,cnt:0,k:h};m[lbl].tot+=f;m[lbl].cnt++;
    });
    return Object.entries(m).sort(function(a,b){return a[1].k-b[1].k;})
      .map(function(e){return{lbl:e[0],avg:Math.round(e[1].tot/e[1].cnt),cnt:e[1].cnt,k:e[1].k};});
  }

  function buildTop(rows,lim){
    var m={};
    rows.forEach(function(r){
      var w=(r['乗車地：市区']||'').trim(),nm=(r['乗車地：地名']||'').trim();
      var full=w&&nm?w+nm:w||nm;var f=toN(r['料金']);if(!full||f<=0)return;
      if(!m[full])m[full]={cnt:0,tot:0};m[full].cnt++;m[full].tot+=f;
    });
    return Object.entries(m).sort(function(a,b){return b[1].cnt-a[1].cnt;}).slice(0,lim)
      .map(function(e){return{name:e[0],cnt:e[1].cnt,avg:Math.round(e[1].tot/e[1].cnt)};});
  }

  function buildMix(rows,key){
    var m={};
    rows.forEach(function(r){
      var v=(r[key]||'その他').trim()||'その他';
      if(!m[v])m[v]={cnt:0,tot:0};var f=toN(r['料金']);m[v].cnt++;if(f>0)m[v].tot+=f;
    });
    return Object.entries(m).sort(function(a,b){return b[1].cnt-a[1].cnt;})
      .map(function(e){return{name:e[0],cnt:e[1].cnt,avg:e[1].cnt>0?Math.round(e[1].tot/e[1].cnt):0};});
  }

  return{
    ds:ds,monOver:monOver,
    normAvgFare:av(monNormF),
    hourly:hourDist(mon2jpn),
    fromTop:buildTop(mon2jpn,15),
    toTop:buildTop(mon2jpn.map(function(r){return Object.assign({},r,{'乗車地：市区':r['降車地：市区'],'乗車地：地名':r['降車地：地名']});}),10),
    stMix:buildMix(mon2jpn,'ステータス'),
    skMix:buildMix(mon2jpn,'サンキュー'),
    monCnt:mon2jpn.length,
    hiHourly:hourDist(monHi),loHourly:hourDist(monLo),
    hiFrom:buildTop(monHi,10),loFrom:buildTop(monLo,10),
    hiSt:buildMix(monHi,'ステータス'),loSt:buildMix(monLo,'ステータス'),
  };
}

function render(R){
  var valid=R.ds.filter(function(d){return d.avg>0;});
  var mon=R.ds.find(function(d){return d.d==='月';})||{d:'月',cnt:0,avg:0,max:0,tavg:0,over100:0};
  var aAll=av(valid.map(function(d){return d.avg;}));
  var aOth=av(valid.filter(function(d){return d.d!=='月';}).map(function(d){return d.avg;}));
  var gap=mon.avg-aAll;
  var maxA=valid.length?Math.max.apply(null,valid.map(function(d){return d.avg;})):1;
  var sorted=[].concat(valid).sort(function(a,b){return b.avg-a.avg;});
  var rank=sorted.findIndex(function(d){return d.d==='月';})+1;
  var mxH=R.hourly.length?Math.max.apply(null,R.hourly.map(function(h){return h.cnt;})):1;
  var mxF=R.fromTop.length?Math.max.apply(null,R.fromTop.map(function(f){return f.cnt;})):1;

  /* KPI */
  var c0=gap<0?'#f87171':'#4ade80',c1=rank>=5?'#f87171':'#facc15';
  document.getElementById('kpis').innerHTML=
    kpi('💰','月曜 平均営収','¥'+mon.avg.toLocaleString(),'全体比 '+(gap>=0?'+':'')+gap.toLocaleString(),c0)+
    kpi('🏆','売上ランク',rank+'位/'+valid.length+'曜','最高¥'+mon.max.toLocaleString(),c1)+
    kpi('🌟','10万超え日',mon.over100+'日/'+mon.cnt+'日','成功率'+(mon.cnt>0?Math.round(mon.over100/mon.cnt*100):0)+'%','#f59e0b');

  /* ── 曜日比較 ── */
  var h='<p style="font-size:11px;color:#475569;margin-bottom:12px">曜日別 平均営収（高い順）</p>';
  sorted.forEach(function(s){
    var pct=s.avg/maxA*100,im=s.d==='月';
    var bg=im?'linear-gradient(90deg,#f87171,#fbbf24)':DC[s.d]+'55';
    h+='<div style="margin-bottom:9px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:3px"><div style="display:flex;align-items:center;gap:7px"><span style="width:27px;height:27px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;border:1.5px solid '+DC[s.d]+';background:'+(im?'#f87171':DC[s.d]+'22')+';color:'+(im?'#fff':DC[s.d])+'">'+s.d+'</span><span style="font-size:11px;color:#475569">'+s.cnt+'日'+(s.tavg>0?' avg'+s.tavg+'件':'')+'</span></div><span style="font-size:13px;font-weight:700;color:'+(im?'#f87171':'#e2e8f0')+'">¥'+s.avg.toLocaleString()+'</span></div>'+bar(pct,bg,18,im?((s.avg/aAll-1)*100).toFixed(1)+'%':'')+'</div>';
  });
  h+='<div class="card" style="border-color:#f8717155;background:#f8717108"><p style="font-size:11px;font-weight:700;color:#f87171;margin-bottom:8px">⚡ 月曜ギャップ</p><div class="gap-grid">';
  [{l:'vs 全体平均',v:(gap>=0?'+':'')+'¥'+Math.abs(gap).toLocaleString(),c:gap<0?'#f87171':'#4ade80'},
   {l:'vs 他曜日平均',v:(av(valid.filter(function(d){return d.d!=='月';}).map(function(d){return d.avg;}))-mon.avg>=0?'-':'+')+'¥'+Math.abs(mon.avg-aOth).toLocaleString(),c:mon.avg<aOth?'#f87171':'#4ade80'},
   {l:'トップとの差',v:'-¥'+(maxA-mon.avg).toLocaleString(),c:'#f87171'},
   {l:'月曜最高記録',v:'¥'+mon.max.toLocaleString(),c:'#4ade80'},
  ].forEach(function(x){h+='<div class="gcell"><p style="font-size:9px;color:#475569;margin-bottom:3px">'+x.l+'</p><p style="font-size:14px;font-weight:800;color:'+x.c+'">'+x.v+'</p></div>';});
  h+='</div></div>';
  document.getElementById('p-compare').innerHTML=h;

  /* ── 時間帯 ── */
  h='<p style="font-size:11px;color:#475569;margin-bottom:12px">月曜 時間帯別 件数/平均単価（JPN TAXI '+R.monCnt+'件）</p>';
  R.hourly.forEach(function(hh){
    var pct=hh.cnt/mxH*100,hot=pct>=55,mid=pct>=25;
    var col=hot?'linear-gradient(90deg,#f59e0b,#f87171)':mid?'linear-gradient(90deg,#2563eb,#60a5fa44)':'#1e2d40';
    h+='<div style="margin-bottom:8px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:3px"><div style="display:flex;align-items:center"><span style="font-size:12px;font-weight:700;min-width:52px;color:'+(hot?'#facc15':mid?'#60a5fa':'#64748b')+'">'+es(hh.lbl)+'</span>';
    if(hot)h+='<span style="font-size:9px;background:#f59e0b22;color:#f59e0b;padding:1px 5px;border-radius:8px;margin-left:4px">🔥HOT</span>';
    h+='</div><span style="font-size:11px;color:#475569">'+hh.cnt+'件 ¥'+hh.avg.toLocaleString()+'</span></div>'+bar(pct,col,20)+'</div>';
  });
  var hotS=R.hourly.filter(function(hh){return hh.cnt/mxH>=.55;});
  var deadS=R.hourly.filter(function(hh){return hh.cnt/mxH<.15;});
  if(hotS.length)h+='<div class="card" style="border-color:#f59e0b55;background:#f59e0b0a"><p style="font-size:11px;font-weight:700;color:#f59e0b;margin-bottom:5px">🔥 ピーク時間帯</p><p style="font-size:12px;color:#cbd5e1;margin-bottom:5px">'+hotS.map(function(hh){return es(hh.lbl)+'（'+hh.cnt+'件）';}).join('　')+'</p><p style="font-size:11px;color:#94a3b8">→ この時間帯に確実にTOP乗車地エリアへ</p></div>';
  if(deadS.length)h+='<div class="card" style="border-color:#47556944;background:#47556908"><p style="font-size:11px;font-weight:700;color:#64748b;margin-bottom:5px">💤 閑散時間帯</p><p style="font-size:12px;color:#64748b;margin-bottom:5px">'+deadS.map(function(hh){return es(hh.lbl);}).join('・')+'</p><p style="font-size:11px;color:#475569">→ 食事・休憩・ピーク前の体力温存に活用</p></div>';
  document.getElementById('p-hourly').innerHTML=h;

  /* ── 乗車地 ── */
  h='<p style="font-size:11px;color:#475569;margin-bottom:12px">月曜 乗車地 TOP'+R.fromTop.length+'（JPN TAXI・件数順）</p>';
  R.fromTop.forEach(function(s,i){
    var pct=s.cnt/mxF*100,top=i<3,md=['🥇','🥈','🥉'][i]||(i+1+'.');
    h+='<div class="spot'+(top?' t':'')+'"><div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:5px"><div style="display:flex;align-items:center;gap:6px;flex:1"><span style="font-size:13px;flex-shrink:0">'+md+'</span><span style="font-size:11px;font-weight:700;color:'+(top?'#facc15':'#e2e8f0')+'">'+es(s.name)+'</span></div><div style="text-align:right;flex-shrink:0;margin-left:8px"><p style="font-size:13px;font-weight:700;color:'+(top?'#facc15':'#94a3b8')+'">'+s.cnt+'件</p><p style="font-size:9px;color:#475569">avg ¥'+s.avg.toLocaleString()+'</p></div></div>'+mbar(pct,top?'linear-gradient(90deg,#f59e0b,#facc15)':'#1e2d40')+'</div>';
  });
  h+='<div class="card" style="border-color:#4ade8055;background:#4ade8008"><p style="font-size:11px;font-weight:700;color:#4ade80;margin-bottom:5px">📍 月曜定点エリア</p><p style="font-size:12px;color:#cbd5e1;line-height:1.8"><strong style="color:#facc15">TOP3：'+R.fromTop.slice(0,3).map(function(s){return es(s.name);}).join(' · ')+'</strong><br>繁華街のやや外側に位置取り、1時間に1回は通過する巡回ルートを設定。</p></div>';
  document.getElementById('p-spots').innerHTML=h;

  /* ── 状態別 ── */
  var cols5=['#60a5fa','#4ade80','#facc15','#f87171','#a78bfa','#fb923c'];
  function mixSec(title,col,data,total,icons){
    var s='<div class="card"><p style="font-size:11px;font-weight:700;color:'+col+';margin-bottom:8px">'+title+'（計'+total+'件）</p>';
    data.forEach(function(x,i){var pct=total>0?x.cnt/total*100:0,c=cols5[i%cols5.length],ico=(icons&&icons[x.name])||'';s+='<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;margin-bottom:3px;align-items:baseline"><span style="font-size:12px;font-weight:600;color:'+c+'">'+(ico?ico+' ':'')+es(x.name)+'</span><span style="font-size:11px;color:#475569">'+x.cnt+'件（'+pct.toFixed(1)+'%）'+(x.avg>0?' ¥'+x.avg.toLocaleString():'')+'</span></div>'+bar(pct,c+'99')+'</div>';});
    return s+'</div>';
  }
  var tSt=R.stMix.reduce(function(a,b){return a+b.cnt;},0);
  var tSk=R.skMix.reduce(function(a,b){return a+b.cnt;},0);
  h=mixSec('🚦 ステータス別','#60a5fa',R.stMix,tSt,{GO:'🟢',スマ配:'📱',流し:'🚕'});
  h+=mixSec('🎫 サンキュー別','#a78bfa',R.skMix,tSk,{サンキュー:'🎫',通常:'🚕'});
  h+='<div class="card" style="border-color:#60a5fa44;background:#60a5fa08"><p style="font-size:11px;font-weight:700;color:#60a5fa;margin-bottom:6px">💡 月曜ステータス戦略</p><p style="font-size:12px;color:#cbd5e1;line-height:1.8">月曜はGO中心で組み立てる。スマ配は来たら受けるが待たない。流しはCV110%で中央値¥1,800と不安定なため補助的に活用。</p></div>';
  document.getElementById('p-status').innerHTML=h;

  /* ── 10万超え分析 ── */
  h='';
  var over=R.monOver;
  h+='<div class="card" style="border-color:#f59e0b55;background:#f59e0b0a">';
  h+='<p style="font-size:12px;font-weight:700;color:#f59e0b;margin-bottom:10px">🌟 月曜10万超え概要</p>';
  h+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px">';
  h+='<div class="gcell2"><p style="font-size:9px;color:#475569;margin-bottom:3px">10万超え日数</p><p style="font-size:20px;font-weight:800;color:#f59e0b">'+over.length+'日</p><p style="font-size:9px;color:#475569">/ 月曜'+mon.cnt+'日</p></div>';
  h+='<div class="gcell2"><p style="font-size:9px;color:#475569;margin-bottom:3px">成功率</p><p style="font-size:20px;font-weight:800;color:#f59e0b">'+(mon.cnt>0?Math.round(over.length/mon.cnt*100):0)+'%</p></div>';
  h+='</div>';
  if(over.length>0){
    var oAvg=av(over.map(function(x){return x.fare;}));
    h+='<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px">';
    [{l:'10万超え平均',v:'¥'+oAvg.toLocaleString(),c:'#f59e0b'},
     {l:'通常日平均',v:'¥'+R.normAvgFare.toLocaleString(),c:'#94a3b8'},
     {l:'差額',v:'+¥'+(oAvg-R.normAvgFare).toLocaleString(),c:'#4ade80'},
    ].forEach(function(x){h+='<div class="gcell2"><p style="font-size:9px;color:#475569;margin-bottom:3px">'+x.l+'</p><p style="font-size:12px;font-weight:800;color:'+x.c+'">'+x.v+'</p></div>';});
    h+='</div>';
  }
  h+='</div>';
  if(over.length>0){
    h+='<p style="font-size:11px;color:#475569;margin-bottom:8px">📅 達成日リスト（高い順）</p>';
    over.forEach(function(x,i){
      h+='<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:#161626;border:1px solid #f59e0b44;border-radius:8px;margin-bottom:6px"><div><p style="font-size:12px;font-weight:700;color:#f59e0b">'+es(x.date)+'</p><p style="font-size:10px;color:#64748b">'+x.trips+'件 実車'+x.real+'%</p></div><p style="font-size:16px;font-weight:800;color:#f59e0b">¥'+x.fare.toLocaleString()+'</p></div>';
    });
  }
  /* 時間帯比較 */
  if(R.hiHourly.length>0){
    h+='<div class="card" style="margin-top:4px"><p style="font-size:11px;font-weight:700;color:#e2e8f0;margin-bottom:10px">🕐 時間帯パターン比較</p>';
    h+='<table style="width:100%;border-collapse:collapse;font-size:11px"><thead><tr><th style="text-align:left;color:#475569;padding:4px 6px;border-bottom:1px solid #1e2d40">時間帯</th><th style="text-align:right;color:#f59e0b;padding:4px 6px;border-bottom:1px solid #1e2d40">🌟10万超え</th><th style="text-align:right;color:#94a3b8;padding:4px 6px;border-bottom:1px solid #1e2d40">通常日</th><th style="text-align:right;color:#64748b;padding:4px 6px;border-bottom:1px solid #1e2d40">差</th></tr></thead><tbody>';
    var allH=[];
    R.hiHourly.forEach(function(x){if(allH.indexOf(x.lbl)<0)allH.push(x.lbl);});
    R.loHourly.forEach(function(x){if(allH.indexOf(x.lbl)<0)allH.push(x.lbl);});
    allH.sort(function(a,b){
      var ka=(R.hiHourly.find(function(x){return x.lbl===a;})||R.loHourly.find(function(x){return x.lbl===a;})||{k:99}).k;
      var kb=(R.hiHourly.find(function(x){return x.lbl===b;})||R.loHourly.find(function(x){return x.lbl===b;})||{k:99}).k;
      return ka-kb;
    });
    var hiT=R.hiHourly.reduce(function(a,b){return a+b.cnt;},0)||1;
    var loT=R.loHourly.reduce(function(a,b){return a+b.cnt;},0)||1;
    allH.forEach(function(lbl){
      var hi=R.hiHourly.find(function(x){return x.lbl===lbl;});
      var lo=R.loHourly.find(function(x){return x.lbl===lbl;});
      var hp=hi?Math.round(hi.cnt/hiT*100):0,lp=lo?Math.round(lo.cnt/loT*100):0,diff=hp-lp;
      var key=Math.abs(diff)>=5;
      h+='<tr'+(key?' style="background:#f59e0b08"':'')+'><td style="font-size:11px;color:'+(key?'#f59e0b':'#64748b')+';padding:5px 6px;border-bottom:1px solid #0d1220">'+es(lbl)+'</td><td style="text-align:right;padding:5px 6px;border-bottom:1px solid #0d1220;color:#f59e0b;font-weight:'+(key?700:400)+'">'+hp+'%</td><td style="text-align:right;padding:5px 6px;border-bottom:1px solid #0d1220;color:#94a3b8">'+lp+'%</td><td style="text-align:right;padding:5px 6px;border-bottom:1px solid #0d1220;color:'+(diff>0?'#4ade80':diff<0?'#f87171':'#475569');h+=';font-weight:700">'+(diff>=0?'+':'')+diff+'%</td></tr>';
    });
    h+='</tbody></table></div>';
  }
  document.getElementById('p-best').innerHTML=h;

  /* ══════════════════════════════════
     🎯 月曜戦略タブ（完全版）
  ══════════════════════════════════ */
  var hotP=R.hourly.filter(function(hh){return hh.cnt/mxH>=.55;}).map(function(hh){return hh.lbl;}).join('・')||'ピーク時間帯確認';
  var t3=R.fromTop.slice(0,3).map(function(s){return s.name;}).join(' · ')||'TOP乗車地確認';
  h='';

  /* 前提条件バナー */
  h+='<div class="card" style="border-color:#f8717166;background:#f8717110">';
  h+='<p style="font-size:12px;font-weight:700;color:#f87171;margin-bottom:8px">⚠️ 月曜の特殊条件</p>';
  h+='<div style="font-size:12px;color:#cbd5e1;line-height:2">';
  h+='🎫 サンキュー：<strong style="color:#f87171">24時まで0枚（丸腰）</strong><br>';
  h+='🟢 GO：<strong style="color:#4ade80">唯一の武器・中央値¥2,300</strong><br>';
  h+='📱 スマ配：来たら受ける・待たない（CV91%・時間ロス大）<br>';
  h+='🚕 流し：補助的のみ（中央値¥1,800・CV110%・不安定）';
  h+='</div></div>';

  /* タイムライン */
  h+='<p style="font-size:11px;color:#475569;margin-bottom:10px;margin-top:4px">⏰ 月曜 営業タイムライン</p>';

  var timeline=[
    {
      time:'16:00〜17:00',phase:'立ち上がり',col:'#60a5fa',icon:'🚀',
      items:[
        '環八を越えてから連続配車ON',
        '吉祥寺エリアを避ける',
        '外苑前方面へ移動しながらGO待受',
        '目標：3〜4件 / ¥7,000',
      ],
      kpis:[{l:'目標件数',v:'3〜4件'},{l:'目標金額',v:'¥7,000'},{l:'サンキュー',v:'OFF'}]
    },
    {
      time:'17:00〜22:00',phase:'回転重視フェーズ',col:'#facc15',icon:'🔄',
      items:[
        'サンキューOFF・近距離案件を腐らず受注',
        '¥2,000前後でも積極受注（腐らない）',
        'GOポジション：繁華街のやや外側',
        '定点エリア：'+t3,
        'ピーク時間帯（'+hotP+'）に確実に稼働',
        '目標：22時までに30件・¥30,000',
      ],
      kpis:[{l:'目標件数',v:'26〜27件'},{l:'目標金額',v:'¥23,000'},{l:'サンキュー',v:'OFF'}]
    },
    {
      time:'22:00〜24:00',phase:'割増・切り替え準備',col:'#fb923c',icon:'🌙',
      items:[
        '割増時間帯（22〜5時）に突入',
        'サンキューはまだないが単価が自然に上がる',
        'GOの回転を維持しながら単価UPを狙う',
        '目標：8〜10件・¥15,000',
      ],
      kpis:[{l:'目標件数',v:'8〜10件'},{l:'目標金額',v:'¥15,000'},{l:'サンキュー',v:'まだOFF'}]
    },
    {
      time:'24:00〜',phase:'サンキュー解放フェーズ',col:'#a78bfa',icon:'⭐',
      items:[
        'サンキューON（最大4枚＋優先パス分）',
        '割増×サンキューの最強コンボ',
        '¥3,000以上保証案件を優先',
        '回数より単価に切り替え',
        '目標：残り時間で¥20,000上乗せ',
      ],
      kpis:[{l:'目標金額',v:'¥20,000↑'},{l:'サンキュー',v:'最大4枚ON'},{l:'狙い',v:'単価重視'}]
    },
  ];

  timeline.forEach(function(tl){
    h+='<div class="tl-item" style="border:1px solid '+tl.col+'33">';
    h+='<div class="tl-head" style="background:'+tl.col+'15">';
    h+='<span style="font-size:18px">'+tl.icon+'</span>';
    h+='<div><p class="tl-time" style="color:'+tl.col+'">'+tl.time+'</p><p class="tl-ttl" style="color:'+tl.col+'">'+tl.phase+'</p></div>';
    h+='</div>';
    h+='<div class="tl-body">';
    tl.items.forEach(function(item){
      h+='<div class="tl-row"><span>▸ '+es(item)+'</span></div>';
    });
    h+='<div class="kpi-row">';
    tl.kpis.forEach(function(k){
      h+='<div class="kpi-mini"><p style="font-size:9px;color:#475569;margin-bottom:2px">'+k.l+'</p><p style="font-size:11px;font-weight:800;color:'+tl.col+'">'+k.v+'</p></div>';
    });
    h+='</div></div></div>';
  });

  /* 数値目標サマリー */
  h+='<div class="card" style="border-color:#4ade8055;background:#4ade8008">';
  h+='<p style="font-size:12px;font-weight:700;color:#4ade80;margin-bottom:10px">📊 月曜 数値目標サマリー</p>';
  h+='<table style="width:100%;border-collapse:collapse;font-size:11px">';
  h+='<thead><tr><th style="text-align:left;color:#475569;padding:4px 6px;border-bottom:1px solid #1e2d40">フェーズ</th><th style="text-align:right;color:#60a5fa;padding:4px 6px;border-bottom:1px solid #1e2d40">件数</th><th style="text-align:right;color:#4ade80;padding:4px 6px;border-bottom:1px solid #1e2d40">金額</th></tr></thead><tbody>';
  [{ph:'16〜17時',cnt:'3〜4件',fare:'¥7,000'},
   {ph:'17〜22時',cnt:'26〜27件',fare:'¥23,000'},
   {ph:'22〜24時',cnt:'8〜10件',fare:'¥15,000'},
   {ph:'24時〜',cnt:'単価重視',fare:'¥20,000↑'},
   {ph:'合計',cnt:'約40件',fare:'¥65,000〜',bold:true},
  ].forEach(function(r){
    h+='<tr style="'+(r.bold?'border-top:2px solid #4ade8055;background:#4ade8008':'')+'">';
    h+='<td style="padding:6px 6px;border-bottom:1px solid #0d1220;color:'+(r.bold?'#4ade80':'#94a3b8')+';font-weight:'+(r.bold?700:400)+'">'+r.ph+'</td>';
    h+='<td style="text-align:right;padding:6px 6px;border-bottom:1px solid #0d1220;color:#60a5fa;font-weight:'+(r.bold?700:400)+'">'+r.cnt+'</td>';
    h+='<td style="text-align:right;padding:6px 6px;border-bottom:1px solid #0d1220;color:#4ade80;font-weight:'+(r.bold?700:400)+'">'+r.fare+'</td></tr>';
  });
  h+='</tbody></table></div>';

  /* 10万超えへの道 */
  h+='<div class="card" style="border-color:#f59e0b55;background:#f59e0b08">';
  h+='<p style="font-size:12px;font-weight:700;color:#f59e0b;margin-bottom:8px">🌟 10万超えへの条件</p>';
  h+='<div style="font-size:12px;color:#cbd5e1;line-height:2">';
  h+='✅ 前週の連続配車起動率60%超（サンキュー確保）<br>';
  h+='✅ 17〜22時に<strong style="color:#facc15">30件以上</strong>こなせている<br>';
  h+='✅ 24時以降にサンキューを<strong style="color:#a78bfa">効果的に消費</strong><br>';
  h+='✅ GOポジショニングがハマる日（探索ナビで確認）<br>';
  h+='✅ 月曜10万超え特徴エリア（'+R.hiFrom.slice(0,2).map(function(s){return es(s.name);}).join('・')+'）に位置取り';
  h+='</div></div>';

  /* 週次PDCA */
  h+='<div class="card" style="border-color:#fb923c55;background:#fb923c08">';
  h+='<p style="font-size:12px;font-weight:700;color:#fb923c;margin-bottom:8px">📊 週次PDCA（毎週月曜帰りに確認）</p>';
  h+='<div style="font-size:12px;color:#cbd5e1;line-height:2">';
  h+='① 22時時点の件数は<strong style="color:#facc15">30件超え</strong>ているか？<br>';
  h+='② 24時以降のサンキュー消費枚数と平均単価<br>';
  h+='③ 前週月曜との差額（改善しているか）<br>';
  h+='→ 小さな改善の積み重ねが3ヶ月後に大きな差になる';
  h+='</div></div>';

  document.getElementById('p-strategy').innerHTML=h;
}

function sw(id,btn){
  document.querySelectorAll('.tab').forEach(function(b){b.classList.remove('on');});
  btn.classList.add('on');
  document.querySelectorAll('.panel').forEach(function(p){p.classList.remove('on');});
  document.getElementById('p-'+id).classList.add('on');
}
init();
</script>
