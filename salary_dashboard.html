<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>出番表・給与・拘束時間</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c232c; --border:#2d3640;
    --txt:#e6edf3; --dim:#8b949e; --accent:#3fb950; --accent2:#58a6ff;
    --warn:#d29922; --danger:#f85149; --gold:#e3b341; --mono:'SF Mono',ui-monospace,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI",sans-serif;
    padding:14px;max-width:760px;margin:0 auto;line-height:1.5;}
  h1{font-size:1.1rem;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:2px;}
  h1 .tag{font-size:.6rem;background:var(--accent);color:#06250f;padding:2px 7px;border-radius:10px;font-weight:700;}
  .sub{color:var(--dim);font-size:.7rem;margin-bottom:14px;}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:15px;margin-bottom:14px;}
  .panel h2{font-size:.9rem;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:7px;
    border-left:3px solid var(--accent);padding-left:9px;}
  .panel h2.t-time{border-color:var(--accent2);}
  .controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px;}
  select,button{background:var(--panel2);color:var(--txt);border:1px solid var(--border);border-radius:7px;padding:7px 11px;font-size:.82rem;font-family:inherit;}
  button{cursor:pointer;} button.ghost:hover{border-color:var(--accent2);}
  .summary{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:6px;}
  @media(max-width:560px){.summary{grid-template-columns:repeat(2,1fr);}}
  .stat{background:var(--panel2);border:1px solid var(--border);border-radius:9px;padding:10px 12px;}
  .stat .lbl{font-size:.62rem;color:var(--dim);margin-bottom:3px;}
  .stat .val{font-size:1.15rem;font-weight:700;font-family:var(--mono);}
  .ok{color:var(--accent);} .blue{color:var(--accent2);} .warn{color:var(--warn);} .danger{color:var(--danger);} .gold{color:var(--gold);}
  .pace{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:13px 15px;margin-top:9px;}
  .pace .big{font-size:1.9rem;font-weight:800;font-family:var(--mono);line-height:1.1;}
  .pace .msg{font-size:.82rem;font-weight:700;margin-top:2px;}
  .pace .note{font-size:.64rem;color:var(--dim);margin-top:3px;}
  table{width:100%;border-collapse:collapse;font-size:.84rem;}
  th,td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--border);font-family:var(--mono);white-space:nowrap;}
  th{color:var(--dim);font-weight:600;font-size:.68rem;}
  td:first-child,th:first-child,td:nth-child(2),th:nth-child(2){text-align:left;}
  tr.future td{color:var(--dim);}
  tr.future .machi{color:var(--accent2);}
  tr.over td{background:rgba(248,81,73,.08);}
  tfoot td{font-weight:700;border-top:2px solid var(--border);border-bottom:none;background:var(--panel2);}
  .badge{display:inline-block;font-size:.6rem;padding:1px 6px;border-radius:8px;}
  .badge.done{background:rgba(63,185,80,.18);color:var(--accent);}
  .badge.future{background:rgba(88,166,255,.16);color:var(--accent2);}
  .badge.dai{background:rgba(227,179,65,.18);color:var(--gold);}
  .badge.sho{background:rgba(88,166,255,.16);color:var(--accent2);}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
  .cal-dow{text-align:center;font-size:.64rem;color:var(--dim);padding:2px 0;font-weight:600;}
  .cal-dow.sat{color:var(--accent2);} .cal-dow.sun{color:var(--danger);}
  .cal-cell{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;border-radius:8px;font-size:.84rem;
    font-family:var(--mono);cursor:pointer;border:1px solid transparent;background:var(--panel2);position:relative;user-select:none;}
  .cal-cell.empty{background:transparent;cursor:default;}
  .cal-cell:hover:not(.empty):not(.done){border-color:var(--accent2);}
  .cal-cell.sel{background:var(--accent2);color:#04203f;font-weight:800;}
  .cal-cell.done{background:rgba(63,185,80,.18);color:var(--accent);border-color:var(--accent);font-weight:700;cursor:default;}
  .cal-cell.done::after{content:'✓';position:absolute;top:1px;right:3px;font-size:.55rem;}
  .cal-cell.sat{color:var(--accent2);} .cal-cell.sun{color:var(--danger);}
  .cal-cell.sel.sat,.cal-cell.sel.sun{color:#04203f;}
  .cal-cell.today{box-shadow:inset 0 0 0 2px var(--gold);}
  .legend{font-size:.64rem;color:var(--dim);margin-top:10px;line-height:1.7;}
  .err{background:rgba(248,81,73,.12);border:1px solid var(--danger);color:#ffb4ae;padding:10px;border-radius:8px;font-size:.78rem;margin-bottom:12px;}
</style>
</head>
<body>
<h1>出番表・給与・拘束時間 <span class="tag">⑦</span></h1>
<div class="sub" id="sub">読み込み中…</div>
<div id="err"></div>

<div class="controls">
  <label style="font-size:.78rem;color:var(--dim)">周期</label>
  <select id="cycleSel"></select>
  <span id="cycleType"></span>
</div>

<div class="panel">
  <h2>📋 出番表 — <span id="otTitle"></span></h2>
  <table id="otTable">
    <thead><tr><th>日付</th><th>曜</th><th>売上</th><th>拘束時間</th><th>状態</th></tr></thead>
    <tbody></tbody>
    <tfoot></tfoot>
  </table>
  <div class="legend" id="otLegend"></div>
</div>

<div class="panel">
  <h2 class="t-time">⏱ 拘束時間 — 使い切りペース</h2>
  <div class="summary" id="timeStats"></div>
  <div class="pace" id="pace"></div>
  <div class="legend" id="timeLegend"></div>
</div>

<div class="panel">
  <h2>💴 この周期の給与（空転差引・52%）</h2>
  <div class="summary" id="salStats"></div>
  <div class="legend" id="salLegend"></div>
</div>

<div class="panel">
  <h2 style="border-color:var(--dim)">🗓 出番を登録</h2>
  <div class="controls">
    <button class="ghost" id="calPrev">‹ 前月</button>
    <strong id="calTitle" style="font-size:.92rem;min-width:110px;text-align:center"></strong>
    <button class="ghost" id="calNext">翌月 ›</button>
    <span style="flex:1"></span>
    <button class="ghost" id="clearShift">この周期をクリア</button>
  </div>
  <div id="calendar"></div>
  <div class="legend">勤務表が出たら出番日を<b>タップ</b>。上の出番表に反映されます。売上が入った日は緑✓（消化済）で固定。<br>※将来はGoogleフォーム→スプレッドシート連携に差し替え予定。</div>
</div>

<script>
const NIPPOU_CSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vT2iLNU2ehDRMl7CQt2ETLkVwIeIRMAEpNsFjImdrWDBGuiTWLiwXc9aTtnhbJzWl0uvN0kEPw9Bd-0/pub?gid=0&single=true&output=csv";
const KUTEN_CSV  = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTTYCG_9IrMI-g9yXrshVt6Jy6EXRVOlDSrelt_BgBI5qi5U9m240OrY7APtcEQyNFd3CXrvbqswE2_/pub?gid=0&single=true&output=csv";
const PAY_RATE = 0.52;
const DAY_LIMIT_MIN = 20*60+59;
const LS_SHIFT = "otban_shifts_v1";
const LIMIT_DAI = 270*60, LIMIT_SHO = 262*60;
const CYCLE_TYPE = {
  '2025/04':'sho','2025/05':'dai','2025/06':'sho','2025/07':'dai','2025/08':'dai',
  '2025/09':'sho','2025/10':'dai','2025/11':'dai','2025/12':'sho','2026/01':'sho',
  '2026/02':'sho','2026/03':'dai','2026/04':'sho','2026/05':'dai','2026/06':'sho',
  '2026/07':'dai','2026/08':'dai','2026/09':'sho','2026/10':'dai','2026/11':'dai','2026/12':'sho'
};
function yen(s){ s=(s||'').replace(/[¥,\s]/g,''); const n=parseInt(s,10); return isNaN(n)?0:n; }
function hm2min(s){ s=(s||'').trim(); if(!s||s.indexOf(':')<0) return 0; const[h,m]=s.split(':'); const H=parseInt(h,10),M=parseInt(m,10); return (isNaN(H)?0:H)*60+(isNaN(M)?0:M); }
function min2hm(t){ const sign=t<0?'-':''; t=Math.abs(t); const h=Math.floor(t/60), m=Math.round(t%60); return sign+h+':'+String(m).padStart(2,'0'); }
function fmtYen(n){ return '¥'+n.toLocaleString('ja-JP'); }
function parseDate(s){ const m=(s||'').match(/(\d+)年(\d+)月(\d+)日/); if(!m) return null; let y=parseInt(m[1],10); y+=(y<100?2000:0); return {y, mo:parseInt(m[2],10), d:parseInt(m[3],10)}; }
function localDateStr(dt){ return dt.getFullYear()+'/'+String(dt.getMonth()+1).padStart(2,'0')+'/'+String(dt.getDate()).padStart(2,'0'); }
const WD=['日','月','火','水','木','金','土'];
function wdOf(iso){ const[y,m,d]=iso.split('/').map(Number); return WD[new Date(y,m-1,d).getDay()]; }
function cycleOf(y,mo,d){ let sy=y,smo=mo; if(d<16){ smo=mo-1; if(smo===0){smo=12; sy=y-1;} } return sy+'/'+String(smo).padStart(2,'0'); }
function cycleLabel(key){ const[y,m]=key.split('/').map(Number); let ny=y,nm=m+1; if(nm>12){nm=1;ny=y+1;} return `${y}年 ${m}月16日〜${nm}月15日`; }
function cycleLimit(key){ return CYCLE_TYPE[key]==='dai'?LIMIT_DAI:LIMIT_SHO; }
function cycleTypeJP(key){ return CYCLE_TYPE[key]==='dai'?'大':'小'; }
function parseCSV(text){
  const rows=[]; let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){ const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else { if(c==='"')q=true; else if(c===','){row.push(cur);cur='';} else if(c==='\n'){row.push(cur);rows.push(row);row=[];cur='';} else if(c==='\r'){} else cur+=c; }
  }
  if(cur!==''||row.length){row.push(cur);rows.push(row);}
  return rows;
}
let RECORDS=[];
let KUTEN={}, KUTEN_CNT={};
let CYCLES=[];
let CAL_Y,CAL_M;

async function loadData(){
  try{
    const res=await fetch(NIPPOU_CSV+'&_cb='+Date.now());
    if(!res.ok) throw new Error('日報CSV取得失敗('+res.status+')');
    const rows=parseCSV(await res.text());
    RECORDS=[];
    for(let i=1;i<rows.length;i++){
      const r=rows[i]; if(!r||r.length<16) continue;
      const pd=parseDate(r[0]); if(!pd) continue;
      const rev=yen(r[3]); if(!rev) continue;
      const iso=`${pd.y}/${String(pd.mo).padStart(2,'0')}/${String(pd.d).padStart(2,'0')}`;
      RECORDS.push({y:pd.y,mo:pd.mo,d:pd.d,key:cycleOf(pd.y,pd.mo,pd.d),iso,
        wd:r[1]||wdOf(iso),rev,kosoku:hm2min(r[15]),deban:(r[12]||'').trim()});
    }
    KUTEN={};KUTEN_CNT={};
    try{
      const k=await fetch(KUTEN_CSV+'&_cb='+Date.now());
      if(k.ok){ const kr=parseCSV(await k.text());
        for(let i=1;i<kr.length;i++){ const r=kr[i]; if(!r||r.length<9) continue;
          const dm=(r[1]||'').match(/(\d{4})[\/\-](\d+)[\/\-](\d+)/); if(!dm) continue;
          const key=cycleOf(+dm[1],+dm[2],+dm[3]); const amt=yen(r[8]); if(!amt) continue;
          KUTEN[key]=(KUTEN[key]||0)+amt; KUTEN_CNT[key]=(KUTEN_CNT[key]||0)+1;
        }
      }
    }catch(e){ console.warn('空転CSV未取得',e); }
    CYCLES=[...new Set(RECORDS.map(r=>r.key))].sort().reverse();
    init();
  }catch(e){
    document.getElementById('err').innerHTML='<div class="err">⚠ '+e.message+'<br>GitHub Pages上では正常に読み込めます。</div>';
    document.getElementById('sub').textContent='読み込み失敗';
  }
}
function getShifts(){ try{return JSON.parse(localStorage.getItem(LS_SHIFT)||'{}');}catch(e){return {};} }
function setShifts(o){ localStorage.setItem(LS_SHIFT,JSON.stringify(o)); }
function recsOf(key){ return RECORDS.filter(r=>r.key===key && r.deban==='J').sort((a,b)=>a.iso<b.iso?-1:1); }
function shiftRowsOf(key){
  const done=recsOf(key);
  const doneIso=new Set(done.map(r=>r.iso));
  const planned=(getShifts()[key]||[]);
  const rows=done.map(r=>({iso:r.iso,wd:r.wd,rev:r.rev,kosoku:r.kosoku,done:true}));
  planned.forEach(iso=>{ if(!doneIso.has(iso)) rows.push({iso,wd:wdOf(iso),rev:null,kosoku:null,done:false}); });
  rows.sort((a,b)=>a.iso<b.iso?-1:1);
  return rows;
}
function init(){
  if(!RECORDS.length){document.getElementById('sub').textContent='データなし';return;}
  const latest=CYCLES[0];
  document.getElementById('sub').textContent=`日報CSV ${RECORDS.length}件（最新 ${RECORDS[RECORDS.length-1].iso}）`;
  const cs=document.getElementById('cycleSel');
  cs.innerHTML=CYCLES.map(k=>`<option value="${k}">${cycleLabel(k)}</option>`).join('');
  cs.value=latest;
  cs.onchange=()=>renderAll(cs.value);
  const last=RECORDS[RECORDS.length-1]; CAL_Y=last.y; CAL_M=last.mo;
  document.getElementById('calPrev').onclick=()=>{CAL_M--;if(CAL_M<1){CAL_M=12;CAL_Y--;}renderCalendar();};
  document.getElementById('calNext').onclick=()=>{CAL_M++;if(CAL_M>12){CAL_M=1;CAL_Y++;}renderCalendar();};
  document.getElementById('clearShift').onclick=()=>{ const key=cs.value; const all=getShifts(); delete all[key]; setShifts(all); renderAll(key); };
  renderAll(latest);
}
function renderAll(key){
  document.getElementById('cycleType').innerHTML=`<span class="badge ${CYCLE_TYPE[key]}">${cycleTypeJP(key)}の月 / 上限${min2hm(cycleLimit(key))}</span>`;
  renderOtTable(key);
  renderTime(key);
  renderSalary(key);
  renderCalendar();
}
function renderOtTable(key){
  document.getElementById('otTitle').textContent=cycleLabel(key);
  const rows=shiftRowsOf(key);
  const tb=document.querySelector('#otTable tbody'); tb.innerHTML='';
  let revSum=0,kSum=0,doneN=0,futureN=0;
  rows.forEach(r=>{
    if(r.done){ revSum+=r.rev; kSum+=r.kosoku; doneN++; } else futureN++;
    const over=r.done && r.kosoku>DAY_LIMIT_MIN;
    tb.insertAdjacentHTML('beforeend',
      `<tr class="${r.done?'':'future'} ${over?'over':''}">
        <td>${r.iso.slice(5)}</td>
        <td>${r.wd}</td>
        <td>${r.done?fmtYen(r.rev):'<span class="machi">— 予定 —</span>'}</td>
        <td class="${over?'danger':''}">${r.done?(min2hm(r.kosoku)+(over?' ⚠':'')):'—'}</td>
        <td>${r.done?'<span class="badge done">消化</span>':'<span class="badge future">これから</span>'}</td>
      </tr>`);
  });
  document.querySelector('#otTable tfoot').innerHTML=
    `<tr><td>合計</td><td>${doneN+futureN}出番</td><td>${fmtYen(revSum)}</td><td>${min2hm(kSum)}</td><td>消化${doneN}/予定${futureN}</td></tr>`;
  document.getElementById('otLegend').innerHTML=
    rows.length? `消化 ${doneN}出番・これから ${futureN}出番。⚠は1出番20:59超（始末書ライン）。`
    : 'この周期の出番が未登録です。下のカレンダーで出番日をタップしてください。';
}
function renderTime(key){
  const done=recsOf(key);
  const used=done.reduce((s,r)=>s+r.kosoku,0);
  const limit=cycleLimit(key); const rem=limit-used;
  const remShifts=shiftRowsOf(key).filter(r=>!r.done).length;
  const perShift = remShifts>0 ? rem/remShifts : null;
  document.getElementById('timeStats').innerHTML=`
    <div class="stat"><div class="lbl">消化（打刻）</div><div class="val">${min2hm(used)}</div></div>
    <div class="stat"><div class="lbl">残り時間（枠まで）</div><div class="val ${rem<0?'danger':''}">${min2hm(rem)}</div></div>
    <div class="stat"><div class="lbl">残り出番</div><div class="val">${remShifts}</div></div>`;
  const pace=document.getElementById('pace');
  if(perShift===null){
    pace.innerHTML=`<div class="note">残り出番がありません（この周期は終了、または予定未登録）。消化 ${min2hm(used)} / 上限 ${min2hm(limit)}。</div>`;
  }else{
    const diff=perShift-DAY_LIMIT_MIN;
    let cls='ok',msg='ほぼ理想：ぴったり使い切れるペース';
    if(rem<0){cls='danger';msg='超過：月間枠を超えています';}
    else if(diff<-20){cls='danger';msg='危険：残出番をかなり短縮しないと超過';}
    else if(diff<0){cls='warn';msg='注意：全出番20:59だと超過。どこかで早上がりを';}
    else if(diff<30){cls='ok';msg='ほぼ理想：ぴったり使い切れるペース';}
    else{cls='blue';msg='余裕：枠が余ります。限界まで走ってOK';}
    pace.innerHTML=`
      <div class="lbl" style="font-size:.64rem;color:var(--dim)">残り時間 ÷ 残り出番 ＝ 1出番あたり使える時間</div>
      <div class="big ${cls}">${min2hm(Math.round(perShift))}</div>
      <div class="msg ${cls}">${msg}</div>
      <div class="note">1出番上限 20:59 との差：<b class="${cls}">${diff>=0?'+':''}${min2hm(Math.round(diff))}</b>（プラスなら全出番フルで走っても枠が余る）</div>`;
  }
  document.getElementById('timeLegend').innerHTML=
    `月間枠（${cycleTypeJP(key)}＝${min2hm(limit)}）は<b>絶対に超えない</b>。各出番の<b>20:59超は始末書</b>。枠ギリギリまで使い切るのが売上最大。`;
}
function renderSalary(key){
  const done=recsOf(key);
  const rev=done.reduce((s,r)=>s+r.rev,0);
  const kut=KUTEN[key]||0; const cnt=KUTEN_CNT[key]||0;
  const adj=rev-kut; const pay=Math.round(adj*PAY_RATE);
  document.getElementById('salStats').innerHTML=`
    <div class="stat"><div class="lbl">売上合計（${done.length}出番）</div><div class="val">${fmtYen(rev)}</div></div>
    <div class="stat"><div class="lbl">空転 ${cnt?('('+cnt+'件)'):''}</div><div class="val ${kut?'warn':''}">${kut?('−'+fmtYen(kut)):'—'}</div></div>
    <div class="stat"><div class="lbl">推定給与（×52%）</div><div class="val ok">${fmtYen(pay)}</div></div>`;
  document.getElementById('salLegend').textContent=
    `推定給与 ＝（売上合計 ${fmtYen(rev)} − 空転 ${fmtYen(kut)}）× 52% ＝ ${fmtYen(pay)}。空転は走るほど記録が増え、明細に近づきます。`;
}
function toggleShiftDay(iso){
  const[y,mo,d]=iso.split('/').map(Number); const key=cycleOf(y,mo,d);
  if(recsOf(key).some(r=>r.iso===iso)) return;
  const all=getShifts(); all[key]=all[key]||[];
  if(all[key].includes(iso)) all[key]=all[key].filter(v=>v!==iso); else all[key].push(iso);
  all[key].sort(); if(!all[key].length) delete all[key];
  setShifts(all);
  renderAll(document.getElementById('cycleSel').value);
}
function renderCalendar(){
  document.getElementById('calTitle').textContent=`${CAL_Y}年 ${CAL_M}月`;
  const sel=new Set(); Object.values(getShifts()).forEach(a=>a.forEach(i=>sel.add(i)));
  const doneAll=new Set(RECORDS.map(r=>r.iso));
  const today=localDateStr(new Date());
  const startDow=new Date(CAL_Y,CAL_M-1,1).getDay();
  const days=new Date(CAL_Y,CAL_M,0).getDate();
  let html='<div class="cal-grid">';
  ['日','月','火','水','木','金','土'].forEach((w,i)=>html+=`<div class="cal-dow ${i===0?'sun':i===6?'sat':''}">${w}</div>`);
  for(let i=0;i<startDow;i++) html+='<div class="cal-cell empty"></div>';
  for(let d=1;d<=days;d++){
    const iso=`${CAL_Y}/${String(CAL_M).padStart(2,'0')}/${String(d).padStart(2,'0')}`;
    const dow=new Date(CAL_Y,CAL_M-1,d).getDay();
    const cls=['cal-cell']; if(dow===0)cls.push('sun'); if(dow===6)cls.push('sat');
    if(doneAll.has(iso))cls.push('done'); else if(sel.has(iso))cls.push('sel');
    if(iso===today)cls.push('today');
    html+=`<div class="${cls.join(' ')}" data-iso="${iso}">${d}</div>`;
  }
  html+='</div>';
  document.getElementById('calendar').innerHTML=html;
  document.querySelectorAll('#calendar .cal-cell:not(.empty):not(.done)').forEach(c=>c.onclick=()=>toggleShiftDay(c.dataset.iso));
}
loadData();
</script>
</body>
</html>
