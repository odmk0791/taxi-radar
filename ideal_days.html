<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>理想的な営業日 分析</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#090912;color:#e2e8f0;font-family:'Hiragino Sans',sans-serif;padding-bottom:48px}
#hdr{background:linear-gradient(135deg,#0a2e1a,#0f3e40);border-bottom:1px solid #4ade8044;padding:18px 16px 14px}
.sub{font-size:10px;color:#4ade80;letter-spacing:3px;text-transform:uppercase;margin-bottom:2px}
h1{font-size:18px;font-weight:800}
.dscr{font-size:11px;color:#475569;margin-top:3px}
#msgbox{margin:20px 16px;padding:14px;background:#161626;border:2px solid #60a5fa;border-radius:12px;font-size:13px;line-height:1.9;word-break:break-all;min-height:60px}
@keyframes sp{to{transform:rotate(360deg)}}
.spin{display:inline-block;animation:sp 1s linear infinite}
.rbtn{display:block;width:calc(100% - 32px);margin:0 16px 16px;padding:13px;background:#1a2035;border:1px solid #f87171;border-radius:12px;color:#f87171;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.tabs{display:flex;gap:5px;padding:0 14px 12px;overflow-x:auto;scrollbar-width:none;margin-top:14px}
.tab{padding:8px 14px;border-radius:20px;border:none;background:#151e30;color:#fff;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap;font-family:inherit;flex-shrink:0;opacity:.6}
.tab.on{opacity:1}
.panel{padding:0 14px;display:none}
.panel.on{display:block}
.card{background:#161626;border:1px solid #1e2d40;border-radius:12px;padding:14px;margin-bottom:12px}
.card-ttl{font-size:12px;font-weight:700;margin-bottom:10px}
.day{border-radius:10px;padding:11px 13px;margin-bottom:8px;border:1px solid #1e2d40;background:#161626;cursor:pointer}
.day.sel{border-color:#4ade80;background:#4ade8008}
.day-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px}
.metrics{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:5px;margin-top:6px}
.metric{background:#0d1220;border-radius:6px;padding:5px 6px;text-align:center}
.metric .l{font-size:8px;color:#475569}
.metric .v{font-size:11px;font-weight:700;margin-top:1px}
.bwrap{height:12px;background:#151e30;border-radius:4px;overflow:hidden;margin-top:3px}
.binner{height:100%;border-radius:4px}
table{width:100%;border-collapse:collapse;font-size:11px}
th{text-align:left;color:#475569;padding:5px 6px;border-bottom:1px solid #1e2d40}
td{padding:5px 6px;border-bottom:1px solid #0d1220}
.badge{font-size:9px;padding:2px 7px;border-radius:8px;font-weight:700}
</style>
</head>
<body>
<div id="hdr">
  <div class="sub">Ideal Operation Days</div>
  <h1>🎯 理想的な営業日 分析</h1>
  <div class="dscr">金曜以外・ロングに頼らず回数で安定高営収（低ばらつき）</div>
</div>
<div id="msgbox"><span class="spin">⏳</span> データ取得中...</div>
<button class="rbtn" id="rbtn" onclick="run()" style="display:none">🔄 再試行</button>
<div id="dashboard" style="display:none">
  <div class="tabs" id="tabs"></div>
  <div id="panels"></div>
</div>
<script>
var U1='https://docs.google.com/spreadsheets/d/e/2PACX-1vT2iLNU2ehDRMl7CQt2ETLkVwIeIRMAEpNsFjImdrWDBGuiTWLiwXc9aTtnhbJzWl0uvN0kEPw9Bd-0/pub?gid=0&single=true&output=csv';
var U2='https://docs.google.com/spreadsheets/d/e/2PACX-1vTm1IwbqhN5odntM8GhM4xHZwR3h1a4WKeWpt-4eLDczrGTTAVz8Bl49SI_c0jGEVrp0t_8iRMTN77A/pub?gid=0&single=true&output=csv';

function csv(text){
  var lines=text.trim().split(/\r?\n/).filter(function(l){return l.trim();});
  function sp(line){var cols=[],cur='',q=false;for(var i=0;i<line.length;i++){var c=line[i];if(c==='"'){q=!q;}else if(c===','&&!q){cols.push(cur.trim());cur='';}else{cur+=c;}}cols.push(cur.trim());return cols;}
  var h=sp(lines[0]);
  return lines.slice(1).map(function(l){var v=sp(l),o={};h.forEach(function(k,i){o[k]=v[i]||'';});return o;});
}
function toN(v){return parseInt(String(v||'').replace(/[^\d]/g,''))||0;}
function av(a){return a.length?Math.round(a.reduce(function(x,y){return x+y;},0)/a.length):0;}
function es(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function mean(a){return a.length?a.reduce(function(x,y){return x+y;},0)/a.length:0;}
function stddev(a){var m=mean(a);return a.length?Math.sqrt(a.reduce(function(s,x){return s+(x-m)*(x-m);},0)/a.length):0;}
function median(a){var s=[].concat(a).sort(function(x,y){return x-y;});var m=Math.floor(s.length/2);return s.length%2?s[m]:Math.round((s[m-1]+s[m])/2);}

/* 日付正規化 */
function normDate(s){
  s=String(s||'').trim();
  var m=s.match(/(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/);
  if(m)return m[1]+'-'+('0'+m[2]).slice(-2)+'-'+('0'+m[3]).slice(-2);
  return s;
}

var GLOBAL={};

async function run(){
  document.getElementById('msgbox').style.display='';
  document.getElementById('msgbox').innerHTML='<span class="spin">⏳</span> 日報CSV取得中...';
  document.getElementById('msgbox').style.borderColor='#60a5fa';
  document.getElementById('rbtn').style.display='none';
  document.getElementById('dashboard').style.display='none';
  try{
    var r1=await fetch(U1);if(!r1.ok)throw new Error('日報 HTTP '+r1.status);var t1=await r1.text();
    document.getElementById('msgbox').innerHTML='<span class="spin">⏳</span> 日報詳細CSV取得中...';
    var r2=await fetch(U2);if(!r2.ok)throw new Error('詳細 HTTP '+r2.status);var t2=await r2.text();
    document.getElementById('msgbox').innerHTML='<span class="spin">⏳</span> 集計中...';

    var rows1=csv(t1), rows2=csv(t2);

    /* 日報詳細を日付ごとにグループ化（プレタク除外） */
    var byDate={};
    rows2.forEach(function(r){
      var sk=(r['サンキュー']||'').trim();
      if(sk==='プレタク'||sk==='プレタクP')return; // プレタク除外
      var d=normDate(r['日付']);
      var dow=(r['曜日']||'').trim();
      var f=toN(r['料金']);
      if(!d||f<=0)return;
      if(!byDate[d])byDate[d]={dow:dow,fares:[],rows:[]};
      byDate[d].fares.push(f);
      byDate[d].rows.push(r);
    });

    /* 日報①からその日のメタ情報（営収・実車率・TAXI種別） */
    var meta={};
    rows1.forEach(function(r){
      var d=normDate(r['日付']);
      var taxi=String(r['TAXI']||'').toUpperCase();
      if(taxi.indexOf('PRE')>=0)return; // プレタク日除外
      meta[d]={eikyu:toN(r['営収']),trips:toN(r['回数']),tanka:toN(r['単価']),real:parseFloat(r['実車率'])||0,dow:(r['曜']||'').trim()};
    });

    /* 各日の統計を計算 */
    var days=[];
    Object.keys(byDate).forEach(function(d){
      var info=byDate[d];
      if(info.dow==='金')return; // 金曜除外
      var fares=info.fares;
      var n=fares.length;
      if(n<20)return; // 件数が少ない日は除外（20件以上）
      var sum=fares.reduce(function(a,b){return a+b;},0);
      var avg=Math.round(sum/n);
      var sd=Math.round(stddev(fares));
      var cv=avg>0?sd/avg*100:999;
      var med=median(fares);
      var m=meta[d]||{};
      days.push({
        date:d,dow:info.dow,n:n,sum:sum,avg:avg,sd:sd,cv:cv,med:med,
        eikyu:m.eikyu||sum,real:m.real||0,
        max:Math.max.apply(null,fares),
        rows:info.rows
      });
    });

    /* 理想スコア = 件数多い × CV低い × 営収高い */
    /* 件数35以上を優先、CVが低く、営収10万近い日 */
    days.forEach(function(d){
      // 理想スコア：件数(多いほど良い) - CV(低いほど良い) + 営収ボーナス
      var cntScore=Math.min(d.n/40,1)*40;        // 40件で満点40
      var cvScore=Math.max(0,(100-d.cv))/100*40; // CV低いほど高得点 最大40
      var eikyuScore=Math.min(d.eikyu/100000,1)*20; // 10万で満点20
      d.score=Math.round(cntScore+cvScore+eikyuScore);
    });

    /* 理想日ランキング（スコア順） */
    var ideal=[].concat(days).sort(function(a,b){return b.score-a.score;}).slice(0,15);
    /* 低CV順 */
    var lowCV=[].concat(days).filter(function(d){return d.n>=30;}).sort(function(a,b){return a.cv-b.cv;}).slice(0,15);

    GLOBAL.ideal=ideal;
    GLOBAL.lowCV=lowCV;
    GLOBAL.allDays=days;

    /* タブ生成 */
    var tabsHtml='';
    tabsHtml+='<button class="tab on" style="background:#4ade80" onclick="sw(\'ideal\',this)">🎯 理想日ランク</button>';
    tabsHtml+='<button class="tab" style="background:#60a5fa" onclick="sw(\'lowcv\',this)">📉 低ばらつき順</button>';
    tabsHtml+='<button class="tab" style="background:#f59e0b" onclick="sw(\'detail\',this)">🔬 No.1日 分解</button>';
    document.getElementById('tabs').innerHTML=tabsHtml;

    var panelsHtml='';
    panelsHtml+='<div class="panel on" id="p-ideal"></div>';
    panelsHtml+='<div class="panel" id="p-lowcv"></div>';
    panelsHtml+='<div class="panel" id="p-detail"></div>';
    document.getElementById('panels').innerHTML=panelsHtml;

    renderIdeal();
    renderLowCV();
    renderDetail(ideal[0]);

    document.getElementById('msgbox').style.display='none';
    document.getElementById('dashboard').style.display='';
  }catch(e){
    document.getElementById('msgbox').innerHTML='⚠️ <strong style="color:#f87171">エラー</strong><br>'+String(e);
    document.getElementById('msgbox').style.borderColor='#f87171';
    document.getElementById('rbtn').style.display='';
  }
}

function dayCard(d,i,rankCol,onclick){
  var dowCol={月:'#f87171',火:'#fb923c',水:'#facc15',木:'#4ade80',土:'#a78bfa',日:'#f472b6'}[d.dow]||'#94a3b8';
  var cvBadge=d.cv<50?'<span class="badge" style="background:#4ade8022;color:#4ade80">CV'+d.cv.toFixed(0)+'% 安定</span>':d.cv<70?'<span class="badge" style="background:#facc1522;color:#facc15">CV'+d.cv.toFixed(0)+'%</span>':'<span class="badge" style="background:#f8717122;color:#f87171">CV'+d.cv.toFixed(0)+'% ばらつき</span>';
  var h='<div class="day"'+(onclick?' onclick="'+onclick+'"':'')+'>';
  h+='<div class="day-top"><div><span style="font-size:13px;font-weight:800;color:'+rankCol+'">'+(i+1)+'位</span> <span style="font-size:13px;font-weight:700;color:#e2e8f0">'+es(d.date)+'</span> <span class="badge" style="background:'+dowCol+'22;color:'+dowCol+'">'+d.dow+'</span></div>';
  h+='<div style="font-size:15px;font-weight:800;color:#4ade80">¥'+d.eikyu.toLocaleString()+'</div></div>';
  h+='<div style="margin-bottom:4px">'+cvBadge+'</div>';
  h+='<div class="metrics">';
  h+='<div class="metric"><div class="l">件数</div><div class="v" style="color:#60a5fa">'+d.n+'件</div></div>';
  h+='<div class="metric"><div class="l">中央値</div><div class="v" style="color:#facc15">¥'+d.med.toLocaleString()+'</div></div>';
  h+='<div class="metric"><div class="l">σ</div><div class="v" style="color:#a78bfa">¥'+d.sd.toLocaleString()+'</div></div>';
  h+='<div class="metric"><div class="l">実車率</div><div class="v" style="color:'+(d.real>=58?'#4ade80':'#94a3b8')+'">'+d.real+'%</div></div>';
  h+='</div></div>';
  return h;
}

function renderIdeal(){
  var h='<div class="card" style="border-color:#4ade8044;background:#4ade8008">';
  h+='<div class="card-ttl" style="color:#4ade80">🎯 理想日スコアとは</div>';
  h+='<p style="font-size:11px;color:#cbd5e1;line-height:1.8">件数の多さ（最大40点）＋ ばらつきの低さ（最大40点）＋ 営収の高さ（最大20点）で算出。<br><strong style="color:#4ade80">ロングに頼らず、回数で安定的に高営収を出した日</strong>が上位に来ます。金曜・プレタク日は除外。</p></div>';
  GLOBAL.ideal.forEach(function(d,i){h+=dayCard(d,i,'#4ade80');});
  document.getElementById('p-ideal').innerHTML=h;
}
function renderLowCV(){
  var h='<div class="card" style="border-color:#60a5fa44;background:#60a5fa08">';
  h+='<div class="card-ttl" style="color:#60a5fa">📉 低ばらつき順（30件以上の日）</div>';
  h+='<p style="font-size:11px;color:#cbd5e1;line-height:1.8">変動係数CVが低い順 ＝ <strong style="color:#60a5fa">1件ごとの料金が均一</strong>＝ おばけ（ロング）に頼らず安定して稼いだ日。</p></div>';
  GLOBAL.lowCV.forEach(function(d,i){h+=dayCard(d,i,'#60a5fa');});
  document.getElementById('p-lowcv').innerHTML=h;
}

function renderDetail(d){
  if(!d){document.getElementById('p-detail').innerHTML='<p style="color:#64748b;padding:20px">データなし</p>';return;}
  var dowCol={月:'#f87171',火:'#fb923c',水:'#facc15',木:'#4ade80',土:'#a78bfa',日:'#f472b6'}[d.dow]||'#94a3b8';
  var h='';
  h+='<div class="card" style="border-color:#f59e0b55;background:#f59e0b0a">';
  h+='<div class="card-ttl" style="color:#f59e0b">🔬 理想日No.1の分解</div>';
  h+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><div><span style="font-size:16px;font-weight:800;color:#e2e8f0">'+es(d.date)+'</span> <span class="badge" style="background:'+dowCol+'22;color:'+dowCol+'">'+d.dow+'曜</span></div><span style="font-size:18px;font-weight:800;color:#4ade80">¥'+d.eikyu.toLocaleString()+'</span></div>';
  h+='<div class="metrics" style="grid-template-columns:1fr 1fr 1fr 1fr">';
  h+='<div class="metric"><div class="l">件数</div><div class="v" style="color:#60a5fa">'+d.n+'件</div></div>';
  h+='<div class="metric"><div class="l">中央値</div><div class="v" style="color:#facc15">¥'+d.med.toLocaleString()+'</div></div>';
  h+='<div class="metric"><div class="l">CV</div><div class="v" style="color:#4ade80">'+d.cv.toFixed(0)+'%</div></div>';
  h+='<div class="metric"><div class="l">実車率</div><div class="v" style="color:#4ade80">'+d.real+'%</div></div>';
  h+='</div></div>';

  /* 時間帯別 */
  var hourMap={};
  d.rows.forEach(function(r){
    var ts=(r['乗車時間']||'').trim();var m=ts.match(/^(\d{1,2}):/);if(!m)return;
    var hh=+m[1],f=toN(r['料金']);if(f<=0)return;
    var lbl=hh>=24?'翌'+(hh-24)+'時':hh+'時';
    if(!hourMap[lbl])hourMap[lbl]={cnt:0,tot:0,k:hh};
    hourMap[lbl].cnt++;hourMap[lbl].tot+=f;
  });
  var hourly=Object.entries(hourMap).sort(function(a,b){return a[1].k-b[1].k;})
    .map(function(e){return{lbl:e[0],cnt:e[1].cnt,avg:Math.round(e[1].tot/e[1].cnt)};});
  var mxHc=Math.max.apply(null,hourly.map(function(x){return x.cnt;}));

  h+='<div class="card"><div class="card-ttl" style="color:#60a5fa">🕐 時間帯別の拾い方（ペース配分）</div>';
  hourly.forEach(function(x){
    var pct=x.cnt/mxHc*100;
    h+='<div style="margin-bottom:7px"><div style="display:flex;justify-content:space-between;margin-bottom:2px"><span style="font-size:11px;color:#94a3b8">'+es(x.lbl)+'</span><span style="font-size:11px;color:#475569"><strong style="color:#60a5fa">'+x.cnt+'件</strong> 平均¥'+x.avg.toLocaleString()+'</span></div><div class="bwrap"><div class="binner" style="width:'+pct+'%;background:#60a5fa88"></div></div></div>';
  });
  /* 累積ペース */
  var cum=0;
  h+='<div style="margin-top:10px;padding:9px;background:#0d1220;border-radius:8px;font-size:11px;color:#cbd5e1;line-height:1.9">';
  h+='<strong style="color:#facc15">累積ペース：</strong><br>';
  hourly.forEach(function(x){cum+=x.cnt;h+=es(x.lbl)+'まで '+cum+'件　';});
  h+='</div></div>';

  /* エリア別 */
  var areaMap={};
  d.rows.forEach(function(r){
    var w=(r['乗車地：市区']||'').trim(),nm=(r['乗車地：地名']||'').trim();
    var full=w&&nm?w+nm:w||nm;var f=toN(r['料金']);if(!full||f<=0)return;
    if(!areaMap[full])areaMap[full]={cnt:0,tot:0};
    areaMap[full].cnt++;areaMap[full].tot+=f;
  });
  var areas=Object.entries(areaMap).sort(function(a,b){return b[1].cnt-a[1].cnt;}).slice(0,15)
    .map(function(e){return{name:e[0],cnt:e[1].cnt,avg:Math.round(e[1].tot/e[1].cnt)};});
  var mxAc=areas.length?Math.max.apply(null,areas.map(function(x){return x.cnt;})):1;

  h+='<div class="card"><div class="card-ttl" style="color:#4ade80">📍 乗車地エリア（この日どこで拾ったか）</div>';
  areas.forEach(function(a,i){
    var pct=a.cnt/mxAc*100,top=i<3;
    h+='<div style="margin-bottom:7px"><div style="display:flex;justify-content:space-between;margin-bottom:2px"><span style="font-size:11px;color:'+(top?'#facc15':'#94a3b8')+'">'+(i+1)+'. '+es(a.name)+'</span><span style="font-size:11px;color:#475569"><strong style="color:'+(top?'#facc15':'#4ade80')+'">'+a.cnt+'件</strong> ¥'+a.avg.toLocaleString()+'</span></div><div class="bwrap"><div class="binner" style="width:'+pct+'%;background:'+(top?'linear-gradient(90deg,#f59e0b,#facc15)':'#4ade8088')+'"></div></div></div>';
  });
  h+='</div>';

  /* ステータス内訳 */
  var stMap={};
  d.rows.forEach(function(r){var s=(r['ステータス']||'?').trim();if(!stMap[s])stMap[s]={cnt:0,tot:0};var f=toN(r['料金']);stMap[s].cnt++;if(f>0)stMap[s].tot+=f;});
  h+='<div class="card"><div class="card-ttl" style="color:#a78bfa">🚦 この日のステータス内訳</div>';
  Object.entries(stMap).sort(function(a,b){return b[1].cnt-a[1].cnt;}).forEach(function(e){
    var pct=e[1].cnt/d.n*100;
    h+='<div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #0d1220;font-size:12px"><span style="color:#94a3b8">'+es(e[0])+'</span><span style="color:#475569">'+e[1].cnt+'件（'+pct.toFixed(0)+'%）平均¥'+(e[1].cnt>0?Math.round(e[1].tot/e[1].cnt).toLocaleString():0)+'</span></div>';
  });
  h+='</div>';

  document.getElementById('p-detail').innerHTML=h;
}

function sw(id,btn){
  document.querySelectorAll('.tab').forEach(function(b){b.classList.remove('on');});
  btn.classList.add('on');
  document.querySelectorAll('.panel').forEach(function(p){p.classList.remove('on');});
  document.getElementById('p-'+id).classList.add('on');
}
run();
</script>
</body>
</html>
