<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>理想的な営業日 分析</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#090912;color:#e2e8f0;font-family:'Hiragino Sans',sans-serif;padding-bottom:48px}
#hdr{background:linear-gradient(135deg,#0a2e1a,#0f3e40);border-bottom:1px solid #4ade8044;padding:18px 16px 14px}
.sub{font-size:10px;color:#4ade80;letter-spacing:3px;text-transform:uppercase;margin-bottom:2px}
h1{font-size:18px;font-weight:800}
.dscr{font-size:11px;color:#475569;margin-top:3px}
#msgbox{margin:20px 16px;padding:14px;background:#161626;border:2px solid #60a5fa;border-radius:12px;font-size:13px;line-height:1.9;word-break:break-all;min-height:60px}
@keyframes sp{to{transform:rotate(360deg)}}
.spin{display:inline-block;animation:sp 1s linear infinite}
.rbtn{display:block;width:calc(100% - 32px);margin:0 16px 16px;padding:13px;background:#1a2035;border:1px solid #f87171;border-radius:12px;color:#f87171;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.tabs{display:flex;gap:5px;padding:0 14px 12px;overflow-x:auto;scrollbar-width:none;margin-top:14px}
.tab{padding:8px 14px;border-radius:20px;border:none;background:#151e30;color:#fff;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap;font-family:inherit;flex-shrink:0;opacity:.6}
.tab.on{opacity:1}
.panel{padding:0 14px;display:none}
.panel.on{display:block}
.card{background:#161626;border:1px solid #1e2d40;border-radius:12px;padding:14px;margin-bottom:12px}
.card-ttl{font-size:12px;font-weight:700;margin-bottom:10px}
.day{border-radius:10px;padding:11px 13px;margin-bottom:8px;border:1px solid #1e2d40;background:#161626}
.day-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px}
.metrics{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:5px;margin-top:6px}
.metric{background:#0d1220;border-radius:6px;padding:5px 6px;text-align:center}
.metric .l{font-size:8px;color:#475569}
.metric .v{font-size:11px;font-weight:700;margin-top:1px}
.bwrap{height:12px;background:#151e30;border-radius:4px;overflow:hidden;margin-top:3px}
.binner{height:100%;border-radius:4px}
table{width:100%;border-collapse:collapse;font-size:11px}
th{text-align:left;color:#475569;padding:5px 6px;border-bottom:1px solid #1e2d40}
td{padding:5px 6px;border-bottom:1px solid #0d1220}
.badge{font-size:9px;padding:2px 7px;border-radius:8px;font-weight:700}
select{background:#0d1220;color:#e2e8f0;border:1px solid #1e2d40;border-radius:8px;padding:8px;font-size:13px;font-family:inherit;width:100%;margin-bottom:12px}
</style>
</head>
<body>
<div id="hdr">
  <div class="sub">Ideal Operation Days</div>
  <h1>🎯 理想的な営業日 分析</h1>
  <div class="dscr">金曜以外・ロングに頼らず回数で安定高営収（低ばらつき）</div>
</div>
<div id="msgbox"><span class="spin">⏳</span> データ取得中...</div>
<button class="rbtn" id="rbtn" onclick="run()" style="display:none">🔄 再試行</button>
<div id="dashboard" style="display:none">
  <div class="tabs" id="tabs"></div>
  <div id="panels"></div>
</div>
<script>
var U1='https://docs.google.com/spreadsheets/d/e/2PACX-1vT2iLNU2ehDRMl7CQt2ETLkVwIeIRMAEpNsFjImdrWDBGuiTWLiwXc9aTtnhbJzWl0uvN0kEPw9Bd-0/pub?gid=0&single=true&output=csv';
var U2='https://docs.google.com/spreadsheets/d/e/2PACX-1vTm1IwbqhN5odntM8GhM4xHZwR3h1a4WKeWpt-4eLDczrGTTAVz8Bl49SI_c0jGEVrp0t_8iRMTN77A/pub?gid=0&single=true&output=csv';

/* CSVを「配列の配列」で返す（位置アクセス用） */
function csvArr(text){
  var lines=text.trim().split(/\r?\n/).filter(function(l){return l.trim();});
  function sp(line){var c=[],cur='',q=false;for(var i=0;i<line.length;i++){var ch=line[i];if(ch==='"'){q=!q;}else if(ch===','&&!q){c.push(cur.trim());cur='';}else{cur+=ch;}}c.push(cur.trim());return c;}
  return lines.map(sp);
}
function toN(v){return parseInt(String(v||'').replace(/[^\d]/g,''))||0;}
function av(a){return a.length?Math.round(a.reduce(function(x,y){return x+y;},0)/a.length):0;}
function es(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function mean(a){return a.length?a.reduce(function(x,y){return x+y;},0)/a.length:0;}
function stddev(a){var m=mean(a);return a.length?Math.sqrt(a.reduce(function(s,x){return s+(x-m)*(x-m);},0)/a.length):0;}
function median(a){var s=[].concat(a).sort(function(x,y){return x-y;});var m=Math.floor(s.length/2);return s.length%2?s[m]:Math.round((s[m-1]+s[m])/2);}

/* 「24年2月19日」→「2024-02-19」 */
function normDate(s){
  s=String(s||'').trim();
  var m=s.match(/(\d{1,2})年(\d{1,2})月(\d{1,2})日/);
  if(m)return '20'+('0'+m[1]).slice(-2)+'-'+('0'+m[2]).slice(-2)+'-'+('0'+m[3]).slice(-2);
  m=s.match(/(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/);
  if(m)return m[1]+'-'+('0'+m[2]).slice(-2)+'-'+('0'+m[3]).slice(-2);
  return s;
}
function dispDate(iso){
  var m=String(iso).match(/(\d{4})-(\d{2})-(\d{2})/);
  if(m)return (+m[2])+'/'+(+m[3])+'/'+m[1].slice(2);
  return iso;
}

var GLOBAL={};

async function run(){
  document.getElementById('msgbox').style.display='';
  document.getElementById('msgbox').innerHTML='<span class="spin">⏳</span> 日報CSV取得中...';
  document.getElementById('msgbox').style.borderColor='#60a5fa';
  document.getElementById('rbtn').style.display='none';
  document.getElementById('dashboard').style.display='none';
  try{
    var t1=await (await fetch(U1)).text();
    document.getElementById('msgbox').innerHTML='<span class="spin">⏳</span> 日報詳細CSV取得中...';
    var t2=await (await fetch(U2)).text();
    document.getElementById('msgbox').innerHTML='<span class="spin">⏳</span> 集計中...';

    var a1=csvArr(t1), a2=csvArr(t2);
    var h1=a1[0], h2=a2[0];

    /* 日報①の列インデックス */
    function idx(headers,name){return headers.findIndex(function(c){return c.replace(/：/g,':').trim()===name.replace(/：/g,':');});}
    var i1_date=idx(h1,'日付'), i1_taxi=idx(h1,'TAXI'), i1_eikyu=idx(h1,'営収'),
        i1_trips=idx(h1,'回数'), i1_tanka=idx(h1,'単価'), i1_real=idx(h1,'実車率'), i1_dow=idx(h1,'曜');

    /* 日報②の列インデックス（A列=0が日付、ヘッダー空欄） */
    var i2_date=0; // A列固定
    var i2_dow=idx(h2,'曜日'), i2_time=idx(h2,'乗車時間'),
        i2_ward=idx(h2,'乗車地:市区'), i2_name=idx(h2,'乗車地:地名'),
        i2_fare=idx(h2,'料金'), i2_st=idx(h2,'ステータス'), i2_sk=idx(h2,'サンキュー');

    /* 日報①メタ（プレタク日除外） */
    var meta={};
    a1.slice(1).forEach(function(row){
      var taxi=String(row[i1_taxi]||'').toUpperCase();
      if(taxi.indexOf('PRE')>=0)return;
      var d=normDate(row[i1_date]);
      if(!d)return;
      meta[d]={eikyu:toN(row[i1_eikyu]),trips:toN(row[i1_trips]),tanka:toN(row[i1_tanka]),real:parseFloat(row[i1_real])||0,dow:String(row[i1_dow]||'').trim()};
    });

    /* 日報②を日付ごと（プレタク除外） */
    var byDate={};
    a2.slice(1).forEach(function(row){
      var sk=String(row[i2_sk]||'').trim();
      if(sk==='プレタク'||sk==='プレタクP')return;
      var d=normDate(row[i2_date]);
      var f=toN(row[i2_fare]);
      if(!d||f<=0)return;
      if(!byDate[d])byDate[d]={fares:[],rows:[]};
      byDate[d].fares.push(f);
      byDate[d].rows.push({
        time:row[i2_time],ward:row[i2_ward],name:row[i2_name],
        fare:f,st:row[i2_st]
      });
    });

    /* 各日の統計（金曜除外・20件以上） */
    var days=[];
    Object.keys(byDate).forEach(function(d){
      var m=meta[d];
      var dow=m?m.dow:'';
      if(dow==='金')return;
      var fares=byDate[d].fares;
      var n=fares.length;
      if(n<20)return;
      var sum=fares.reduce(function(a,b){return a+b;},0);
      var avg=Math.round(sum/n);
      var sd=Math.round(stddev(fares));
      days.push({
        date:d,dow:dow,n:n,sum:sum,avg:avg,sd:sd,
        cv:avg>0?sd/avg*100:999,med:median(fares),
        eikyu:m?m.eikyu:sum,real:m?m.real:0,
        max:Math.max.apply(null,fares),rows:byDate[d].rows
      });
    });

    /* スコア */
    days.forEach(function(d){
      var cntScore=Math.min(d.n/40,1)*40;
      var cvScore=Math.max(0,(100-d.cv))/100*40;
      var eikyuScore=Math.min(d.eikyu/100000,1)*20;
      d.score=Math.round(cntScore+cvScore+eikyuScore);
    });

    GLOBAL.ideal=[].concat(days).sort(function(a,b){return b.score-a.score;}).slice(0,15);
    GLOBAL.lowCV=[].concat(days).filter(function(d){return d.n>=30;}).sort(function(a,b){return a.cv-b.cv;}).slice(0,15);
    GLOBAL.allDays=days;

    if(days.length===0){
      document.getElementById('msgbox').innerHTML='⚠️ 集計対象0日。日報②日付='+normDate(a2[1]?a2[1][0]:'')+' / 日報①日付='+normDate(a1[1]?a1[1][i1_date]:'')+' / メタ数='+Object.keys(meta).length;
      document.getElementById('msgbox').style.borderColor='#f87171';
      document.getElementById('rbtn').style.display='';
      return;
    }

    document.getElementById('tabs').innerHTML=
      '<button class="tab on" style="background:#4ade80" onclick="sw(\'ideal\',this)">🎯 理想日ランク</button>'+
      '<button class="tab" style="background:#60a5fa" onclick="sw(\'lowcv\',this)">📉 低ばらつき順</button>'+
      '<button class="tab" style="background:#f59e0b" onclick="sw(\'detail\',this)">🔬 日別分解</button>';
    document.getElementById('panels').innerHTML=
      '<div class="panel on" id="p-ideal"></div><div class="panel" id="p-lowcv"></div><div class="panel" id="p-detail"></div>';

    renderIdeal();renderLowCV();renderDetailSelector();

    document.getElementById('msgbox').style.display='none';
    document.getElementById('dashboard').style.display='';
  }catch(e){
    document.getElementById('msgbox').innerHTML='⚠️ <strong style="color:#f87171">エラー</strong><br>'+String(e&&e.stack||e);
    document.getElementById('msgbox').style.borderColor='#f87171';
    document.getElementById('rbtn').style.display='';
  }
}

var DOWC={月:'#f87171',火:'#fb923c',水:'#facc15',木:'#4ade80',土:'#a78bfa',日:'#f472b6'};

function dayCard(d,i,rankCol){
  var dc=DOWC[d.dow]||'#94a3b8';
  var cvB=d.cv<50?'<span class="badge" style="background:#4ade8022;color:#4ade80">CV'+d.cv.toFixed(0)+'% 安定</span>':d.cv<70?'<span class="badge" style="background:#facc1522;color:#facc15">CV'+d.cv.toFixed(0)+'%</span>':'<span class="badge" style="background:#f8717122;color:#f87171">CV'+d.cv.toFixed(0)+'% ばらつき</span>';
  var h='<div class="day"><div class="day-top"><div><span style="font-size:13px;font-weight:800;color:'+rankCol+'">'+(i+1)+'位</span> <span style="font-size:13px;font-weight:700">'+dispDate(d.date)+'</span> <span class="badge" style="background:'+dc+'22;color:'+dc+'">'+d.dow+'</span></div><div style="font-size:15px;font-weight:800;color:#4ade80">¥'+d.eikyu.toLocaleString()+'</div></div>';
  h+='<div style="margin-bottom:4px">'+cvB+'</div><div class="metrics">';
  h+='<div class="metric"><div class="l">件数</div><div class="v" style="color:#60a5fa">'+d.n+'件</div></div>';
  h+='<div class="metric"><div class="l">中央値</div><div class="v" style="color:#facc15">¥'+d.med.toLocaleString()+'</div></div>';
  h+='<div class="metric"><div class="l">最高</div><div class="v" style="color:'+(d.max<10000?'#4ade80':'#f87171')+'">¥'+(d.max/1000).toFixed(0)+'k</div></div>';
  h+='<div class="metric"><div class="l">実車率</div><div class="v" style="color:'+(d.real>=58?'#4ade80':'#94a3b8')+'">'+d.real+'%</div></div>';
  h+='</div></div>';
  return h;
}
function renderIdeal(){
  var h='<div class="card" style="border-color:#4ade8044;background:#4ade8008"><div class="card-ttl" style="color:#4ade80">🎯 理想日スコア</div><p style="font-size:11px;color:#cbd5e1;line-height:1.8">件数の多さ＋ばらつきの低さ＋営収の高さで算出。<strong style="color:#4ade80">ロングに頼らず回数で安定高営収</strong>の日が上位。金曜・プレタク除外。</p></div>';
  GLOBAL.ideal.forEach(function(d,i){h+=dayCard(d,i,'#4ade80');});
  document.getElementById('p-ideal').innerHTML=h;
}
function renderLowCV(){
  var h='<div class="card" style="border-color:#60a5fa44;background:#60a5fa08"><div class="card-ttl" style="color:#60a5fa">📉 低ばらつき順（30件以上）</div><p style="font-size:11px;color:#cbd5e1;line-height:1.8">CV低い順＝料金が均一＝<strong style="color:#60a5fa">おばけに頼らず安定</strong>して稼いだ日。</p></div>';
  GLOBAL.lowCV.forEach(function(d,i){h+=dayCard(d,i,'#60a5fa');});
  document.getElementById('p-lowcv').innerHTML=h;
}
function renderDetailSelector(){
  var opts='';
  GLOBAL.ideal.forEach(function(d,i){opts+='<option value="'+d.date+'">理想日'+(i+1)+'位: '+dispDate(d.date)+'('+d.dow+') '+d.n+'件 ¥'+d.eikyu.toLocaleString()+'</option>';});
  var h='<select onchange="renderDetail(this.value)">'+opts+'</select><div id="detail-body"></div>';
  document.getElementById('p-detail').innerHTML=h;
  if(GLOBAL.ideal[0])renderDetail(GLOBAL.ideal[0].date);
}
function renderDetail(date){
  var d=GLOBAL.allDays.find(function(x){return x.date===date;});
  if(!d){document.getElementById('detail-body').innerHTML='<p style="color:#64748b;padding:20px">データなし</p>';return;}
  var dc=DOWC[d.dow]||'#94a3b8';
  var h='<div class="card" style="border-color:#f59e0b55;background:#f59e0b0a"><div class="card-ttl" style="color:#f59e0b">🔬 '+dispDate(d.date)+'（'+d.dow+'曜）の分解</div>';
  h+='<div class="metrics"><div class="metric"><div class="l">営収</div><div class="v" style="color:#4ade80">¥'+(d.eikyu/1000).toFixed(0)+'k</div></div><div class="metric"><div class="l">件数</div><div class="v" style="color:#60a5fa">'+d.n+'件</div></div><div class="metric"><div class="l">CV</div><div class="v" style="color:#4ade80">'+d.cv.toFixed(0)+'%</div></div><div class="metric"><div class="l">実車率</div><div class="v" style="color:#4ade80">'+d.real+'%</div></div></div></div>';

  /* 時間帯別 */
  var hm={};
  d.rows.forEach(function(r){var m=String(r.time||'').match(/^(\d{1,2}):/);if(!m)return;var hh=+m[1];var lbl=hh>=24?'翌'+(hh-24)+'時':hh+'時';if(!hm[lbl])hm[lbl]={cnt:0,tot:0,k:hh};hm[lbl].cnt++;hm[lbl].tot+=r.fare;});
  var hourly=Object.entries(hm).sort(function(a,b){return a[1].k-b[1].k;}).map(function(e){return{lbl:e[0],cnt:e[1].cnt,avg:Math.round(e[1].tot/e[1].cnt)};});
  var mxH=Math.max.apply(null,hourly.map(function(x){return x.cnt;}));
  h+='<div class="card"><div class="card-ttl" style="color:#60a5fa">🕐 時間帯別の拾い方</div>';
  hourly.forEach(function(x){var pct=x.cnt/mxH*100;h+='<div style="margin-bottom:7px"><div style="display:flex;justify-content:space-between;margin-bottom:2px"><span style="font-size:11px;color:#94a3b8">'+es(x.lbl)+'</span><span style="font-size:11px;color:#475569"><strong style="color:#60a5fa">'+x.cnt+'件</strong> ¥'+x.avg.toLocaleString()+'</span></div><div class="bwrap"><div class="binner" style="width:'+pct+'%;background:#60a5fa88"></div></div></div>';});
  var cum=0;h+='<div style="margin-top:10px;padding:9px;background:#0d1220;border-radius:8px;font-size:11px;color:#cbd5e1;line-height:1.9"><strong style="color:#facc15">累積ペース：</strong><br>';
  hourly.forEach(function(x){cum+=x.cnt;h+=es(x.lbl)+'まで '+cum+'件　';});h+='</div></div>';

  /* エリア別 */
  var am={};
  d.rows.forEach(function(r){var w=(r.ward||'').trim(),nm=(r.name||'').trim();var full=w&&nm?w+nm:w||nm;if(!full)return;if(!am[full])am[full]={cnt:0,tot:0};am[full].cnt++;am[full].tot+=r.fare;});
  var areas=Object.entries(am).sort(function(a,b){return b[1].cnt-a[1].cnt;}).slice(0,15).map(function(e){return{name:e[0],cnt:e[1].cnt,avg:Math.round(e[1].tot/e[1].cnt)};});
  var mxA=areas.length?Math.max.apply(null,areas.map(function(x){return x.cnt;})):1;
  h+='<div class="card"><div class="card-ttl" style="color:#4ade80">📍 乗車地エリア（どこで拾ったか）</div>';
  areas.forEach(function(a,i){var pct=a.cnt/mxA*100,top=i<3;h+='<div style="margin-bottom:7px"><div style="display:flex;justify-content:space-between;margin-bottom:2px"><span style="font-size:11px;color:'+(top?'#facc15':'#94a3b8')+'">'+(i+1)+'. '+es(a.name)+'</span><span style="font-size:11px;color:#475569"><strong style="color:'+(top?'#facc15':'#4ade80')+'">'+a.cnt+'件</strong> ¥'+a.avg.toLocaleString()+'</span></div><div class="bwrap"><div class="binner" style="width:'+pct+'%;background:'+(top?'linear-gradient(90deg,#f59e0b,#facc15)':'#4ade8088')+'"></div></div></div>';});
  h+='</div>';

  /* ステータス */
  var sm={};
  d.rows.forEach(function(r){var s=(r.st||'?').trim();if(!sm[s])sm[s]={cnt:0,tot:0};sm[s].cnt++;sm[s].tot+=r.fare;});
  h+='<div class="card"><div class="card-ttl" style="color:#a78bfa">🚦 ステータス内訳</div>';
  Object.entries(sm).sort(function(a,b){return b[1].cnt-a[1].cnt;}).forEach(function(e){var pct=e[1].cnt/d.n*100;h+='<div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #0d1220;font-size:12px"><span style="color:#94a3b8">'+es(e[0])+'</span><span style="color:#475569">'+e[1].cnt+'件（'+pct.toFixed(0)+'%）平均¥'+Math.round(e[1].tot/e[1].cnt).toLocaleString()+'</span></div>';});
  h+='</div>';

  document.getElementById('detail-body').innerHTML=h;
}
function sw(id,btn){document.querySelectorAll('.tab').forEach(function(b){b.classList.remove('on');});btn.classList.add('on');document.querySelectorAll('.panel').forEach(function(p){p.classList.remove('on');});document.getElementById('p-'+id).classList.add('on');}
run();
</script>
</body></html>
