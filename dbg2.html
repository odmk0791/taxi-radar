<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>デバッグ2</title>
<style>body{background:#090912;color:#e2e8f0;font-family:monospace;padding:16px;font-size:12px;line-height:1.8}
.box{background:#161626;border:1px solid #1e2d40;border-radius:8px;padding:12px;white-space:pre-wrap;word-break:break-all}</style></head>
<body><h2>🔍 デバッグ2：日報②1列目の中身</h2><div class="box" id="out">⏳...</div>
<script>
var U2='https://docs.google.com/spreadsheets/d/e/2PACX-1vTm1IwbqhN5odntM8GhM4xHZwR3h1a4WKeWpt-4eLDczrGTTAVz8Bl49SI_c0jGEVrp0t_8iRMTN77A/pub?gid=0&single=true&output=csv';
function csv(text){var lines=text.trim().split(/\r?\n/).filter(function(l){return l.trim();});function sp(line){var c=[],cur='',q=false;for(var i=0;i<line.length;i++){var ch=line[i];if(ch==='"'){q=!q;}else if(ch===','&&!q){c.push(cur.trim());cur='';}else{cur+=ch;}}c.push(cur.trim());return c;}return{h:sp(lines[0]),rows:lines.slice(1,6).map(sp)};}
(async function(){
  var out=document.getElementById('out');
  try{
    var r=await fetch(U2);var t=await r.text();var d=csv(t);
    var s='=== ヘッダー（列番号付き）===\n';
    d.h.forEach(function(col,i){s+='['+i+'] "'+col+'"\n';});
    s+='\n=== 最初の5行（全列、列番号付き）===\n';
    d.rows.forEach(function(row,ri){
      s+='\n--- 行'+(ri+1)+' ---\n';
      row.forEach(function(val,i){s+='  ['+i+'] '+d.h[i]+' = "'+val+'"\n';});
    });
    out.textContent=s;
  }catch(e){out.textContent='エラー:'+e;}
})();
</script></body></html>
