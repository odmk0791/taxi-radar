<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d1117">
<title>TAXI RADAR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{
  --bg:#0d1117;--surface:#161b22;--border:#30363d;
  --green:#39d353;--green-dim:#1a4a2a;
  --amber:#f0a500;--red:#f85149;--blue:#58a6ff;
  --text:#e6edf3;--muted:#8b949e;
  --font-mono:'Share Tech Mono',monospace;
  --font-jp:'Noto Sans JP',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--font-jp)}

/* ── HEADER ── */
#hdr{
  position:fixed;top:0;left:0;right:0;z-index:1000;
  background:rgba(13,17,23,0.92);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
  padding:env(safe-area-inset-top,0) 0 0;
}
.hdr-inner{
  display:flex;align-items:center;gap:10px;
  padding:10px 14px;
}
.logo{
  font-family:var(--font-mono);font-size:18px;font-weight:700;
  color:var(--green);letter-spacing:0.1em;flex-shrink:0;
}
.logo span{color:var(--amber)}
.hdr-status{flex:1;min-width:0}
.status-row{display:flex;align-items:center;gap:6px}
.pulse{
  width:8px;height:8px;border-radius:50%;flex-shrink:0;
  background:var(--green);
  box-shadow:0 0 0 0 rgba(57,211,83,0.6);
  animation:pulse-anim 2s infinite;
}
.pulse.amber{background:var(--amber);box-shadow:0 0 0 0 rgba(240,165,0,0.6)}
.pulse.red{background:var(--red);box-shadow:none;animation:none}
@keyframes pulse-anim{0%{box-shadow:0 0 0 0 rgba(57,211,83,0.6)}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
.status-text{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clock-box{
  font-family:var(--font-mono);font-size:13px;color:var(--green);
  background:var(--green-dim);border:1px solid rgba(57,211,83,0.3);
  border-radius:6px;padding:4px 8px;flex-shrink:0;text-align:center;
  white-space:nowrap;
}
.clock-day{font-size:10px;color:rgba(57,211,83,0.6);margin-top:1px}

/* ── MAP ── */
#map{
  position:fixed;
  top:0;left:0;right:0;
  bottom:calc(var(--panel-h,380px));
  z-index:0;
}
.leaflet-control-attribution{display:none}
.leaflet-control-zoom{
  border:1px solid var(--border)!important;
  border-radius:8px!important;
  overflow:hidden;
}
.leaflet-control-zoom a{
  background:var(--surface)!important;
  color:var(--text)!important;
  border:none!important;
  border-bottom:1px solid var(--border)!important;
}

/* ── PANEL ── */
#panel{
  position:fixed;bottom:0;left:0;right:0;
  height:var(--panel-h,380px);
  background:var(--surface);
  border-top:1px solid var(--border);
  border-radius:16px 16px 0 0;
  z-index:500;
  display:flex;flex-direction:column;
  padding-bottom:env(safe-area-inset-bottom,0);
}
.panel-handle{
  width:40px;height:4px;
  background:var(--border);border-radius:2px;
  margin:10px auto 0;
  cursor:pointer;flex-shrink:0;
}
.panel-tabs{
  display:flex;gap:0;
  border-bottom:1px solid var(--border);
  flex-shrink:0;margin-top:8px;
}
.tab-btn{
  flex:1;padding:8px 4px;font-size:12px;
  font-family:var(--font-jp);font-weight:700;
  color:var(--muted);background:none;border:none;
  border-bottom:2px solid transparent;cursor:pointer;
  transition:color .15s,border-color .15s;letter-spacing:0.03em;
}
.tab-btn.active{color:var(--green);border-bottom-color:var(--green)}

/* controls */
.ctrl-row{
  display:flex;align-items:center;gap:8px;
  padding:8px 12px;flex-shrink:0;
}
.ctrl-label{font-size:11px;color:var(--muted);white-space:nowrap}
.ctrl-val{font-family:var(--font-mono);font-size:13px;color:var(--amber);flex-shrink:0}
input[type=range]{
  flex:1;height:3px;border-radius:2px;
  -webkit-appearance:none;appearance:none;outline:none;
  background:linear-gradient(to right,var(--green) 0%,var(--green) var(--pct,22%),var(--border) var(--pct,22%));
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:18px;height:18px;
  border-radius:50%;background:var(--green);
  box-shadow:0 0 0 3px rgba(57,211,83,0.2);cursor:pointer;
}
.chips{
  display:flex;gap:6px;overflow-x:auto;padding:0 12px 4px;
  flex-shrink:0;scrollbar-width:none;
}
.chips::-webkit-scrollbar{display:none}
.chip{
  white-space:nowrap;padding:5px 12px;border-radius:20px;
  font-size:11px;font-weight:700;font-family:var(--font-jp);
  border:1px solid var(--border);background:var(--bg);
  color:var(--muted);cursor:pointer;flex-shrink:0;
  transition:all .12s;
}
.chip.active{background:var(--green);color:#000;border-color:var(--green)}
.gps-btn{
  display:flex;align-items:center;gap:6px;
  padding:6px 14px;border-radius:8px;
  background:var(--green-dim);color:var(--green);
  border:1px solid rgba(57,211,83,0.4);
  font-family:var(--font-jp);font-weight:700;font-size:12px;
  cursor:pointer;flex-shrink:0;transition:opacity .12s;
}
.gps-btn:active{opacity:.7}

/* list */
.list-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 12px 8px}
.spot-row{
  display:flex;align-items:center;gap:10px;
  padding:9px 10px;margin-bottom:6px;
  background:var(--bg);border:1px solid var(--border);
  border-radius:10px;cursor:pointer;
  transition:border-color .12s,transform .1s;
}
.spot-row:active{transform:scale(.98);border-color:var(--green)}
.spot-rank{
  font-family:var(--font-mono);font-size:13px;font-weight:700;
  width:22px;text-align:center;flex-shrink:0;
}
.r1{color:var(--amber)}.r2{color:var(--muted)}.r3{color:#cd7f32}
.spot-body{flex:1;min-width:0}
.spot-name{font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.spot-tags{display:flex;gap:6px;margin-top:3px;flex-wrap:wrap}
.tag{font-size:10px;padding:1px 7px;border-radius:20px;font-weight:700;letter-spacing:0.02em}
.tag-d{background:rgba(88,166,255,.12);color:var(--blue)}
.tag-c{background:rgba(57,211,83,.12);color:var(--green)}
.spot-bar{height:2px;background:var(--border);border-radius:1px;margin-top:5px}
.spot-bar-fill{height:2px;border-radius:1px;background:linear-gradient(to right,var(--green),var(--amber));transition:width .6s cubic-bezier(.16,1,.3,1)}
.spot-nav{font-size:16px;color:var(--muted);flex-shrink:0}

.empty{padding:32px 12px;text-align:center;color:var(--muted)}
.empty-icon{font-size:40px;margin-bottom:8px}
.empty-msg{font-size:13px;line-height:1.6}

/* hotspot tab */
.area-card{
  background:var(--bg);border:1px solid var(--border);
  border-radius:10px;padding:10px 12px;margin-bottom:6px;
}
.area-hdr{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.area-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.area-name{font-size:13px;font-weight:700}
.area-cnt{font-size:11px;color:var(--muted);margin-left:auto;font-family:var(--font-mono)}
.area-pills{display:flex;flex-wrap:wrap;gap:4px}
.pill{font-size:10px;padding:3px 8px;border-radius:20px;background:rgba(255,255,255,.05);color:var(--text);border:1px solid var(--border)}

/* scan animation overlay */
#scan-overlay{
  position:fixed;inset:0;z-index:2000;
  background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;
  transition:opacity .5s;
}
#scan-overlay.hidden{opacity:0;pointer-events:none}
.scan-ring{
  width:80px;height:80px;border-radius:50%;
  border:2px solid var(--green-dim);
  position:relative;
  display:flex;align-items:center;justify-content:center;
}
.scan-ring::before{
  content:'';position:absolute;inset:0;border-radius:50%;
  border:2px solid transparent;border-top-color:var(--green);
  animation:spin 1s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.scan-icon{font-size:28px}
.scan-msg{font-size:13px;color:var(--muted);font-family:var(--font-mono)}

/* my loc marker */
.my-loc-icon{
  width:16px;height:16px;border-radius:50%;
  background:var(--blue);
  border:2px solid #fff;
  box-shadow:0 0 0 4px rgba(88,166,255,0.3);
}
</style>
</head>
<body>

<!-- SCAN OVERLAY -->
<div id="scan-overlay">
  <div class="scan-ring"><div class="scan-icon">📡</div></div>
  <div class="scan-msg" id="scan-msg">GPS 取得中...</div>
</div>

<!-- HEADER -->
<div id="hdr">
  <div class="hdr-inner">
    <div class="logo">TAXI<span>▸</span>RADAR</div>
    <div class="hdr-status">
      <div class="status-row">
        <div class="pulse" id="pulse-dot"></div>
        <div class="status-text" id="loc-text">現在地 取得中...</div>
      </div>
    </div>
    <div class="clock-box">
      <div id="clock">--:--</div>
      <div class="clock-day" id="clock-day">---</div>
    </div>
  </div>
</div>

<!-- MAP -->
<div id="map"></div>

<!-- BOTTOM PANEL -->
<div id="panel">
  <div class="panel-handle" id="panel-handle"></div>
  <div class="panel-tabs">
    <button class="tab-btn active" onclick="switchTab('radar')">🎯 近くのスポット</button>
    <button class="tab-btn" onclick="switchTab('hot')">🔥 エリア別</button>
  </div>

  <!-- RADAR tab -->
  <div id="tab-radar">
    <div class="ctrl-row">
      <span class="ctrl-label">検索半径</span>
      <input type="range" id="r-slider" min="1" max="30" value="5" oninput="updateRadius(this.value)" style="--pct:14%">
      <span class="ctrl-val" id="r-val">5km</span>
      <button class="gps-btn" onclick="getGPS()">📍 再取得</button>
    </div>
    <div class="chips" id="time-chips">
      <div class="chip active" data-off="0" onclick="selectOffset(this)">今すぐ</div>
      <div class="chip" data-off="1" onclick="selectOffset(this)">+1h</div>
      <div class="chip" data-off="2" onclick="selectOffset(this)">+2h</div>
      <div class="chip" data-off="3" onclick="selectOffset(this)">+3h</div>
      <div class="chip" data-off="-1" onclick="selectOffset(this)">-1h</div>
      <div class="chip" data-off="-2" onclick="selectOffset(this)">-2h</div>
    </div>
    <div class="list-scroll" id="spot-list"></div>
  </div>

  <!-- HOT tab -->
  <div id="tab-hot" style="display:none">
    <div class="chips" id="day-chips" style="padding-top:8px">
      <div class="chip active" data-day="今日" onclick="selectDay(this)">今日</div>
      <div class="chip" data-day="月" onclick="selectDay(this)">月</div>
      <div class="chip" data-day="火" onclick="selectDay(this)">火</div>
      <div class="chip" data-day="水" onclick="selectDay(this)">水</div>
      <div class="chip" data-day="木" onclick="selectDay(this)">木</div>
      <div class="chip" data-day="金" onclick="selectDay(this)">金</div>
      <div class="chip" data-day="土" onclick="selectDay(this)">土</div>
      <div class="chip" data-day="日" onclick="selectDay(this)">日</div>
    </div>
    <div class="list-scroll" id="area-list"></div>
  </div>
</div>

let uLat=null,uLng=null,radius=5,timeOff=0,hotDay=null;

// ═══════════════════════════════════════════════════════
//  MAP INIT
// ═══════════════════════════════════════════════════════
function initMap(){
  const hdrH = document.getElementById('hdr').offsetHeight;
  document.getElementById('map').style.top = hdrH+'px';

  map = L.map('map',{
    zoomControl:true,
    attributionControl:false,
    tap:true,
  }).setView([35.6762,139.6503],12);

  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{
    maxZoom:19,subdomains:'abcd'
  }).addTo(map);

  // fix panel height var
  const ph = document.getElementById('panel').offsetHeight;
  document.documentElement.style.setProperty('--panel-h', ph+'px');
}

// ═══════════════════════════════════════════════════════
//  CLOCK
// ═══════════════════════════════════════════════════════
const DAYS=['日','月','火','水','木','金','土'];
function tick(){
  const n=new Date(),h=n.getHours(),m=n.getMinutes();
  document.getElementById('clock').textContent=`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
  document.getElementById('clock-day').textContent=DAYS[n.getDay()]+'曜';
}
setInterval(tick,1000); tick();

// ═══════════════════════════════════════════════════════
//  DISTANCE (km)
// ═══════════════════════════════════════════════════════
function km(a,b,c,d){
  const R=6371,dLat=(c-a)*Math.PI/180,dLng=(d-b)*Math.PI/180;
  const x=Math.sin(dLat/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

// ═══════════════════════════════════════════════════════
//  GPS
// ═══════════════════════════════════════════════════════
function getGPS(){
  setScan('📡 GPS 取得中...');
  if(!navigator.geolocation){setScan('⚠ GPS非対応',true);return;}
  navigator.geolocation.getCurrentPosition(pos=>{
    uLat=pos.coords.latitude; uLng=pos.coords.longitude;
    placeMyMarker();
    reverseGeo(uLat,uLng).then(n=>{
      document.getElementById('loc-text').textContent=n||`${uLat.toFixed(4)},${uLng.toFixed(4)}`;
      document.getElementById('pulse-dot').className='pulse';
    });
    hideScan();
    renderRadar();
  },err=>{
    setScan('⚠ GPS失敗 — 地図をタップして現在地を設定',true);
    map.on('click',e=>{
      uLat=e.latlng.lat; uLng=e.latlng.lng;
      placeMyMarker();
      document.getElementById('loc-text').textContent=`${uLat.toFixed(4)}, ${uLng.toFixed(4)}`;
      document.getElementById('pulse-dot').className='pulse amber';
      hideScan(); renderRadar();
    });
  },{timeout:8000,enableHighAccuracy:true});
}

function setScan(msg,stop){
  document.getElementById('scan-overlay').classList.remove('hidden');
  document.getElementById('scan-msg').textContent=msg;
  if(stop) document.querySelector('.scan-ring::before') && void 0;
}
function hideScan(){
  document.getElementById('scan-overlay').classList.add('hidden');
}

async function reverseGeo(lat,lng){
  try{
    const r=await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json&accept-language=ja`);
    const d=await r.json();
    const a=d.address;
    return (a.city_district||a.suburb||a.neighbourhood||a.city||'')+(a.quarter||'');
  }catch{return null;}
}

function placeMyMarker(){
  if(myMarker) myMarker.remove();
  const icon=L.divIcon({html:'<div class="my-loc-icon"></div>',className:'',iconSize:[16,16],iconAnchor:[8,8]});
  myMarker=L.marker([uLat,uLng],{icon,zIndexOffset:1000}).addTo(map);
  map.setView([uLat,uLng],14,{animate:true});
}

// ═══════════════════════════════════════════════════════
//  RADIUS
// ═══════════════════════════════════════════════════════
function updateRadius(v){
  radius=+v;
  document.getElementById('r-val').textContent=v+'km';
  const pct=((v-1)/29*100).toFixed(1);
  document.getElementById('r-slider').style.setProperty('--pct',pct+'%');
  renderRadar();
}

// ═══════════════════════════════════════════════════════
//  TIME OFFSET
// ═══════════════════════════════════════════════════════
function selectOffset(el){
  document.querySelectorAll('#time-chips .chip').forEach(c=>c.classList.remove('active'));
  el.classList.add('active');
  timeOff=+el.dataset.off;
  renderRadar();
}

function makePinIcon(rank,count,maxCount){
  const c=PIN_COLORS[Math.min(rank,7)];
  const sz=Math.round(28+Math.min((count/maxCount),1)*18);
  return L.divIcon({
    html:`<div style="
      width:${sz}px;height:${sz}px;border-radius:50% 50% 50% 0;
      background:${c};border:2px solid rgba(0,0,0,0.5);
      transform:rotate(-45deg);
      display:flex;align-items:center;justify-content:center;
      box-shadow:0 2px 8px rgba(0,0,0,0.6);
    "><span style="transform:rotate(45deg);font-size:${Math.round(sz*0.38)}px;font-weight:700;color:#000;font-family:monospace">${rank+1}</span></div>`,
    className:'',iconSize:[sz,sz],iconAnchor:[sz/2,sz],
  });
}

// ═══════════════════════════════════════════════════════
//  RENDER RADAR
// ═══════════════════════════════════════════════════════
function renderRadar(){
  // clear old markers
  spotMarkers.forEach(m=>m.remove());
  spotMarkers=[];

  const list=document.getElementById('spot-list');
  if(!uLat){
    list.innerHTML='<div class="empty"><div class="empty-icon">📡</div><div class="empty-msg">まず📍ボタンで現在地を取得してください</div></div>';
    return;
  }

  const now=new Date();
  const tgt=now.getHours()+timeOff;
  const day=DAYS[now.getDay()];

  const cands=D.filter(r=>{
    if(r[0]!==day) return false;
    const diff=Math.abs(r[1]-tgt);
    if(diff>2&&diff<22) return false;
    return km(uLat,uLng,r[5],r[6])<=radius;
  });

  const agg={};
  cands.forEach(r=>{
    const k=r[2]+r[3];
    if(!agg[k]) agg[k]={ward:r[2],name:r[3],count:0,lat:r[5],lng:r[6]};
    agg[k].count+=r[4];
  });

  let spots=Object.values(agg).sort((a,b)=>b.count-a.count).slice(0,20);

  if(!spots.length){
    list.innerHTML=`<div class="empty"><div class="empty-icon">🔍</div><div class="empty-msg">${radius}km以内に該当なし<br>半径を広げるか時間帯を変えて試してみてください</div></div>`;
    return;
  }

  const maxC=spots[0].count;

  // add map pins
  spots.forEach((s,i)=>{
    const icon=makePinIcon(i,s.count,maxC);
    const m=L.marker([s.lat,s.lng],{icon}).addTo(map);
    m.bindPopup(`<b>${s.ward} ${s.name}</b><br>過去 ${s.count} 件`);
    m.on('click',()=>{
      const row=document.getElementById('sr-'+i);
      if(row) row.scrollIntoView({behavior:'smooth',block:'nearest'});
    });
    spotMarkers.push(m);
  });

  // fit bounds
  const bounds=L.latLngBounds([[uLat,uLng],...spots.slice(0,10).map(s=>[s.lat,s.lng])]);
  map.fitBounds(bounds,{padding:[20,20],maxZoom:15});

  const rankCls=['r1','r2','r3'];
  list.innerHTML=spots.map((s,i)=>{
    const d=km(uLat,uLng,s.lat,s.lng);
    const rc=i<3?rankCls[i]:'';
    const pct=Math.round(s.count/maxC*100);
    return `<div class="spot-row" id="sr-${i}" onclick="focusPin(${i},${s.lat},${s.lng})">
      <div class="spot-rank ${rc}">${i+1}</div>
      <div class="spot-body">
        <div class="spot-name">${s.ward} ${s.name}</div>
        <div class="spot-tags">
          <span class="tag tag-d">📍 ${d.toFixed(1)}km</span>
          <span class="tag tag-c">🏆 ${s.count}件</span>
        </div>
        <div class="spot-bar"><div class="spot-bar-fill" style="width:${pct}%"></div></div>
      </div>
      <div class="spot-nav">›</div>
    </div>`;
  }).join('');
}

function focusPin(i,lat,lng){
  map.setView([lat,lng],16,{animate:true});
  spotMarkers[i]&&spotMarkers[i].openPopup();
}

// ═══════════════════════════════════════════════════════
//  HOT TAB
// ═══════════════════════════════════════════════════════
function selectDay(el){
  document.querySelectorAll('#day-chips .chip').forEach(c=>c.classList.remove('active'));
  el.classList.add('active');
  const v=el.dataset.day;
  hotDay=v==='今日'?DAYS[new Date().getDay()]:v;
  renderHot();
}

function renderHot(){
  const day=hotDay||DAYS[new Date().getDay()];
  const agg={};
  D.filter(r=>r[0]===day).forEach(r=>{
    if(!agg[r[2]]) agg[r[2]]={total:0,spots:{}};
    agg[r[2]].total+=r[4];
    agg[r[2]].spots[r[3]]=(agg[r[2]].spots[r[3]]||0)+r[4];
  });
  const areas=Object.entries(agg).sort((a,b)=>b[1].total-a[1].total).slice(0,8);
  const list=document.getElementById('area-list');
  list.innerHTML=areas.map(([ward,d],i)=>{
    const tops=Object.entries(d.spots).sort((a,b)=>b[1]-a[1]).slice(0,5)
      .map(([n,c])=>`<span class="pill">${n} <b style="color:var(--green)">${c}</b></span>`).join('');
    return `<div class="area-card">
      <div class="area-hdr">
        <div class="area-dot" style="background:${PIN_COLORS[i]}"></div>
        <div class="area-name">${ward}</div>
        <div class="area-cnt">計${d.total}件</div>
      </div>
      <div class="area-pills">${tops}</div>
    </div>`;
  }).join('');
}

// ═══════════════════════════════════════════════════════
//  TAB SWITCH
// ═══════════════════════════════════════════════════════
function switchTab(t){
  document.querySelectorAll('.tab-btn').forEach((b,i)=>b.classList.toggle('active',(i===0&&t==='radar')||(i===1&&t==='hot')));
  document.getElementById('tab-radar').style.display=t==='radar'?'':'none';
  document.getElementById('tab-hot').style.display=t==='hot'?'':'none';
  if(t==='hot') renderHot();
}

// ═══════════════════════════════════════════════════════
//  PANEL DRAG (simple toggle)
// ═══════════════════════════════════════════════════════
let panelExpanded=false;
document.getElementById('panel-handle').addEventListener('click',()=>{
  panelExpanded=!panelExpanded;
  const ph=panelExpanded?'75vh':'380px';
  document.getElementById('panel').style.height=ph;
  document.documentElement.style.setProperty('--panel-h',ph);
  document.getElementById('map').style.bottom=ph;
  setTimeout(()=>map.invalidateSize(),300);
});

// ═══════════════════════════════════════════════════════
//  BOOT
// ═══════════════════════════════════════════════════════
window.addEventListener('load',()=>{
  initMap();
  hotDay=DAYS[new Date().getDay()];
  getGPS();
});
</script>
