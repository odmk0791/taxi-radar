<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d1117">
<title>TAXI RADAR</title>
<style>
:root{--bg:#0d1117;--s:#161b22;--s2:#1c2230;--bd:#30363d;--g:#39d353;--gd:#1a4a2a;--am:#f0a500;--bl:#58a6ff;--re:#f85149;--tx:#e6edf3;--mu:#8b949e}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:var(--bg);color:var(--tx);font-family:-apple-system,'Hiragino Sans',sans-serif;padding-bottom:env(safe-area-inset-bottom,16px)}
#hdr{position:sticky;top:0;z-index:100;background:rgba(13,17,23,.97);border-bottom:1px solid var(--bd);padding-top:env(safe-area-inset-top,0)}
.hi{display:flex;align-items:center;gap:8px;padding:10px 14px}
.logo{font-size:16px;font-weight:900;flex-shrink:0}
.logo b{color:var(--am)}
.hs{flex:1;min-width:0}
.st{font-size:11px;color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ck{font-size:14px;font-weight:700;color:var(--g);background:var(--gd);border:1px solid rgba(57,211,83,.3);border-radius:8px;padding:5px 9px;flex-shrink:0;text-align:center;font-family:ui-monospace,monospace}
.cd{font-size:9px;color:rgba(57,211,83,.6);margin-top:1px}
main{padding:12px 14px}
.tab-row{display:flex;border-bottom:1px solid var(--bd);margin-bottom:12px}
.tabBtn{flex:1;padding:8px 4px;font-size:13px;font-weight:700;font-family:-apple-system,'Hiragino Sans',sans-serif;color:var(--mu);background:none;border:none;border-bottom:2px solid transparent;cursor:pointer}
.tabBtn.on{color:var(--g);border-bottom-color:var(--g)}
.gps-box{background:var(--s);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
.gps-top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.loc-label{font-size:10px;color:var(--mu)}
.loc-name{font-size:13px;font-weight:700;margin-top:2px}
.btn-row{display:flex;gap:8px}
.btn{flex:1;padding:11px 8px;border-radius:10px;border:none;font-family:-apple-system,'Hiragino Sans',sans-serif;font-size:13px;font-weight:700;cursor:pointer;text-align:center}
.btn-g{background:var(--g);color:#000}
.btn-g:disabled{background:var(--gd);color:var(--g)}
.btn-b{background:var(--s2);color:var(--bl);border:1px solid var(--bd)!important}
.err{display:none;background:rgba(248,81,73,.1);border:1px solid rgba(248,81,73,.4);border-radius:10px;padding:10px 12px;margin-top:8px;font-size:12px;color:var(--re);line-height:1.7;white-space:pre-line}
.err.show{display:block}
.err-btn{display:inline-block;margin-top:6px;padding:3px 10px;background:var(--re);color:#fff;border:none;border-radius:6px;font-size:11px;font-weight:700;cursor:pointer;font-family:-apple-system,sans-serif}
.ctrl{background:var(--s);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.cr{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.cl{font-size:11px;color:var(--mu);flex-shrink:0}
.cv{font-size:13px;font-weight:700;color:var(--am);flex-shrink:0;min-width:32px;text-align:right}
input[type=range]{flex:1;height:4px;-webkit-appearance:none;outline:none;border-radius:2px;background:linear-gradient(to right,var(--g) 0%,var(--g) var(--p,14%),var(--bd) var(--p,14%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--g);cursor:pointer}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:7px 14px;border-radius:20px;font-size:12px;font-weight:700;font-family:-apple-system,'Hiragino Sans',sans-serif;border:1px solid var(--bd);background:var(--bg);color:var(--mu);cursor:pointer;flex-shrink:0}
.chip.on{background:var(--g);color:#000;border-color:var(--g)}
.sec{font-size:11px;color:var(--mu);margin-bottom:8px;display:flex;align-items:center;gap:6px;text-transform:uppercase;letter-spacing:.06em}
.sec::after{content:'';flex:1;height:1px;background:var(--bd)}
.card{display:flex;align-items:center;gap:10px;background:var(--s);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:8px;text-decoration:none;color:inherit}
.rank{font-size:14px;font-weight:900;width:24px;text-align:center;flex-shrink:0}
.r1{color:var(--am)}.r2{color:#94a3b8}.r3{color:#cd7f32}.rn{color:var(--mu)}
.cb{flex:1;min-width:0}
.cn{font-size:15px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:4px}
.tags{display:flex;gap:6px}
.tag{font-size:10px;padding:2px 8px;border-radius:20px;font-weight:700}
.td{background:rgba(88,166,255,.12);color:var(--bl)}
.tc{background:rgba(57,211,83,.12);color:var(--g)}
.bar{height:3px;background:var(--bd);border-radius:2px;margin-top:6px}
.barf{height:3px;border-radius:2px;background:linear-gradient(to right,var(--g),var(--am))}
.carr{font-size:18px;color:var(--mu);flex-shrink:0}
.empty{padding:32px 0;text-align:center;color:var(--mu)}
.empty span{font-size:40px;display:block;margin-bottom:8px}
.empty p{font-size:13px;line-height:1.7}
.loading{padding:24px;text-align:center;color:var(--mu);font-size:13px}
.area{background:var(--s);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.ah{display:flex;align-items:center;gap:7px;margin-bottom:7px}
.adot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.an{font-size:13px;font-weight:700}
.ac{font-size:11px;color:var(--mu);margin-left:auto}
.aps{display:flex;flex-wrap:wrap;gap:4px}
.pill{font-size:10px;padding:3px 8px;border-radius:20px;background:rgba(255,255,255,.05);color:var(--tx);border:1px solid var(--bd)}
</style>
</head>
<body>
<div id="hdr">
  <div class="hi">
    <div class="logo">🚖 TAXI<b>▸</b>RADAR</div>
    <div class="hs"><div class="st" id="st">データ読み込み中...</div></div>
    <div class="ck"><div id="ck">--:--</div><div class="cd" id="cd">---</div></div>
  </div>
</div>
<main>
  <div class="tab-row">
    <button class="tabBtn on" id="tab-r">🎯 近くのスポット</button>
    <button class="tabBtn" id="tab-h">🔥 エリア別</button>
  </div>
  <div id="pg-r">
    <div class="gps-box">
      <div class="gps-top">
        <span style="font-size:20px">📍</span>
        <div>
          <div class="loc-label">現在地</div>
          <div class="loc-name" id="locname">未設定</div>
        </div>
      </div>
      <div class="btn-row">
        <button class="btn btn-g" id="gpsbtn">📡 GPS取得</button>
        <button class="btn btn-b" id="manualbtn">✏️ 手動入力</button>
      </div>
      <div class="err" id="errbox">
        <span id="errtxt"></span><br>
        <button class="err-btn" id="errcls">閉じる</button>
      </div>
    </div>
    <div class="ctrl">
      <div class="cr">
        <span class="cl">検索半径</span>
        <input type="range" id="rs" min="1" max="30" value="5" style="--p:14%">
        <span class="cv" id="rv">5km</span>
      </div>
      <div class="chips" id="tc">
        <button class="chip on" data-o="0">今すぐ</button>
        <button class="chip" data-o="1">+1h</button>
        <button class="chip" data-o="2">+2h</button>
        <button class="chip" data-o="3">+3h</button>
        <button class="chip" data-o="-1">-1h</button>
        <button class="chip" data-o="-2">-2h</button>
      </div>
    </div>
    <div class="sec">近くのスポット</div>
    <div id="rl"><div class="loading">データ読み込み中...</div></div>
  </div>
  <div id="pg-h" style="display:none">
    <div class="chips" id="dc" style="margin-bottom:12px">
      <button class="chip on" data-d="today">今日</button>
      <button class="chip" data-d="月">月</button>
      <button class="chip" data-d="火">火</button>
      <button class="chip" data-d="水">水</button>
      <button class="chip" data-d="木">木</button>
      <button class="chip" data-d="金">金</button>
      <button class="chip" data-d="土">土</button>
      <button class="chip" data-d="日">日</button>
    </div>
    <div class="sec">エリア別ランキング</div>
    <div id="hl"><div class="loading">データ読み込み中...</div></div>
  </div>
</main>
<script>
var D = null;
var DAYS = ['日','月','火','水','木','金','土'];
var PC = ['#f0a500','#94a3b8','#cd7f32','#39d353','#58a6ff','#a78bfa','#f87171','#22d3ee'];
var uLat = null, uLng = null, R = 5, off = 0;
var hDay = DAYS[new Date().getDay()];

// 時計
function tick() {
  var n = new Date();
  var h = ('0' + n.getHours()).slice(-2);
  var m = ('0' + n.getMinutes()).slice(-2);
  document.getElementById('ck').textContent = h + ':' + m;
  document.getElementById('cd').textContent = DAYS[n.getDay()] + '曜';
}
setInterval(tick, 1000);
tick();

// 距離計算(km)
function dist(a, b, c, d) {
  var R2 = 6371;
  var dLat = (c - a) * Math.PI / 180;
  var dLng = (d - b) * Math.PI / 180;
  var x = Math.sin(dLat/2) * Math.sin(dLat/2)
        + Math.cos(a * Math.PI/180) * Math.cos(c * Math.PI/180)
        * Math.sin(dLng/2) * Math.sin(dLng/2);
  return R2 * 2 * Math.atan2(Math.sqrt(x), Math.sqrt(1 - x));
}

function showErr(msg) {
  document.getElementById('errtxt').textContent = msg;
  document.getElementById('errbox').classList.add('show');
}
function closeErr() {
  document.getElementById('errbox').classList.remove('show');
}

function renderRadar() {
  var list = document.getElementById('rl');
  if (!D) { list.innerHTML = '<div class="loading">データ読み込み中...</div>'; return; }
  if (!uLat) {
    list.innerHTML = '<div class="empty"><span>📡</span><p>GPS取得または手動入力で<br>現在地を設定してください</p></div>';
    return;
  }
  var now = new Date();
  var tgt = now.getHours() + off;
  var day = DAYS[now.getDay()];
  var agg = {};
  for (var i = 0; i < D.length; i++) {
    var r = D[i];
    if (r[0] !== day) continue;
    var df = Math.abs(r[1] - tgt);
    if (df > 2 && df < 22) continue;
    if (dist(uLat, uLng, r[5], r[6]) > R) continue;
    var k = r[2] + r[3];
    if (!agg[k]) agg[k] = {w:r[2], n:r[3], c:0, lat:r[5], lng:r[6]};
    agg[k].c += r[4];
  }
  var spots = Object.values(agg).sort(function(a,b){return b.c - a.c;}).slice(0, 20);
  if (!spots.length) {
    list.innerHTML = '<div class="empty"><span>🔍</span><p>' + R + 'km以内にデータなし<br>半径を広げてみてください</p></div>';
    return;
  }
  var mx = spots[0].c;
  var rc = ['r1','r2','r3'];
  var html = '';
  for (var j = 0; j < spots.length; j++) {
    var s = spots[j];
    var d = dist(uLat, uLng, s.lat, s.lng);
    var url = 'https://maps.apple.com/?q=' + encodeURIComponent(s.w + ' ' + s.n) + '&ll=' + s.lat + ',' + s.lng + '&z=16';
    var rankCls = j < 3 ? rc[j] : 'rn';
    html += '<a class="card" href="' + url + '" target="_blank">'
         + '<div class="rank ' + rankCls + '">' + (j+1) + '</div>'
         + '<div class="cb">'
         + '<div class="cn">' + s.w + ' ' + s.n + '</div>'
         + '<div class="tags">'
         + '<span class="tag td">📍 ' + d.toFixed(1) + 'km</span>'
         + '<span class="tag tc">🏆 ' + s.c + '件</span>'
         + '</div>'
         + '<div class="bar"><div class="barf" style="width:' + Math.round(s.c/mx*100) + '%"></div></div>'
         + '</div>'
         + '<div class="carr">›</div>'
         + '</a>';
  }
  list.innerHTML = html;
}

function renderHot() {
  if (!D) return;
  var day = hDay;
  var agg = {};
  for (var i = 0; i < D.length; i++) {
    var r = D[i];
    if (r[0] !== day) continue;
    if (!agg[r[2]]) agg[r[2]] = {t:0, s:{}};
    agg[r[2]].t += r[4];
    agg[r[2]].s[r[3]] = (agg[r[2]].s[r[3]] || 0) + r[4];
  }
  var areas = Object.entries(agg).sort(function(a,b){return b[1].t - a[1].t;}).slice(0, 8);
  var html = '';
  for (var j = 0; j < areas.length; j++) {
    var w = areas[j][0], d = areas[j][1];
    var tops = Object.entries(d.s).sort(function(a,b){return b[1]-a[1];}).slice(0,5);
    var pillsHtml = '';
    for (var k = 0; k < tops.length; k++) {
      pillsHtml += '<span class="pill">' + tops[k][0] + ' <b style="color:var(--g)">' + tops[k][1] + '</b></span>';
    }
    html += '<div class="area">'
          + '<div class="ah"><div class="adot" style="background:' + PC[j] + '"></div>'
          + '<div class="an">' + w + '</div>'
          + '<div class="ac">計' + d.t + '件</div></div>'
          + '<div class="aps">' + pillsHtml + '</div></div>';
  }
  document.getElementById('hl').innerHTML = html;
}

function swTab(t) {
  document.getElementById('tab-r').classList.toggle('on', t === 'r');
  document.getElementById('tab-h').classList.toggle('on', t === 'h');
  document.getElementById('pg-r').style.display = t === 'r' ? '' : 'none';
  document.getElementById('pg-h').style.display = t === 'h' ? '' : 'none';
  if (t === 'h') renderHot();
}

// データ読み込み
fetch('data.json')
  .then(function(res) { return res.json(); })
  .then(function(json) {
    D = json;
    document.getElementById('st').textContent = '📍 現在地を設定してください';
    renderRadar();
  })
  .catch(function(e) {
    document.getElementById('st').textContent = 'データ読み込み失敗: ' + e.message;
  });

// イベント登録
document.getElementById('tab-r').addEventListener('click', function() { swTab('r'); });
document.getElementById('tab-h').addEventListener('click', function() { swTab('h'); });
document.getElementById('errcls').addEventListener('click', closeErr);

document.getElementById('gpsbtn').addEventListener('click', function() {
  if (!navigator.geolocation) { showErr('GPS非対応ブラウザです。手動入力をご利用ください。'); return; }
  var btn = this;
  btn.textContent = '⏳ 取得中...';
  btn.disabled = true;
  document.getElementById('st').textContent = 'GPS取得中...';
  navigator.geolocation.getCurrentPosition(
    function(pos) {
      uLat = pos.coords.latitude;
      uLng = pos.coords.longitude;
      btn.textContent = '📡 GPS取得';
      btn.disabled = false;
      document.getElementById('locname').textContent = uLat.toFixed(5) + ', ' + uLng.toFixed(5);
      document.getElementById('st').textContent = '現在地を取得しました ✓';
      closeErr();
      renderRadar();
      fetch('https://nominatim.openstreetmap.org/reverse?lat=' + uLat + '&lon=' + uLng + '&format=json&accept-language=ja')
        .then(function(r) { return r.json(); })
        .then(function(data) {
          var a = data.address;
          var name = (a.city_district || a.suburb || a.neighbourhood || a.city || '') + (a.quarter || '');
          if (name) {
            document.getElementById('locname').textContent = name;
            document.getElementById('st').textContent = name + '付近';
          }
        }).catch(function() {});
    },
    function(err) {
      btn.textContent = '📡 GPS取得';
      btn.disabled = false;
      var msg = 'GPS取得に失敗しました。';
      if (err.code === 1) msg = '位置情報が拒否されています。\n\niPhone設定 → Safari → 位置情報 →「このAppの使用中」に変更後、リロードしてください。\n\nまたは「手動入力」で緯度経度を入力できます。';
      else if (err.code === 3) msg = 'GPS取得がタイムアウトしました。屋外でお試しください。\n\n「手動入力」で緯度経度を直接入力することもできます。';
      showErr(msg);
      document.getElementById('st').textContent = 'GPS失敗 — 手動入力をお試しください';
    },
    { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
  );
});

document.getElementById('manualbtn').addEventListener('click', function() {
  var v = window.prompt('緯度,経度を入力してください\n例: 35.6580,139.7016\n(渋谷駅付近)');
  if (!v) return;
  var parts = v.split(',');
  if (parts.length < 2) { alert('形式が正しくありません。例: 35.6580,139.7016'); return; }
  var lat = parseFloat(parts[0].trim());
  var lng = parseFloat(parts[1].trim());
  if (isNaN(lat) || isNaN(lng)) { alert('数値を入力してください。例: 35.6580,139.7016'); return; }
  uLat = lat; uLng = lng;
  document.getElementById('locname').textContent = uLat.toFixed(5) + ', ' + uLng.toFixed(5);
  document.getElementById('st').textContent = '手動設定済み ✓';
  closeErr();
  renderRadar();
});

document.getElementById('rs').addEventListener('input', function() {
  R = parseInt(this.value);
  document.getElementById('rv').textContent = R + 'km';
  var p = ((R - 1) / 29 * 100).toFixed(1);
  this.style.setProperty('--p', p + '%');
  if (uLat) renderRadar();
});

document.querySelectorAll('#tc .chip').forEach(function(c) {
  c.addEventListener('click', function() {
    document.querySelectorAll('#tc .chip').forEach(function(x) { x.classList.remove('on'); });
    this.classList.add('on');
    off = parseInt(this.getAttribute('data-o'));
    if (uLat) renderRadar();
  });
});

document.querySelectorAll('#dc .chip').forEach(function(c) {
  c.addEventListener('click', function() {
    document.querySelectorAll('#dc .chip').forEach(function(x) { x.classList.remove('on'); });
    this.classList.add('on');
    var v = this.getAttribute('data-d');
    hDay = (v === 'today') ? DAYS[new Date().getDay()] : v;
    renderHot();
  });
});
</script>
</body>
</html>
