<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d1117">
<title>TAXI RADAR</title>
<style>
:root{
  --bg:#0d1117;--s:#161b22;--s2:#1c1c26;--bd:#30363d;
  --g:#39d353;--gd:#1a4a2a;--am:#f0a500;--bl:#58a6ff;--re:#f85149;
  --tx:#e6edf3;--mu:#8b949e;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{height:100%;background:var(--bg)}
body{min-height:100%;background:var(--bg);color:var(--tx);
  font-family:-apple-system,'Hiragino Sans',sans-serif;
  padding-bottom:env(safe-area-inset-bottom,16px)}

#hdr{
  position:sticky;top:0;z-index:100;
  background:rgba(13,17,23,.97);border-bottom:1px solid var(--bd);
  padding-top:env(safe-area-inset-top,0);
}
.hi{display:flex;align-items:center;gap:8px;padding:10px 14px}
.logo{font-size:16px;font-weight:900;flex-shrink:0}
.logo b{color:var(--am)}
.hs{flex:1;min-width:0}
.st{font-size:11px;color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ck{font-size:14px;font-weight:700;color:var(--g);background:var(--gd);
  border:1px solid rgba(57,211,83,.3);border-radius:8px;
  padding:5px 9px;flex-shrink:0;text-align:center}
.cd{font-size:9px;color:rgba(57,211,83,.6);margin-top:1px}

main{padding:12px 14px}

/* TAB */
.tab-row{display:flex;border-bottom:1px solid var(--bd);margin-bottom:12px}
.tabBtn{
  flex:1;padding:8px 4px;font-size:13px;font-weight:700;
  font-family:-apple-system,'Hiragino Sans',sans-serif;
  color:var(--mu);background:none;border:none;
  border-bottom:2px solid transparent;
  cursor:pointer;-webkit-appearance:none;
}
.tabBtn.on{color:var(--g);border-bottom-color:var(--g)}

/* GPS BOX */
.gps-box{background:var(--s);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
.gps-row{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.loc-icon{font-size:20px;flex-shrink:0}
.loc-label{font-size:10px;color:var(--mu)}
.loc-name{font-size:13px;font-weight:700;margin-top:2px}
.btn-row{display:flex;gap:8px}
.btn{
  flex:1;padding:11px 8px;border-radius:10px;border:none;
  font-family:-apple-system,'Hiragino Sans',sans-serif;
  font-size:13px;font-weight:700;
  cursor:pointer;text-align:center;
  -webkit-appearance:none;display:block;
}
.btn-gps{background:var(--g);color:#000}
.btn-gps:disabled{background:var(--gd);color:var(--g)}
.btn-manual{background:var(--s2);color:var(--bl);border:1px solid var(--bd)!important}

/* ERROR */
.err-box{
  display:none;background:rgba(248,81,73,.1);border:1px solid rgba(248,81,73,.4);
  border-radius:10px;padding:10px 12px;margin-top:8px;
  font-size:12px;color:var(--re);line-height:1.6;white-space:pre-line;
}
.err-box.show{display:block}
.err-close{
  display:inline-block;margin-top:6px;padding:3px 10px;
  background:var(--re);color:#fff;border:none;border-radius:6px;
  font-size:11px;font-weight:700;cursor:pointer;
  font-family:-apple-system,'Hiragino Sans',sans-serif;
  -webkit-appearance:none;
}

/* CONTROLS */
.ctrl-box{background:var(--s);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.cr{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.cl{font-size:11px;color:var(--mu);flex-shrink:0}
.cv{font-size:13px;font-weight:700;color:var(--am);flex-shrink:0;min-width:32px;text-align:right}
input[type=range]{
  flex:1;height:4px;-webkit-appearance:none;outline:none;border-radius:2px;
  background:linear-gradient(to right,var(--g) 0%,var(--g) var(--p,14%),var(--bd) var(--p,14%));
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:22px;height:22px;
  border-radius:50%;background:var(--g);cursor:pointer;
}

/* CHIPS */
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  white-space:nowrap;padding:7px 14px;border-radius:20px;font-size:12px;font-weight:700;
  font-family:-apple-system,'Hiragino Sans',sans-serif;
  border:1px solid var(--bd);background:var(--bg);color:var(--mu);
  cursor:pointer;flex-shrink:0;-webkit-appearance:none;
}
.chip.on{background:var(--g);color:#000;border-color:var(--g)}

/* SECTION */
.sec{font-size:11px;color:var(--mu);margin-bottom:8px;
  display:flex;align-items:center;gap:6px;text-transform:uppercase;letter-spacing:.06em}
.sec::after{content:'';flex:1;height:1px;background:var(--bd)}

/* CARDS */
.card{
  display:flex;align-items:center;gap:10px;
  background:var(--s);border:1px solid var(--bd);border-radius:12px;
  padding:12px;margin-bottom:8px;
  text-decoration:none;color:inherit;
}
.rank{font-size:14px;font-weight:900;width:24px;text-align:center;flex-shrink:0}
.r1{color:var(--am)}.r2{color:#94a3b8}.r3{color:#cd7f32}.rn{color:var(--mu)}
.cb{flex:1;min-width:0}
.cn{font-size:15px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:4px}
.tags{display:flex;gap:6px}
.tag{font-size:10px;padding:2px 8px;border-radius:20px;font-weight:700}
.td{background:rgba(88,166,255,.12);color:var(--bl)}
.tc{background:rgba(57,211,83,.12);color:var(--g)}
.bar{height:3px;background:var(--bd);border-radius:2px;margin-top:6px}
.barf{height:3px;border-radius:2px;background:linear-gradient(to right,var(--g),var(--am))}
.carr{font-size:18px;color:var(--mu);flex-shrink:0}

.empty{padding:32px 0;text-align:center;color:var(--mu)}
.ei{font-size:40px;margin-bottom:8px}
.et{font-size:13px;line-height:1.7}

/* HOT */
.area{background:var(--s);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.ah{display:flex;align-items:center;gap:7px;margin-bottom:7px}
.adot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.an{font-size:13px;font-weight:700}
.ac{font-size:11px;color:var(--mu);margin-left:auto}
.aps{display:flex;flex-wrap:wrap;gap:4px}
.pill{font-size:10px;padding:3px 8px;border-radius:20px;
  background:rgba(255,255,255,.05);color:var(--tx);border:1px solid var(--bd)}
</style>
</head>
<body>

<div id="hdr">
  <div class="hi">
    <div class="logo">🚖 TAXI<b>▸</b>RADAR</div>
    <div class="hs"><div class="st" id="st">📍 現在地を設定してください</div></div>
    <div class="ck"><div id="ck">--:--</div><div class="cd" id="cd">---</div></div>
  </div>
</div>

<main>
  <div class="tab-row">
    <button class="tabBtn on" id="tab-r">🎯 近くのスポット</button>
    <button class="tabBtn" id="tab-h">🔥 エリア別</button>
  </div>

  <div id="pg-r">
    <div class="gps-box">
      <div class="gps-row">
        <div class="loc-icon">📍</div>
        <div>
          <div class="loc-label">現在地</div>
          <div class="loc-name" id="locname">未設定</div>
        </div>
      </div>
      <div class="btn-row">
        <button class="btn btn-gps" id="gpsbtn">📡 GPS取得</button>
        <button class="btn btn-manual" id="manualbtn">✏️ 手動入力</button>
      </div>
      <div class="err-box" id="errbox">
        <span id="errtxt"></span>
        <br><button class="err-close" id="errclose">閉じる</button>
      </div>
    </div>

    <div class="ctrl-box">
      <div class="cr">
        <span class="cl">検索半径</span>
        <input type="range" id="rs" min="1" max="30" value="5" style="--p:14%">
        <span class="cv" id="rv">5km</span>
      </div>
      <div class="chips" id="tc">
        <button class="chip on" data-o="0">今すぐ</button>
        <button class="chip" data-o="1">+1h</button>
        <button class="chip" data-o="2">+2h</button>
        <button class="chip" data-o="3">+3h</button>
        <button class="chip" data-o="-1">-1h</button>
        <button class="chip" data-o="-2">-2h</button>
      </div>
    </div>

    <div class="sec">近くのスポット</div>
    <div id="rl">
      <div class="empty"><div class="ei">📡</div><div class="et">「GPS取得」を押してください<br>または「手動入力」で緯度経度を入力</div></div>
    </div>
  </div>

  <div id="pg-h" style="display:none">
    <div class="chips" id="dc" style="margin-bottom:12px">
      <button class="chip on" data-d="今日">今日</button>
      <button class="chip" data-d="月">月</button>
      <button class="chip" data-d="火">火</button>
      <button class="chip" data-d="水">水</button>
      <button class="chip" data-d="木">木</button>
      <button class="chip" data-d="金">金</button>
      <button class="chip" data-d="土">土</button>
      <button class="chip" data-d="日">日</button>
    </div>
    <div class="sec">エリア別ランキング</div>
    <div id="hl"></div>
  </div>
</main>

function tick(){
  const n=new Date();
  document.getElementById('ck').textContent=`${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}`;
  document.getElementById('cd').textContent=DAYS[n.getDay()]+'\u66dc';
}

// DISTANCE
function km(a,b,c,d){
  const R2=6371,dL=(c-a)*Math.PI/180,dG=(d-b)*Math.PI/180;
  const x=Math.sin(dL/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dG/2)**2;
  return R2*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

function renderRadar(){
  var list=document.getElementById('rl');
  if(!uLat){list.innerHTML='<div class="empty"><div class="ei">\ud83d\udce1</div><div class="et">GPS\u53d6\u5f97\u307e\u305f\u306f\u624b\u52d5\u5165\u529b\u3067\u73fe\u5728\u5730\u3092\u8a2d\u5b9a</div></div>';return;}
  var now=new Date(),tgt=now.getHours()+off,day=DAYS[now.getDay()];
  var agg={};
  D.filter(function(r){
    if(r[0]!==day) return false;
    var d=Math.abs(r[1]-tgt);if(d>2&&d<22) return false;
    return km(uLat,uLng,r[5],r[6])<=R;
  }).forEach(function(r){
    var k=r[2]+r[3];
    if(!agg[k]) agg[k]={w:r[2],n:r[3],c:0,lat:r[5],lng:r[6]};
    agg[k].c+=r[4];
  });
  var spots=Object.values(agg).sort(function(a,b){return b.c-a.c;}).slice(0,20);
  if(!spots.length){list.innerHTML='<div class="empty"><div class="ei">\ud83d\udd0d</div><div class="et">'+R+'km\u4ee5\u5185\u306b\u30c7\u30fc\u30bf\u306a\u3057<br>\u534a\u5f84\u3092\u5e83\u3052\u3066\u307f\u3066\u304f\u3060\u3055\u3044</div></div>';return;}
  var mx=spots[0].c;
  var rc=['r1','r2','r3'];
  list.innerHTML=spots.map(function(s,i){
    var d=km(uLat,uLng,s.lat,s.lng);
    var url='https://maps.apple.com/?q='+encodeURIComponent(s.w+' '+s.n)+'&ll='+s.lat+','+s.lng+'&z=16';
    return '<a class="card" href="'+url+'" target="_blank">'
      +'<div class="rank '+(i<3?rc[i]:'rn')+'">'+(i+1)+'</div>'
      +'<div class="cb">'
      +'<div class="cn">'+s.w+' '+s.n+'</div>'
      +'<div class="tags"><span class="tag td">\ud83d\udccd '+d.toFixed(1)+'km</span><span class="tag tc">\ud83c\udfc6 '+s.c+'\u4ef6</span></div>'
      +'<div class="bar"><div class="barf" style="width:'+Math.round(s.c/mx*100)+'%"></div></div>'
      +'</div><div class="carr">\u203a</div></a>';
  }).join('');
}

function renderHot(){
  var day=hDay||DAYS[new Date().getDay()];
  var agg={};
  D.filter(function(r){return r[0]===day;}).forEach(function(r){
    if(!agg[r[2]]) agg[r[2]]={t:0,s:{}};
    agg[r[2]].t+=r[4];agg[r[2]].s[r[3]]=(agg[r[2]].s[r[3]]||0)+r[4];
  });
  var areas=Object.entries(agg).sort(function(a,b){return b[1].t-a[1].t;}).slice(0,8);
  document.getElementById('hl').innerHTML=areas.map(function(entry,i){
    var w=entry[0],d=entry[1];
    var tops=Object.entries(d.s).sort(function(a,b){return b[1]-a[1];}).slice(0,5)
      .map(function(e){return '<span class="pill">'+e[0]+' <b style="color:var(--g)">'+e[1]+'</b></span>';}).join('');
    return '<div class="area"><div class="ah"><div class="adot" style="background:'+PC[i]+'"></div><div class="an">'+w+'</div><div class="ac">\u8a08'+d.t+'\u4ef6</div></div><div class="aps">'+tops+'</div></div>';
  }).join('');
}

function swTab(t){
  document.getElementById('tab-r').classList.toggle('on',t==='r');
  document.getElementById('tab-h').classList.toggle('on',t==='h');
  document.getElementById('pg-r').style.display=t==='r'?'':'none';
  document.getElementById('pg-h').style.display=t==='h'?'':'none';
  if(t==='h') renderHot();
}
</script>
