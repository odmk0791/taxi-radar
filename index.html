<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a0f">
<title>乗客レーダー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0a0f;
  --surface: #13131a;
  --surface2: #1c1c26;
  --border: rgba(255,255,255,0.08);
  --accent: #4f9cf9;
  --accent2: #a78bfa;
  --green: #34d399;
  --amber: #fbbf24;
  --red: #f87171;
  --text: #f1f5f9;
  --muted: #64748b;
  --radius: 16px;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: 'Noto Sans JP', sans-serif; }

#app { display: flex; flex-direction: column; height: 100dvh; }

/* Header */
header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 12px 16px 10px;
  display: flex; align-items: center; gap: 10px;
  flex-shrink: 0;
}
.logo {
  width: 36px; height: 36px; border-radius: 10px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; flex-shrink: 0;
}
.header-info { flex: 1; min-width: 0; }
.header-title { font-size: 16px; font-weight: 700; letter-spacing: 0.02em; }
.header-sub { font-size: 11px; color: var(--muted); font-family: 'JetBrains Mono', monospace; margin-top: 1px; }

/* Clock */
.clock-badge {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 6px 10px;
  text-align: center;
  flex-shrink: 0;
}
.clock-time { font-size: 15px; font-weight: 600; font-family: 'JetBrains Mono', monospace; color: var(--accent); }
.clock-day { font-size: 10px; color: var(--muted); margin-top: 1px; }

/* Scroll area */
#scroll-area { flex: 1; overflow-y: auto; padding: 12px 14px 80px; -webkit-overflow-scrolling: touch; }

/* Location bar */
.location-bar {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 14px;
  margin-bottom: 12px;
  display: flex; align-items: center; gap: 10px;
}
.loc-icon { font-size: 20px; flex-shrink: 0; }
.loc-info { flex: 1; min-width: 0; }
.loc-label { font-size: 11px; color: var(--muted); }
.loc-name { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
.loc-btn {
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 10px;
  padding: 7px 12px;
  font-size: 12px;
  font-weight: 600;
  font-family: 'Noto Sans JP', sans-serif;
  cursor: pointer;
  flex-shrink: 0;
  transition: opacity 0.15s;
}
.loc-btn:active { opacity: 0.7; }

/* Radius slider */
.radius-row {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 14px;
  margin-bottom: 12px;
}
.radius-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.radius-label { font-size: 12px; color: var(--muted); }
.radius-val { font-size: 14px; font-weight: 600; font-family: 'JetBrains Mono', monospace; color: var(--accent); }
input[type=range] {
  width: 100%; height: 4px; border-radius: 2px;
  -webkit-appearance: none; appearance: none;
  background: linear-gradient(to right, var(--accent) 0%, var(--accent) var(--pct,50%), var(--border) var(--pct,50%));
  outline: none;
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 20px; height: 20px;
  border-radius: 50%; background: var(--accent);
  box-shadow: 0 0 0 3px rgba(79,156,249,0.25);
  cursor: pointer;
}

/* Section header */
.section-header {
  display: flex; align-items: center; gap: 8px;
  margin: 4px 0 10px;
  font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em;
}
.section-header::after { content: ''; flex: 1; height: 1px; background: var(--border); }

/* Result cards */
.result-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px;
  margin-bottom: 10px;
  display: flex; gap: 12px; align-items: flex-start;
  cursor: pointer;
  transition: border-color 0.15s, transform 0.1s;
  text-decoration: none; color: inherit;
}
.result-card:active { transform: scale(0.98); border-color: rgba(79,156,249,0.4); }
.rank-circle {
  width: 36px; height: 36px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 15px; flex-shrink: 0;
}
.rank-1 { background: rgba(251,191,36,0.15); color: #fbbf24; border: 1.5px solid rgba(251,191,36,0.3); }
.rank-2 { background: rgba(148,163,184,0.15); color: #94a3b8; border: 1.5px solid rgba(148,163,184,0.3); }
.rank-3 { background: rgba(180,83,9,0.2); color: #fb923c; border: 1.5px solid rgba(180,83,9,0.3); }
.rank-n { background: rgba(100,116,139,0.1); color: var(--muted); border: 1.5px solid var(--border); }
.card-body { flex: 1; min-width: 0; }
.card-name { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
.card-meta { display: flex; gap: 8px; flex-wrap: wrap; }
.tag {
  font-size: 11px; padding: 2px 8px; border-radius: 20px;
  font-weight: 500;
}
.tag-dist { background: rgba(79,156,249,0.12); color: var(--accent); }
.tag-count { background: rgba(52,211,153,0.12); color: var(--green); }
.card-bar-wrap { height: 3px; background: var(--surface2); border-radius: 2px; margin-top: 8px; }
.card-bar { height: 3px; border-radius: 2px; background: linear-gradient(to right, var(--green), var(--accent)); transition: width 0.6s cubic-bezier(.16,1,.3,1); }
.card-map-arrow { color: var(--muted); font-size: 18px; align-self: center; flex-shrink: 0; }

/* Hotspot clusters */
.cluster-card {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 14px;
  margin-bottom: 8px;
}
.cluster-header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.cluster-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.cluster-name { font-size: 14px; font-weight: 600; }
.cluster-count { font-size: 11px; color: var(--muted); margin-left: auto; }
.cluster-spots { display: flex; flex-wrap: wrap; gap: 6px; }
.spot-pill {
  font-size: 11px; padding: 4px 10px; border-radius: 20px;
  background: rgba(255,255,255,0.06); color: var(--text);
  border: 1px solid var(--border);
}

/* Empty / loading */
.empty-state { text-align: center; padding: 48px 24px; color: var(--muted); }
.empty-icon { font-size: 48px; margin-bottom: 12px; }
.empty-text { font-size: 14px; }
.loading-dots { display: flex; gap: 6px; justify-content: center; margin-top: 16px; }
.loading-dots span {
  width: 8px; height: 8px; border-radius: 50%; background: var(--accent);
  animation: pulse 1s ease-in-out infinite;
}
.loading-dots span:nth-child(2) { animation-delay: 0.2s; }
.loading-dots span:nth-child(3) { animation-delay: 0.4s; }
@keyframes pulse { 0%,100%{opacity:0.2;transform:scale(0.8)} 50%{opacity:1;transform:scale(1)} }

/* Bottom nav */
nav {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: var(--surface);
  border-top: 1px solid var(--border);
  display: flex;
  padding-bottom: env(safe-area-inset-bottom, 0);
  z-index: 100;
}
.nav-btn {
  flex: 1; padding: 10px 8px; border: none; background: none;
  color: var(--muted); font-family: 'Noto Sans JP', sans-serif;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  cursor: pointer; transition: color 0.15s; font-size: 10px;
}
.nav-btn.active { color: var(--accent); }
.nav-btn span { font-size: 22px; }

/* Time filter chips */
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; margin-bottom: 12px; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  white-space: nowrap; padding: 6px 14px; border-radius: 20px;
  font-size: 12px; font-weight: 500; border: 1px solid var(--border);
  background: var(--surface); color: var(--muted);
  cursor: pointer; transition: all 0.15s; flex-shrink: 0;
  font-family: 'Noto Sans JP', sans-serif;
}
.chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }

/* Page panels */
.page { display: none; }
.page.active { display: block; }

/* History tab */
.hist-row {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; padding: 10px 14px; margin-bottom: 8px;
  display: flex; align-items: center; gap: 10px;
}
.hist-time { font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--accent); flex-shrink: 0; }
.hist-name { font-size: 13px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hist-cnt { font-size: 12px; color: var(--green); flex-shrink: 0; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo">🚖</div>
    <div class="header-info">
      <div class="header-title">乗客レーダー</div>
      <div class="header-sub" id="header-context">データ読込中...</div>
    </div>
    <div class="clock-badge">
      <div class="clock-time" id="clock">--:--</div>
      <div class="clock-day" id="clock-day">---</div>
    </div>
  </header>

  <div id="scroll-area">

    <!-- Radar page -->
    <div class="page active" id="page-radar">
      <div class="location-bar">
        <div class="loc-icon">📍</div>
        <div class="loc-info">
          <div class="loc-label">現在地</div>
          <div class="loc-name" id="loc-name">取得中...</div>
        </div>
        <button class="loc-btn" onclick="getLocation()">更新</button>
      </div>

      <div class="radius-row">
        <div class="radius-header">
          <span class="radius-label">検索半径</span>
          <span class="radius-val" id="radius-val">5 km</span>
        </div>
        <input type="range" id="radius-slider" min="1" max="20" value="5"
          oninput="updateRadius(this.value)" style="--pct:22%">
      </div>

      <div class="chips" id="time-chips">
        <div class="chip active" data-offset="0" onclick="selectChip(this)">今すぐ</div>
        <div class="chip" data-offset="1" onclick="selectChip(this)">+1h</div>
        <div class="chip" data-offset="2" onclick="selectChip(this)">+2h</div>
        <div class="chip" data-offset="3" onclick="selectChip(this)">+3h</div>
        <div class="chip" data-offset="-1" onclick="selectChip(this)">-1h</div>
      </div>

      <div class="section-header">近くのスポット</div>
      <div id="results-list"></div>
    </div>

    <!-- Hotspot page -->
    <div class="page" id="page-hot">
      <div class="chips" id="day-chips">
        <div class="chip active" data-day="今日" onclick="selectDayChip(this)">今日</div>
        <div class="chip" data-day="月" onclick="selectDayChip(this)">月</div>
        <div class="chip" data-day="火" onclick="selectDayChip(this)">火</div>
        <div class="chip" data-day="水" onclick="selectDayChip(this)">水</div>
        <div class="chip" data-day="木" onclick="selectDayChip(this)">木</div>
        <div class="chip" data-day="金" onclick="selectDayChip(this)">金</div>
        <div class="chip" data-day="土" onclick="selectDayChip(this)">土</div>
        <div class="chip" data-day="日" onclick="selectDayChip(this)">日</div>
      </div>
      <div class="section-header">エリア別ランキング</div>
      <div id="hotspot-list"></div>
    </div>

    <!-- History page -->
    <div class="page" id="page-hist">
      <div class="section-header">全時間帯トップ30</div>
      <div id="hist-list"></div>
    </div>

  </div><!-- scroll-area -->

  <nav>
    <button class="nav-btn active" id="nav-radar" onclick="switchPage('radar')">
      <span>🎯</span>レーダー
    </button>
    <button class="nav-btn" id="nav-hot" onclick="switchPage('hot')">
      <span>🔥</span>ホット
    </button>
    <button class="nav-btn" id="nav-hist" onclick="switchPage('hist')">
      <span>📊</span>統計
    </button>
  </nav>
</div>

const DAYS = ['日','月','火','水','木','金','土'];
let userLat = null, userLng = null;
let radiusKm = 5;
let timeOffset = 0;
let selectedDay = null;

// ===== CLOCK =====
function updateClock() {
  const now = new Date();
  const h = now.getHours(), m = now.getMinutes();
  document.getElementById('clock').textContent = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
  document.getElementById('clock-day').textContent = '月火水木金土日'[now.getDay()] + '曜日';
  document.getElementById('header-context').textContent = `${DAYS[now.getDay()]}曜 ${h}時台 — ${RAW.length}件のデータ`;
}
setInterval(updateClock, 1000);
updateClock();

// ===== DISTANCE =====
function distKm(lat1, lng1, lat2, lng2) {
  const R = 6371, dLat = (lat2-lat1)*Math.PI/180, dLng = (lng2-lng1)*Math.PI/180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

// ===== GEOCODE =====
async function geocodeLatLng(lat, lng) {
  try {
    const url = `https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json&accept-language=ja`;
    const r = await fetch(url);
    const d = await r.json();
    const a = d.address;
    return (a.city_district || a.suburb || a.neighbourhood || a.county || a.city || '') + (a.quarter || '');
  } catch { return `${lat.toFixed(4)}, ${lng.toFixed(4)}`; }
}

// ===== LOCATION =====
function getLocation() {
  document.getElementById('loc-name').textContent = '取得中...';
  if (!navigator.geolocation) {
    document.getElementById('loc-name').textContent = 'GPS非対応ブラウザ';
    return;
  }
  navigator.geolocation.getCurrentPosition(async pos => {
    userLat = pos.coords.latitude;
    userLng = pos.coords.longitude;
    const name = await geocodeLatLng(userLat, userLng);
    document.getElementById('loc-name').textContent = name || `${userLat.toFixed(4)}, ${userLng.toFixed(4)}`;
    renderRadar();
  }, err => {
    document.getElementById('loc-name').textContent = 'GPS取得失敗 — 手動入力';
    showManualInput();
  }, { timeout: 8000 });
}

function showManualInput() {
  const bar = document.querySelector('.location-bar');
  const inp = document.createElement('input');
  inp.placeholder = '緯度,経度 または 地名（例: 35.597,139.711）';
  inp.style.cssText = 'flex:1;background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:6px 10px;font-size:13px;font-family:inherit;margin-left:8px;';
  inp.onkeydown = e => {
    if (e.key === 'Enter') {
      const v = inp.value.trim();
      const m = v.match(/(-?\d+\.?\d*),\s*(-?\d+\.?\d*)/);
      if (m) { userLat = +m[1]; userLng = +m[2]; document.getElementById('loc-name').textContent = v; inp.remove(); renderRadar(); }
    }
  };
  bar.appendChild(inp); inp.focus();
}

// ===== RADIUS =====
function updateRadius(v) {
  radiusKm = +v;
  document.getElementById('radius-val').textContent = `${v} km`;
  const pct = ((v-1)/19*100).toFixed(1);
  document.getElementById('radius-slider').style.setProperty('--pct', pct + '%');
  renderRadar();
}

// ===== TIME OFFSET =====
function selectChip(el) {
  document.querySelectorAll('#time-chips .chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  timeOffset = +el.dataset.offset;
  renderRadar();
}

// ===== RENDER RADAR =====
function renderRadar() {
  const list = document.getElementById('results-list');
  if (!userLat) {
    list.innerHTML = '<div class="empty-state"><div class="empty-icon">📍</div><div class="empty-text">まず現在地を取得してください</div><div class="loading-dots"><span></span><span></span><span></span></div></div>';
    return;
  }
  const now = new Date();
  const targetHour = now.getHours() + timeOffset;
  const dayIdx = now.getDay();
  const targetDay = DAYS[dayIdx];

  const candidates = RAW.filter(r => {
    if (r[0] !== targetDay) return false;
    const diff = Math.abs(r[1] - targetHour);
    if (diff > 2 && diff < 22) return false;
    const d = distKm(userLat, userLng, r[5], r[6]);
    return d <= radiusKm;
  });

  // aggregate by location
  const map = {};
  candidates.forEach(r => {
    const key = r[2] + r[3];
    if (!map[key]) map[key] = { ward: r[2], name: r[3], count: 0, lat: r[5], lng: r[6] };
    map[key].count += r[4];
  });

  let spots = Object.values(map).sort((a, b) => b.count - a.count).slice(0, 15);

  if (spots.length === 0) {
    list.innerHTML = `<div class="empty-state"><div class="empty-icon">🔍</div><div class="empty-text">${radiusKm}km以内にデータなし<br><small style="font-size:11px;margin-top:4px;display:block">半径を広げるか、時間帯を変えてみてください</small></div></div>`;
    return;
  }

  const maxCount = spots[0].count;
  const rankClasses = ['rank-1','rank-2','rank-3'];
  list.innerHTML = spots.map((s, i) => {
    const d = distKm(userLat, userLng, s.lat, s.lng);
    const rankClass = i < 3 ? rankClasses[i] : 'rank-n';
    const pct = Math.round(s.count / maxCount * 100);
    const mapUrl = `https://maps.google.com/?q=${s.lat},${s.lng}`;
    return `
    <a class="result-card" href="${mapUrl}" target="_blank">
      <div class="rank-circle ${rankClass}">${i+1}</div>
      <div class="card-body">
        <div class="card-name">${s.ward} ${s.name}</div>
        <div class="card-meta">
          <span class="tag tag-dist">📍 ${d.toFixed(1)}km</span>
          <span class="tag tag-count">🏆 ${s.count}件</span>
        </div>
        <div class="card-bar-wrap"><div class="card-bar" style="width:${pct}%"></div></div>
      </div>
      <div class="card-map-arrow">›</div>
    </a>`;
  }).join('');
}

// ===== HOTSPOT =====
function selectDayChip(el) {
  document.querySelectorAll('#day-chips .chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  const d = el.dataset.day;
  selectedDay = d === '今日' ? DAYS[new Date().getDay()] : d;
  renderHotspots();
}

function renderHotspots() {
  const day = selectedDay || DAYS[new Date().getDay()];
  const filtered = RAW.filter(r => r[0] === day);
  const agg = {};
  filtered.forEach(r => {
    const k = r[2];
    if (!agg[k]) agg[k] = { ward: r[2], total: 0, spots: {} };
    agg[k].total += r[4];
    const sk = r[3];
    agg[k].spots[sk] = (agg[k].spots[sk] || 0) + r[4];
  });
  const areas = Object.values(agg).sort((a, b) => b.total - a.total).slice(0, 8);
  const colors = ['#4f9cf9','#a78bfa','#34d399','#fbbf24','#f87171','#22d3ee','#fb923c','#e879f9'];
  const list = document.getElementById('hotspot-list');
  list.innerHTML = areas.map((a, i) => {
    const topSpots = Object.entries(a.spots).sort((x,y) => y[1]-x[1]).slice(0,5).map(([n,c]) => `<span class="spot-pill">${n} <span style="color:var(--green)">${c}</span></span>`).join('');
    return `<div class="cluster-card">
      <div class="cluster-header">
        <div class="cluster-dot" style="background:${colors[i]}"></div>
        <div class="cluster-name">${a.ward}</div>
        <div class="cluster-count">計${a.total}件</div>
      </div>
      <div class="cluster-spots">${topSpots}</div>
    </div>`;
  }).join('');
}

// ===== HISTORY =====
function renderHistory() {
  const agg = {};
  RAW.forEach(r => {
    const k = r[2] + r[3];
    if (!agg[k]) agg[k] = { ward: r[2], name: r[3], count: 0, hours: [] };
    agg[k].count += r[4];
    if (!agg[k].hours.includes(r[1])) agg[k].hours.push(r[1]);
  });
  const spots = Object.values(agg).sort((a,b) => b.count-a.count).slice(0,30);
  const list = document.getElementById('hist-list');
  list.innerHTML = spots.map((s,i) => {
    const hrs = s.hours.sort((a,b)=>a-b);
    const hr = hrs[0] >= 24 ? `翌${hrs[0]-24}時〜` : `${hrs[0]}時〜`;
    return `<div class="hist-row">
      <div class="hist-time">#${i+1}</div>
      <div class="hist-name">${s.ward} ${s.name}</div>
      <div class="hist-cnt">${s.count}件</div>
    </div>`;
  }).join('');
}

// ===== PAGE NAV =====
function switchPage(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  document.getElementById('nav-' + name).classList.add('active');
  if (name === 'hot') renderHotspots();
  if (name === 'hist') renderHistory();
}

// ===== INIT =====
document.getElementById('radius-slider').style.setProperty('--pct', '22%');
selectedDay = DAYS[new Date().getDay()];
getLocation();
</script>
