<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d1117">
<title>TAXI RADAR</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{
  --bg:#0d1117;--s:#161b22;--s2:#1c1c26;--bd:#30363d;
  --g:#39d353;--gd:#1a4a2a;--am:#f0a500;--bl:#58a6ff;--re:#f85149;
  --tx:#e6edf3;--mu:#8b949e;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:'Noto Sans JP',sans-serif;overflow:hidden}

/* HEADER */
#hdr{
  position:fixed;top:0;left:0;right:0;z-index:900;
  background:rgba(13,17,23,.96);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--bd);
  padding-top:env(safe-area-inset-top,0);
}
.hi{display:flex;align-items:center;gap:10px;padding:10px 14px}
.logo{font-size:17px;font-weight:900;letter-spacing:.04em;flex-shrink:0}
.logo span{color:var(--am)}
.hs{flex:1;min-width:0}
.st{font-size:11px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ck{font-size:15px;font-weight:700;color:var(--g);background:var(--gd);
  border:1px solid rgba(57,211,83,.3);border-radius:8px;padding:4px 10px;
  flex-shrink:0;text-align:center;font-variant-numeric:tabular-nums}
.cd{font-size:10px;color:rgba(57,211,83,.6);margin-top:1px}

/* MAP */
#map{position:fixed;top:0;left:0;right:0;bottom:360px;z-index:0}
.leaflet-control-attribution{display:none}
.leaflet-control-zoom a{background:var(--s)!important;color:var(--tx)!important;border-color:var(--bd)!important}

/* PANEL */
#panel{
  position:fixed;bottom:0;left:0;right:0;height:360px;
  background:var(--s);border-top:1px solid var(--bd);
  border-radius:16px 16px 0 0;z-index:500;
  display:flex;flex-direction:column;
  padding-bottom:env(safe-area-inset-bottom,0);
}
.ph{width:36px;height:4px;background:var(--bd);border-radius:2px;margin:9px auto 0;flex-shrink:0;cursor:pointer}

/* TABS */
.tabs{display:flex;border-bottom:1px solid var(--bd);flex-shrink:0;margin-top:6px}
.tb{flex:1;padding:7px 4px;font-size:12px;font-family:'Noto Sans JP',sans-serif;font-weight:700;
  color:var(--mu);background:none;border:none;border-bottom:2px solid transparent;cursor:pointer}
.tb.on{color:var(--g);border-bottom-color:var(--g)}

/* LOCATION ROW */
.locrow{
  display:flex;align-items:center;gap:8px;padding:8px 12px;
  flex-shrink:0;border-bottom:1px solid var(--bd);
}
.locname{flex:1;font-size:13px;color:var(--tx);font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.locbtn{
  padding:6px 12px;border-radius:8px;border:none;font-family:'Noto Sans JP',sans-serif;
  font-size:12px;font-weight:700;cursor:pointer;flex-shrink:0;transition:opacity .12s;white-space:nowrap
}
.locbtn:active{opacity:.7}
.btn-gps{background:var(--g);color:#000}
.btn-map{background:var(--s2);color:var(--bl);border:1px solid var(--bd)!important}

/* CONTROLS */
.cr{display:flex;align-items:center;gap:8px;padding:6px 12px;flex-shrink:0}
.cl{font-size:11px;color:var(--mu);white-space:nowrap}
.cv{font-family:monospace;font-size:13px;color:var(--am);flex-shrink:0;min-width:36px;text-align:right}
input[type=range]{flex:1;height:3px;-webkit-appearance:none;outline:none;border-radius:2px;
  background:linear-gradient(to right,var(--g) 0%,var(--g) var(--p,14%),var(--bd) var(--p,14%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;
  border-radius:50%;background:var(--g);box-shadow:0 0 0 3px rgba(57,211,83,.2);cursor:pointer}

/* CHIPS */
.chips{display:flex;gap:5px;overflow-x:auto;padding:0 12px 4px;flex-shrink:0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:5px 12px;border-radius:20px;font-size:11px;font-weight:700;
  font-family:'Noto Sans JP',sans-serif;border:1px solid var(--bd);background:var(--bg);
  color:var(--mu);cursor:pointer;flex-shrink:0;transition:all .1s}
.chip.on{background:var(--g);color:#000;border-color:var(--g)}

/* LIST */
.ls{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 12px 8px}
.row{display:flex;align-items:center;gap:10px;padding:9px 10px;margin-bottom:6px;
  background:var(--bg);border:1px solid var(--bd);border-radius:10px;cursor:pointer;
  transition:border-color .1s,transform .1s}
.row:active{transform:scale(.98);border-color:var(--g)}
.rk{font-family:monospace;font-size:13px;font-weight:700;width:20px;text-align:center;flex-shrink:0}
.r1{color:var(--am)}.r2{color:#94a3b8}.r3{color:#cd7f32}
.rb{flex:1;min-width:0}
.rn{font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rt{display:flex;gap:6px;margin-top:3px}
.tg{font-size:10px;padding:1px 7px;border-radius:20px;font-weight:700}
.td{background:rgba(88,166,255,.12);color:var(--bl)}
.tc{background:rgba(57,211,83,.12);color:var(--g)}
.bar{height:2px;background:var(--bd);border-radius:1px;margin-top:5px}
.barf{height:2px;border-radius:1px;background:linear-gradient(to right,var(--g),var(--am));transition:width .5s}
.ra{color:var(--mu);font-size:16px;flex-shrink:0}

.em{padding:24px 12px;text-align:center;color:var(--mu)}
.ei{font-size:36px;margin-bottom:8px}
.et{font-size:13px;line-height:1.7}

/* AREA CARDS */
.ac{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin-bottom:6px}
.ah{display:flex;align-items:center;gap:7px;margin-bottom:7px}
.adot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.an{font-size:13px;font-weight:700}
.acnt{font-size:11px;color:var(--mu);margin-left:auto;font-family:monospace}
.ap{display:flex;flex-wrap:wrap;gap:4px}
.pill{font-size:10px;padding:3px 8px;border-radius:20px;background:rgba(255,255,255,.05);color:var(--tx);border:1px solid var(--bd)}

/* MY MARKER */
.ml{width:14px;height:14px;border-radius:50%;background:var(--bl);border:2px solid #fff;box-shadow:0 0 0 4px rgba(88,166,255,.3)}

/* GPS STATUS MSG */
#gps-msg{
  display:none;
  position:fixed;top:70px;left:12px;right:12px;z-index:1000;
  background:var(--s);border:1px solid var(--am);border-radius:10px;
  padding:10px 14px;font-size:12px;color:var(--am);line-height:1.6;
  box-shadow:0 4px 16px rgba(0,0,0,.5);
}
#gps-msg.show{display:block}
#gps-msg button{margin-top:6px;padding:4px 10px;background:var(--am);color:#000;border:none;
  border-radius:6px;font-family:'Noto Sans JP',sans-serif;font-size:11px;font-weight:700;cursor:pointer}
</style>
</head>
<body>

<div id="hdr">
  <div class="hi">
    <div class="logo">🚖 TAXI<span>▸</span>RADAR</div>
    <div class="hs"><div class="st" id="st">📍 現在地を設定してください</div></div>
    <div class="ck"><div id="ck">--:--</div><div class="cd" id="cd">---</div></div>
  </div>
</div>

<!-- GPS エラーメッセージ -->
<div id="gps-msg">
  <div id="gps-msg-text"></div>
  <button onclick="closeGpsMsg()">閉じる</button>
</div>

<div id="map"></div>

<div id="panel">
  <div class="ph" id="ph"></div>
  <div class="tabs">
    <button class="tb on" onclick="swTab('r')">🎯 近くのスポット</button>
    <button class="tb" onclick="swTab('h')">🔥 エリア別</button>
  </div>

  <!-- RADAR TAB -->
  <div id="tr">
    <div class="locrow">
      <span style="font-size:18px">📍</span>
      <div class="locname" id="locname">未設定 — ボタンで現在地を取得</div>
      <button class="locbtn btn-gps" id="gpsbtn" onclick="tryGPS()">GPS取得</button>
      <button class="locbtn btn-map" onclick="startMapTap()">地図で指定</button>
    </div>
    <div class="cr">
      <span class="cl">検索半径</span>
      <input type="range" id="rs" min="1" max="30" value="5" oninput="setR(this.value)" style="--p:14%">
      <span class="cv" id="rv">5km</span>
    </div>
    <div class="chips" id="tc">
      <div class="chip on" data-o="0" onclick="setOff(this)">今すぐ</div>
      <div class="chip" data-o="1" onclick="setOff(this)">+1h</div>
      <div class="chip" data-o="2" onclick="setOff(this)">+2h</div>
      <div class="chip" data-o="3" onclick="setOff(this)">+3h</div>
      <div class="chip" data-o="-1" onclick="setOff(this)">-1h</div>
      <div class="chip" data-o="-2" onclick="setOff(this)">-2h</div>
    </div>
    <div class="ls" id="rl">
      <div class="em">
        <div class="ei">📍</div>
        <div class="et">「GPS取得」ボタンを押すか<br>「地図で指定」で現在地を設定してください</div>
      </div>
    </div>
  </div>

  <!-- HOT TAB -->
  <div id="th" style="display:none">
    <div class="chips" style="padding-top:8px" id="dc">
      <div class="chip on" data-d="今日" onclick="setDay(this)">今日</div>
      <div class="chip" data-d="月" onclick="setDay(this)">月</div>
      <div class="chip" data-d="火" onclick="setDay(this)">火</div>
      <div class="chip" data-d="水" onclick="setDay(this)">水</div>
      <div class="chip" data-d="木" onclick="setDay(this)">木</div>
      <div class="chip" data-d="金" onclick="setDay(this)">金</div>
      <div class="chip" data-d="土" onclick="setDay(this)">土</div>
      <div class="chip" data-d="日" onclick="setDay(this)">日</div>
    </div>
    <div class="ls" id="hl"></div>
  </div>
</div>

// ── CLOCK ──
function tick(){
  const n=new Date();
  document.getElementById('ck').textContent=`${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}`;
  document.getElementById('cd').textContent=DAYS[n.getDay()]+'曜';
}
setInterval(tick,1000);tick();

// ── MAP ──
window.addEventListener('load',()=>{
  const hh=document.getElementById('hdr').offsetHeight;
  document.getElementById('map').style.top=hh+'px';
  map=L.map('map',{zoomControl:true,attributionControl:false,tap:true}).setView([35.6762,139.6503],12);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{maxZoom:19,subdomains:'abcd'}).addTo(map);
  hDay=DAYS[new Date().getDay()];
});

function km(a,b,c,d){
  const R=6371,dL=(c-a)*Math.PI/180,dG=(d-b)*Math.PI/180;
  const x=Math.sin(dL/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dG/2)**2;
  return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

// ── GPS ── ユーザー操作から直接呼ぶ（オーバーレイなし）──
function tryGPS(){
  if(!navigator.geolocation){
    showMsg('このブラウザはGPSに対応していません。「地図で指定」をお使いください。');return;
  }
  const btn=document.getElementById('gpsbtn');
  btn.textContent='取得中…';btn.disabled=true;
  document.getElementById('st').textContent='GPS取得中...';

  navigator.geolocation.getCurrentPosition(
    pos=>{
      uLat=pos.coords.latitude; uLng=pos.coords.longitude;
      placeMe(); btn.textContent='GPS取得'; btn.disabled=false;
      document.getElementById('locname').textContent=`${uLat.toFixed(5)}, ${uLng.toFixed(5)}`;
      document.getElementById('st').textContent='現在地を取得しました';
      renderRadar();
      // 住所逆引き
      fetch(`https://nominatim.openstreetmap.org/reverse?lat=${uLat}&lon=${uLng}&format=json&accept-language=ja`)
        .then(r=>r.json()).then(d=>{
          const a=d.address;
          const n=(a.city_district||a.suburb||a.neighbourhood||a.city||'')+(a.quarter||'');
          if(n){document.getElementById('locname').textContent=n;document.getElementById('st').textContent=n+'付近';}
        }).catch(()=>{});
    },
    err=>{
      btn.textContent='GPS取得'; btn.disabled=false;
      let msg='GPS取得に失敗しました。';
      if(err.code===1) msg='📵 位置情報の使用が拒否されています。\n\niPhoneの場合：設定 → Safari（またはChrome）→ 位置情報 → 「このAppの使用中」に変更してください。';
      else if(err.code===3) msg='⏱ GPS取得がタイムアウトしました。\n\n屋外など電波の良い場所でお試しください。もしくは「地図で指定」ボタンで現在地を手動設定できます。';
      showMsg(msg);
      document.getElementById('st').textContent='GPS失敗 — 地図で指定してください';
    },
    {enableHighAccuracy:true,timeout:15000,maximumAge:0}
  );
}

function showMsg(txt){
  const el=document.getElementById('gps-msg');
  document.getElementById('gps-msg-text').textContent=txt;
  el.classList.add('show');
}
function closeGpsMsg(){document.getElementById('gps-msg').classList.remove('show');}

// ── 地図タップで指定 ──
let tapMode=false;
function startMapTap(){
  tapMode=true;
  showMsg('地図上の現在地をタップしてください。タップした地点が現在地として設定されます。');
  map.once('click',e=>{
    tapMode=false; closeGpsMsg();
    uLat=e.latlng.lat; uLng=e.latlng.lng;
    placeMe();
    document.getElementById('locname').textContent=`${uLat.toFixed(5)}, ${uLng.toFixed(5)}`;
    document.getElementById('st').textContent='地図でセット済み';
    renderRadar();
  });
}

function placeMe(){
  if(myM) myM.remove();
  const ic=L.divIcon({html:'<div class="ml"></div>',className:'',iconSize:[14,14],iconAnchor:[7,7]});
  myM=L.marker([uLat,uLng],{icon:ic,zIndexOffset:1000}).addTo(map);
  map.setView([uLat,uLng],14,{animate:true});
}

// ── RADIUS ──
function setR(v){
  radius=+v;
  document.getElementById('rv').textContent=v+'km';
  const p=((v-1)/29*100).toFixed(1);
  document.getElementById('rs').style.setProperty('--p',p+'%');
  renderRadar();
}

function setOff(el){
  document.querySelectorAll('#tc .chip').forEach(c=>c.classList.remove('on'));
  el.classList.add('on'); off=+el.dataset.o; renderRadar();
}

// ── RENDER ──
function renderRadar(){
  pins.forEach(m=>m.remove()); pins=[];
  const list=document.getElementById('rl');
  if(!uLat){
    list.innerHTML='<div class="em"><div class="ei">📍</div><div class="et">「GPS取得」または「地図で指定」で現在地を設定してください</div></div>';
    return;
  }
  const now=new Date(), tgt=now.getHours()+off, day=DAYS[now.getDay()];
  const agg={};
  D.filter(r=>{
    if(r[0]!==day) return false;
    const d=Math.abs(r[1]-tgt); if(d>2&&d<22) return false;
    return km(uLat,uLng,r[5],r[6])<=radius;
  }).forEach(r=>{
    const k=r[2]+r[3];
    if(!agg[k]) agg[k]={w:r[2],n:r[3],c:0,lat:r[5],lng:r[6]};
    agg[k].c+=r[4];
  });
  const spots=Object.values(agg).sort((a,b)=>b.c-a.c).slice(0,20);
  if(!spots.length){
    list.innerHTML=`<div class="em"><div class="ei">🔍</div><div class="et">${radius}km以内にデータなし<br>半径を広げてみてください</div></div>`;
    return;
  }
  const mx=spots[0].c;
  spots.forEach((s,i)=>{
    const sz=Math.round(26+Math.min(s.c/mx,1)*16);
    const ic=L.divIcon({html:`<div style="width:${sz}px;height:${sz}px;border-radius:50% 50% 50% 0;background:${PC[Math.min(i,7)]};border:2px solid rgba(0,0,0,.5);transform:rotate(-45deg);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.5)"><span style="transform:rotate(45deg);font-size:${Math.round(sz*.38)}px;font-weight:700;color:#000;font-family:monospace">${i+1}</span></div>`,className:'',iconSize:[sz,sz],iconAnchor:[sz/2,sz]});
    const m=L.marker([s.lat,s.lng],{icon:ic}).addTo(map);
    m.bindPopup(`<b>${s.w} ${s.n}</b><br>過去 ${s.c} 件`);
    m.on('click',()=>{const r=document.getElementById('sr'+i);if(r)r.scrollIntoView({behavior:'smooth',block:'nearest'});});
    pins.push(m);
  });
  const bds=L.latLngBounds([[uLat,uLng],...spots.slice(0,10).map(s=>[s.lat,s.lng])]);
  map.fitBounds(bds,{padding:[20,20],maxZoom:15});
  const rc=['r1','r2','r3'];
  list.innerHTML=spots.map((s,i)=>{
    const d=km(uLat,uLng,s.lat,s.lng);
    return `<div class="row" id="sr${i}" onclick="focusPin(${i},${s.lat},${s.lng})">
      <div class="rk ${i<3?rc[i]:''}">${i+1}</div>
      <div class="rb">
        <div class="rn">${s.w} ${s.n}</div>
        <div class="rt"><span class="tg td">📍${d.toFixed(1)}km</span><span class="tg tc">🏆${s.c}件</span></div>
        <div class="bar"><div class="barf" style="width:${Math.round(s.c/mx*100)}%"></div></div>
      </div><div class="ra">›</div></div>`;
  }).join('');
}

function focusPin(i,lat,lng){
  map.setView([lat,lng],16,{animate:true});
  pins[i]&&pins[i].openPopup();
}

// ── HOT ──
function setDay(el){
  document.querySelectorAll('#dc .chip').forEach(c=>c.classList.remove('on'));
  el.classList.add('on');
  const v=el.dataset.d; hDay=v==='今日'?DAYS[new Date().getDay()]:v; renderHot();
}
function renderHot(){
  const day=hDay||DAYS[new Date().getDay()];
  const agg={};
  D.filter(r=>r[0]===day).forEach(r=>{
    if(!agg[r[2]]) agg[r[2]]={t:0,s:{}};
    agg[r[2]].t+=r[4]; agg[r[2]].s[r[3]]=(agg[r[2]].s[r[3]]||0)+r[4];
  });
  const areas=Object.entries(agg).sort((a,b)=>b[1].t-a[1].t).slice(0,8);
  document.getElementById('hl').innerHTML=areas.map(([w,d],i)=>{
    const tops=Object.entries(d.s).sort((a,b)=>b[1]-a[1]).slice(0,5)
      .map(([n,c])=>`<span class="pill">${n} <b style="color:var(--g)">${c}</b></span>`).join('');
    return `<div class="ac"><div class="ah"><div class="adot" style="background:${PC[i]}"></div><div class="an">${w}</div><div class="acnt">計${d.t}件</div></div><div class="ap">${tops}</div></div>`;
  }).join('');
}

// ── TABS ──
function swTab(t){
  document.querySelectorAll('.tb').forEach((b,i)=>b.classList.toggle('on',(i===0&&t==='r')||(i===1&&t==='h')));
  document.getElementById('tr').style.display=t==='r'?'':'none';
  document.getElementById('th').style.display=t==='h'?'':'none';
  if(t==='h') renderHot();
}

// ── PANEL EXPAND ──
let exp=false;
document.getElementById('ph').addEventListener('click',()=>{
  exp=!exp;
  const h=exp?'75vh':'360px';
  document.getElementById('panel').style.height=h;
  document.getElementById('map').style.bottom=h;
  setTimeout(()=>map&&map.invalidateSize(),300);
});
</script>
