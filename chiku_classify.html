<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>地名別 繁華/住宅 分類</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#090912;color:#e2e8f0;font-family:'Hiragino Sans',sans-serif;padding-bottom:48px}
#hdr{background:linear-gradient(135deg,#3a2a0a,#402010);border-bottom:1px solid #fb923c55;padding:18px 16px 14px}
.sub{font-size:10px;color:#fb923c;letter-spacing:3px;text-transform:uppercase;margin-bottom:2px}
h1{font-size:18px;font-weight:800}
.dscr{font-size:11px;color:#475569;margin-top:3px}
#msgbox{margin:20px 16px;padding:14px;background:#161626;border:2px solid #60a5fa;border-radius:12px;font-size:13px;line-height:1.9;word-break:break-all;min-height:60px}
@keyframes sp{to{transform:rotate(360deg)}}
.spin{display:inline-block;animation:sp 1s linear infinite}
.rbtn{display:block;width:calc(100% - 32px);margin:0 16px 16px;padding:13px;background:#1a2035;border:1px solid #f87171;border-radius:12px;color:#f87171;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.tabs{display:flex;gap:5px;padding:0 14px 12px;overflow-x:auto;scrollbar-width:none;margin-top:14px}
.tab{padding:8px 16px;border-radius:20px;border:none;background:#151e30;color:#fff;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;font-family:inherit;flex-shrink:0;opacity:.6}
.tab.on{opacity:1}
.panel{padding:0 14px;display:none}
.panel.on{display:block}
.card{background:#161626;border:1px solid #1e2d40;border-radius:12px;padding:14px;margin-bottom:12px}
.card-ttl{font-size:12px;font-weight:700;margin-bottom:10px}
.note{font-size:11px;color:#94a3b8;line-height:1.7}
.row{display:flex;align-items:center;gap:10px;padding:9px 6px;border-bottom:1px solid #0d1220}
.row:last-child{border:none}
.rname{flex:1;min-width:0}
.rname .nm{font-size:12px;font-weight:600;color:#e2e8f0}
.rname .meta{font-size:9px;color:#64748b;margin-top:2px}
.hot{color:#facc15;font-weight:700}
.toggle{flex-shrink:0;width:88px;height:30px;border-radius:8px;border:1px solid #1e2d40;background:#0d1220;display:flex;cursor:pointer;overflow:hidden;font-size:10px;font-weight:700}
.toggle div{flex:1;display:flex;align-items:center;justify-content:center;transition:all .12s}
.toggle .jt{color:#475569}
.toggle .hk{color:#475569}
.toggle.is-hanka .hk{background:#f87171;color:#fff}
.toggle.is-jutaku .jt{background:#4ade80;color:#062012}
#savebar{position:fixed;bottom:0;left:0;right:0;background:#0d1220;border-top:1px solid #1e2d40;padding:10px 16px;font-size:11px;color:#64748b;text-align:center;z-index:50}
.mism{background:#facc1510}
.editbox{background:#0d1220;border:1px solid #1e2d40;border-radius:8px;padding:10px;font-size:12px;color:#cbd5e1;line-height:1.9;word-break:break-all}
.btn-sm{background:#1a2035;border:1px solid #60a5fa44;border-radius:8px;padding:7px 12px;color:#60a5fa;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;margin-right:6px;margin-top:8px}
</style>
</head>
<body>
<div id="hdr">
  <div class="sub">Chiku Classify (Editable + Saved)</div>
  <h1>🏙️ 地名別 繁華/住宅 分類</h1>
  <div class="dscr">タップで切替・自動保存</div>
</div>
<div id="msgbox"><span class="spin">⏳</span> データ取得中...</div>
<button class="rbtn" id="rbtn" onclick="run()" style="display:none">🔄 再試行</button>
<div id="dashboard" style="display:none">
  <div class="tabs" id="tabs"></div>
  <div id="panels"></div>
</div>
<div id="savebar" style="display:none">💾 変更はこの端末に自動保存されます</div>

<script>
var U1='https://docs.google.com/spreadsheets/d/e/2PACX-1vT2iLNU2ehDRMl7CQt2ETLkVwIeIRMAEpNsFjImdrWDBGuiTWLiwXc9aTtnhbJzWl0uvN0kEPw9Bd-0/pub?gid=0&single=true&output=csv';
var U2='https://docs.google.com/spreadsheets/d/e/2PACX-1vTm1IwbqhN5odntM8GhM4xHZwR3h1a4WKeWpt-4eLDczrGTTAVz8Bl49SI_c0jGEVrp0t_8iRMTN77A/pub?gid=0&single=true&output=csv';

var WARDS=['港区','渋谷区','世田谷区','新宿区','品川区','杉並区','大田区','中央区','千代田区','目黒区','中野区','練馬区'];

/* デフォルト繁華街（地名の部分一致）。保存データが無い初回のみ適用 */
var DEFAULT_HANKA={
  '港区':['六本木','赤坂','西麻布','麻布十番','新橋','虎ノ門','浜松町','芝','三田','白金','南青山','北青山','元赤坂','台場','お台場'],
  '渋谷区':['道玄坂','宇田川','渋谷','神南','桜丘','円山','松濤','神泉','恵比寿','恵比寿南','恵比寿西','代官山','猿楽','神宮前','千駄ヶ谷'],
  '世田谷区':['三軒茶屋','太子堂','下北沢','三宿','池尻','北沢'],
  '新宿区':['歌舞伎町','新宿','西新宿','歌舞伎','大久保','百人町','四谷','荒木町','神楽坂'],
  '品川区':['北品川','東品川','大崎','五反田','西五反田','東五反田','上大崎'],
  '杉並区':['阿佐谷','高円寺','荻窪','西荻'],
  '大田区':['蒲田','大森','羽田','西蒲田'],
  '中央区':['銀座','築地','日本橋','京橋','八重洲','月島','勝どき','晴海'],
  '千代田区':['丸の内','大手町','有楽町','神田','秋葉原','永田町','霞が関','内幸町','飯田橋','九段'],
  '目黒区':['中目黒','上目黒','自由が丘','目黒','下目黒'],
  '中野区':['中野','新井','東中野'],
  '練馬区':['練馬','石神井','大泉','江古田']
};

/* 保存される分類: { '世田谷区|三軒茶屋一丁目': 'hanka', ... } 地名フルネーム単位 */
var CLASSIFY={};
var STORAGE_KEY='chiku-classify-v2';

function csvArr(text){
  var lines=text.trim().split(/\r?\n/).filter(function(l){return l.trim();});
  function sp(line){var c=[],cur='',q=false;for(var i=0;i<line.length;i++){var ch=line[i];if(ch==='"'){q=!q;}else if(ch===','&&!q){c.push(cur.trim());cur='';}else{cur+=ch;}}c.push(cur.trim());return c;}
  return lines.map(sp);
}
function toN(v){return parseInt(String(v||'').replace(/[^\d]/g,''))||0;}
function es(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function normDate(s){s=String(s||'').trim();var m=s.match(/(\d{1,2})年(\d{1,2})月(\d{1,2})日/);if(m)return '20'+('0'+m[1]).slice(-2)+'-'+('0'+m[2]).slice(-2)+'-'+('0'+m[3]).slice(-2);m=s.match(/(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/);if(m)return m[1]+'-'+('0'+m[2]).slice(-2)+'-'+('0'+m[3]).slice(-2);m=s.match(/(\d{2})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/);if(m)return '20'+m[1]+'-'+('0'+m[2]).slice(-2)+'-'+('0'+m[3]).slice(-2);return s;}
function hourOf(t){var m=String(t||'').match(/^(\d{1,2}):/);return m?+m[1]:null;}

function key(ward,name){return ward+'|'+name;}
function defIsHanka(ward,name){var list=DEFAULT_HANKA[ward]||[];for(var i=0;i<list.length;i++)if(name.indexOf(list[i])>=0)return true;return false;}

var G={};

function loadSaved(){
  try{
    var v=localStorage.getItem(STORAGE_KEY);
    if(v){CLASSIFY=JSON.parse(v);return true;}
  }catch(e){}
  return false;
}
function save(){
  try{
    localStorage.setItem(STORAGE_KEY,JSON.stringify(CLASSIFY));
    var sb=document.getElementById('savebar');sb.textContent='✅ 保存しました（この端末のブラウザに記憶）';sb.style.color='#4ade80';
    setTimeout(function(){sb.textContent='💾 変更はこの端末に自動保存されます';sb.style.color='#64748b';},1400);
  }catch(e){
    var sb=document.getElementById('savebar');sb.textContent='⚠️ 保存失敗: '+e;sb.style.color='#f87171';
  }
}

async function run(){
  document.getElementById('msgbox').style.display='';
  document.getElementById('msgbox').innerHTML='<span class="spin">⏳</span> 取得中...';
  document.getElementById('msgbox').style.borderColor='#60a5fa';
  document.getElementById('rbtn').style.display='none';
  document.getElementById('dashboard').style.display='none';
  document.getElementById('savebar').style.display='none';
  try{
    loadSaved();
    var t1=await (await fetch(U1)).text();
    var t2=await (await fetch(U2)).text();
    document.getElementById('msgbox').innerHTML='<span class="spin">⏳</span> 集計中...';
    var a1=csvArr(t1),a2=csvArr(t2),h1=a1[0],h2=a2[0];
    function idx(hs,n){return hs.findIndex(function(c){return c.replace(/：/g,':').trim()===n.replace(/：/g,':');});}
    var i1d=idx(h1,'日付'),i1t=idx(h1,'TAXI');
    var i2t=idx(h2,'乗車時間'),i2ew=idx(h2,'乗車地:市区'),i2en=idx(h2,'乗車地:地名'),i2f=idx(h2,'料金'),i2sk=idx(h2,'サンキュー');

    var preDate={};
    a1.slice(1).forEach(function(r){if(String(r[i1t]||'').toUpperCase().indexOf('PRE')>=0){var d=normDate(r[i1d]);if(d)preDate[d]=1;}});

    var data={};WARDS.forEach(function(w){data[w]={};});
    a2.slice(1).forEach(function(r){
      var sk=String(r[i2sk]||'').trim();
      if(sk==='プレタク'||sk==='プレタクP')return;
      var d=normDate(r[0]);if(preDate[d])return;
      var ward=String(r[i2ew]||'').trim();
      if(WARDS.indexOf(ward)<0)return;
      var name=String(r[i2en]||'').trim();if(!name)return;
      var f=toN(r[i2f]);if(f<=0)return;
      var hh=hourOf(r[i2t]);
      if(!data[ward][name])data[ward][name]={cnt:0,tot:0,early:0,deep:0};
      var o=data[ward][name];o.cnt++;o.tot+=f;
      if(hh!==null&&hh>=16&&hh<=19)o.early++;
      if(hh!==null&&(hh>=23||hh<=2))o.deep++;
    });
    G.data=data;

    /* 保存が無い地名はデフォルトで初期化 */
    WARDS.forEach(function(w){
      Object.keys(data[w]).forEach(function(nm){
        var k=key(w,nm);
        if(CLASSIFY[k]===undefined){
          var oo=data[w][nm];var av2=Math.round(oo.tot/oo.cnt);
          var er=Math.round(oo.early/oo.cnt*100),dr=Math.round(oo.deep/oo.cnt*100);
          var dataHk=(dr>er&&av2>=3200);
          CLASSIFY[k]=(defIsHanka(w,nm)||dataHk)?'hanka':'jutaku';
        }
      });
    });

    var tabsHtml='';var panelsHtml='';
    WARDS.forEach(function(w,i){
      var id='w'+i;
      tabsHtml+='<button class="tab'+(i===0?' on':'')+'" style="background:'+(i===0?'#fb923c':'#a78bfa')+'" onclick="sw(\''+id+'\',this)">'+w+'</button>';
      panelsHtml+='<div class="panel'+(i===0?' on':'')+'" id="p-'+id+'"></div>';
    });
    document.getElementById('tabs').innerHTML=tabsHtml;
    document.getElementById('panels').innerHTML=panelsHtml;
    WARDS.forEach(function(w,i){renderWard(w,'w'+i);});

    document.getElementById('msgbox').style.display='none';
    document.getElementById('dashboard').style.display='';
    document.getElementById('savebar').style.display='';
  }catch(e){
    document.getElementById('msgbox').innerHTML='⚠️ <strong style="color:#f87171">エラー</strong><br>'+String(e&&e.stack||e);
    document.getElementById('msgbox').style.borderColor='#f87171';
    document.getElementById('rbtn').style.display='';
  }
}

function renderWard(ward,pid){
  var d=G.data[ward];
  var arr=Object.entries(d).map(function(e){
    var o=e[1];
    return {name:e[0],cnt:o.cnt,avg:Math.round(o.tot/o.cnt),
      earlyRate:Math.round(o.early/o.cnt*100),deepRate:Math.round(o.deep/o.cnt*100)};
  }).filter(function(x){return x.cnt>=3;}).sort(function(a,b){return b.cnt-a.cnt;});

  var hankaCnt=arr.filter(function(x){return CLASSIFY[key(ward,x.name)]==='hanka';}).length;

  var h='<div class="card" style="border-color:#fb923c44;background:#fb923c08">';
  h+='<div class="card-ttl" style="color:#fb923c">🏙️ '+ward+'（件数順・3件以上）</div>';
  h+='<p class="note">各地名のトグルをタップして<span style="color:#f87171">繁華</span>/<span style="color:#4ade80">住宅</span>を切替。自動保存されます。浅%・深%・単価は判断の参考。</p>';
  h+='<p style="font-size:11px;color:#64748b;margin-top:6px" id="cnt-'+pid+'">繁華'+hankaCnt+' / 住宅'+(arr.length-hankaCnt)+' 地名</p>';
  h+='<button class="btn-sm" onclick="applyDataHint(\''+ward+'\',\''+pid+'\')">📊 データ推奨で一括設定</button>';
  h+='<button class="btn-sm" onclick="resetDefault(\''+ward+'\',\''+pid+'\')" style="border-color:#f8717144;color:#f87171">↩️ 初期リストに戻す</button>';
  h+='</div>';

  h+='<div class="card">';
  arr.forEach(function(x){
    var k=key(ward,x.name);
    var isH=CLASSIFY[k]==='hanka';
    var dataHanka=x.deepRate>x.earlyRate&&x.avg>=3200;
    var mismatch=isH!==dataHanka;
    h+='<div class="row'+(mismatch?' mism':'')+'" id="row-'+pid+'-'+es(x.name)+'">';
    h+='<div class="rname"><div class="nm">'+es(x.name)+(mismatch?' <span style="font-size:9px;color:#facc15">⚠️</span>':'')+'</div>';
    h+='<div class="meta">'+x.cnt+'件 ¥'+x.avg.toLocaleString()+' / <span class="'+(x.earlyRate>=35?'hot':'')+'">浅'+x.earlyRate+'%</span> <span class="'+(x.deepRate>=50?'hot':'')+'">深'+x.deepRate+'%</span></div></div>';
    h+='<div class="toggle '+(isH?'is-hanka':'is-jutaku')+'" onclick="toggle(\''+ward+'\',\''+es(x.name)+'\',\''+pid+'\',this)"><div class="jt">住宅</div><div class="hk">繁華</div></div>';
    h+='</div>';
  });
  h+='</div>';
  h+='<p style="font-size:10px;color:#64748b;padding:0 4px 8px;line-height:1.6">⚠️ = あなたの判定とデータ傾向（深夜多＆高単価=繁華のはず）が食い違う地名。</p>';

  document.getElementById('p-'+pid).innerHTML=h;
}

function toggle(ward,name,pid,el){
  var k=key(ward,name);
  CLASSIFY[k]=CLASSIFY[k]==='hanka'?'jutaku':'hanka';
  el.classList.toggle('is-hanka');
  el.classList.toggle('is-jutaku');
  updateCount(ward,pid);
  save();
}
function updateCount(ward,pid){
  var d=G.data[ward];
  var names=Object.keys(d).filter(function(nm){return d[nm].cnt>=3;});
  var hk=names.filter(function(nm){return CLASSIFY[key(ward,nm)]==='hanka';}).length;
  var el=document.getElementById('cnt-'+pid);
  if(el)el.textContent='繁華'+hk+' / 住宅'+(names.length-hk)+' 地名';
}
function applyDataHint(ward,pid){
  var d=G.data[ward];
  Object.keys(d).forEach(function(nm){
    if(d[nm].cnt<3)return;
    var o=d[nm];var avg=Math.round(o.tot/o.cnt);
    var early=Math.round(o.early/o.cnt*100),deep=Math.round(o.deep/o.cnt*100);
    CLASSIFY[key(ward,nm)]=(deep>early&&avg>=3200)?'hanka':'jutaku';
  });
  renderWard(ward,pid);save();
}
function resetDefault(ward,pid){
  var d=G.data[ward];
  Object.keys(d).forEach(function(nm){CLASSIFY[key(ward,nm)]=defIsHanka(ward,nm)?'hanka':'jutaku';});
  renderWard(ward,pid);save();
}

function sw(id,btn){document.querySelectorAll('.tab').forEach(function(b){b.classList.remove('on');});btn.classList.add('on');document.querySelectorAll('.panel').forEach(function(p){p.classList.remove('on');});document.getElementById('p-'+id).classList.add('on');}
run();
</script>
</body></html>
