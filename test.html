<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>TAXI RADAR - TEST</title>
<style>
body{background:#0d1117;color:#e6edf3;font-family:-apple-system,sans-serif;padding:20px}
button{display:block;width:100%;padding:14px;margin:10px 0;border:none;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer}
.g{background:#39d353;color:#000}
.b{background:#1c2a3a;color:#58a6ff;border:1px solid #30363d}
#log{margin-top:20px;padding:12px;background:#161b22;border-radius:8px;font-size:13px;min-height:60px;white-space:pre-wrap}
</style>
</head>
<body>
<h2>ボタン動作テスト</h2>
<button class="g" id="btn1">GPS取得テスト</button>
<button class="b" id="btn2">手動入力テスト</button>
<button class="b" id="btn3">タブ切替テスト</button>
<div id="log">ここにログが表示されます</div>
<script>
var log = document.getElementById('log');
function addLog(msg) { log.textContent += new Date().toLocaleTimeString() + ' ' + msg + '\n'; }

document.getElementById('btn1').addEventListener('click', function() {
  addLog('GPS取得ボタン: クリックOK');
  if (navigator.geolocation) {
    addLog('geolocation API: 利用可能');
    navigator.geolocation.getCurrentPosition(
      function(p) { addLog('GPS成功: ' + p.coords.latitude + ', ' + p.coords.longitude); },
      function(e) { addLog('GPS失敗 code=' + e.code + ' msg=' + e.message); },
      {timeout:10000}
    );
  } else {
    addLog('geolocation API: 非対応');
  }
});

document.getElementById('btn2').addEventListener('click', function() {
  addLog('手動入力ボタン: クリックOK');
  var v = window.prompt('テスト入力');
  addLog('入力値: ' + v);
});

document.getElementById('btn3').addEventListener('click', function() {
  addLog('タブ切替ボタン: クリックOK');
});

addLog('ページロード完了');
</script>
</body>
</html>
