<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Heat Map for TAXI Driver</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --bg:#0d1117;--surface:#161b22;--surface2:#21262d;--border:#30363d;
  --text:#e6edf3;--muted:#8b949e;--blue:#79c0ff;--green:#3fb950;--orange:#f0883e;--red:#f85149;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);
  font-family:'Helvetica Neue',Arial,'Hiragino Kaku Gothic ProN',Meiryo,sans-serif;
  display:flex;flex-direction:column;height:100vh}

/* ── ヘッダー ── */
#header{background:var(--surface);border-bottom:1px solid var(--border);
  padding:7px 14px;display:flex;align-items:center;gap:8px;flex-shrink:0}
#header h1{font-size:14px;font-weight:800;letter-spacing:.03em}
.hd-sub{font-size:10px;color:var(--muted)}
#now-clock{margin-left:auto;font-size:11px;color:var(--blue);font-weight:600;white-space:nowrap}

/* ── コントロール ── */
#controls{background:var(--surface);border-bottom:1px solid var(--border);
  padding:6px 12px;display:flex;align-items:center;gap:10px;flex-shrink:0;flex-wrap:wrap}
.ctrl-label{font-size:10px;color:var(--muted);white-space:nowrap}
#day-group{display:flex;gap:3px;align-items:center;flex-wrap:wrap}
.day-btn{padding:5px 9px;border-radius:20px;border:1px solid var(--border);
  background:var(--surface2);color:var(--muted);font-size:12px;font-weight:700;
  cursor:pointer;transition:all .15s;-webkit-tap-highlight-color:transparent}
.day-btn:hover,.day-btn:active{border-color:var(--blue);color:var(--blue)}
.day-btn.active{background:var(--blue);color:#0d1117;border-color:var(--blue)}
.day-btn[data-day="7"]{border-color:var(--orange)}
.day-btn[data-day="7"].active{background:var(--orange);color:#0d1117;border-color:var(--orange)}
#time-group{display:flex;align-items:center;gap:7px;flex:1;min-width:200px}
#time-slider{flex:1;-webkit-appearance:none;height:5px;border-radius:3px;
  background:var(--border);outline:none;cursor:pointer}
#time-slider::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;
  border-radius:50%;background:var(--blue);cursor:pointer;border:2px solid var(--bg)}
#time-display{font-size:15px;font-weight:800;color:var(--blue);min-width:48px;text-align:center}
.ctrl-btn{padding:5px 10px;border-radius:6px;border:1px solid var(--border);
  background:var(--surface2);color:var(--muted);font-size:11px;cursor:pointer;
  white-space:nowrap;-webkit-tap-highlight-color:transparent}
.ctrl-btn:hover,.ctrl-btn:active{border-color:var(--blue);color:var(--blue)}
#play-btn.playing{border-color:var(--orange);color:var(--orange)}

/* ── ステータスバー ── */
#statsbar{background:var(--surface);border-bottom:1px solid var(--border);
  padding:4px 12px;display:flex;align-items:center;gap:12px;
  flex-shrink:0;font-size:11px;color:var(--muted);min-height:24px;flex-wrap:wrap}
.sval{color:var(--text);font-weight:700}
#statusmsg{margin-left:auto;font-weight:600;font-size:11px}
#statusmsg.loading{color:var(--blue)}
#statusmsg.error{color:var(--red)}
#statusmsg.ok{color:var(--green)}
#statusmsg.warn{color:var(--orange)}

/* ── 地図 ── */
#map-wrap{flex:1;position:relative;min-height:0}
#map{width:100%;height:100%}
.leaflet-container{background:#111827!important}
.leaflet-tile-pane{filter:brightness(1.65) contrast(0.88) saturate(1.1)}

/* ── 凡例 ── */
#legend{position:absolute;bottom:26px;right:10px;z-index:1000;
  background:rgba(13,17,23,.92);border:1px solid var(--border);
  border-radius:7px;padding:8px 12px;font-size:11px;pointer-events:none}
.leg-title{color:var(--muted);font-size:10px;text-transform:uppercase;
  letter-spacing:.07em;margin-bottom:5px}
.leg-grad{width:130px;height:10px;border-radius:5px;margin-bottom:3px;
  background:linear-gradient(to right,#0066ff,#00ccff,#00ff88,#ffff00,#ff8800,#ff2200)}
.leg-labels{display:flex;justify-content:space-between;font-size:10px;color:var(--muted)}

/* ── フローティングボタン ── */
#fab-wrap{position:absolute;top:10px;right:10px;z-index:1000;
  display:flex;flex-direction:column;gap:6px}
.fab{width:34px;height:34px;border-radius:50%;border:1px solid var(--border);
  background:rgba(22,27,34,.92);cursor:pointer;display:flex;align-items:center;
  justify-content:center;font-size:16px;-webkit-tap-highlight-color:transparent}
.fab:hover,.fab:active{border-color:var(--blue)}
#fab-loc.active{background:var(--blue);color:#0d1117;border-color:var(--blue)}

/* ── Leaflet popup ── */
.leaflet-popup-content-wrapper{
  background:var(--surface);border:1px solid var(--border);
  color:var(--text);border-radius:8px;box-shadow:0 4px 24px rgba(0,0,0,.6)}
.leaflet-popup-tip{background:var(--surface)}
.leaflet-popup-content{font-size:12px;line-height:1.7;margin:10px 14px}
.pop-addr{font-weight:800;font-size:13px;color:var(--blue);margin-bottom:6px}
.pop-row{display:flex;justify-content:space-between;gap:18px;
  border-bottom:1px solid var(--border);padding:2px 0}
.pop-row:last-child{border-bottom:none}
.pop-key{color:var(--muted)}
.pop-val{font-weight:700}
.pop-bar-bg{height:4px;background:var(--border);border-radius:2px;margin-top:6px}
.pop-bar{height:4px;border-radius:2px;transition:width .3s}

/* ── スマホ対応 ── */
@media(max-width:640px){
  #header h1{font-size:13px}
  .hd-sub{display:none}
  #controls{gap:6px;padding:5px 10px}
  .day-btn{padding:5px 7px;font-size:11px}
  #time-group{min-width:100%;order:1}
  #statsbar span:nth-child(n+3){display:none}
  #legend{bottom:20px;right:8px;padding:6px 10px}
  .leg-grad{width:100px}
}
</style>
</head>
<body>

<div id="header">
  <div>
    <h1>🚕 Heat Map for TAXI Driver</h1>
    <div class="hd-sub">武三23区 乗車地分析 — 過去データ集計</div>
  </div>
  <div id="now-clock"></div>
</div>

<div id="controls">
  <div id="day-group">
    <span class="ctrl-label">曜日</span>
    <button class="day-btn" data-day="1">月</button>
    <button class="day-btn" data-day="2">火</button>
    <button class="day-btn" data-day="3">水</button>
    <button class="day-btn" data-day="4">木</button>
    <button class="day-btn" data-day="5">金</button>
    <button class="day-btn" data-day="6">土</button>
    <button class="day-btn" data-day="0">日</button>
    <button class="day-btn" data-day="7">祝前</button>
  </div>
  <div id="time-group">
    <span class="ctrl-label">時間帯</span>
    <input type="range" id="time-slider" min="0" max="40" step="1" value="19">
    <span id="time-display">19時台</span>
    <button class="ctrl-btn" id="now-btn">現在時刻</button>
    <button class="ctrl-btn" id="play-btn">▶ 再生</button>
  </div>
</div>

<div id="statsbar">
  <span>件数: <span class="sval" id="s-count">—</span></span>
  <span>熱量: <span class="sval" id="s-hot">—</span></span>
  <span>最多: <span class="sval" id="s-top">—</span></span>
  <span>総計: <span class="sval" id="s-total">—</span></span>
  <span id="statusmsg" class="loading">⏳ 初期化中...</span>
</div>

<div id="map-wrap">
  <div id="map"></div>
  <div id="fab-wrap">
    <button class="fab" id="fab-reload" title="再読込">🔄</button>
    <button class="fab" id="fab-loc" title="現在地">📍</button>
  </div>
  <div id="legend">
    <div class="leg-title">乗車密度</div>
    <div class="leg-grad"></div>
    <div class="leg-labels"><span>少</span><span>多</span></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

const normDate = s => {
  if(!s) return null; s=s.trim();
  const m=s.match(/^(\d{4})[\-\/](\d{1,2})[\-\/](\d{1,2})/);
  return m?`${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`:null;
};
const parseHour = s => {
  if(!s) return null;
  const m=s.trim().match(/^(\d+):/);
  // 34:11 → 34 のまま返す（シフトは16〜34時で同日扱い）
  return m ? parseInt(m[1]) : null;
};
const buildAddr = (ward,place) => {
  if(!ward||!place) return null;
  ward=ward.trim(); place=place.trim();
  if(!ward||!place||place==='その他') return null;
  const full=ward+place;
  if(coordLookup[full]) return full;
  const kn={'1':'一','2':'二','3':'三','4':'四','5':'五','6':'六','7':'七','8':'八','9':'九','10':'十'};
  const conv=full.replace(/(\d+)丁目/g,(_,n)=>(kn[n]||n)+'丁目');
  return coordLookup[conv]?conv:null;
};
const parseCSV = text => {
  const parse = line => {
    const res=[]; let cur='',inq=false;
    for(const c of line){
      if(c==='"')inq=!inq;
      else if(c===','&&!inq){res.push(cur.trim());cur='';}
      else cur+=c;
    }
    res.push(cur.trim()); return res;
  };
  return text.split(/\r?\n/).filter(l=>l.trim()).map(parse);
};

// 強度→色（青→水色→緑→黄→オレンジ→赤）
const intensityToColor = t => {
  const stops=[
    [0,   [0,80,255]],
    [0.2, [0,180,255]],
    [0.4, [0,220,140]],
    [0.6, [240,220,0]],
    [0.78,[255,120,0]],
    [1.0, [255,20,20]]
  ];
  let i=0;
  while(i<stops.length-2 && stops[i+1][0]<=t) i++;
  const [t0,c0]=stops[i],[t1,c1]=stops[i+1];
  const f=Math.min((t-t0)/(t1-t0),1);
  return `rgb(${Math.round(c0[0]+(c1[0]-c0[0])*f)},${Math.round(c0[1]+(c1[1]-c0[1])*f)},${Math.round(c0[2]+(c1[2]-c0[2])*f)})`;
};

// ================================================================
// Voronoi 構築（ガード点込み・起動時1回）
// ================================================================
function buildVoronoi(){
  // 全点（実データ + ガード点）でDelaunay→Voronoi
  // 経度=x, 緯度=y で計算
  const delaunay = d3.Delaunay.from(
    COORDS_ALL,
    r => r[2],   // lng → x
    r => r[1]    // lat → y
  );
  // バウンディングボックスは実データの範囲+余白
  return delaunay.voronoi([139.30, 35.44, 140.10, 35.86]);
}

// ================================================================
// ポリゴン描画
// ================================================================
function drawPolygons(){
  if(!polygonLayer || !voronoiObj) return;
  polygonLayer.clearLayers();

  const hourData = rideData[selectedDay]?.[selectedHour] || {};
  const entries = Object.entries(hourData);

  // スロット内最大値（相対カラー）
  let slotMax=1;
  entries.forEach(([,c])=>{if(c>slotMax)slotMax=c;});

  // 全インデックスループ（実データのみ描画）
  COORDS_ALL.forEach(([addr,lat,lng],i) => {
    if(addr==='__guard__') return;  // ガード点は描画しない

    const cell = voronoiObj.cellPolygon(i);
    if(!cell || cell.length < 3) return;

    const count = hourData[addr] || 0;

    // セルの最大辺長チェック（肥大セルを除外）
    // 0.04° ≈ 4km を超えるセルはスキップ
    let maxSpan=0;
    for(const [cx,cy] of cell){
      const dx=Math.abs(cx-lng), dy=Math.abs(cy-lat);
      if(dx>maxSpan) maxSpan=dx;
      if(dy>maxSpan) maxSpan=dy;
    }
    if(maxSpan > 0.04) return;

    // [lng,lat] → Leaflet [lat,lng]
    const latlngs = cell.map(([x,y])=>[y,x]);

    if(count===0){
      // 件数ゼロ → ごく薄いグリッド線のみ
      L.polygon(latlngs,{
        fillColor:'#ffffff',fillOpacity:0.025,
        color:'#ffffff',weight:0.4,opacity:0.1,
        interactive:false
      }).addTo(polygonLayer);
      return;
    }

    // 件数あり → 色付き
    const intensity = Math.pow(count/slotMax, 0.5);
    const color = intensityToColor(intensity);
    const fillOpacity = 0.22 + intensity*0.55;

    // 全曜日・終日集計
    const allDay = Object.values(rideData[selectedDay]||{})
      .reduce((s,h)=>s+(h[addr]||0),0);
    const days=['日','月','火','水','木','金','土','祝前'];
    const barW = Math.round(intensity*100);

    L.polygon(latlngs,{
      fillColor:color, fillOpacity,
      color:'#ffffff', weight:0.7, opacity:0.35
    }).on('click', function(e){
      L.DomEvent.stopPropagation(e);
      if(popupRef) map.closePopup(popupRef);
      popupRef = L.popup({maxWidth:240, className:'taxi-popup'})
        .setLatLng(e.latlng)
        .setContent(`
          <div class="pop-addr">${addr}</div>
          <div class="pop-row">
            <span class="pop-key">${days[selectedDay]} ${selectedHour}時台</span>
            <span class="pop-val" style="color:${color}">${count}件</span>
          </div>
          <div class="pop-bar-bg"><div class="pop-bar" style="width:${barW}%;background:${color}"></div></div>
          <div class="pop-row" style="margin-top:4px">
            <span class="pop-key">${days[selectedDay]} 終日合計</span>
            <span class="pop-val">${allDay}件</span>
          </div>
        `)
        .openOn(map);
    }).addTo(polygonLayer);
  });

  updateStats(entries, slotMax);
}

// ================================================================
// 統計更新
// ================================================================
function updateStats(entries, slotMax){
  const total = entries.reduce((s,[,c])=>s+c, 0);
  document.getElementById('s-count').textContent = total>0 ? total+'件' : '0件';

  const hotPct = globalMax>0 ? Math.round(slotMax/globalMax*100) : 0;
  const level = hotPct>=70?'🔴 超ホット':hotPct>=40?'🟠 ホット':
                hotPct>=20?'🟡 普通':hotPct>=5?'🟢 低め':'⚪ 静か';
  document.getElementById('s-hot').textContent = `${level} (${hotPct}%)`;

  if(entries.length>0){
    const top = [...entries].sort((a,b)=>b[1]-a[1])[0];
    document.getElementById('s-top').textContent = `${top[0]}（${top[1]}件）`;
  } else {
    // 近隣の時間帯を探してヒント表示
    const days=['日','月','火','水','木','金','土','祝前'];
    let hint='—';
    const dayData = rideData[selectedDay]||{};
    let bestH=-1, bestC=0;
    for(let h=0;h<=40;h++){
      const c=Object.values(dayData[h]||{}).reduce((s,v)=>s+v,0);
      if(c>bestC){bestC=c;bestH=h;}
    }
    if(bestH>=0) hint=`データなし（${days[selectedDay]}の最多:${bestH}時台 ${bestC}件）`;
    else hint=`${days[selectedDay]}のデータなし`;
    document.getElementById('s-top').textContent = hint;
  }
}

// ================================================================
// データ処理
// ================================================================
const computeGlobalMax = () => {
  globalMax=1;
  for(let d=0;d<=7;d++)
    for(let h=0;h<=40;h++)  // 16〜40時（余裕込み）
      Object.values(rideData[d][h]||{}).forEach(c=>{if(c>globalMax)globalMax=c;});
};

function processCSV(rows){
  resetData();
  let ok=0,skip=0;
  const start=isNaN(Date.parse((rows[0]?.[COL.date]||'').replace(/\//g,'-')))?1:0;
  for(let i=start;i<rows.length;i++){
    const cols=rows[i];
    if(cols.length<7) continue;
    const ds=normDate(cols[COL.date]); if(!ds){skip++;continue;}
    const hour=parseHour(cols[COL.time]); if(hour===null){skip++;continue;}
    const addr=buildAddr(cols[COL.ward],cols[COL.place]); if(!addr){skip++;continue;}
    // 曜日は日付列の日付で判定（34時台も同じ日扱い）
    const date=new Date(ds+'T00:00:00');
    const dow=date.getDay();
    const cat=isHoliday(ds)?0:(isHolidayEve(ds)?7:dow);
    // hour が 34 超の場合も安全に対応（深夜残業など）
    if(!rideData[cat][hour]) rideData[cat][hour]={};
    rideData[cat][hour][addr]=(rideData[cat][hour][addr]||0)+1;
    ok++;
  }
  totalCount=ok;
  computeGlobalMax();
  document.getElementById('s-total').textContent=ok.toLocaleString()+'件';
  return ok;
}

// ================================================================
// 地図・現在地
// ================================================================
function initMap(){
  map = L.map('map',{center:[35.685,139.75],zoom:12,
    zoomControl:true,attributionControl:true});
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{
    attribution:'&copy; <a href="https://www.openstreetmap.org">OSM</a> &copy; <a href="https://carto.com">CARTO</a>',
    subdomains:'abcd',maxZoom:19
  }).addTo(map);
  polygonLayer = L.layerGroup().addTo(map);
  map.on('click',()=>{ if(popupRef)map.closePopup(popupRef); });
}

function startWatchLocation(){
  if(!navigator.geolocation) return;
  document.getElementById('fab-loc').classList.add('active');
  navigator.geolocation.watchPosition(pos=>{
    const {latitude:lat,longitude:lng,accuracy} = pos.coords;
    const ll=[lat,lng];
    if(!locationCircle){
      locationCircle=L.circle(ll,{radius:accuracy,color:'#79c0ff',
        fillColor:'#79c0ff',fillOpacity:0.12,weight:1,opacity:0.4}).addTo(map);
      const icon=L.divIcon({className:'',
        html:`<div style="width:14px;height:14px;border-radius:50%;
          background:#79c0ff;border:3px solid #fff;
          box-shadow:0 0 0 5px rgba(121,192,255,.3),0 2px 8px rgba(0,0,0,.5)"></div>`,
        iconSize:[14,14],iconAnchor:[7,7]});
      locationMarker=L.marker(ll,{icon,zIndexOffset:2000})
        .bindTooltip('現在地').addTo(map);
      map.setView(ll,Math.max(map.getZoom(),14));
    }else{
      locationMarker.setLatLng(ll);
      locationCircle.setLatLng(ll).setRadius(accuracy);
    }
  },err=>{
    console.warn('位置情報エラー:',err.message);
    document.getElementById('fab-loc').classList.remove('active');
  },{enableHighAccuracy:true,maximumAge:10000,timeout:15000});
}

// ================================================================
// CSV読み込み
// ================================================================
async function loadData(){
  setStatus('loading','⏳ データ読込中...');
  try{
    const res=await fetch(CSV_URL);
    if(!res.ok) throw new Error('HTTP '+res.status);
    const text=await res.text();
    const rows=parseCSV(text);
    if(rows.length<2) throw new Error('データが空です');
    const n=processCSV(rows);
    setStatus('ok',`✅ ${n.toLocaleString()}件読込済`);
    drawPolygons();
  }catch(e){
    setStatus('error','❌ '+e.message);
    console.error(e);
  }
}
const setStatus = (type,msg) => {
  const el=document.getElementById('statusmsg');
  el.textContent=msg; el.className=type;
};

// ================================================================
// UI
// ================================================================
const updateDayBtns = () =>
  document.querySelectorAll('.day-btn').forEach(b=>
    b.classList.toggle('active',+b.dataset.day===selectedDay));

const updateTime = () => {
  document.getElementById('time-display').textContent=selectedHour+'時台';
  document.getElementById('time-slider').value=selectedHour;
};

const updateClock = () => {
  const n=new Date();
  const days=['日','月','火','水','木','金','土'];
  const ds=localDateStr(n);  // ローカル日付
  let lbl=days[n.getDay()]+'曜日';
  if(isHoliday(ds)) lbl+='（祝日）';
  else if(isHolidayEve(ds)) lbl+='（祝前日）';
  const hh=String(n.getHours()).padStart(2,'0'),mm=String(n.getMinutes()).padStart(2,'0');
  document.getElementById('now-clock').textContent=
    `${n.getFullYear()}/${n.getMonth()+1}/${n.getDate()} ${lbl} ${hh}:${mm}`;
};

const jumpToNow = () => {
  const n = new Date();
  let h = n.getHours();
  // ローカル日付を使用（toISOString はUTCのため日本時間でズレる）
  let ds = localDateStr(n);
  // 0〜10時は前日シフトの続き → 時刻+24・日付を前日に
  if(h <= 10){
    h = h + 24;
    const prev = new Date(n.getFullYear(), n.getMonth(), n.getDate() - 1);
    ds = localDateStr(prev);
  }
  selectedHour = h;
  selectedDay = isHoliday(ds) ? 0
              : isHolidayEve(ds) ? 7
              : new Date(ds + 'T00:00:00').getDay();
  updateDayBtns(); updateTime(); drawPolygons();
};

const togglePlay = () => {
  const btn=document.getElementById('play-btn');
  if(playTimer){
    clearInterval(playTimer); playTimer=null;
    btn.textContent='▶ 再生'; btn.classList.remove('playing');
  }else{
    btn.textContent='⏸ 停止'; btn.classList.add('playing');
    playTimer=setInterval(()=>{
      selectedHour=(selectedHour+1)%24;
      updateTime(); drawPolygons();
    },750);
  }
};

// ================================================================
// イベント & 起動
// ================================================================
document.querySelectorAll('.day-btn').forEach(btn=>
  btn.addEventListener('click',()=>{selectedDay=+btn.dataset.day;updateDayBtns();drawPolygons();}));
document.getElementById('time-slider').addEventListener('input',e=>{
  selectedHour=+e.target.value; updateTime(); drawPolygons();
});
document.getElementById('now-btn').addEventListener('click',jumpToNow);
document.getElementById('play-btn').addEventListener('click',togglePlay);
document.getElementById('fab-reload').addEventListener('click',loadData);
document.getElementById('fab-loc').addEventListener('click',()=>{
  if(locationMarker) map.setView(locationMarker.getLatLng(),Math.max(map.getZoom(),14));
  else startWatchLocation();
});

document.addEventListener('DOMContentLoaded',()=>{
  initMap();           // 地図初期化（必ず最初）
  jumpToNow();
  updateClock(); setInterval(updateClock,30000);

  setStatus('loading','⏳ エリア境界計算中...');
  setTimeout(()=>{
    voronoiObj = buildVoronoi();
    console.log('Voronoi完了');
    loadData();
    startWatchLocation();
  },150);
});
</script>
