<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>営業ルートトレース</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',sans-serif;background:#060610;color:#e0e2f8;display:flex;height:100vh;overflow:hidden;}

/* ── SIDEBAR ───────────────────────────────── */
#sidebar{width:300px;min-width:300px;background:#0f0f20;border-right:1px solid #222240;display:flex;flex-direction:column;overflow:hidden;z-index:10;}

.s-head{padding:12px 14px 10px;border-bottom:1px solid #222240;flex-shrink:0;}
.s-eye{font-size:9px;letter-spacing:.2em;color:#f5a000;text-transform:uppercase;margin-bottom:6px;}
.date-row{display:flex;gap:6px;align-items:center;}
#date-input{flex:1;background:#1a1a30;border:1px solid #303055;color:#fff;padding:6px 10px;border-radius:6px;font-size:13px;font-family:inherit;outline:none;}
#date-input:focus{border-color:#f5a00077;}
#load-btn{background:#f5a000;color:#000;border:none;padding:6px 15px;border-radius:6px;font-size:11px;font-weight:800;cursor:pointer;font-family:inherit;}
#load-btn:hover{background:#ffbb33;}
.s-dow{font-size:10px;color:#5a5a80;margin-top:5px;}

/* stats */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:#222240;border-bottom:1px solid #222240;flex-shrink:0;}
.stat-cell{background:#0f0f20;padding:10px 14px;}
.stat-lbl{font-size:8px;letter-spacing:.1em;color:#4a4a6a;text-transform:uppercase;margin-bottom:3px;}
.stat-val{font-size:15px;font-weight:800;color:#f5a000;line-height:1;}
.stat-unit{font-size:9px;font-weight:400;color:#6a6a8a;}

/* match status */
#match-status{padding:7px 14px;font-size:10px;color:#5a5a80;border-bottom:1px solid #1a1a30;flex-shrink:0;line-height:1.5;}
#match-status.good{color:#3a8a5a;}
#match-status.bad{color:#8a4a20;}

/* trip list */
#trip-list{flex:1;overflow-y:auto;padding:5px 0;}
#trip-list::-webkit-scrollbar{width:3px;}
#trip-list::-webkit-scrollbar-thumb{background:#252545;border-radius:2px;}
.t-row{display:flex;align-items:flex-start;gap:9px;padding:7px 12px;cursor:pointer;border-left:2px solid transparent;transition:background .1s,border-color .1s;}
.t-row:hover{background:#141428;border-left-color:#f5a00044;}
.t-row.active{background:#181832;border-left-color:#f5a000;}
.t-row.no-map{opacity:.35;cursor:default;}
.t-row.no-map:hover{background:transparent;border-left-color:transparent;}
.t-num{width:22px;height:22px;min-width:22px;background:#f5a000;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:900;color:#000;margin-top:1px;flex-shrink:0;}
.t-row.active .t-num{background:#fff;}
.t-row.no-map .t-num{background:#252540;color:#505068;}
.t-body{flex:1;min-width:0;}
.t-loc{font-size:10.5px;color:#b0b0d0;line-height:1.55;}
.t-from,.t-to{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.t-arr{font-size:9px;color:#f5a00040;}
.t-meta{display:flex;gap:7px;align-items:center;margin-top:3px;}
.t-fare{font-size:11.5px;font-weight:800;color:#f5a000;}
.t-time{font-size:9px;color:#404060;}
.t-sep{height:1px;background:#141428;margin:0 12px;}

/* coord debug */
#coord-hint{padding:6px 14px;font-size:9px;color:#404060;border-top:1px solid #1a1a30;flex-shrink:0;line-height:1.6;}

/* ── MAP ───────────────────────────────────── */
#map-wrap{flex:1;position:relative;}
#map{width:100%;height:100%;background:#060610;}
#loading{position:absolute;inset:0;background:#060610;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:1000;}
.spin{width:28px;height:28px;border:2px solid #222240;border-top-color:#f5a000;border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.ld-txt{font-size:11px;color:#3a3a5a;letter-spacing:.1em;}
#ld-sub{font-size:9px;color:#252540;margin-top:4px;}
#legend{position:absolute;bottom:20px;right:10px;background:rgba(6,6,20,.93);border:1px solid #222240;border-radius:8px;padding:9px 13px;z-index:500;font-size:10px;color:#5a5a80;backdrop-filter:blur(6px);display:none;}
.lg-row{display:flex;align-items:center;gap:7px;margin-bottom:5px;}
.lg-row:last-child{margin-bottom:0;}
.lg-c{width:17px;height:17px;background:#f5a000;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:900;color:#000;flex-shrink:0;}
.lg-d{width:8px;height:8px;background:#888;border-radius:50%;flex-shrink:0;margin:0 4.5px;}
.lg-l{width:20px;height:2px;background:#f5a000;opacity:.55;flex-shrink:0;}
.leaflet-tooltip{background:#0c0c20 !important;border:1px solid #f5a00055 !important;color:#d0d0f0 !important;font-size:10px !important;font-family:'Hiragino Kaku Gothic ProN',sans-serif !important;padding:4px 9px !important;border-radius:5px !important;box-shadow:0 3px 10px rgba(0,0,0,.6) !important;}
.leaflet-tooltip::before{display:none !important;}
.leaflet-control-zoom a{background:#0f0f20 !important;color:#606080 !important;border-color:#222240 !important;}
.leaflet-control-zoom a:hover{background:#181832 !important;color:#f5a000 !important;}
</style>
</head>
<body>
<div id="sidebar">
  <div class="s-head">
    <div class="s-eye">Route Trace · 武三23区</div>
    <div class="date-row">
      <input type="date" id="date-input" value="2026-03-19">
      <button id="load-btn" onclick="startLoad()">表示</button>
    </div>
    <div class="s-dow" id="s-dow">2026年3月19日（木）</div>
  </div>

  <div class="stats-grid">
    <div class="stat-cell"><div class="stat-lbl">営収</div><div class="stat-val" id="st-fare">—</div></div>
    <div class="stat-cell"><div class="stat-lbl">件数</div><div class="stat-val" id="st-cnt">—</div></div>
    <div class="stat-cell"><div class="stat-lbl">¥5,000+</div><div class="stat-val" id="st-long">—</div></div>
    <div class="stat-cell"><div class="stat-lbl">平均単価</div><div class="stat-val" id="st-avg">—</div></div>
  </div>

  <div id="match-status">読み込み中...</div>
  <div id="trip-list"></div>
  <div id="coord-hint"></div>
</div>

<div id="map-wrap">
  <div id="map"></div>
  <div id="loading">
    <div class="spin"></div>
    <div class="ld-txt">データを読み込み中...</div>
    <div id="ld-sub">初期化中</div>
  </div>
  <div id="legend">
    <div class="lg-row"><div class="lg-c">1</div>乗車地点（番号順）</div>
    <div class="lg-row"><div class="lg-d"></div>降車地点</div>
    <div class="lg-row"><div class="lg-l"></div>ルート（直線）</div>
  </div>
</div>

<script>
// ─── URLs ────────────────────────────────────────
const URL_BD = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTm1IwbqhN5odntM8GhM4xHZwR3h1a4WKeWpt-4eLDczrGTTAVz8Bl49SI_c0jGEVrp0t_8iRMTN77A/pub?gid=0&single=true&output=csv';
const URL_CO = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSpOj4QzyarqZtTDM5bld8QDEIzRodRLUwAfF8u42CbgTuGPoKqWrOKtw2Ddrhm0OnONlVnzwc8c1BX/pub?gid=1210114672&single=true&output=csv';

// ─── Hardcoded column names (matching actual CSV) ────
// Full-width colon variants handled by normCol()
const COL = {
  pWard : '乗車地：市区',   // or 乗車地:市区
  pTown : '乗車地：地名',   // or 乗車地:地名
  dWard : '降車地：市区',
  dTown : '降車地：地名',
  fare  : '料金',
  time  : '乗車時間',
};

// ─── State ───────────────────────────────────────
let leafMap, coordMap = new Map(), csvCache = null, dayRowsCache = null;
let tripLayers = [], activeN = null;
let coordSample = [];  // first 3 coord keys for debugging

// ─── Map init ────────────────────────────────────
leafMap = L.map('map', {center:[35.68,139.71], zoom:12});
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
  {attribution:'© OpenStreetMap © CARTO', subdomains:'abcd', maxZoom:19}).addTo(leafMap);

function setSub(s){ document.getElementById('ld-sub').textContent = s; }
function showLoad(){ document.getElementById('loading').style.display = 'flex'; document.getElementById('legend').style.display = 'none'; }
function hideLoad(){ document.getElementById('loading').style.display = 'none'; document.getElementById('legend').style.display = 'block'; }

// ─── Normalize address string ────────────────────
function na(s){
  if(!s) return '';
  return String(s)
    .trim()
    .replace(/[\s　\t\r\n]+/g, '')
    .replace(/：/g,':').replace(/（/g,'(').replace(/）/g,')')
    .replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0)-0xFEE0))
    .replace(/一丁目/g,'1丁目').replace(/二丁目/g,'2丁目').replace(/三丁目/g,'3丁目')
    .replace(/四丁目/g,'4丁目').replace(/五丁目/g,'5丁目').replace(/六丁目/g,'6丁目')
    .replace(/七丁目/g,'7丁目').replace(/八丁目/g,'8丁目').replace(/九丁目/g,'9丁目');
}

// Strip prefecture prefix: 東京都 神奈川県 etc.
function stripPref(s){ return s.replace(/^[\u4e00-\u9fa5]{2,3}[都道府県]/, ''); }
// Strip ward/city prefix: 渋谷区 三鷹市 etc.
function stripWard(s){ return s.replace(/^[\u4e00-\u9fa5]+[区市]/, ''); }
// Strip その他
function stripSono(s){ return String(s||'').replace(/^その他/, ''); }

// ─── Build coordinate map ────────────────────────
function buildCoordMap(rows){
  if(!rows.length) return new Map();
  const keys = Object.keys(rows[0]);

  // Detect lat/lng columns
  const latCol = keys.find(k => /緯度|lat/i.test(k)) || keys[keys.length-2];
  const lngCol = keys.find(k => /経度|lng|lon/i.test(k)) || keys[keys.length-1];
  const nameCols = keys.filter(k => k !== latCol && k !== lngCol);

  const m = new Map();
  coordSample = [];

  rows.forEach(row => {
    const full = nameCols.map(c => String(row[c]||'').trim()).join('');
    const lat  = parseFloat(row[latCol]);
    const lng  = parseFloat(row[lngCol]);
    if(!full || isNaN(lat) || isNaN(lng)) return;

    const base = na(full);
    const v = {lat, lng};

    // Register all variants so matching works regardless of prefix
    const variants = new Set([
      base,
      stripPref(base),                      // remove 東京都 etc.
      stripWard(base),                      // remove 渋谷区 etc.
      stripWard(stripPref(base)),           // remove both
    ]);
    variants.forEach(k => { if(k) m.set(k, v); });

    if(coordSample.length < 3) coordSample.push(base);
  });

  return m;
}

// ─── Coordinate lookup ───────────────────────────
function getCoords(loc, cmap){
  if(!loc || !loc.trim()) return null;

  // Build candidate strings to try
  const raw  = na(loc);
  const sono = na(stripSono(loc));

  const tries = [raw, sono, stripPref(raw), stripWard(raw), stripWard(sono),
                 stripPref(sono), stripWard(stripPref(raw))];

  for(const t of tries){
    if(!t) continue;
    if(cmap.has(t)) return cmap.get(t);
    // Longest prefix/suffix match
    let best = null, bl = 0;
    for(const [k,v] of cmap){
      if(t.startsWith(k) && k.length > bl){ best = v; bl = k.length; }
    }
    if(best) return best;
  }
  return null;
}

// ─── Resolve column name (full-width/half-width colon) ─
function resolveCol(keys, wanted){
  // exact
  if(keys.includes(wanted)) return wanted;
  // normalize colon
  const nw = wanted.replace(/：/g,':').replace(/:/g,'：');
  // try both colon styles
  const alts = [wanted.replace(/：/g,':'), wanted.replace(/:/g,'：')];
  for(const a of alts){
    const f = keys.find(k => k === a);
    if(f) return f;
  }
  // contains match
  const base = wanted.replace(/[：:]/g,'');
  const f2 = keys.find(k => k.replace(/[：:]/g,'') === base);
  if(f2) return f2;
  return null;
}

// ─── Date match (year-aware + Reiwa + fallback) ──
function matchDate(row, y, m, d){
  const s = Object.values(row).map(v=>String(v||'')).join(' ');
  const m2 = String(m).padStart(2,'0'), d2 = String(d).padStart(2,'0');
  const ry = y - 2018; // Reiwa year

  const pats = [
    `${y}/${m}/${d}`, `${y}/${m2}/${d2}`,
    `${y}-${m2}-${d2}`, `${y}年${m}月${d}日`,
    `R${ry}/${m}/${d}`, `R${ry}.${m}.${d}`, `R${ry}-${m2}-${d2}`,
    `令和${ry}年${m}月${d}日`,
  ];
  if(pats.some(p => s.includes(p))) return true;

  // No year in data → match by month/day only
  if(!/20\d\d|R\d|令和/.test(s)){
    return [`${m}/${d}`, `${m2}/${d2}`, `${m}月${d}`].some(p => s.includes(p));
  }
  return false;
}

// ─── Fetch CSV ───────────────────────────────────
async function fetchCSV(url){
  const r = await fetch(url);
  if(!r.ok) throw new Error('HTTP '+r.status);
  const t = await r.text();
  return Papa.parse(t, {header:true, skipEmptyLines:true, dynamicTyping:false,
    transformHeader: h => h.trim().replace(/^\uFEFF/,'')}).data;
}

// ─── Icons ───────────────────────────────────────
function iconP(n, active){
  const bg = active ? '#fff' : '#f5a000';
  const sh = active ? '0 0 0 2px #f5a000,0 2px 8px rgba(0,0,0,.7)'
                    : '0 0 0 1.5px #000,0 2px 6px rgba(0,0,0,.6)';
  return L.divIcon({
    html:`<div style="width:22px;height:22px;background:${bg};border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:900;color:#000;font-family:sans-serif;box-shadow:${sh};">${n}</div>`,
    className:'', iconSize:[22,22], iconAnchor:[11,11]
  });
}
function iconD(active){
  return L.divIcon({
    html:`<div style="width:9px;height:9px;background:${active?'#f5a000':'#7878b0'};border-radius:50%;border:1.5px solid ${active?'#f5a000':'#222'};box-shadow:0 1px 4px rgba(0,0,0,.5);"></div>`,
    className:'', iconSize:[9,9], iconAnchor:[4,4]
  });
}

function setActive(n){
  if(activeN !== null){
    document.getElementById('tr-'+activeN)?.classList.remove('active');
    const p = tripLayers.find(l=>l.n===activeN);
    if(p){ p.line.setStyle({color:'#f5a000',weight:1.5,opacity:.45}); p.pm.setIcon(iconP(activeN,false)); p.dm.setIcon(iconD(false)); }
  }
  activeN = n;
  const el = document.getElementById('tr-'+n);
  if(el){ el.classList.add('active'); el.scrollIntoView({behavior:'smooth',block:'nearest'}); }
  const c = tripLayers.find(l=>l.n===n);
  if(c){
    c.line.setStyle({color:'#fff',weight:3,opacity:.9}); c.line.bringToFront();
    c.pm.setIcon(iconP(n,true)); c.dm.setIcon(iconD(true));
    leafMap.panTo(c.pm.getLatLng(), {animate:true,duration:.4});
  }
}

function clearMap(){
  tripLayers.forEach(l=>{l.line.remove();l.pm.remove();l.dm.remove();});
  tripLayers=[]; activeN=null;
  document.getElementById('trip-list').innerHTML='';
}

const DOW=['日','月','火','水','木','金','土'];
function dowLabel(s){ const[y,m,d]=s.split('-').map(Number); return`${y}年${m}月${d}日（${DOW[new Date(y,m-1,d).getDay()]}）`; }
function pf(n){ return n ? '¥'+n.toLocaleString() : '—'; }
function sl(s,n=14){ if(!s||s==='') return '—'; return s.length>n ? s.slice(0,n)+'…' : s; }
function pfare(v){ return parseInt(String(v||'').replace(/[^0-9]/g,''))||0; }

// ─── MAIN LOAD ───────────────────────────────────
async function startLoad(){
  clearMap();
  showLoad();

  const dateStr = document.getElementById('date-input').value;
  const [y,m,d] = dateStr.split('-').map(Number);
  document.getElementById('s-dow').textContent = dowLabel(dateStr);

  try{
    // 1. Coords
    if(coordMap.size === 0){
      setSub('座標データを取得中...');
      const cr = await fetchCSV(URL_CO);
      coordMap = buildCoordMap(cr);
      document.getElementById('coord-hint').textContent =
        '座標DB: '+coordMap.size+'キー / サンプル: '+coordSample.slice(0,2).join(', ');
    }

    // 2. Breakdown
    if(!csvCache){
      setSub('日報詳細を取得中...');
      csvCache = await fetchCSV(URL_BD);
    }
    if(!csvCache.length) throw new Error('日報詳細CSVが空');
    const keys = Object.keys(csvCache[0]);

    // Resolve actual column names (handles full/half-width colon)
    const c = {};
    for(const [k,v] of Object.entries(COL)){
      c[k] = resolveCol(keys, v);
    }

    // 3. Filter date
    setSub(y+'/'+m+'/'+d+' を抽出中...');
    const dayRows = csvCache.filter(r => matchDate(r, y, m, d));
    if(!dayRows.length){
      const samp = [...new Set(csvCache.slice(0,30).flatMap(r=>Object.values(r))
        .filter(v=>/\d/.test(String(v))))].slice(0,6);
      throw new Error(`${y}/${m}/${d} のデータなし。値サンプル: ${samp.join(' / ')}`);
    }
    dayRowsCache = dayRows;

    // 4. Build trips
    const trips = dayRows.map((row,i) => {
      const pw = c.pWard ? String(row[c.pWard]||'').trim() : '';
      const pt = c.pTown ? String(row[c.pTown]||'').trim() : '';
      const dw = c.dWard ? String(row[c.dWard]||'').trim() : '';
      const dt = c.dTown ? String(row[c.dTown]||'').trim() : '';
      const pickup  = pw + pt;
      const dropoff = dw + dt;
      const fare  = pfare(c.fare  ? row[c.fare]  : '');
      const time  = c.time  ? String(row[c.time]||'')  : '';
      const pc = getCoords(pickup,  coordMap);
      const dc = getCoords(dropoff, coordMap);
      return {n:i+1, pickup, dropoff, fare, time, pc, dc, ok:!!(pc&&dc)};
    });

    // 5. Stats
    const matched = trips.filter(t=>t.ok).length;
    const tot  = trips.reduce((s,t)=>s+t.fare, 0);
    const long = trips.filter(t=>t.fare>=5000).length;
    const avg  = trips.length ? Math.round(tot/trips.length) : 0;

    document.getElementById('st-fare').innerHTML = '¥'+tot.toLocaleString();
    document.getElementById('st-cnt').innerHTML  = trips.length+'<span class="stat-unit"> 件</span>';
    document.getElementById('st-long').innerHTML = long+'<span class="stat-unit"> 件</span>';
    document.getElementById('st-avg').innerHTML  = '¥'+avg.toLocaleString();

    const ms = document.getElementById('match-status');
    ms.textContent = `地図にプロット: ${matched}/${trips.length}件`;
    ms.className = matched > 0 ? 'good' : 'bad';

    // Show what didn't match (first 3)
    const unm = trips.filter(t=>!t.ok);
    if(unm.length > 0){
      const hint = '未マッチ例: '+unm.slice(0,2).map(t=>`"${t.pickup}"`).join(', ');
      document.getElementById('coord-hint').textContent += ' | '+hint;
    }

    // 6. Trip list
    const list = document.getElementById('trip-list');
    trips.forEach((t,i) => {
      if(i>0){ const sep=document.createElement('div'); sep.className='t-sep'; list.appendChild(sep); }
      const div = document.createElement('div');
      div.className = 't-row'+(t.ok?'':' no-map');
      div.id = 'tr-'+t.n;
      div.innerHTML = `
        <div class="t-num">${t.n}</div>
        <div class="t-body">
          <div class="t-loc">
            <span class="t-from">${sl(t.pickup)}</span>
            <span class="t-arr">↓</span>
            <span class="t-to">${sl(t.dropoff)}</span>
          </div>
          <div class="t-meta">
            <div class="t-fare">${pf(t.fare)}</div>
            ${t.time?`<div class="t-time">${t.time}</div>`:''}
            ${!t.ok?'<div class="t-time">未マッチ</div>':''}
          </div>
        </div>`;
      if(t.ok) div.addEventListener('click', ()=>setActive(t.n));
      list.appendChild(div);
    });

    // 7. Draw map
    const bounds = [];
    trips.filter(t=>t.ok).forEach(t => {
      const line = L.polyline([[t.pc.lat,t.pc.lng],[t.dc.lat,t.dc.lng]],
        {color:'#f5a000', weight:1.5, opacity:.5}).addTo(leafMap);
      const pm = L.marker([t.pc.lat,t.pc.lng], {icon:iconP(t.n,false)})
        .addTo(leafMap).bindTooltip(`#${t.n} 乗：${t.pickup}`,{direction:'top'});
      const dm = L.marker([t.dc.lat,t.dc.lng], {icon:iconD(false)})
        .addTo(leafMap).bindTooltip(`#${t.n} 降：${t.dropoff}`,{direction:'top'});
      [line,pm,dm].forEach(el=>el.on('click',()=>setActive(t.n)));
      tripLayers.push({n:t.n, line, pm, dm});
      bounds.push([t.pc.lat,t.pc.lng],[t.dc.lat,t.dc.lng]);
    });
    if(bounds.length) leafMap.fitBounds(bounds, {padding:[50,50]});

    hideLoad();

  } catch(err){
    document.getElementById('loading').innerHTML=`
      <div style="text-align:center;padding:24px">
        <div style="color:#a03030;font-size:13px;margin-bottom:8px">エラー</div>
        <div style="color:#404060;font-size:11px;max-width:260px;line-height:1.8">${err.message}</div>
      </div>`;
    document.getElementById('match-status').textContent = 'エラー: '+err.message;
    document.getElementById('match-status').className = 'bad';
  }
}

startLoad();
</script>
</body>
</html>
