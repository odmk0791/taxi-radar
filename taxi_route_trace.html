<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>営業ルートトレース</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',sans-serif;background:#080810;color:#d8daf0;display:flex;height:100vh;overflow:hidden;}

#sidebar{width:320px;min-width:320px;background:#0d0d18;border-right:1px solid #1c1c2e;display:flex;flex-direction:column;overflow:hidden;z-index:10;}

/* header */
.s-head{padding:12px 14px 10px;border-bottom:1px solid #1c1c2e;flex-shrink:0;}
.s-eye{font-size:9px;letter-spacing:.2em;color:#f5a000;text-transform:uppercase;margin-bottom:6px;}
.date-row{display:flex;gap:6px;align-items:center;}
#date-input{flex:1;background:#141420;border:1px solid #252538;color:#fff;padding:5px 9px;border-radius:6px;font-size:13px;font-family:inherit;outline:none;}
#date-input:focus{border-color:#f5a00055;}
#load-btn{background:#f5a000;color:#000;border:none;padding:5px 14px;border-radius:6px;font-size:11px;font-weight:800;cursor:pointer;font-family:inherit;white-space:nowrap;}
#load-btn:hover{background:#ffbb33;}
.s-dow{font-size:10px;color:#333352;margin-top:4px;}

/* column picker — always visible */
#col-picker{flex-shrink:0;border-bottom:2px solid #f5a00033;background:#0a0a15;padding:10px 13px;}
.cp-title{font-size:9px;letter-spacing:.15em;color:#f5a000;text-transform:uppercase;margin-bottom:8px;}
.cp-row{display:grid;grid-template-columns:72px 1fr;align-items:center;gap:6px;margin-bottom:5px;}
.cp-row:last-of-type{margin-bottom:8px;}
.cp-lbl{font-size:9.5px;color:#555572;white-space:nowrap;}
.cp-sel{background:#0f0f1e;border:1px solid #1e1e32;color:#9090c0;padding:4px 6px;border-radius:4px;font-size:10px;font-family:inherit;outline:none;width:100%;}
.cp-sel:focus{border-color:#f5a00066;}
.cp-sel option{background:#0f0f1e;}
#cp-apply{width:100%;background:#f5a000;color:#000;border:none;padding:6px;border-radius:5px;font-size:10px;font-weight:800;cursor:pointer;font-family:inherit;}
#cp-apply:hover{background:#ffbb33;}
#cp-status{font-size:9px;margin-top:6px;line-height:1.5;color:#444462;}

/* stats */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:#1c1c2e;border-bottom:1px solid #1c1c2e;flex-shrink:0;}
.stat-cell{background:#0d0d18;padding:9px 13px;}
.stat-lbl{font-size:8px;letter-spacing:.1em;color:#2e2e48;text-transform:uppercase;margin-bottom:2px;}
.stat-val{font-size:14px;font-weight:800;color:#f5a000;line-height:1;}
.stat-unit{font-size:9px;font-weight:400;color:#555;}

/* trip list */
#trip-list{flex:1;overflow-y:auto;padding:4px 0;}
#trip-list::-webkit-scrollbar{width:3px;}
#trip-list::-webkit-scrollbar-thumb{background:#1e1e30;}
.trip-row{display:flex;align-items:flex-start;gap:8px;padding:6px 12px;cursor:pointer;border-left:2px solid transparent;transition:background .1s,border-color .1s;}
.trip-row:hover{background:#10101e;border-left-color:#f5a00033;}
.trip-row.active{background:#13132a;border-left-color:#f5a000;}
.trip-row.no-map{opacity:.3;cursor:default;}
.t-badge{width:21px;height:21px;min-width:21px;background:#f5a000;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:900;color:#000;margin-top:1px;}
.trip-row.active .t-badge{background:#fff;}
.trip-row.no-map .t-badge{background:#1e1e30;color:#444;}
.t-info{flex:1;min-width:0;}
.t-loc{font-size:10px;color:#7878a0;line-height:1.5;}
.t-from,.t-to{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.t-arr{font-size:8px;color:#f5a00033;}
.t-meta{display:flex;gap:6px;align-items:center;margin-top:2px;}
.t-fare{font-size:11px;font-weight:800;color:#f5a000;}
.t-time{font-size:9px;color:#2a2a48;}
.t-tag{font-size:8px;color:#2a2a48;}
.t-div{height:1px;background:#0f0f28;margin:0 12px;}

/* ── MAP ─────────────────────────────────── */
#map-wrap{flex:1;position:relative;}
#map{width:100%;height:100%;background:#080810;}
#loading{position:absolute;inset:0;background:#080810;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:1000;}
.spin{width:28px;height:28px;border:2px solid #1c1c2e;border-top-color:#f5a000;border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.ld-txt{font-size:11px;color:#2e2e4a;letter-spacing:.1em;}
#ld-sub{font-size:9px;color:#1e1e38;margin-top:4px;}
#legend{position:absolute;bottom:20px;right:10px;background:rgba(8,8,20,.92);border:1px solid #1c1c2e;border-radius:8px;padding:9px 12px;z-index:500;font-size:10px;color:#44445a;backdrop-filter:blur(6px);display:none;}
.lg-row{display:flex;align-items:center;gap:7px;margin-bottom:5px;}
.lg-row:last-child{margin-bottom:0;}
.lg-c{width:17px;height:17px;background:#f5a000;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:900;color:#000;flex-shrink:0;}
.lg-d{width:8px;height:8px;background:#777;border-radius:50%;flex-shrink:0;margin:0 4.5px;}
.lg-l{width:20px;height:2px;background:#f5a000;opacity:.5;flex-shrink:0;}
.leaflet-tooltip{background:#0c0c1c !important;border:1px solid #f5a00044 !important;color:#c8cae8 !important;font-size:10px !important;font-family:'Hiragino Kaku Gothic ProN',sans-serif !important;padding:4px 9px !important;border-radius:5px !important;box-shadow:0 3px 10px rgba(0,0,0,.6) !important;}
.leaflet-tooltip::before{display:none !important;}
.leaflet-control-zoom a{background:#0d0d18 !important;color:#555 !important;border-color:#1c1c2e !important;}
.leaflet-control-zoom a:hover{background:#141428 !important;color:#f5a000 !important;}
</style>
</head>
<body>
<div id="sidebar">

  <div class="s-head">
    <div class="s-eye">Route Trace · 武三23区</div>
    <div class="date-row">
      <input type="date" id="date-input" value="2026-03-19">
      <button id="load-btn" onclick="startLoad()">表示</button>
    </div>
    <div class="s-dow" id="s-dow">2026年3月19日（木）</div>
  </div>

  <!-- ★ 列選択パネル（常時表示） -->
  <div id="col-picker">
    <div class="cp-title">列の設定 — CSVが読み込まれたら選択してください</div>
    <div class="cp-row"><span class="cp-lbl">乗車：市区</span><select class="cp-sel" id="sel-pw"><option value="">— 選択 —</option></select></div>
    <div class="cp-row"><span class="cp-lbl">乗車：丁名</span><select class="cp-sel" id="sel-pt"><option value="">— 選択 —</option></select></div>
    <div class="cp-row"><span class="cp-lbl">降車：市区</span><select class="cp-sel" id="sel-dw"><option value="">— 選択 —</option></select></div>
    <div class="cp-row"><span class="cp-lbl">降車：丁名</span><select class="cp-sel" id="sel-dt"><option value="">— 選択 —</option></select></div>
    <div class="cp-row"><span class="cp-lbl">営収</span><select class="cp-sel" id="sel-fare"><option value="">— 選択 —</option></select></div>
    <div class="cp-row"><span class="cp-lbl">時刻（任意）</span><select class="cp-sel" id="sel-time"><option value="">— 選択 —</option></select></div>
    <button id="cp-apply" onclick="renderWithSettings()">この設定で描画</button>
    <div id="cp-status">← まず「表示」を押してCSVを読み込んでください</div>
  </div>

  <div class="stats-grid">
    <div class="stat-cell"><div class="stat-lbl">営収</div><div class="stat-val" id="st-fare">—</div></div>
    <div class="stat-cell"><div class="stat-lbl">件数</div><div class="stat-val" id="st-cnt">—</div></div>
    <div class="stat-cell"><div class="stat-lbl">¥5,000+</div><div class="stat-val" id="st-long">—</div></div>
    <div class="stat-cell"><div class="stat-lbl">平均単価</div><div class="stat-val" id="st-avg">—</div></div>
  </div>

  <div id="trip-list"></div>
</div>

<div id="map-wrap">
  <div id="map"></div>
  <div id="loading">
    <div class="spin"></div>
    <div class="ld-txt">データを読み込み中...</div>
    <div id="ld-sub">初期化中</div>
  </div>
  <div id="legend">
    <div class="lg-row"><div class="lg-c">1</div>乗車地点（番号順）</div>
    <div class="lg-row"><div class="lg-d"></div>降車地点</div>
    <div class="lg-row"><div class="lg-l"></div>ルート（直線）</div>
  </div>
</div>

<script>
const URL_BD='https://docs.google.com/spreadsheets/d/e/2PACX-1vTm1IwbqhN5odntM8GhM4xHZwR3h1a4WKeWpt-4eLDczrGTTAVz8Bl49SI_c0jGEVrp0t_8iRMTN77A/pub?gid=0&single=true&output=csv';
const URL_CO='https://docs.google.com/spreadsheets/d/e/2PACX-1vSpOj4QzyarqZtTDM5bld8QDEIzRodRLUwAfF8u42CbgTuGPoKqWrOKtw2Ddrhm0OnONlVnzwc8c1BX/pub?gid=1210114672&single=true&output=csv';

let leafMap, coordMap=new Map(), csvCache=null, dayRowsCache=null;
let tripLayers=[], activeN=null;

leafMap=L.map('map',{center:[35.68,139.71],zoom:12});
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{attribution:'© OpenStreetMap © CARTO',subdomains:'abcd',maxZoom:19}).addTo(leafMap);

function setSub(s){document.getElementById('ld-sub').textContent=s;}
function showLoad(){document.getElementById('loading').style.display='flex';document.getElementById('legend').style.display='none';}
function hideLoad(){document.getElementById('loading').style.display='none';document.getElementById('legend').style.display='block';}
function setStatus(s,warn=false){const el=document.getElementById('cp-status');el.textContent=s;el.style.color=warn?'#a06020':'#444462';}

// ── normalize address string ──────────────────────
function normAddr(s){
  if(!s)return'';
  return String(s).trim()
    .replace(/[\s　\t]+/g,'')
    .replace(/：/g,':').replace(/（/g,'(').replace(/）/g,')')
    .replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0))
    .replace(/一丁目/g,'1丁目').replace(/二丁目/g,'2丁目').replace(/三丁目/g,'3丁目')
    .replace(/四丁目/g,'4丁目').replace(/五丁目/g,'5丁目').replace(/六丁目/g,'6丁目')
    .replace(/七丁目/g,'7丁目').replace(/八丁目/g,'8丁目').replace(/九丁目/g,'9丁目');
}
// normalize column name for matching (full-width → half-width)
function normCol(k){
  return String(k)
    .replace(/：/g,':').replace(/　/g,' ').replace(/（/g,'(').replace(/）/g,')')
    .trim();
}
function stripSonota(s){return String(s||'').replace(/^その他/,'');}

// ── coord map ──────────────────────────────────────
function buildCoordMap(rows){
  if(!rows.length)return new Map();
  const keys=Object.keys(rows[0]);
  const latCol=keys.find(k=>/緯度|lat/i.test(k))||keys[keys.length-2];
  const lngCol=keys.find(k=>/経度|lng|lon/i.test(k))||keys[keys.length-1];
  const nameCols=keys.filter(k=>k!==latCol&&k!==lngCol);
  const m=new Map();
  rows.forEach(row=>{
    const full=nameCols.map(c=>String(row[c]||'').trim()).join('');
    const lat=parseFloat(row[latCol]),lng=parseFloat(row[lngCol]);
    if(full&&!isNaN(lat)&&!isNaN(lng))m.set(normAddr(full),{lat,lng});
  });
  return m;
}

function getCoords(loc,cmap){
  if(!loc)return null;
  const tries=[normAddr(loc),normAddr(stripSonota(loc))];
  for(const n of tries){
    if(!n)continue;
    if(cmap.has(n))return cmap.get(n);
    let best=null,bl=0;
    for(const[k,v]of cmap){if(n.startsWith(k)&&k.length>bl){best=v;bl=k.length;}}
    if(best)return best;
  }
  return null;
}

// ── date match ─────────────────────────────────────
function matchDate(row,y,m,d){
  const s=Object.values(row).map(v=>String(v||'')).join(' ');
  const ps=[`${y}/${m}/${d}`,`${y}/${String(m).padStart(2,'0')}/${String(d).padStart(2,'0')}`,`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`,`${y}年${m}月${d}日`];
  if(ps.some(p=>s.includes(p)))return true;
  if(!/20\d\d/.test(s))return[`${m}/${d}`,`${m}月${d}`].some(p=>s.includes(p));
  return false;
}

// ── fetch CSV ──────────────────────────────────────
async function fetchCSV(url){
  const r=await fetch(url);
  if(!r.ok)throw new Error('HTTP '+r.status);
  const t=await r.text();
  return Papa.parse(t,{header:true,skipEmptyLines:true,dynamicTyping:false,transformHeader:h=>h.trim().replace(/^\uFEFF/,'')}).data;
}

// ── populate selects ───────────────────────────────
function populateSelects(keys){
  const ids=['sel-pw','sel-pt','sel-dw','sel-dt','sel-fare','sel-time'];
  ids.forEach(id=>{
    const sel=document.getElementById(id);
    while(sel.options.length>1)sel.remove(1);
    keys.forEach(k=>{
      const o=document.createElement('option');
      o.value=k; o.textContent=k;
      sel.appendChild(o);
    });
  });
}

// ── auto-select best column ────────────────────────
// Matches both exact and normalized (full-width colon etc.)
function autoPickCol(keys,candidates){
  for(const c of candidates){
    // exact
    const ex=keys.find(k=>k===c);
    if(ex)return ex;
    // normalized match
    const nc=normCol(c);
    const nm=keys.find(k=>normCol(k)===nc);
    if(nm)return nm;
    // contains (normalized)
    const ct=keys.find(k=>normCol(k).includes(nc)||k.includes(c));
    if(ct)return ct;
  }
  return null;
}

function autoSelectCols(keys){
  const pw=autoPickCol(keys,['乗車地:市区','乗車地：市区','乗車:市区','乗車：市区','乗車市区','乗車区市']);
  const pt=autoPickCol(keys,['乗車地:地名','乗車地：地名','乗車:地名','乗車：地名','乗車地名','乗車丁名','乗車町']);
  const dw=autoPickCol(keys,['降車地:市区','降車地：市区','降車:市区','降車：市区','降車市区','降車区市']);
  const dt=autoPickCol(keys,['降車地:地名','降車地：地名','降車:地名','降車：地名','降車地名','降車丁名','降車町']);
  // fare: 営収 first, avoid 納金
  const fare=keys.find(k=>normCol(k)==='営収')||
    keys.find(k=>normCol(k).includes('営収'))||
    keys.find(k=>(k.includes('売上')||k.includes('運賃'))&&!k.includes('納金'))||
    keys.find(k=>k.includes('金額')&&!k.includes('納金'));
  const time=autoPickCol(keys,['乗車時刻','乗車時','時刻','time']);

  if(pw)document.getElementById('sel-pw').value=pw;
  if(pt)document.getElementById('sel-pt').value=pt;
  if(dw)document.getElementById('sel-dw').value=dw;
  if(dt)document.getElementById('sel-dt').value=dt;
  if(fare)document.getElementById('sel-fare').value=fare;
  if(time)document.getElementById('sel-time').value=time;

  return{pw,pt,dw,dt,fare,time};
}

// ── icons ──────────────────────────────────────────
function iconP(n,active){
  const bg=active?'#fff':'#f5a000';
  const sh=active?'0 0 0 2px #f5a000,0 2px 8px rgba(0,0,0,.7)':'0 0 0 1.5px #000,0 2px 6px rgba(0,0,0,.6)';
  return L.divIcon({html:`<div style="width:22px;height:22px;background:${bg};border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:900;color:#000;font-family:sans-serif;box-shadow:${sh};">${n}</div>`,className:'',iconSize:[22,22],iconAnchor:[11,11]});
}
function iconD(active){
  return L.divIcon({html:`<div style="width:9px;height:9px;background:${active?'#f5a000':'#6868a0'};border-radius:50%;border:1.5px solid ${active?'#f5a000':'#222'};box-shadow:0 1px 4px rgba(0,0,0,.5);"></div>`,className:'',iconSize:[9,9],iconAnchor:[4,4]});
}

function setActive(n){
  if(activeN!==null){
    document.getElementById('tr-'+activeN)?.classList.remove('active');
    const p=tripLayers.find(l=>l.n===activeN);
    if(p){p.line.setStyle({color:'#f5a000',weight:1.5,opacity:.4});p.pm.setIcon(iconP(activeN,false));p.dm.setIcon(iconD(false));}
  }
  activeN=n;
  const el=document.getElementById('tr-'+n);
  if(el){el.classList.add('active');el.scrollIntoView({behavior:'smooth',block:'nearest'});}
  const c=tripLayers.find(l=>l.n===n);
  if(c){c.line.setStyle({color:'#fff',weight:3,opacity:.9});c.line.bringToFront();c.pm.setIcon(iconP(n,true));c.dm.setIcon(iconD(true));leafMap.panTo(c.pm.getLatLng(),{animate:true,duration:.4});}
}

function clearMapLayers(){
  tripLayers.forEach(l=>{l.line.remove();l.pm.remove();l.dm.remove();});
  tripLayers=[];activeN=null;
  document.getElementById('trip-list').innerHTML='';
}

const DOW=['日','月','火','水','木','金','土'];
function dowLabel(s){const[y,m,d]=s.split('-').map(Number);return`${y}年${m}月${d}日（${DOW[new Date(y,m-1,d).getDay()]}）`;}

// ── RENDER ─────────────────────────────────────────
function doRender(rows,pwCol,ptCol,dwCol,dtCol,fareCol,timeCol){
  clearMapLayers();

  const trips=rows.map((row,i)=>{
    const pw=pwCol?String(row[pwCol]||'').trim():'';
    const pt=ptCol?String(row[ptCol]||'').trim():'';
    const dw=dwCol?String(row[dwCol]||'').trim():'';
    const dt=dtCol?String(row[dtCol]||'').trim():'';
    const pickup=pw+pt, dropoff=dw+dt;
    const fare=parseFare(fareCol?row[fareCol]:'');
    const time=timeCol?String(row[timeCol]||''):'';
    const pc=getCoords(pickup,coordMap);
    const dc=getCoords(dropoff,coordMap);
    return{n:i+1,pickup,dropoff,fare,time,pc,dc,ok:!!(pc&&dc)};
  });

  const matched=trips.filter(t=>t.ok).length;
  const unmatch=trips.filter(t=>!t.ok);
  
  // Status message
  if(matched===0){
    setStatus('⚠ 座標が0件マッチ。列設定を確認してください',true);
    // show sample of what we're trying to match
    if(trips.length>0){
      const s=trips[0];
      setStatus(`⚠ マッチ0件。試した住所例: 乗車="${s.pickup}" 降車="${s.dropoff}" — 列設定を直してください`,true);
    }
  } else {
    setStatus(`✓ ${matched}/${trips.length}件マッチ（未マッチ${unmatch.length}件）`);
  }

  // Stats
  const tot=trips.reduce((s,t)=>s+t.fare,0);
  const lng=trips.filter(t=>t.fare>=5000).length;
  const avg=trips.length?Math.round(tot/trips.length):0;
  document.getElementById('st-fare').innerHTML='¥'+tot.toLocaleString();
  document.getElementById('st-cnt').innerHTML=trips.length+'<span class="stat-unit"> 件</span>';
  document.getElementById('st-long').innerHTML=lng+'<span class="stat-unit"> 件</span>';
  document.getElementById('st-avg').innerHTML='¥'+avg.toLocaleString();

  // Trip list
  const list=document.getElementById('trip-list');
  trips.forEach((t,i)=>{
    if(i>0){const d=document.createElement('div');d.className='t-div';list.appendChild(d);}
    const div=document.createElement('div');
    div.className='trip-row'+(t.ok?'':' no-map');
    div.id='tr-'+t.n;
    div.innerHTML=`<div class="t-badge">${t.n}</div><div class="t-info"><div class="t-loc"><span class="t-from">${sl(t.pickup)}</span><span class="t-arr">↓</span><span class="t-to">${sl(t.dropoff)}</span></div><div class="t-meta"><div class="t-fare">${ff(t.fare)}</div>${t.time?`<div class="t-time">${t.time}</div>`:''}${!t.ok?'<div class="t-tag">未マッチ</div>':''}</div></div>`;
    if(t.ok)div.addEventListener('click',()=>setActive(t.n));
    list.appendChild(div);
  });

  // Map
  const bounds=[];
  trips.filter(t=>t.ok).forEach(t=>{
    const line=L.polyline([[t.pc.lat,t.pc.lng],[t.dc.lat,t.dc.lng]],{color:'#f5a000',weight:1.5,opacity:.45}).addTo(leafMap);
    const pm=L.marker([t.pc.lat,t.pc.lng],{icon:iconP(t.n,false)}).addTo(leafMap).bindTooltip('#'+t.n+' 乗：'+t.pickup,{direction:'top'});
    const dm=L.marker([t.dc.lat,t.dc.lng],{icon:iconD(false)}).addTo(leafMap).bindTooltip('#'+t.n+' 降：'+t.dropoff,{direction:'top'});
    [line,pm,dm].forEach(el=>el.on('click',()=>setActive(t.n)));
    tripLayers.push({n:t.n,line,pm,dm});
    bounds.push([t.pc.lat,t.pc.lng],[t.dc.lat,t.dc.lng]);
  });
  if(bounds.length)leafMap.fitBounds(bounds,{padding:[50,50]});
}

function parseFare(v){return parseInt(String(v||'').replace(/[^0-9]/g,''))||0;}
function ff(n){return n?'¥'+n.toLocaleString():'—';}
function sl(s,n=14){if(!s||s==='')return'—';return s.length>n?s.slice(0,n)+'…':s;}

// ── renderWithSettings (from apply button) ─────────
function renderWithSettings(){
  if(!dayRowsCache||!dayRowsCache.length){setStatus('先に「表示」ボタンを押してください',true);return;}
  const pw=document.getElementById('sel-pw').value||null;
  const pt=document.getElementById('sel-pt').value||null;
  const dw=document.getElementById('sel-dw').value||null;
  const dt=document.getElementById('sel-dt').value||null;
  const fare=document.getElementById('sel-fare').value||null;
  const time=document.getElementById('sel-time').value||null;
  doRender(dayRowsCache,pw,pt,dw,dt,fare,time);
  hideLoad();
}

// ── MAIN ───────────────────────────────────────────
async function startLoad(){
  showLoad();
  const dateStr=document.getElementById('date-input').value;
  const[y,m,d]=dateStr.split('-').map(Number);
  document.getElementById('s-dow').textContent=dowLabel(dateStr);

  try{
    // coords
    if(coordMap.size===0){
      setSub('座標データ取得中...');
      const cr=await fetchCSV(URL_CO);
      coordMap=buildCoordMap(cr);
    }

    // breakdown
    if(!csvCache){
      setSub('日報詳細を取得中...');
      csvCache=await fetchCSV(URL_BD);
    }

    if(!csvCache.length)throw new Error('日報詳細CSVが空です');
    const keys=Object.keys(csvCache[0]);

    // populate dropdowns with actual column names
    populateSelects(keys);

    // Show ALL column names in the status area so user can see them
    const colList=keys.map((k,i)=>`[${i}]${k}`).join('  ');
    setStatus('列名: '+colList);

    // auto-select
    const ac=autoSelectCols(keys);

    // filter date
    setSub(y+'/'+m+'/'+d+' を抽出中...');
    const dayRows=csvCache.filter(r=>matchDate(r,y,m,d));

    if(!dayRows.length){
      // show sample dates
      const sd=[...new Set(csvCache.slice(0,40).flatMap(r=>Object.values(r)).filter(v=>/20\d\d/.test(String(v))))].slice(0,5);
      throw new Error(`${y}/${m}/${d}のデータなし。日付サンプル: ${sd.join(', ')}`);
    }

    dayRowsCache=dayRows;

    // render with auto-detected columns
    doRender(dayRows,
      document.getElementById('sel-pw').value||null,
      document.getElementById('sel-pt').value||null,
      document.getElementById('sel-dw').value||null,
      document.getElementById('sel-dt').value||null,
      document.getElementById('sel-fare').value||null,
      document.getElementById('sel-time').value||null
    );
    hideLoad();

  } catch(err){
    document.getElementById('loading').innerHTML=`<div style="text-align:center;padding:24px"><div style="color:#a02020;font-size:13px;margin-bottom:8px">エラー</div><div style="color:#30304a;font-size:11px;max-width:260px;line-height:1.7">${err.message}</div></div>`;
    setStatus('エラー: '+err.message,true);
  }
}

startLoad();
</script>
