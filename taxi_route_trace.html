<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Route Trace for TAXI Driver</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',sans-serif;
  background:#07071a;color:#e4e6ff;height:100vh;overflow:hidden;display:flex;flex-direction:column;}
#view-dates,#view-route{display:none;flex:1;overflow:hidden;}
#view-dates.active,#view-route.active{display:flex;flex-direction:column;}
#init-loading{position:fixed;inset:0;background:#07071a;z-index:9999;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;}
.spin{width:28px;height:28px;border:2.5px solid #28285a;border-top-color:#f5a000;
  border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.ld-txt{font-size:11px;color:#4040a0;letter-spacing:.1em;}

/* ── VIEW 1: 日報一覧 ─────────────────────────────── */
.dl-head{padding:11px 16px 10px;border-bottom:1px solid #28285a;flex-shrink:0;
  display:flex;align-items:center;gap:10px;background:#0d0d22;}
.dl-title{font-size:15px;font-weight:800;color:#fff;flex:1;}
.dl-subtitle{font-size:9px;color:#4848a0;letter-spacing:.15em;text-transform:uppercase;margin-bottom:2px;}
.dl-filters{display:flex;gap:4px;}
.dl-filter{background:#1c1c3a;border:1px solid #383870;color:#8080c0;
  padding:4px 10px;border-radius:20px;font-size:10px;font-weight:600;
  cursor:pointer;font-family:inherit;transition:all .15s;white-space:nowrap;}
.dl-filter.active{background:#f5a000;border-color:#f5a000;color:#000;}
.dl-filter:hover:not(.active){background:#252550;}
.dl-table-wrap{flex:1;overflow-y:auto;}
.dl-table-wrap::-webkit-scrollbar{width:4px;}
.dl-table-wrap::-webkit-scrollbar-thumb{background:#28285a;border-radius:2px;}
table{width:100%;border-collapse:collapse;}
thead th{position:sticky;top:0;background:#0d0d22;padding:8px 14px;
  font-size:9px;letter-spacing:.1em;color:#40406a;text-transform:uppercase;
  text-align:left;border-bottom:1px solid #1e1e40;font-weight:600;}
thead th.r{text-align:right;}
tbody tr{cursor:pointer;border-bottom:1px solid #10102a;transition:background .1s;}
tbody tr:hover{background:#131328;}
tbody tr.high{background:#0e0e26;}
td{padding:9px 14px;font-size:12px;color:#9090c0;}
td.date-cell{color:#d0d2f0;font-weight:600;white-space:nowrap;}
td.dow-cell{color:#505080;font-size:11px;}
td.fare-cell{text-align:right;font-size:13px;font-variant-numeric:tabular-nums;}
tbody tr.high td.fare-cell{color:#f5a000;font-weight:800;}
td.cnt-cell,td.avg-cell{text-align:right;}
.badge-high{background:#f5a00022;color:#f5a000;font-size:8px;font-weight:700;
  padding:1px 5px;border-radius:3px;margin-left:5px;border:1px solid #f5a00044;}
.empty{text-align:center;color:#404060;padding:32px;font-size:12px;}

/* ── VIEW 2: ルートマップ ─────────────────────────── */
#view-route{flex-direction:row !important;}
#sidebar{width:300px;min-width:300px;background:#0f0f28;border-right:1px solid #28285a;
  display:flex;flex-direction:column;overflow:hidden;}
.s-back{padding:7px 13px;border-bottom:1px solid #1e1e40;display:flex;align-items:center;
  gap:7px;cursor:pointer;transition:background .1s;flex-shrink:0;}
.s-back:hover{background:#14142e;}
.s-back span:first-child{color:#f5a000;font-size:13px;}
.s-back span:last-child{font-size:10px;color:#505080;}
.s-head{padding:9px 13px 8px;border-bottom:1px solid #28285a;flex-shrink:0;}
.s-eye{font-size:9px;letter-spacing:.15em;color:#f5a000;text-transform:uppercase;margin-bottom:3px;}
.s-date{font-size:16px;font-weight:800;color:#fff;line-height:1.1;}
.s-dow{font-size:10px;color:#505080;margin-top:2px;}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;
  background:#28285a;border-bottom:1px solid #28285a;flex-shrink:0;}
.stat-cell{background:#0f0f28;padding:9px 13px;}
.stat-lbl{font-size:8px;letter-spacing:.08em;color:#404060;text-transform:uppercase;margin-bottom:2px;}
.stat-val{font-size:14px;font-weight:800;color:#f5a000;line-height:1;}
.stat-unit{font-size:9px;font-weight:400;color:#707090;}
.legend-bar{display:flex;gap:4px;padding:5px 12px;border-bottom:1px solid #1a1a38;flex-shrink:0;}
.leg-btn{display:flex;align-items:center;gap:4px;font-size:9px;color:#505078;
  cursor:pointer;padding:3px 7px;border-radius:12px;border:1px solid #1e1e40;background:#0d0d22;}
.leg-btn.active{color:#c0c2e0;border-color:#303058;}
.leg-line{width:16px;height:2px;background:#f5a000;flex-shrink:0;}
.leg-dash{width:16px;height:0;border-top:2px dashed #00ccee;flex-shrink:0;}
#trip-list{flex:1;overflow-y:auto;padding:4px 0;}
#trip-list::-webkit-scrollbar{width:3px;}
#trip-list::-webkit-scrollbar-thumb{background:#28285a;border-radius:2px;}
.t-row{display:flex;align-items:flex-start;gap:8px;padding:6px 12px;cursor:pointer;
  border-left:2px solid transparent;transition:background .1s,border-color .1s;}
.t-row:hover{background:#141630;border-left-color:#f5a00033;}
.t-row.active{background:#1a1a40;border-left-color:#f5a000;}
.t-row.no-map{opacity:.32;cursor:default;}
.t-row.no-map:hover{background:transparent;border-left-color:transparent;}
.t-row.partial{opacity:.75;} /* 乗車地のみ：やや薄いが操作可能 */
.t-row.partial .t-num{background:#aa6600;}
.t-num{width:22px;height:22px;min-width:22px;background:#f5a000;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:9px;font-weight:900;color:#000;margin-top:1px;flex-shrink:0;}
.t-row.active .t-num{background:#fff;}
.t-row.no-map .t-num{background:#222240;color:#404060;}
.t-body{flex:1;min-width:0;}
.t-loc{font-size:10px;color:#a8aacc;line-height:1.5;}
.t-from,.t-to{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.t-arr{font-size:8px;color:#f5a00030;}
.t-meta{display:flex;gap:4px;align-items:center;margin-top:3px;flex-wrap:wrap;}
.t-fare{font-size:11px;font-weight:800;color:#f5a000;margin-right:2px;}
.t-time{font-size:9px;color:#3a3a58;margin-right:2px;}
.badge{font-size:7.5px;font-weight:700;padding:1px 5px;border-radius:3px;white-space:nowrap;}
.badge-go{background:#162050;color:#5588ee;border:1px solid #2244aa;}
.badge-app{background:#102820;color:#44bb88;border:1px solid #1a5530;}
.badge-thx{background:#2e1e00;color:#f5a000;border:1px solid #553300;}
.badge-other{background:#1e1230;color:#8866cc;border:1px solid #332255;}
/* 乗車条件バッジ */
.badge-pre-ride{background:#1e1040;color:#aa88ff;border:1px solid #6644bb;}
.badge-prep-ride{background:#003030;color:#44ddcc;border:1px solid #00aaaa;}
/* 休憩行（トリップリスト内） */
.t-row-brk{
  display:flex;align-items:center;gap:8px;
  padding:5px 12px;background:#071a10;
  border-left:2px solid #33cc6688;
}
.brk-icon{
  width:22px;height:22px;min-width:22px;
  background:#1a3a22;border:1.5px solid #33cc66;
  border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:9px;color:#33cc66;
}
.brk-body{flex:1;min-width:0;}
.brk-time{font-size:10px;color:#33cc66;font-weight:700;}
.brk-sub{font-size:9px;color:#2a5a38;margin-top:1px;}

/* 空転（メーター空転・迎車キャンセル） */
.t-row-ktn{
  display:flex;align-items:center;gap:8px;
  padding:5px 12px;background:#2a1010;
  border-left:2px solid #ee445588;
}
.ktn-icon{
  width:22px;height:22px;min-width:22px;
  background:#3a1a1a;border:1.5px solid #ee4455;
  border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:9px;color:#ee4455;
}
.ktn-body{flex:1;min-width:0;}
.ktn-time{font-size:10px;color:#ee4455;font-weight:700;}
.ktn-sub{font-size:9px;color:#7a3030;margin-top:1px;}
.t-sep{height:1px;background:#0e0e28;margin:0 12px;}
#status-bar{flex-shrink:0;padding:5px 12px;font-size:9px;color:#404060;
  border-top:1px solid #181838;line-height:1.5;word-break:break-all;}
#status-bar.ok{color:#3a9060;}
#status-bar.ng{color:#903030;}
#map-wrap{flex:1;position:relative;}
#map{width:100%;height:100%;background:#07071a;}
#map-loading{position:absolute;inset:0;background:#07071a;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:12px;z-index:1000;}
.leaflet-tooltip{background:#0c0c28 !important;border:1px solid #f5a00055 !important;
  color:#d0d2f8 !important;font-size:10px !important;
  font-family:'Hiragino Kaku Gothic ProN',sans-serif !important;
  padding:4px 9px !important;border-radius:5px !important;}
.leaflet-tooltip::before{display:none !important;}
.leaflet-control-zoom a{background:#0f0f28 !important;color:#606090 !important;border-color:#28285a !important;}
.leaflet-control-zoom a:hover{background:#1c1c48 !important;color:#f5a000 !important;}

/* ── DOW FILTER BAR ───────────────────────────────── */
.dl-dow-bar{
  display:flex;align-items:center;gap:4px;flex-wrap:wrap;
  padding:6px 14px 7px;border-bottom:1px solid #1e1e40;
  background:#0a0a1e;flex-shrink:0;
}
.dl-dow-lbl{font-size:9px;color:#40406a;letter-spacing:.1em;margin-right:2px;}
.dl-dow{
  background:#1c1c3a;border:1px solid #2a2a50;color:#5050a0;
  padding:4px 9px;border-radius:16px;font-size:11px;font-weight:700;
  cursor:pointer;font-family:inherit;transition:all .15s;
}
.dl-dow.active{background:#f5a000;border-color:#f5a000;color:#000;}
.dl-dow:hover:not(.active){background:#252548;color:#8080c0;}
.dl-dow-all{
  background:transparent;border:1px solid #2a2a50;color:#40406a;
  padding:4px 9px;border-radius:16px;font-size:10px;
  cursor:pointer;font-family:inherit;margin-left:2px;
}
.dl-dow-all:hover{color:#6060a0;border-color:#383870;}
/* 土=青、日=赤 */
.dl-dow[data-dow="土"].active{background:#5577ee;border-color:#5577ee;color:#fff;}
.dl-dow[data-dow="日"].active{background:#ee5555;border-color:#ee5555;color:#fff;}

/* ── ACCOUNT FILTER BAR ───────────────────────────── */
.dl-acct-bar{
  display:flex;align-items:center;gap:5px;flex-wrap:wrap;
  padding:5px 14px 8px;border-bottom:2px solid #1e1e40;
  background:#090918;flex-shrink:0;
}
.dl-acct{
  background:#1c1c3a;border:1px solid #2a2a50;color:#5050a0;
  padding:4px 12px;border-radius:16px;font-size:11px;font-weight:700;
  cursor:pointer;font-family:inherit;transition:all .15s;
}
.dl-acct.active{background:#f5a000;border-color:#f5a000;color:#000;}
.dl-acct:hover:not(.active){background:#252548;color:#8080c0;}
/* JPN=紫系, PRE=金系, 通常=グレー */
#acct-jpn.active{background:#8855ee;border-color:#8855ee;color:#fff;}
#acct-pre.active{background:#ddaa00;border-color:#ddaa00;color:#000;}
#acct-reg.active{background:#445566;border-color:#445566;color:#ccc;}
/* 一覧テーブルの車種バッジ */
.acct-badge{
  display:inline-block;font-size:8px;font-weight:700;
  padding:1px 5px;border-radius:3px;margin-left:5px;vertical-align:middle;
}
.acct-jpn{background:#8855ee22;color:#aa88ff;border:1px solid #8855ee44;}
.acct-pre{background:#ddaa0022;color:#f5c842;border:1px solid #ddaa0044;}
.acct-reg{background:#44556622;color:#8899aa;border:1px solid #44556644;}

/* ── MOBILE FLOAT BUTTON ──────────────────────────── */
#mob-toggle{
  display:none;position:absolute;bottom:24px;left:50%;
  transform:translateX(-50%);z-index:800;
  background:rgba(15,15,40,.92);border:1px solid #f5a00066;
  color:#f5a000;font-family:inherit;font-size:12px;font-weight:700;
  padding:9px 22px;border-radius:24px;cursor:pointer;
  backdrop-filter:blur(8px);white-space:nowrap;
  box-shadow:0 3px 16px rgba(0,0,0,.5);
}

/* ── MOBILE: portrait ≤ 767px ─────────────────────── */
@media (max-width:767px){
  /* dates list */
  .dl-head{padding:8px 10px 7px;flex-wrap:wrap;gap:6px;}
  .dl-title{font-size:13px;}
  .dl-filters{flex-wrap:wrap;gap:3px;}
  .dl-filter{font-size:9px;padding:3px 9px;}
  td,thead th{padding:7px 10px;font-size:11px;}

  /* route view */
  #view-route{flex-direction:column !important;}

  #sidebar{
    width:100% !important;min-width:100% !important;
    border-right:none;border-top:1px solid #28285a;
    position:fixed;bottom:0;left:0;right:0;
    /* iPhone13 の画面高さ基準で一覧エリア確保 */
    height:56vh;z-index:700;
    transform:translateY(100%);
    transition:transform .3s cubic-bezier(.4,0,.2,1);
  }
  /* ── 3状態 ── */
  /* 全開 */
  #sidebar.mob-open{transform:translateY(0);}
  /* 縮小（handle + stats だけ見える ≈ 88px） */
  #sidebar.mob-peek{transform:translateY(calc(100% - 88px));}

  #map-wrap{position:fixed;inset:0;z-index:100;}
  #mob-toggle{display:block;}

  /* ── ハンドルバー ── */
  #mob-handle{
    display:flex;flex-direction:column;align-items:center;
    padding:8px 0 5px;cursor:pointer;flex-shrink:0;
    background:#0f0f28;user-select:none;
  }
  .mob-bar{
    width:38px;height:4px;background:#38387a;
    border-radius:2px;margin-bottom:4px;
  }
  #mob-handle-label{
    font-size:9px;color:#5050a0;letter-spacing:.08em;
  }
  /* mob-peek時: ハンドルを「▲ 開く」表示に */
  #sidebar.mob-peek #mob-handle-label::before{content:'▲ 一覧を開く';}
  #sidebar.mob-peek #mob-handle-label{display:none;}/* labelを差し替え */
  #sidebar.mob-open  #mob-handle-label{display:block;}

  /* compact header */
  .s-back span:last-child{font-size:9px;}
  .s-head{padding:7px 13px 6px;}
  .s-date{font-size:14px;}
  .s-dow{font-size:9px;}

  /* stats: 4 columns 1 row (peek時も全部見える) */
  .stats-grid{grid-template-columns:repeat(4,1fr);}
  .stat-cell{padding:6px 8px;}
  .stat-val{font-size:12px;}
  .stat-lbl{font-size:7px;}

  #trip-list{flex:1;-webkit-overflow-scrolling:touch;}
  .legend-bar{padding:4px 12px;}

  /* larger touch */
  .t-row{padding:8px 12px;}
  .t-num{width:24px;height:24px;font-size:10px;}
  .t-loc{font-size:11px;}
  .t-fare{font-size:12px;}
}

/* ── MOBILE: landscape (height≤500) ──────────────── */
@media (max-height:500px) and (orientation:landscape){
  #mob-handle{display:none;}
  #sidebar{width:230px !important;min-width:230px !important;}
  .stats-grid{grid-template-columns:repeat(4,1fr);}
  .stat-cell{padding:6px 8px;}
  .stat-val{font-size:11px;}
  .s-date{font-size:13px;}
}


</style>
</head>
<body>
<div id="init-loading">
  <div class="spin"></div>
  <div class="ld-txt">データを読み込み中...</div>
  <div id="init-sub" style="font-size:9px;color:#30305a;margin-top:2px;"></div>
</div>
<div id="view-dates">
  <div class="dl-head">
    <div>
      <div class="dl-subtitle">Route Trace for TAXI Driver</div>
      <div class="dl-title">営業日報 一覧</div>
    </div>
    <!-- 売上フィルター -->
    <div class="dl-filters">
      <button class="dl-filter active" onclick="filterFare('all',this)">全件</button>
      <button class="dl-filter" onclick="filterFare('high',this)">10万以上</button>
      <button class="dl-filter" onclick="filterFare('mid',this)">8〜9万</button>
      <button class="dl-filter" onclick="filterFare('low',this)">8万未満</button>
    </div>
  </div>
  <!-- 曜日フィルター（売上フィルターと掛け合わせ） -->
  <div class="dl-dow-bar">
    <span class="dl-dow-lbl">曜日</span>
    <button class="dl-dow active" data-dow="月" onclick="toggleDow('月',this)">月</button>
    <button class="dl-dow active" data-dow="火" onclick="toggleDow('火',this)">火</button>
    <button class="dl-dow active" data-dow="水" onclick="toggleDow('水',this)">水</button>
    <button class="dl-dow active" data-dow="木" onclick="toggleDow('木',this)">木</button>
    <button class="dl-dow active" data-dow="金" onclick="toggleDow('金',this)">金</button>
    <button class="dl-dow active" data-dow="土" onclick="toggleDow('土',this)">土</button>
    <button class="dl-dow active" data-dow="日" onclick="toggleDow('日',this)">日</button>
    <button class="dl-dow-all" onclick="resetDow()">全曜日</button>
  </div>
  <!-- アカウントフィルター（車種別） -->
  <div class="dl-acct-bar">
    <span class="dl-dow-lbl">車種</span>
    <button class="dl-acct active" id="acct-all" onclick="filterAcct('all',this)">全車種</button>
    <button class="dl-acct" id="acct-jpn" onclick="filterAcct('JPN',this)">🚕 JPN（専用・通常）</button>
    <button class="dl-acct" id="acct-pre" onclick="filterAcct('PRE',this)">⭐ PRE（プレタク）</button>
  </div>
  <div class="dl-table-wrap">
    <table>
      <thead><tr>
        <th>日付</th><th>曜</th><th class="r">営収</th><th class="r">件数</th><th class="r">平均単価</th>
      </tr></thead>
      <tbody id="date-tbody"></tbody>
    </table>
  </div>
</div>
<div id="view-route">
  <div id="sidebar">
    <!-- モバイル用ドラッグハンドル（タップで開閉） -->
    <div id="mob-handle" onclick="cycleMobPanel()">
      <div class="mob-bar"></div>
      <span id="mob-handle-label">▼ 縮む</span>
    </div>
    <div class="s-back" onclick="showDates()">
      <span>←</span><span>日報一覧に戻る</span>
    </div>
    <div class="s-head">
      <div class="s-eye">Route Trace for TAXI Driver</div>
      <div class="s-date" id="s-date">—</div>
      <div class="s-dow" id="s-dow">—</div>
    </div>
    <div class="stats-grid">
      <div class="stat-cell"><div class="stat-lbl">営収（日報）</div><div class="stat-val" id="st-fare">—</div></div>
      <div class="stat-cell"><div class="stat-lbl">件数</div><div class="stat-val" id="st-cnt">—</div></div>
      <div class="stat-cell"><div class="stat-lbl">¥5,000+</div><div class="stat-val" id="st-long">—</div></div>
      <div class="stat-cell"><div class="stat-lbl">平均単価</div><div class="stat-val" id="st-avg">—</div></div>
    </div>
    <div class="legend-bar">
      <div class="leg-btn active" id="lb-trip" onclick="toggleLeg('trip',this)">
        <span class="leg-line"></span>実車
      </div>
      <div class="leg-btn active" id="lb-dead" onclick="toggleLeg('dead',this)">
        <span class="leg-dash"></span>空車移動
      </div>
      <div class="leg-btn active" id="lb-brk" onclick="toggleLeg('brk',this)">
        <span style="width:16px;height:0;border-top:2px dashed #33cc66;flex-shrink:0;"></span>休憩
      </div>
      <div class="leg-btn active" id="lb-ktn" onclick="toggleLeg('ktn',this)">
        <span style="width:10px;height:10px;border-radius:50%;background:#ee4455;flex-shrink:0;"></span>空転
      </div>
      <div class="leg-btn active" id="lb-gps" onclick="toggleLeg('gps',this)">
        <span style="width:16px;height:0;border-top:2px solid #aa66ff;flex-shrink:0;opacity:.7;"></span>GPS
      </div>
    </div>
    <div id="trip-list"></div>
    <div id="status-bar">—</div>
  </div>
  <div id="map-wrap">
    <div id="map"></div>
    <div id="map-loading">
      <div class="spin"></div>
      <div class="ld-txt">ルートを読み込み中...</div>
      <div id="map-sub" style="font-size:9px;color:#303058;margin-top:2px;"></div>
    </div>
    <button id="mob-toggle" onclick="toggleMobSidebar()">📋 一覧を開く</button>
  </div>
</div>
<script>

// ── utils ────────────────────────────────────────────
function na(s){
  if(!s)return'';
  return String(s).trim().replace(/[\s　\t\r\n]+/g,'').replace(/：/g,':')
    .replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0))
    .replace(/一丁目/g,'1丁目').replace(/二丁目/g,'2丁目').replace(/三丁目/g,'3丁目')
    .replace(/四丁目/g,'4丁目').replace(/五丁目/g,'5丁目').replace(/六丁目/g,'6丁目')
    .replace(/七丁目/g,'7丁目').replace(/八丁目/g,'8丁目').replace(/九丁目/g,'9丁目');
}
function stripSono(s){return String(s||'').replace(/^その他/,'');}
function stripPref(s){return s.replace(/^[\u4e00-\u9fa5]{2,3}[都道府県]/,'');}
function stripWard(s){return s.replace(/^[\u4e00-\u9fa5]+[区市]/,'');}

// ── 関東圏の都県を市区名から推定 ──────────────────────
// 同名地名が関西等にある場合のNominatim誤マッチを防ぐ
function inferPrefecture(addr){
  // 埼玉県の主要市
  if(/川口市|さいたま市|浦和|大宮|所沢市|越谷市|川越市|春日部市|草加市|熊谷市|上尾市|志木市|朝霞市|新座市|和光市|戸田市|蕨市|行田市|加須市|東松山市|羽生市|鴻巣市|深谷市|秩父市|飯能市|入間市|狭山市|富士見市|ふじみ野市|坂戸市|三郷市|吉川市/.test(addr)) return '埼玉県';
  // 千葉県の主要市
  if(/市川市|船橋市|千葉市|習志野市|浦安市|柏市|松戸市|野田市|成田市|木更津市|茂原市|印西市|白井市|流山市|八千代市|四街道市|佐倉市|鎌ケ谷市|袖ケ浦市|富里市|我孫子市|取手市|龍ケ崎市|守谷市|利根町|稲敷市/.test(addr)) return '千葉県';
  // 神奈川県の主要市
  if(/横浜市|川崎市|相模原市|横須賀市|平塚市|鎌倉市|藤沢市|小田原市|茅ヶ崎市|逗子市|三浦市|秦野市|厚木市|大和市|伊勢原市|海老名市|座間市|綾瀬市|南足柄市/.test(addr)) return '神奈川県';
  // 東京（デフォルト）
  return '東京都';
}

// ── Nominatim fallback (武三23区外・その他の住所) ──────
// CSVにない住所をNominatimでジオコード。セッション中はキャッシュ使用
// ★ 都県を付加してクエリ、かつ関東圏外の結果は無効とする
async function geocodeFallback(addrs, onProgress){
  // 関東圏の有効範囲（この外は誤マッチとみなす）
  const KANTO_LAT_MIN=34.8, KANTO_LAT_MAX=36.8;
  const KANTO_LNG_MIN=138.5, KANTO_LNG_MAX=141.0;

  const todo=addrs.filter(a=>a&&!apiGeoCache.has(a));
  for(let i=0;i<todo.length;i++){
    const addr=todo[i];
    const stripped=stripSono(addr).trim(); // 「その他」を除去
    if(!stripped){ apiGeoCache.set(addr,null); if(onProgress)onProgress(i+1,todo.length); continue; }

    // 都県を付加してより正確なクエリを作成
    const pref=inferPrefecture(stripped);
    // 既に都県が含まれていれば付加しない
    const q=(stripped.includes('都')||stripped.includes('道')||stripped.includes('府')||stripped.includes('県'))
      ? stripped : pref+stripped;

    let found=null;
    try{
      const url=`https://nominatim.openstreetmap.org/search?format=json&limit=3&countrycodes=jp&q=${encodeURIComponent(q)}`;
      const r=await fetch(url,{headers:{'Accept':'application/json','Accept-Language':'ja'}});
      const results=await r.json();
      // 関東圏内の結果だけ採用
      if(results&&results.length>0){
        for(const res of results){
          const lat=parseFloat(res.lat), lng=parseFloat(res.lon);
          if(lat>=KANTO_LAT_MIN&&lat<=KANTO_LAT_MAX&&lng>=KANTO_LNG_MIN&&lng<=KANTO_LNG_MAX){
            found={lat,lng};
            break;
          }
        }
      }
    }catch(e){}

    apiGeoCache.set(addr, found); // null でもキャッシュ（再検索しない）
    if(onProgress)onProgress(i+1,todo.length);
    if(i<todo.length-1)await new Promise(r=>setTimeout(r,1100));
  }
}
function parseFare(v){return parseInt(String(v||'').replace(/[^0-9]/g,''))||0;}
function pf(n){return n?'¥'+n.toLocaleString():'—';}
function sl(s,n=13){if(!s||!s.trim())return'—';return s.length>n?s.slice(0,n)+'…':s;}
function resolveCol(keys,want){
  if(keys.includes(want))return want;
  const alts=[want.replace(/：/g,':'),want.replace(/:/g,'：')];
  return keys.find(k=>alts.includes(k)||na(k)===na(want))||null;
}

// ── date parsing ─────────────────────────────────────
function parseDate(dateStr,dowStr){
  dateStr=String(dateStr||'').trim();
  dowStr=String(dowStr||'').trim();
  let m;
  m=dateStr.match(/(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);
  if(m)return{y:+m[1],mo:+m[2],d:+m[3]};
  m=dateStr.match(/R(\d+)[\.\/](\d{1,2})[\.\/](\d{1,2})/);
  if(m)return{y:+m[1]+2018,mo:+m[2],d:+m[3]};
  m=dateStr.match(/令和(\d+)年(\d{1,2})月(\d{1,2})日/);
  if(m)return{y:+m[1]+2018,mo:+m[2],d:+m[3]};
  // "24年2月19日" (2桁西暦)
  m=dateStr.match(/^(\d{1,2})年(\d{1,2})月(\d{1,2})日/);
  if(m)return{y:+m[1]+2000,mo:+m[2],d:+m[3]};
  // Excel serial
  const serial=parseInt(dateStr);
  if(!isNaN(serial)&&serial>40000&&serial<60000){
    const dt=new Date(Math.round((serial-25569)*86400000));
    return{y:dt.getUTCFullYear(),mo:dt.getUTCMonth()+1,d:dt.getUTCDate()};
  }
  // "m/d" — use 曜 to determine year
  m=dateStr.match(/^(\d{1,2})[\/](\d{1,2})$/);
  if(m){
    const mo=+m[1],day=+m[2];
    const targetDow=DOWMAP[dowStr];
    if(targetDow!==undefined){
      for(let yr=2027;yr>=2023;yr--){
        if(new Date(yr,mo-1,day).getDay()===targetDow)return{y:yr,mo,d:day};
      }
    }
    return null;
  }
  m=dateStr.match(/(\d{1,2})月(\d{1,2})日/);
  if(m){
    const mo=+m[1],day=+m[2];
    const targetDow=DOWMAP[dowStr];
    if(targetDow!==undefined){
      for(let yr=2027;yr>=2023;yr--){
        if(new Date(yr,mo-1,day).getDay()===targetDow)return{y:yr,mo,d:day};
      }
    }
    return null;
  }
  return null;
}
function matchDate(row,y,mo,d){
  const s=Object.values(row).map(v=>String(v||'')).join(' ');
  const m2=String(mo).padStart(2,'0'),d2=String(d).padStart(2,'0'),ry=y-2018;
  const pats=[`${y}/${mo}/${d}`,`${y}/${m2}/${d2}`,`${y}-${m2}-${d2}`,`${y}年${mo}月${d}日`,
    `R${ry}/${mo}/${d}`,`R${ry}.${mo}.${d}`,`令和${ry}年${mo}月${d}日`,
    `${String(y).slice(2)}年${mo}月${d}日`]; // "26年3月19日"
  if(pats.some(p=>s.includes(p)))return true;
  if(!/20\d\d|R\d|令和|\d{2}年/.test(s))return[`${mo}/${d}`,`${mo}月${d}`].some(p=>s.includes(p));
  return false;
}

async function fetchCSV(url){

  if(!r.ok)throw new Error('HTTP '+r.status);
  return Papa.parse(await r.text(),{header:true,skipEmptyLines:true,dynamicTyping:false,

// ── coord map ─────────────────────────────────────────
function buildCoordMap(rows){
  const m=new Map();
  rows.forEach(row=>{
    const addr=row['住所']||row[Object.keys(row)[0]]||'';
    const lat=parseFloat(row['緯度(latitude)']||row['緯度']||row[Object.keys(row)[1]]);
    const lng=parseFloat(row['経度(longitude)']||row['経度']||row[Object.keys(row)[2]]);
    if(!addr||isNaN(lat)||isNaN(lng))return;
    const key=na(addr);const v={lat,lng};
    m.set(key,v);
    const noPref=stripPref(key);
    if(noPref!==key)m.set(noPref,v);
  });
  return m;
}
function getCoords(addr){
  if(!addr||!addr.trim())return null;
  const base=na(addr),stripped=na(stripSono(addr));
  for(const c of[base,stripped,stripWard(base),stripWard(stripped),stripPref(base),stripWard(stripPref(base))]){
    if(!c)continue;
    if(coordMap.has(c))return coordMap.get(c);
    let best=null,bl=0;
    for(const[k,v]of coordMap){if(c.startsWith(k)&&k.length>bl){best=v;bl=k.length;}}
    if(best)return best;
  }
  return null;
}

// ── サンキュー判定 ─────────────────────────────────────
// 値を確認して判定: 数字>0 or TRUE/yes/サンキュー/○ を陽性とみなす
// ── 乗車条件バッジ（サンキュー列の実際の値を表示） ───────
// 通常=非表示、サンキュー=琥珀、プレタク=紫、プレタクP=シアン
function mkCondBadge(val){
  if(!val)return'';
  const v=String(val).trim();
  if(!v||v==='通常')return''; // 通常は多すぎるので非表示
  if(v==='サンキュー')return`<span class="badge badge-thx">サンキュー</span>`;
  if(v==='プレタク')  return`<span class="badge badge-pre-ride">プレタク</span>`;
  if(v==='プレタクP') return`<span class="badge badge-prep-ride">プレタクP</span>`;
  // 数値形式（旧形式）: 1以上ならサンキュー扱い
  const n=parseFloat(v);
  if(!isNaN(n)&&n>0)return`<span class="badge badge-thx">サンキュー</span>`;
  return'';
}

// ── ステータス＋乗車条件 バッジ ────────────────────────
function mkBadge(status,thx){
  let html='';
  if(status&&status.trim()){
    const s=String(status).trim();
    if(/Go|GO/i.test(s))html+=`<span class="badge badge-go">${s}</span>`;
    else if(/アプリ|配車|無線|スマ/i.test(s))html+=`<span class="badge badge-app">${sl(s,6)}</span>`;
    else if(s)html+=`<span class="badge badge-other">${sl(s,7)}</span>`;
  }
  html+=mkCondBadge(thx);
  return html;
}

      <td class="avg-cell" style="font-size:11px;color:#7070a0;">${r.avg?pf(r.avg):'—'}</td>`;
    tr.addEventListener('click',()=>loadRoute(r));
    tbody.appendChild(tr);
  });
}

// ── モバイル: 3段階パネル制御 ──────────────────────────
// 状態: closed(デフォルト) → open(全開) → peek(縮小) → closed
function getMobState(){
  const sb=document.getElementById('sidebar');
  if(sb.classList.contains('mob-open'))return'open';
  if(sb.classList.contains('mob-peek'))return'peek';
  return'closed';
}
function setMobState(state){
  const sb=document.getElementById('sidebar');
  const btn=document.getElementById('mob-toggle');
  const lbl=document.getElementById('mob-handle-label');
  sb.classList.remove('mob-open','mob-peek');
  if(state==='open'){
    sb.classList.add('mob-open');
    if(btn)btn.textContent='▽ 縮む';
    if(lbl)lbl.textContent='▼ 縮む';
  } else if(state==='peek'){
    sb.classList.add('mob-peek');
    if(btn)btn.textContent='▲ 一覧を開く';
    if(lbl)lbl.textContent='▲ 一覧を開く';
  } else {
    if(btn)btn.textContent='📋 一覧を開く';
  }
  setTimeout(()=>leafMap.invalidateSize(),50);
}
function closeMobPanel(){ setMobState('closed'); }

// フローティングボタン: closed/peek → open, open → peek
function toggleMobSidebar(){
  const s=getMobState();
  setMobState(s==='open'?'peek':'open');
}
// ハンドルバータップ: open → peek, peek → open
function cycleMobPanel(){
  const s=getMobState();
  setMobState(s==='open'?'peek':'open');
}

// ── 案件選択時: パネルの上にルートが見えるよう fitBounds ──
function getMobBottomPad(){
  if(window.innerWidth>767)return null;
  const sb=document.getElementById('sidebar');
  const h=window.innerHeight;
  if(sb.classList.contains('mob-open')) return Math.round(h*0.58);
  if(sb.classList.contains('mob-peek')) return 92;
  return 0;
}

// ── VIEW 2 ────────────────────────────────────────────
async function loadRoute(dayInfo){
  document.getElementById('view-dates').className='';
  document.getElementById('view-route').className='active';
  setTimeout(()=>leafMap.invalidateSize(),150);
  // Reset mobile sidebar state
  closeMobPanel();
  clearMap();
  document.getElementById('map-loading').style.display='flex';

  const{y,mo,d,fare:dailyFare,cnt:dailyCnt}=dayInfo;
  document.getElementById('s-date').textContent=`${y}/${mo}/${d}`;
  document.getElementById('s-dow').textContent=`${DOW[new Date(y,mo-1,d).getDay()]}曜日`;

  try{
    document.getElementById('map-sub').textContent='日報詳細を取得中...';
    if(!bdCache)bdCache=await fetchCSV(URL_BD);
    const bk=Object.keys(bdCache[0]);
    const cpw=resolveCol(bk,C_PW),cpt=resolveCol(bk,C_PT);
    const cdw=resolveCol(bk,C_DW),cdt=resolveCol(bk,C_DT);
    const ctm=resolveCol(bk,C_TIME);
    const ctd=resolveCol(bk,C_DROPTIME)||bk.find(k=>k.includes('降車時間'));
    const cfb=resolveCol(bk,C_FARE_B)||bk.find(k=>k.includes('料金'));
    const cst=resolveCol(bk,C_STATUS)||bk.find(k=>k.includes('ステータス'));
    const cth=resolveCol(bk,C_THX)||bk.find(k=>k==='サンキュー')||bk.find(k=>k.includes('サンキュー'));

    const dayRows=bdCache.filter(r=>matchDate(r,y,mo,d));
    if(!dayRows.length)throw new Error(`${y}/${mo}/${d} のデータが見つかりません`);

    // 緯度・経度列を検出（日報詳細CSVにGPSが直接記録されている場合）
    const cplat=bk.find(k=>k.includes('乗車地')&&k.includes('緯度'));
    const cplng=bk.find(k=>k.includes('乗車地')&&k.includes('経度'));
    const cdlat=bk.find(k=>k.includes('降車地')&&k.includes('緯度'));
    const cdlng=bk.find(k=>k.includes('降車地')&&k.includes('経度'));

    const trips=dayRows.map((row,i)=>{
      const pw=cpw?String(row[cpw]||'').trim():'';
      const pt=cpt?String(row[cpt]||'').trim():'';
      const dw=cdw?String(row[cdw]||'').trim():'';
      const dt=cdt?String(row[cdt]||'').trim():'';
      // 日報詳細のGPS座標を優先使用
      const pLat=cplat?parseFloat(row[cplat]):NaN;
      const pLng=cplng?parseFloat(row[cplng]):NaN;
      const dLat=cdlat?parseFloat(row[cdlat]):NaN;
      const dLng=cdlng?parseFloat(row[cdlng]):NaN;
      const pcGPS=(!isNaN(pLat)&&!isNaN(pLng)&&pLat!==0)?{lat:pLat,lng:pLng}:null;
      const dcGPS=(!isNaN(dLat)&&!isNaN(dLng)&&dLat!==0)?{lat:dLat,lng:dLng}:null;
      return{n:i+1,
        pickup:(pw+pt).trim(),dropoff:(dw+dt).trim(),
        fare:parseFare(cfb?row[cfb]:''),
        time:ctm?String(row[ctm]||''):'',
        dropTime:ctd?String(row[ctd]||''):'',
        status:cst?String(row[cst]||''):'',
        thx:cth?row[cth]:null,
        pcGPS,dcGPS,
        pc:null,dc:null,ok:false};
    });
    // startMin・dropTimeMin を分数で付加（GPS区間分割用）
    trips.forEach(t=>{
      t.startMin=timeToMin(t.time);
      t.dropTimeMin=timeToMin(t.dropTime);
    });
    // 座標の優先順位: ①日報詳細GPS → ②座標CSV → ③Nominatimフォールバック
    trips.forEach(t=>{
      t.pc=t.pcGPS||getCoords(t.pickup);
      t.dc=t.dcGPS||getCoords(t.dropoff);
      t.ok=!!(t.pc&&t.dc);
      t.partial=!!(t.pc&&!t.dc); // 乗車地のみ座標あり
    });

    // CSVにない住所（武三23区外・「その他」）をNominatim APIで補完
    const unmatchedAddrs=[...new Set(
      trips.filter(t=>!t.ok).flatMap(t=>[t.pickup,t.dropoff]).filter(a=>a&&!getCoords(a))
    )];
    if(unmatchedAddrs.length>0){
      await geocodeFallback(unmatchedAddrs,(done,total)=>{
        document.getElementById('map-sub').textContent=`武三23区外 ${done}/${total}件を取得中...`;
      });
      // キャッシュから座標を再反映
      trips.forEach(t=>{
        if(!t.pc&&apiGeoCache.get(t.pickup))t.pc=apiGeoCache.get(t.pickup);
        if(!t.dc&&apiGeoCache.get(t.dropoff))t.dc=apiGeoCache.get(t.dropoff);
        t.ok=!!(t.pc&&t.dc);
        t.partial=!!(t.pc&&!t.dc);
      });
    }

    // ── 休憩データを取得・日付フィルター ──────────────────
    if(!breakCache){
      try{ breakCache=await fetchCSV(URL_BREAK); }
      catch(e){ breakCache=[]; }
    }
    const dateKey=`${y}/${String(mo).padStart(2,'0')}/${String(d).padStart(2,'0')}`;
    const dateKeyAlt=`${y}/${mo}/${d}`;
    const dayBreaks=breakCache.filter(r=>{
      const bDate=String(r['日付']||'').trim();
      return bDate===dateKey||bDate===dateKeyAlt;
    }).map(r=>({
      start: String(r['開始時間']||'').trim(),
      end:   String(r['終了時間']||'').trim(),
      mins:  parseInt(r['休憩時間']||'0')||0,
      memo:  String(r['メモ']||'').trim(),
      lat:   parseFloat(r['休憩：緯度']||r['緯度']||''),
      lng:   parseFloat(r['休憩：経度']||r['経度']||''),
      startMin: timeToMin(String(r['開始時間']||'')),
    })).filter(b=>b.startMin>=0);

    // ── 空転データを取得・日付フィルター ──────────────────
    // 日付列は「2026/06/03」(=シフト日) 形式。タイムスタンプではなくこちらを使う
    if(!kutenCache){
      try{ kutenCache=await fetchCSV(URL_KUTEN); }
      catch(e){ kutenCache=[]; }
    }
    const dayKuten=kutenCache.filter(r=>{
      const kDate=String(r['日付']||'').trim();
      return kDate===dateKey||kDate===dateKeyAlt;
    }).map(r=>({
      kind: String(r['種別']||'').trim(), // メーター空転 / 迎車キャンセル
      time: String(r['時刻']||'').trim(),
      ward: String(r['場所_市区']||'').trim(),
      place:String(r['場所_地名']||'').trim(),
      lat:  parseFloat(r['緯度']||''),
      lng:  parseFloat(r['経度']||''),
      fare: parseFare(r['金額']),
      memo: String(r['メモ']||'').trim(),
      startMin: timeToMin(String(r['時刻']||'')),
    })).filter(k=>k.startMin>=0);

    const matched=trips.filter(t=>t.ok).length;
    const fareDisp=dailyFare||trips.reduce((s,t)=>s+t.fare,0);
    const cntDisp=dailyCnt||trips.length;
    const long=trips.filter(t=>t.fare>=5000).length;
    const avg=cntDisp>0?Math.round(fareDisp/cntDisp):0;
    document.getElementById('st-fare').innerHTML='¥'+fareDisp.toLocaleString();
    document.getElementById('st-cnt').innerHTML=cntDisp+'<span class="stat-unit"> 件</span>';
    document.getElementById('st-long').innerHTML=long+'<span class="stat-unit"> 件</span>';
    document.getElementById('st-avg').innerHTML='¥'+avg.toLocaleString();

    // ── サイドバー：営業と休憩を時刻順に混合表示 ──────────
    const list=document.getElementById('trip-list');
    // trips に time を分数で付加（ソート用）
    trips.forEach(t=>{ t.startMin=timeToMin(t.time); });
    // 全アイテムを時刻順に並べる（休憩・空転含む）
    const allItems=[
      ...trips.map(t=>({type:'trip',data:t,min:t.startMin})),
      ...dayBreaks.map(b=>({type:'brk',data:b,min:b.startMin})),
      ...dayKuten.map(k=>({type:'ktn',data:k,min:k.startMin}))
    ].sort((a,b)=>(a.min<0?9999:a.min)-(b.min<0?9999:b.min));

    let prevDiv=null;
    allItems.forEach(item=>{
      if(prevDiv){const s=document.createElement('div');s.className='t-sep';list.appendChild(s);}
      const div=document.createElement('div');
      if(item.type==='trip'){
        const t=item.data;
        // ok=両方あり, partial=乗車地のみ, no-map=どちらもなし
        const cls=t.ok?'':t.partial?'partial':'no-map';
        div.className='t-row'+(cls?' '+cls:'');div.id='tr-'+t.n;
        const noMapLabel=t.partial
          ?'<span style="font-size:8px;color:#aa6600;">降車地未取得</span>'
          :'<span style="font-size:8px;color:#303050;">未取得</span>';
        div.innerHTML=`<div class="t-num">${t.n}</div><div class="t-body">
          <div class="t-loc"><span class="t-from">${sl(t.pickup)}</span><span class="t-arr">↓</span><span class="t-to">${sl(t.dropoff)}</span></div>
          <div class="t-meta"><div class="t-fare">${pf(t.fare)}</div>${t.time?`<span class="t-time">${t.time}</span>`:''}${mkBadge(t.status,t.thx)}${(!t.ok)?noMapLabel:''}</div>
        </div>`;
        if(t.ok||t.partial)div.addEventListener('click',()=>setActive(t.n));
      } else if(item.type==='brk'){
        const b=item.data;
        const hasLoc=!isNaN(b.lat)&&!isNaN(b.lng);
        const brkLabel=b.mins>0?`${b.mins}分`:
          (b.start&&b.end&&b.start!==b.end)?`${b.start}〜${b.end}`:`${b.start}`;
        div.className='t-row-brk';
        div.innerHTML=`<div class="brk-icon">休</div><div class="brk-body">
          <div class="brk-time">☕ 休憩 ${brkLabel}</div>
          <div class="brk-sub">${b.memo||''} ${hasLoc?'📍':''}</div>
        </div>`;
      } else {
        const k=item.data;
        const hasLoc=!isNaN(k.lat)&&!isNaN(k.lng);
        const label = k.kind==='迎車キャンセル' ? '迎' : '空';
        const kindLabel = k.kind || '空転';
        div.className='t-row-ktn';
        div.innerHTML=`<div class="ktn-icon">${label}</div><div class="ktn-body">
          <div class="ktn-time">⚠ ${kindLabel} ${k.time}${k.ward||k.place?` ／ ${sl((k.ward||'')+(k.place||''),14)}`:''}</div>
          <div class="ktn-sub">${k.memo||''} ${hasLoc?'📍':''}</div>
        </div>`;
      }
      list.appendChild(div);
      prevDiv=div;
    });

    // ── GPS ロガーデータを先に読み込む（空車ルート描画に使用） ──
    const gpsDate=`${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    let gpsPoints=null,gpsNPoints=0;
    try{
      const gpsRes=await fetch(`${GPS_BASE}/${gpsDate}.json`);
      if(gpsRes.ok){
        const gpsData=await gpsRes.json();
        if(gpsData.points&&gpsData.points.length>0){
          gpsPoints=gpsData.points; // [[sec, lat, lng], ...]
          gpsNPoints=gpsData.n_points||gpsPoints.length;
          // 全体のGPSトラック（紫細線、最背面）
          const latlngs=gpsPoints.map(p=>[p[1],p[2]]);
          gpsPolyline=L.polyline(latlngs,{
            color:'#aa66ff',weight:1.5,opacity:showGps?0.4:0,smoothFactor:2
          }).addTo(leafMap);
          gpsPolyline.bringToBack();
        }
      }
    }catch(e){}

    // ── 地図：Dead-runライン（GPSデータがあれば実走路、なければ直線） ──
    const valid=trips.filter(t=>t.ok);
    for(let i=0;i<valid.length-1;i++){
      const a=valid[i],b=valid[i+1];
      let drawn=false;
      // GPS区間分割：a.dropTimeMin → b.startMin の実走路
      if(gpsPoints&&a.dropTimeMin>=0&&b.startMin>=0){
        const secFrom=a.dropTimeMin*60, secTo=b.startMin*60;
        const seg=gpsPoints.filter(p=>p[0]>=secFrom&&p[0]<=secTo);
        if(seg.length>=2){
          const latlngs=seg.map(p=>[p[1],p[2]]);
          const dl=L.polyline(latlngs,{
            color:'#00ccee',weight:2,opacity:showDead?0.75:0,smoothFactor:1
          }).addTo(leafMap);
          deadLayers.push(dl);
          drawn=true;
        }
      }
      // フォールバック：直線
      if(!drawn){
        const dl=L.polyline([[a.dc.lat,a.dc.lng],[b.pc.lat,b.pc.lng]],{
          color:'#00ccee',weight:1.5,opacity:showDead?0.5:0,dashArray:'6 9'
        }).addTo(leafMap);
        deadLayers.push(dl);
      }
    }
    // ── 地図：実車ライン＋マーカー（完全プロット） ────────
    const bounds=[];
    valid.forEach(t=>{
      const line=L.polyline([[t.pc.lat,t.pc.lng],[t.dc.lat,t.dc.lng]],
        {color:'#f5a000',weight:3,opacity:showTrip ? 0.75 : 0}).addTo(leafMap);
      const pm=L.marker([t.pc.lat,t.pc.lng],{icon:iconP(t.n,false)}).addTo(leafMap)
        .bindTooltip(`#${t.n} 乗：${t.pickup}`,{direction:'top'});
      const dm=L.marker([t.dc.lat,t.dc.lng],{icon:iconD(false)}).addTo(leafMap)
        .bindTooltip(`#${t.n} 降：${t.dropoff}`,{direction:'top'});
      [line,pm,dm].forEach(e=>e.on('click',()=>setActive(t.n)));
      tripLayers.push({n:t.n,line,pm,dm});
      bounds.push([t.pc.lat,t.pc.lng],[t.dc.lat,t.dc.lng]);
    });
    // ── 地図：半プロット（乗車地のみ、橙色の◎マーカー） ──
    trips.filter(t=>t.partial).forEach(t=>{
      const pm=L.marker([t.pc.lat,t.pc.lng],{icon:iconP(t.n,false),opacity:showTrip?0.8:0}).addTo(leafMap)
        .bindTooltip(`#${t.n} 乗：${t.pickup}（降車地未取得）`,{direction:'top'});
      pm.on('click',()=>setActive(t.n));
      tripLayers.push({n:t.n,line:null,pm,dm:null});
      bounds.push([t.pc.lat,t.pc.lng]);
    });

    // ── 地図：休憩マーカー＋ライン（緯度経度がある場合のみ） ──
    dayBreaks.filter(b=>!isNaN(b.lat)&&!isNaN(b.lng)).forEach(b=>{
      const brkLabel=b.mins>0?`${b.mins}分`:
        (b.start&&b.end&&b.start!==b.end)?`${b.start}〜${b.end}`:b.start;
      const prevTrip=valid.filter(t=>t.startMin<b.startMin).slice(-1)[0];
      if(prevTrip){
        const l=L.polyline([[prevTrip.dc.lat,prevTrip.dc.lng],[b.lat,b.lng]],
          {color:'#33cc66',weight:1.5,opacity:showBrk?0.65:0,dashArray:'5 8'}).addTo(leafMap);
        breakLayers.push(l);
      }
      const nextTrip=valid.filter(t=>t.startMin>b.startMin)[0];
      if(nextTrip){
        const l=L.polyline([[b.lat,b.lng],[nextTrip.pc.lat,nextTrip.pc.lng]],
          {color:'#33cc66',weight:1.5,opacity:showBrk?0.65:0,dashArray:'5 8'}).addTo(leafMap);
        breakLayers.push(l);
      }
      const bm=L.marker([b.lat,b.lng],{icon:iconBreak()}).addTo(leafMap)
        .bindTooltip(`休憩 ${brkLabel}${b.memo?' '+b.memo:''}`,{direction:'top',permanent:false});
      breakLayers.push(bm);
      bounds.push([b.lat,b.lng]);
    });

    // ── 地図：空転マーカー ──────────────────────────────
    dayKuten.filter(k=>!isNaN(k.lat)&&!isNaN(k.lng)).forEach(k=>{
      const kindLabel=k.kind||'空転';
      const km=L.marker([k.lat,k.lng],{icon:iconKuten(k.kind),opacity:showKtn?0.85:0}).addTo(leafMap)
        .bindTooltip(`⚠ ${kindLabel} ${k.time}${k.memo?' '+k.memo:''}`,{direction:'top',permanent:false});
      kutenLayers.push(km);
      bounds.push([k.lat,k.lng]);
    });

    if(bounds.length)leafMap.fitBounds(bounds,{padding:[50,50]});

    const unm=trips.filter(t=>!t.ok&&!t.partial);
    const partial=trips.filter(t=>t.partial);
    const gpsPins=trips.filter(t=>t.pcGPS||t.dcGPS).length;
    const stBar=document.getElementById('status-bar');
    let stMsg=`プロット: ${matched+(partial.length)}/${trips.length}件`;
    if(partial.length)stMsg+=`（乗車地のみ: ${partial.length}件）`;
    if(unm.length)stMsg+=` | 未取得: `+unm.slice(0,2).map(t=>sl(t.pickup,9)).join(',');
    if(dayBreaks.length)stMsg+=` | 休憩: ${dayBreaks.length}件`;
    if(dayKuten.length)stMsg+=` | 空転: ${dayKuten.length}件`;
    if(gpsNPoints>0)stMsg+=` | GPS実測: ${gpsNPoints}点`;
    if(gpsPins>0)stMsg+=` | ピン座標: ${gpsPins}件`;

    stBar.textContent=stMsg;
    stBar.className=matched>0?'ok':'ng';
    document.getElementById('map-loading').style.display='none';

  }catch(err){
    document.getElementById('map-loading').innerHTML=`<div style="text-align:center;padding:24px"><div style="color:#c04040;font-size:13px;margin-bottom:8px">エラー</div><div style="color:#404060;font-size:11px;max-width:260px;line-height:1.8">${err.message}</div></div>`;
  }
}

// ── INIT ──────────────────────────────────────────────

// アカウント値を JPN / PRE に正規化
// JPN = 専用 + 通常（流し可能な通常タクシー）
// PRE = プレタク（アルファード、GO専用）
function normalizeAcct(val){
  if(!val)return'JPN';
  const v=String(val).trim();
  if(v.includes('プレタク')||v.includes('プレミアム'))return'PRE';
  return'JPN'; // 専用・通常・その他すべて → JPN
}

// 日付キー生成（日報とブレークダウンを突合するため）
function dayKey(y,mo,d){return`${y}-${mo}-${d}`;}

let currentAcct='all';
function filterAcct(acct,btn){
  currentAcct=acct;
  document.querySelectorAll('.dl-acct').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderDates();
}

async function init(){
  try{
    document.getElementById('init-sub').textContent='座標データを読み込み中...';
    coordMap=buildCoordMap(await fetchCSV(URL_COORD));

    document.getElementById('init-sub').textContent='日報を読み込み中...';
    dailyCache=await fetchCSV(URL_DAILY);

    if(dailyCache.length>0){
      const dk=Object.keys(dailyCache[0]);
      const fareCol=dk.find(k=>k==='営収')||dk.find(k=>k.includes('営収'));
      const cntCol =dk.find(k=>k==='回数')||dk.find(k=>k.includes('回数'));
      const avgCol =dk.find(k=>k==='単価')||dk.find(k=>k.includes('単価'));
      // TAXI列でJPN/PREを判定 (JAP→JPN, PRE→PRE)
      const taxiCol=dk.find(k=>k==='TAXI')||dk.find(k=>k.includes('TAXI'));
      allDays=[];
      dailyCache.forEach(row=>{
        const info=parseDate(row['日付'],row['曜']);
        if(!info)return;
        const{y,mo,d}=info;
        const fare=fareCol?parseFare(row[fareCol]):0;
        const cnt =cntCol?parseInt(row[cntCol])||0:0;
        const avg =avgCol?parseFare(row[avgCol]):0;
        const dow=DOW[new Date(y,mo-1,d).getDay()]||row['曜']||'';
        // TAXI列の値: JAP→JPN, PRE→PRE, その他→JPN
        const taxiVal=taxiCol?String(row[taxiCol]||'').trim():'';
        const acct=taxiVal.toUpperCase().includes('PRE')?'PRE':'JPN';
        allDays.push({y,mo,d,dateStr:`${y}/${mo}/${d}`,dow,fare,cnt,avg,acct});
      });
      allDays.sort((a,b)=>(b.y-a.y)||(b.mo-a.mo)||(b.d-a.d));
    }

    document.getElementById('init-loading').style.display='none';
    renderDates();
    document.getElementById('view-dates').className='active';
  }catch(err){
    document.getElementById('init-sub').textContent='エラー: '+err.message;
    console.error(err);
  }
}
init();
</script>
</body>
</html>
