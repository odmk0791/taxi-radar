<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>営業ルートトレース</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',sans-serif;
  background:#07071a;color:#e4e6ff;display:flex;height:100vh;overflow:hidden;}

/* ── VIEWS ────────────────────────────────────── */
#view-dates,#view-route{display:none;width:100%;height:100%;}
#view-dates.active,#view-route.active{display:flex;}

/* ══════════════════════════════════════════════
   VIEW 1: 日報一覧
══════════════════════════════════════════════ */
#view-dates{flex-direction:column;background:#07071a;}
.dl-head{padding:14px 18px 12px;border-bottom:1px solid #28285a;flex-shrink:0;
  display:flex;align-items:center;gap:12px;}
.dl-title{font-size:14px;font-weight:800;color:#fff;flex:1;}
.dl-subtitle{font-size:9px;color:#5050a0;letter-spacing:.15em;text-transform:uppercase;}
.dl-filters{display:flex;gap:6px;}
.dl-filter{background:#1c1c3a;border:1px solid #383870;color:#8080c0;
  padding:5px 12px;border-radius:20px;font-size:10px;font-weight:600;
  cursor:pointer;font-family:inherit;transition:all .15s;}
.dl-filter.active{background:#f5a000;border-color:#f5a000;color:#000;}
.dl-filter:hover:not(.active){background:#252550;color:#c0c0e8;}

.dl-table-wrap{flex:1;overflow-y:auto;padding:0;}
.dl-table-wrap::-webkit-scrollbar{width:4px;}
.dl-table-wrap::-webkit-scrollbar-thumb{background:#28285a;border-radius:2px;}
table{width:100%;border-collapse:collapse;}
thead th{position:sticky;top:0;background:#0d0d22;padding:9px 16px;
  font-size:9px;letter-spacing:.1em;color:#4a4a70;text-transform:uppercase;
  text-align:left;border-bottom:1px solid #1e1e40;font-weight:600;}
thead th:nth-child(3),thead th:nth-child(4),thead th:nth-child(5){text-align:right;}
tbody tr{cursor:pointer;border-bottom:1px solid #111130;transition:background .1s;}
tbody tr:hover{background:#141428;}
tbody tr.high td.fare-cell{color:#f5a000;font-weight:800;}
tbody tr.high{background:#0f0f28;}
td{padding:10px 16px;font-size:12px;color:#b0b2d8;}
td.date-cell{color:#d8daff;font-weight:600;}
td.dow-cell{color:#6060a0;font-size:11px;}
td.fare-cell,td.cnt-cell,td.avg-cell{text-align:right;font-variant-numeric:tabular-nums;}
td.fare-cell{font-size:13px;}
.badge-high{display:inline-block;background:#f5a00022;color:#f5a000;
  font-size:8px;font-weight:700;padding:1px 5px;border-radius:3px;margin-left:6px;
  border:1px solid #f5a00044;}
.badge-low{display:inline-block;background:#4488ff22;color:#4488ff;
  font-size:8px;font-weight:700;padding:1px 5px;border-radius:3px;margin-left:6px;
  border:1px solid #4488ff44;}

/* ══════════════════════════════════════════════
   VIEW 2: ルートマップ
══════════════════════════════════════════════ */
#view-route{flex-direction:row;}
#sidebar{width:300px;min-width:300px;background:#0f0f28;border-right:1px solid #28285a;
  display:flex;flex-direction:column;overflow:hidden;z-index:10;}
.s-back{padding:8px 14px;border-bottom:1px solid #1e1e40;flex-shrink:0;
  display:flex;align-items:center;gap:8px;cursor:pointer;transition:background .1s;}
.s-back:hover{background:#161636;}
.s-back-arrow{color:#f5a000;font-size:13px;}
.s-back-txt{font-size:10px;color:#6060a0;}
.s-head{padding:10px 14px 9px;border-bottom:1px solid #28285a;flex-shrink:0;}
.s-eye{font-size:9px;letter-spacing:.2em;color:#f5a000;text-transform:uppercase;margin-bottom:4px;}
.s-date{font-size:16px;font-weight:800;color:#fff;line-height:1;}
.s-dow{font-size:10px;color:#5050a0;margin-top:3px;}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;
  background:#28285a;border-bottom:1px solid #28285a;flex-shrink:0;}
.stat-cell{background:#0f0f28;padding:9px 13px;}
.stat-lbl{font-size:8px;letter-spacing:.1em;color:#404060;text-transform:uppercase;margin-bottom:2px;}
.stat-val{font-size:14px;font-weight:800;color:#f5a000;line-height:1;}
.stat-unit{font-size:9px;font-weight:400;color:#7070a0;}

/* legend toggles */
.legend-bar{display:flex;gap:4px;padding:6px 13px;border-bottom:1px solid #1a1a38;flex-shrink:0;flex-wrap:wrap;}
.leg-btn{display:flex;align-items:center;gap:4px;font-size:9px;color:#6060a0;
  cursor:pointer;padding:3px 7px;border-radius:12px;border:1px solid #1e1e40;
  transition:all .15s;background:#0d0d22;}
.leg-btn:hover{border-color:#3a3a60;}
.leg-btn.active{color:#e0e2ff;border-color:#3a3a60;background:#141428;}
.leg-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.leg-line{width:16px;height:2px;flex-shrink:0;}
.leg-dash{width:16px;height:0;border-top:2px dashed currentColor;flex-shrink:0;opacity:.6;}

#trip-list{flex:1;overflow-y:auto;padding:4px 0;}
#trip-list::-webkit-scrollbar{width:3px;}
#trip-list::-webkit-scrollbar-thumb{background:#28285a;border-radius:2px;}
.t-row{display:flex;align-items:flex-start;gap:8px;padding:6px 12px;cursor:pointer;
  border-left:2px solid transparent;transition:background .1s,border-color .1s;}
.t-row:hover{background:#161640;border-left-color:#f5a00044;}
.t-row.active{background:#1c1c50;border-left-color:#f5a000;}
.t-row.no-map{opacity:.35;cursor:default;}
.t-row.no-map:hover{background:transparent;border-left-color:transparent;}
.t-num{width:22px;height:22px;min-width:22px;background:#f5a000;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:9px;font-weight:900;color:#000;margin-top:1px;flex-shrink:0;}
.t-row.active .t-num{background:#fff;}
.t-row.no-map .t-num{background:#252555;color:#505080;}
.t-body{flex:1;min-width:0;}
.t-loc{font-size:10px;color:#b8badc;line-height:1.5;}
.t-from,.t-to{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.t-arr{font-size:8px;color:#f5a00033;}
.t-meta{display:flex;gap:5px;align-items:center;margin-top:3px;flex-wrap:wrap;}
.t-fare{font-size:11px;font-weight:800;color:#f5a000;}
.t-time{font-size:9px;color:#404060;}
.badge{font-size:8px;font-weight:700;padding:1px 5px;border-radius:3px;white-space:nowrap;}
.badge-go{background:#1a3a7a;color:#6699ff;border:1px solid #2244aa;}
.badge-status{background:#1a3a2a;color:#44bb88;border:1px solid #226644;}
.badge-thx{background:#3a2a00;color:#f5a000;border:1px solid #664400;}
.badge-other{background:#2a1a3a;color:#9966ff;border:1px solid #442266;}
.t-sep{height:1px;background:#111130;margin:0 12px;}

#status-bar{flex-shrink:0;padding:5px 13px;font-size:9.5px;
  border-top:1px solid #1a1a38;line-height:1.5;word-break:break-all;color:#505070;}
#status-bar.ok{color:#40a070;}
#status-bar.ng{color:#a04040;}

#map-wrap{flex:1;position:relative;}
#map{width:100%;height:100%;background:#07071a;}
#loading-overlay{position:absolute;inset:0;background:#07071a;display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:13px;z-index:1000;}
.spin{width:28px;height:28px;border:2.5px solid #28285a;border-top-color:#f5a000;
  border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.ld-txt{font-size:11px;color:#4040a0;letter-spacing:.1em;}
#ld-sub{font-size:9px;color:#30305a;margin-top:3px;}

/* initial loading screen */
#init-loading{position:fixed;inset:0;background:#07071a;z-index:9999;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;}

.leaflet-tooltip{background:#0c0c28 !important;border:1px solid #f5a00055 !important;
  color:#d0d2f8 !important;font-size:10px !important;
  font-family:'Hiragino Kaku Gothic ProN',sans-serif !important;
  padding:4px 9px !important;border-radius:5px !important;}
.leaflet-tooltip::before{display:none !important;}
.leaflet-control-zoom a{background:#0f0f28 !important;color:#6060a0 !important;border-color:#28285a !important;}
.leaflet-control-zoom a:hover{background:#1c1c50 !important;color:#f5a000 !important;}
</style>
</head>
<body>

<!-- 初期ローディング -->
<div id="init-loading">
  <div class="spin"></div>
  <div class="ld-txt">データを読み込み中...</div>
  <div id="init-sub" style="font-size:9px;color:#30305a;margin-top:3px;">日報を取得しています</div>
</div>

<!-- VIEW 1: 日報一覧 -->
<div id="view-dates">
  <div class="dl-head">
    <div>
      <div class="dl-subtitle">Route Trace · 武三23区</div>
      <div class="dl-title">営業日報 一覧</div>
    </div>
    <div class="dl-filters">
      <button class="dl-filter active" onclick="filterDates('all',this)">全件</button>
      <button class="dl-filter" onclick="filterDates('high',this)">10万超</button>
      <button class="dl-filter" onclick="filterDates('low',this)">8万未満</button>
    </div>
  </div>
  <div class="dl-table-wrap">
    <table id="date-table">
      <thead>
        <tr>
          <th>日付</th><th>曜</th><th>営収</th><th>件数</th><th>平均単価</th>
        </tr>
      </thead>
      <tbody id="date-tbody"></tbody>
    </table>
  </div>
</div>

<!-- VIEW 2: ルートマップ -->
<div id="view-route">
  <div id="sidebar">
    <div class="s-back" onclick="showDatesView()">
      <span class="s-back-arrow">←</span>
      <span class="s-back-txt">日報一覧に戻る</span>
    </div>
    <div class="s-head">
      <div class="s-eye">Route Trace · 武三23区</div>
      <div class="s-date" id="s-date">—</div>
      <div class="s-dow" id="s-dow">—</div>
    </div>
    <div class="stats-grid">
      <div class="stat-cell"><div class="stat-lbl">営収（日報）</div><div class="stat-val" id="st-fare">—</div></div>
      <div class="stat-cell"><div class="stat-lbl">件数</div><div class="stat-val" id="st-cnt">—</div></div>
      <div class="stat-cell"><div class="stat-lbl">¥5,000+</div><div class="stat-val" id="st-long">—</div></div>
      <div class="stat-cell"><div class="stat-lbl">平均単価</div><div class="stat-val" id="st-avg">—</div></div>
    </div>
    <div class="legend-bar">
      <div class="leg-btn active" id="leg-trip" onclick="toggleLayer('trip',this)">
        <span class="leg-line" style="background:#f5a000;height:2px;"></span>実車
      </div>
      <div class="leg-btn active" id="leg-dead" onclick="toggleLayer('dead',this)">
        <span class="leg-dash" style="color:#4488bb;"></span>空車移動
      </div>
    </div>
    <div id="trip-list"></div>
    <div id="status-bar">読み込み中...</div>
  </div>
  <div id="map-wrap">
    <div id="map"></div>
    <div id="loading-overlay">
      <div class="spin"></div>
      <div class="ld-txt">ルートを読み込み中...</div>
      <div id="ld-sub"></div>
    </div>
  </div>
</div>

<script>
const URL_COORD='./busann23ku_gsi_coordinates.csv';
const URL_DAILY='https://docs.google.com/spreadsheets/d/e/2PACX-1vT2iLNU2ehDRMl7CQt2ETLkVwIeIRMAEpNsFjImdrWDBGuiTWLiwXc9aTtnhbJzWl0uvN0kEPw9Bd-0/pub?gid=0&single=true&output=csv';
const URL_BD='https://docs.google.com/spreadsheets/d/e/2PACX-1vTm1IwbqhN5odntM8GhM4xHZwR3h1a4WKeWpt-4eLDczrGTTAVz8Bl49SI_c0jGEVrp0t_8iRMTN77A/pub?gid=0&single=true&output=csv';

const C_PW='乗車地：市区',C_PT='乗車地：地名',C_DW='降車地：市区',C_DT='降車地：地名',C_TIME='乗車時間';

let leafMap,coordMap=new Map(),bdCache=null,dailyCache=null;
let tripLayers=[],deadLayers=[],activeN=null;
let showTrip=true,showDead=true;
const DOW=['日','月','火','水','木','金','土'];

// ── Map init ─────────────────────────────────────────
leafMap=L.map('map',{center:[35.68,139.71],zoom:12});
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
  {attribution:'© OpenStreetMap © CARTO',subdomains:'abcd',maxZoom:19}).addTo(leafMap);

function setSub(s){document.getElementById('ld-sub').textContent=s;}
function showMapLoad(){document.getElementById('loading-overlay').style.display='flex';}
function hideMapLoad(){document.getElementById('loading-overlay').style.display='none';}
function setStatus(s,cls=''){const el=document.getElementById('status-bar');el.textContent=s;el.className=cls;}

// ── Address normalize ─────────────────────────────────
function na(s){
  if(!s)return'';
  return String(s).trim().replace(/[\s　\t\r\n]+/g,'').replace(/：/g,':')
    .replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0))
    .replace(/一丁目/g,'1丁目').replace(/二丁目/g,'2丁目').replace(/三丁目/g,'3丁目')
    .replace(/四丁目/g,'4丁目').replace(/五丁目/g,'5丁目').replace(/六丁目/g,'6丁目')
    .replace(/七丁目/g,'7丁目').replace(/八丁目/g,'8丁目').replace(/九丁目/g,'9丁目');
}
function stripSono(s){return String(s||'').replace(/^その他/,'');}
function stripPref(s){return s.replace(/^[\u4e00-\u9fa5]{2,3}[都道府県]/,'');}
function stripWard(s){return s.replace(/^[\u4e00-\u9fa5]+[区市]/,'');}

// ── Coord map ─────────────────────────────────────────
function buildCoordMap(rows){
  const m=new Map();
  rows.forEach(row=>{
    const addr=row['住所']||row[Object.keys(row)[0]]||'';
    const lat=parseFloat(row['緯度(latitude)']||row['緯度']||row[Object.keys(row)[1]]);
    const lng=parseFloat(row['経度(longitude)']||row['経度']||row[Object.keys(row)[2]]);
    if(!addr||isNaN(lat)||isNaN(lng))return;
    const key=na(addr);const v={lat,lng};
    m.set(key,v);
    const noPref=stripPref(key);
    if(noPref!==key)m.set(noPref,v);
  });
  return m;
}
function getCoords(addr){
  if(!addr||!addr.trim())return null;
  const base=na(addr),stripped=na(stripSono(addr));
  for(const c of [base,stripped,stripWard(base),stripWard(stripped),stripPref(base),stripWard(stripPref(base))]){
    if(!c)continue;
    if(coordMap.has(c))return coordMap.get(c);
    let best=null,bl=0;
    for(const[k,v]of coordMap){if(c.startsWith(k)&&k.length>bl){best=v;bl=k.length;}}
    if(best)return best;
  }
  return null;
}

// ── CSV fetch ─────────────────────────────────────────
async function fetchCSV(url){
  const r=await fetch(url);
  if(!r.ok)throw new Error('HTTP '+r.status+' '+url.split('/').pop());
  return Papa.parse(await r.text(),{header:true,skipEmptyLines:true,dynamicTyping:false,
    transformHeader:h=>h.trim().replace(/^\uFEFF/,'')}).data;
}

// ── Date helpers ──────────────────────────────────────
function matchDate(row,y,m,d){
  const s=Object.values(row).map(v=>String(v||'')).join(' ');
  const m2=String(m).padStart(2,'0'),d2=String(d).padStart(2,'0'),ry=y-2018;
  const pats=[`${y}/${m}/${d}`,`${y}/${m2}/${d2}`,`${y}-${m2}-${d2}`,`${y}年${m}月${d}日`,
    `R${ry}/${m}/${d}`,`R${ry}.${m}.${d}`,`令和${ry}年${m}月${d}日`];
  if(pats.some(p=>s.includes(p)))return true;
  if(!/20\d\d|R\d|令和/.test(s))return[`${m}/${d}`,`${m}月${d}`].some(p=>s.includes(p));
  return false;
}
function parseFare(v){return parseInt(String(v||'').replace(/[^0-9]/g,''))||0;}
function pf(n){return n?'¥'+n.toLocaleString():'—';}
function sl(s,n=13){if(!s||!s.trim())return'—';return s.length>n?s.slice(0,n)+'…':s;}
function resolveCol(keys,want){
  if(keys.includes(want))return want;
  const alts=[want.replace(/：/g,':'),want.replace(/:/g,'：')];
  return keys.find(k=>alts.includes(k)||na(k)===na(want))||null;
}

// ── Extract date from daily report row ───────────────
function extractDateFromRow(row){
  const vals=Object.values(row).map(v=>String(v||''));
  // Try to find a date-like value
  for(const v of vals){
    // yyyy/m/d or yyyy/mm/dd
    let m=v.match(/(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);
    if(m)return{y:+m[1],m:+m[2],d:+m[3]};
    // R8.3.19 etc.
    m=v.match(/R(\d+)[\.\/](\d{1,2})[\.\/](\d{1,2})/);
    if(m)return{y:+m[1]+2018,m:+m[2],d:+m[3]};
    // 令和8年3月19日
    m=v.match(/令和(\d+)年(\d{1,2})月(\d{1,2})日/);
    if(m)return{y:+m[1]+2018,m:+m[2],d:+m[3]};
  }
  return null;
}

// ── Status badge ──────────────────────────────────────
function statusBadge(status){
  if(!status||!status.trim())return'';
  const s=String(status).trim();
  if(s.includes('Go')||s.includes('GO')||s.includes('go'))
    return`<span class="badge badge-go">${s}</span>`;
  if(s.includes('アプリ')||s.includes('配車'))
    return`<span class="badge badge-status">${s}</span>`;
  if(s.includes('流し')||s.includes('つけ')||s.includes('付け'))
    return`<span class="badge badge-other">${s}</span>`;
  return`<span class="badge badge-other">${sl(s,8)}</span>`;
}
function thxBadge(thx){
  if(!thx||thx==='0'||thx===''||thx==='false')return'';
  return`<span class="badge badge-thx">サンキュー</span>`;
}

// ── Layer visibility ──────────────────────────────────
function toggleLayer(type,btn){
  btn.classList.toggle('active');
  if(type==='trip'){
    showTrip=btn.classList.contains('active');
    tripLayers.forEach(l=>{
      if(l.line)l.line.setOpacity(showTrip?0.55:0);
      if(l.pm)l.pm.setOpacity(showTrip?1:0);
      if(l.dm)l.dm.setOpacity(showTrip?1:0);
    });
  } else {
    showDead=btn.classList.contains('active');
    deadLayers.forEach(l=>l.setOpacity(showDead?0.35:0));
  }
}

// ── Active trip ───────────────────────────────────────
function setActive(n){
  if(activeN!==null){
    document.getElementById('tr-'+activeN)?.classList.remove('active');
    const p=tripLayers.find(l=>l.n===activeN);
    if(p){if(p.line)p.line.setStyle({color:'#f5a000',weight:1.8,opacity:showTrip?.55:0});
      if(p.pm)p.pm.setIcon(iconP(activeN,false));if(p.dm)p.dm.setIcon(iconD(false));}
  }
  activeN=n;
  const el=document.getElementById('tr-'+n);
  if(el){el.classList.add('active');el.scrollIntoView({behavior:'smooth',block:'nearest'});}
  const c=tripLayers.find(l=>l.n===n);
  if(c){if(c.line)c.line.setStyle({color:'#fff',weight:3,opacity:.9});
    if(c.line)c.line.bringToFront();
    if(c.pm)c.pm.setIcon(iconP(n,true));if(c.dm)c.dm.setIcon(iconD(true));
    leafMap.panTo(c.pm.getLatLng(),{animate:true,duration:.4});}
}

function clearMap(){
  tripLayers.forEach(l=>{if(l.line)l.line.remove();if(l.pm)l.pm.remove();if(l.dm)l.dm.remove();});
  deadLayers.forEach(l=>l.remove());
  tripLayers=[];deadLayers=[];activeN=null;
  document.getElementById('trip-list').innerHTML='';
}

// ── Icons ─────────────────────────────────────────────
function iconP(n,act){
  const bg=act?'#fff':'#f5a000';
  const sh=act?'0 0 0 2px #f5a000,0 2px 8px rgba(0,0,0,.7)':'0 0 0 1.5px #000,0 2px 6px rgba(0,0,0,.6)';
  return L.divIcon({html:`<div style="width:22px;height:22px;background:${bg};border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:900;color:#000;font-family:sans-serif;box-shadow:${sh};">${n}</div>`,className:'',iconSize:[22,22],iconAnchor:[11,11]});
}
function iconD(act){return L.divIcon({html:`<div style="width:8px;height:8px;background:${act?'#f5a000':'#7070b8'};border-radius:50%;border:1.5px solid ${act?'#f5a000':'#222'};"></div>`,className:'',iconSize:[8,8],iconAnchor:[4,4]});}

// ══════════════════════════════════════════════
//  VIEW 1: 日報一覧
// ══════════════════════════════════════════════
let allDailyRows=[];
let currentFilter='all';

function filterDates(f,btn){
  currentFilter=f;
  document.querySelectorAll('.dl-filter').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderDateTable();
}

function renderDateTable(){
  const tbody=document.getElementById('date-tbody');
  tbody.innerHTML='';
  let rows=[...allDailyRows];
  if(currentFilter==='high')rows=rows.filter(r=>r.fare>=100000);
  if(currentFilter==='low') rows=rows.filter(r=>r.fare>0&&r.fare<80000);

  rows.forEach(r=>{
    const tr=document.createElement('tr');
    if(r.fare>=100000)tr.className='high';
    const highBadge=r.fare>=100000?'<span class="badge-high">10万超</span>':'';
    const lowBadge=r.fare>0&&r.fare<80000?'<span class="badge-low">低</span>':'';
    const avg=r.cnt>0?Math.round(r.fare/r.cnt):0;
    tr.innerHTML=`
      <td class="date-cell">${r.dateStr}${highBadge}${lowBadge}</td>
      <td class="dow-cell">${r.dow}</td>
      <td class="fare-cell">${pf(r.fare)}</td>
      <td class="cnt-cell">${r.cnt||'—'}</td>
      <td class="avg-cell" style="font-size:11px;color:#8080b0;">${avg?pf(avg):'—'}</td>`;
    tr.addEventListener('click',()=>loadRoute(r.y,r.m,r.d,r.fare,r.cnt));
    tbody.appendChild(tr);
  });

  if(!rows.length){
    const tr=document.createElement('tr');
    tr.innerHTML=`<td colspan="5" style="text-align:center;color:#404060;padding:24px;">データなし</td>`;
    tbody.appendChild(tr);
  }
}

function showDatesView(){
  document.getElementById('view-dates').className='active';
  document.getElementById('view-route').className='';
}
function showRouteView(){
  document.getElementById('view-dates').className='';
  document.getElementById('view-route').className='active';
}

// ══════════════════════════════════════════════
//  VIEW 2: ルートマップ
// ══════════════════════════════════════════════
async function loadRoute(y,m,d,dailyFarePre,dailyCntPre){
  showRouteView();
  clearMap();
  showMapLoad();

  const dateStr=`${y}/${m}/${d}`;
  const dateKey=`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  document.getElementById('s-date').textContent=dateStr;
  document.getElementById('s-dow').textContent=`${DOW[new Date(y,m-1,d).getDay()]}曜日`;

  try{
    setSub('日報詳細を取得中...');
    if(!bdCache)bdCache=await fetchCSV(URL_BD);
    if(!bdCache.length)throw new Error('日報詳細CSVが空');

    const bk=Object.keys(bdCache[0]);
    const cpw=resolveCol(bk,C_PW),cpt=resolveCol(bk,C_PT);
    const cdw=resolveCol(bk,C_DW),cdt=resolveCol(bk,C_DT);
    const ctm=resolveCol(bk,C_TIME);
    const cFareB=resolveCol(bk,'料金')||bk.find(k=>k.includes('料金'));
    const cStatus=resolveCol(bk,'ステータス')||bk.find(k=>k.includes('ステータス')||k.includes('status'));
    const cThx=resolveCol(bk,'サンキュー')||bk.find(k=>k.includes('サンキュー')||k.includes('サンキュ'));

    setSub(`${dateStr} を抽出中...`);
    const dayRows=bdCache.filter(r=>matchDate(r,y,m,d));
    if(!dayRows.length){
      throw new Error(`${dateStr} のデータが見つかりません`);
    }

    // Build trips
    const trips=dayRows.map((row,i)=>{
      const pw=cpw?String(row[cpw]||'').trim():'';
      const pt=cpt?String(row[cpt]||'').trim():'';
      const dw=cdw?String(row[cdw]||'').trim():'';
      const dt=cdt?String(row[cdt]||'').trim():'';
      const pickup=(pw+pt).trim(), dropoff=(dw+dt).trim();
      return{n:i+1,pickup,dropoff,
        fare:parseFare(cFareB?row[cFareB]:''),
        time:ctm?String(row[ctm]||''):'',
        status:cStatus?String(row[cStatus]||''):'',
        thx:cThx?String(row[cThx]||''):'',
        pc:getCoords(pickup),dc:getCoords(dropoff),ok:false};
    });
    trips.forEach(t=>{t.ok=!!(t.pc&&t.dc);});

    const matched=trips.filter(t=>t.ok).length;

    // Stats — 日報からの営収を優先
    const fareDisplay=dailyFarePre||trips.reduce((s,t)=>s+t.fare,0);
    const tripCnt=dailyCntPre||trips.length;
    const long=trips.filter(t=>t.fare>=5000).length;
    const avg=tripCnt>0?Math.round(fareDisplay/tripCnt):0;
    document.getElementById('st-fare').innerHTML='¥'+fareDisplay.toLocaleString();
    document.getElementById('st-cnt').innerHTML=tripCnt+'<span class="stat-unit"> 件</span>';
    document.getElementById('st-long').innerHTML=long+'<span class="stat-unit"> 件</span>';
    document.getElementById('st-avg').innerHTML='¥'+avg.toLocaleString();

    // Sidebar list
    const list=document.getElementById('trip-list');
    trips.forEach((t,i)=>{
      if(i>0){const s=document.createElement('div');s.className='t-sep';list.appendChild(s);}
      const div=document.createElement('div');
      div.className='t-row'+(t.ok?'':' no-map');
      div.id='tr-'+t.n;
      div.innerHTML=`<div class="t-num">${t.n}</div><div class="t-body">
        <div class="t-loc"><span class="t-from">${sl(t.pickup)}</span><span class="t-arr">↓</span><span class="t-to">${sl(t.dropoff)}</span></div>
        <div class="t-meta">
          <div class="t-fare">${pf(t.fare)}</div>
          ${t.time?`<div class="t-time">${t.time}</div>`:''}
          ${statusBadge(t.status)}
          ${thxBadge(t.thx)}
          ${!t.ok?'<span style="font-size:8px;color:#404060;">未取得</span>':''}
        </div></div>`;
      if(t.ok)div.addEventListener('click',()=>setActive(t.n));
      list.appendChild(div);
    });

    // Map — dead run lines first (bottom layer)
    const bounds=[];
    const validTrips=trips.filter(t=>t.ok);

    // Dead-run lines: trip[i].dropoff → trip[i+1].pickup
    for(let i=0;i<validTrips.length-1;i++){
      const a=validTrips[i],b=validTrips[i+1];
      const dl=L.polyline(
        [[a.dc.lat,a.dc.lng],[b.pc.lat,b.pc.lng]],
        {color:'#4488bb',weight:1,opacity:showDead?.35:0,dashArray:'6 8'}
      ).addTo(leafMap);
      deadLayers.push(dl);
    }

    // Trip lines + markers
    validTrips.forEach(t=>{
      const line=L.polyline([[t.pc.lat,t.pc.lng],[t.dc.lat,t.dc.lng]],
        {color:'#f5a000',weight:1.8,opacity:showTrip?.55:0}).addTo(leafMap);
      const pm=L.marker([t.pc.lat,t.pc.lng],{icon:iconP(t.n,false)}).addTo(leafMap)
        .bindTooltip(`#${t.n} 乗：${t.pickup}${t.status?' ['+t.status+']':''}`,{direction:'top'});
      const dm=L.marker([t.dc.lat,t.dc.lng],{icon:iconD(false)}).addTo(leafMap)
        .bindTooltip(`#${t.n} 降：${t.dropoff}`,{direction:'top'});
      [line,pm,dm].forEach(el=>el.on('click',()=>setActive(t.n)));
      tripLayers.push({n:t.n,line,pm,dm});
      bounds.push([t.pc.lat,t.pc.lng],[t.dc.lat,t.dc.lng]);
    });

    if(bounds.length)leafMap.fitBounds(bounds,{padding:[50,50]});

    const unmatched=trips.filter(t=>!t.ok);
    let st=`プロット: ${matched}/${trips.length}件`;
    if(unmatched.length)st+=` | 未取得: `+unmatched.slice(0,2).map(t=>sl(t.pickup,10)).join(', ');
    setStatus(st,matched>0?'ok':'ng');
    hideMapLoad();

  }catch(err){
    document.getElementById('loading-overlay').innerHTML=`<div style="text-align:center;padding:24px"><div style="color:#c04040;font-size:13px;margin-bottom:8px">エラー</div><div style="color:#5050a0;font-size:11px;max-width:260px;line-height:1.8">${err.message}</div></div>`;
    setStatus('エラー: '+err.message,'ng');
  }
}

// ══════════════════════════════════════════════
//  INIT: 全データ読み込み
// ══════════════════════════════════════════════
async function init(){
  try{
    // 座標CSV
    document.getElementById('init-sub').textContent='座標データを読み込み中...';
    coordMap=buildCoordMap(await fetchCSV(URL_COORD));

    // 日報CSV
    document.getElementById('init-sub').textContent='日報を読み込み中...';
    dailyCache=await fetchCSV(URL_DAILY);

    // 日報の列を解析して一覧を作る
    if(dailyCache.length>0){
      const dk=Object.keys(dailyCache[0]);

      // 営収列と件数列を検出（全列を試す）
      // まず全列名を診断表示
      const fareCol=dk.find(k=>k==='営収')||dk.find(k=>k.includes('営収'));
      const cntCol=dk.find(k=>k==='件数')||dk.find(k=>k.includes('件数'));

      allDailyRows=[];
      dailyCache.forEach(row=>{
        const dateInfo=extractDateFromRow(row);
        if(!dateInfo)return;
        const {y,m,d}=dateInfo;
        const fare=fareCol?parseFare(row[fareCol]):0;
        const cnt=cntCol?parseInt(row[cntCol])||0:0;
        const dateStr=`${y}/${m}/${d}`;
        const dow=DOW[new Date(y,m-1,d).getDay()]||'';
        allDailyRows.push({y,m,d,dateStr,dow,fare,cnt});
      });

      // Sort descending by date
      allDailyRows.sort((a,b)=>(b.y-a.y)||(b.m-a.m)||(b.d-a.d));
    }

    document.getElementById('init-loading').style.display='none';
    renderDateTable();
    showDatesView();

  }catch(err){
    document.getElementById('init-sub').textContent='エラー: '+err.message;
    console.error(err);
  }
}

init();
</script>
