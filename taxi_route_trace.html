<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>営業ルートトレース</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',sans-serif;background:#080810;color:#d8daf0;display:flex;height:100vh;overflow:hidden;}

/* ── SIDEBAR ──────────────────────────────── */
#sidebar{width:310px;min-width:310px;background:#0d0d18;border-right:1px solid #1c1c2e;display:flex;flex-direction:column;overflow:hidden;z-index:10;}
.s-head{padding:12px 13px 10px;border-bottom:1px solid #1c1c2e;}
.s-eye{font-size:9px;letter-spacing:.2em;color:#f5a000;text-transform:uppercase;margin-bottom:6px;}
.date-row{display:flex;gap:6px;align-items:center;}
#date-input{flex:1;background:#141420;border:1px solid #252538;color:#fff;padding:5px 9px;border-radius:6px;font-size:13px;font-family:inherit;outline:none;}
#date-input:focus{border-color:#f5a00055;}
#load-btn{background:#f5a000;color:#000;border:none;padding:5px 13px;border-radius:6px;font-size:11px;font-weight:800;cursor:pointer;font-family:inherit;transition:background .15s;white-space:nowrap;}
#load-btn:hover{background:#ffbb33;}
.s-dow{font-size:10px;color:#333352;margin-top:4px;}

/* settings toggle */
#cfg-toggle{padding:5px 13px;font-size:9px;color:#333352;cursor:pointer;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #1c1c2e;user-select:none;}
#cfg-toggle:hover{color:#5a5a7a;background:#0a0a14;}
#cfg-panel{background:#0a0a14;border-bottom:1px solid #1c1c2e;padding:8px 13px;display:none;}
#cfg-panel.open{display:block;}
.cfg-row{display:flex;align-items:center;gap:6px;margin-bottom:5px;}
.cfg-row:last-child{margin-bottom:0;}
.cfg-lbl{font-size:9px;color:#3a3a58;width:68px;flex-shrink:0;letter-spacing:.05em;}
.cfg-sel{flex:1;background:#0f0f1e;border:1px solid #252540;color:#9090b8;padding:3px 6px;border-radius:4px;font-size:10px;font-family:inherit;outline:none;}
.cfg-sel:focus{border-color:#f5a00055;}
.cfg-sel option{background:#0f0f1e;}
#cfg-apply{width:100%;margin-top:7px;background:#1a1a2e;color:#f5a000;border:1px solid #f5a00033;padding:6px;border-radius:5px;font-size:10px;font-weight:800;cursor:pointer;font-family:inherit;transition:background .15s;}
#cfg-apply:hover{background:#252540;}

/* stats */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:#1c1c2e;border-bottom:1px solid #1c1c2e;}
.stat-cell{background:#0d0d18;padding:9px 13px;}
.stat-lbl{font-size:8px;letter-spacing:.1em;color:#303048;text-transform:uppercase;margin-bottom:2px;}
.stat-val{font-size:14px;font-weight:800;color:#f5a000;line-height:1;}
.stat-unit{font-size:9px;font-weight:400;color:#666;}

/* trip list */
#trip-list{flex:1;overflow-y:auto;padding:4px 0;}
#trip-list::-webkit-scrollbar{width:3px;}
#trip-list::-webkit-scrollbar-thumb{background:#1e1e30;border-radius:2px;}
.trip-row{display:flex;align-items:flex-start;gap:8px;padding:6px 11px;cursor:pointer;border-left:2px solid transparent;transition:background .1s,border-color .1s;}
.trip-row:hover{background:#111120;border-left-color:#f5a00033;}
.trip-row.active{background:#14142a;border-left-color:#f5a000;}
.trip-row.no-map{opacity:.3;cursor:default;}
.trip-row.no-map:hover{background:transparent;border-left-color:transparent;}
.t-badge{width:21px;height:21px;min-width:21px;background:#f5a000;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:900;color:#000;margin-top:1px;}
.trip-row.active .t-badge{background:#fff;}
.trip-row.no-map .t-badge{background:#1e1e30;color:#444;}
.t-info{flex:1;min-width:0;}
.t-loc{font-size:10px;color:#7878a0;line-height:1.5;}
.t-loc .from,.t-loc .to{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.t-loc .arr{font-size:8px;color:#f5a00033;}
.t-meta{display:flex;gap:6px;align-items:center;margin-top:2px;}
.t-fare{font-size:11px;font-weight:800;color:#f5a000;}
.t-time{font-size:9px;color:#2a2a48;}
.t-tag{font-size:8px;color:#2a2a48;}
.t-div{height:1px;background:#0f0f28;margin:0 11px;}

/* debug */
#dbg-bar{border-top:1px solid #1c1c2e;padding:5px 12px;font-size:9px;color:#222238;cursor:pointer;display:flex;justify-content:space-between;user-select:none;}
#dbg-bar:hover{color:#3a3a58;}
#dbg-body{background:#050510;padding:7px 12px;max-height:160px;overflow-y:auto;font-size:9px;font-family:'SF Mono','Consolas',monospace;color:#28283e;display:none;}
#dbg-body.open{display:block;}
#dbg-body::-webkit-scrollbar{width:2px;}
#dbg-body::-webkit-scrollbar-thumb{background:#1c1c2e;}
.dl{margin-bottom:1.5px;line-height:1.4;}
.ok{color:#286040;}.warn{color:#785020;}.err{color:#782020;}

/* ── MAP ────────────────────────────────── */
#map-wrap{flex:1;position:relative;}
#map{width:100%;height:100%;background:#080810;}
#loading{position:absolute;inset:0;background:#080810;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:1000;}
.spin{width:28px;height:28px;border:2px solid #1c1c2e;border-top-color:#f5a000;border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.ld-msg{font-size:11px;color:#30304a;letter-spacing:.1em;}
#ld-step{font-size:9px;color:#20203a;margin-top:4px;}
#legend{position:absolute;bottom:20px;right:10px;background:rgba(8,8,20,.9);border:1px solid #1c1c2e;border-radius:8px;padding:9px 12px;z-index:500;font-size:10px;color:#44445a;backdrop-filter:blur(6px);display:none;}
.lg-row{display:flex;align-items:center;gap:7px;margin-bottom:5px;}
.lg-row:last-child{margin-bottom:0;}
.lg-c{width:17px;height:17px;background:#f5a000;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:900;color:#000;flex-shrink:0;}
.lg-d{width:8px;height:8px;background:#777;border-radius:50%;flex-shrink:0;margin:0 4.5px;}
.lg-l{width:20px;height:2px;background:#f5a000;opacity:.5;flex-shrink:0;}
.leaflet-tooltip{background:#0c0c1c !important;border:1px solid #f5a00044 !important;color:#c8cae8 !important;font-size:10px !important;font-family:'Hiragino Kaku Gothic ProN',sans-serif !important;padding:4px 9px !important;border-radius:5px !important;box-shadow:0 3px 10px rgba(0,0,0,.6) !important;}
.leaflet-tooltip::before{display:none !important;}
.leaflet-control-zoom a{background:#0d0d18 !important;color:#555 !important;border-color:#1c1c2e !important;}
.leaflet-control-zoom a:hover{background:#141428 !important;color:#f5a000 !important;}
</style>
</head>
<body>
<div id="sidebar">
  <div class="s-head">
    <div class="s-eye">Route Trace · 武三23区</div>
    <div class="date-row">
      <input type="date" id="date-input" value="2026-03-19">
      <button id="load-btn" onclick="loadData()">表示</button>
    </div>
    <div class="s-dow" id="s-dow">2026年3月19日（木）</div>
  </div>

  <!-- Column settings panel -->
  <div id="cfg-toggle" onclick="toggleCfg()">
    <span>⚙ 列設定（マッチしない場合ここで調整）</span><span id="cfg-arrow">▲</span>
  </div>
  <div id="cfg-panel">
    <div class="cfg-row">
      <span class="cfg-lbl">乗車：市区</span>
      <select class="cfg-sel" id="sel-p-ward"><option value="">— 未設定 —</option></select>
    </div>
    <div class="cfg-row">
      <span class="cfg-lbl">乗車：丁名</span>
      <select class="cfg-sel" id="sel-p-town"><option value="">— 未設定 —</option></select>
    </div>
    <div class="cfg-row">
      <span class="cfg-lbl">降車：市区</span>
      <select class="cfg-sel" id="sel-d-ward"><option value="">— 未設定 —</option></select>
    </div>
    <div class="cfg-row">
      <span class="cfg-lbl">降車：丁名</span>
      <select class="cfg-sel" id="sel-d-town"><option value="">— 未設定 —</option></select>
    </div>
    <div class="cfg-row">
      <span class="cfg-lbl">営収</span>
      <select class="cfg-sel" id="sel-fare"><option value="">— 未設定 —</option></select>
    </div>
    <div class="cfg-row">
      <span class="cfg-lbl">時刻</span>
      <select class="cfg-sel" id="sel-time"><option value="">— 未設定 —</option></select>
    </div>
    <button id="cfg-apply" onclick="applyAndRender()">この設定で描画</button>
  </div>

  <div class="stats-grid">
    <div class="stat-cell"><div class="stat-lbl">営収</div><div class="stat-val" id="st-fare">—</div></div>
    <div class="stat-cell"><div class="stat-lbl">件数</div><div class="stat-val" id="st-cnt">—</div></div>
    <div class="stat-cell"><div class="stat-lbl">¥5,000+</div><div class="stat-val" id="st-long">—</div></div>
    <div class="stat-cell"><div class="stat-lbl">平均単価</div><div class="stat-val" id="st-avg">—</div></div>
  </div>

  <div id="trip-list"></div>

  <div id="dbg-bar" onclick="toggleDbg()">
    <span>デバッグ情報</span><span id="dbg-arrow2">▲</span>
  </div>
  <div id="dbg-body"></div>
</div>

<div id="map-wrap">
  <div id="map"></div>
  <div id="loading">
    <div class="spin"></div>
    <div class="ld-msg">データを読み込み中...</div>
    <div id="ld-step">初期化中</div>
  </div>
  <div id="legend">
    <div class="lg-row"><div class="lg-c">1</div>乗車地点（番号順）</div>
    <div class="lg-row"><div class="lg-d"></div>降車地点</div>
    <div class="lg-row"><div class="lg-l"></div>ルート（直線）</div>
  </div>
</div>

<script>
const URL_BREAKDOWN='https://docs.google.com/spreadsheets/d/e/2PACX-1vTm1IwbqhN5odntM8GhM4xHZwR3h1a4WKeWpt-4eLDczrGTTAVz8Bl49SI_c0jGEVrp0t_8iRMTN77A/pub?gid=0&single=true&output=csv';
const URL_COORDS='https://docs.google.com/spreadsheets/d/e/2PACX-1vSpOj4QzyarqZtTDM5bld8QDEIzRodRLUwAfF8u42CbgTuGPoKqWrOKtw2Ddrhm0OnONlVnzwc8c1BX/pub?gid=1210114672&single=true&output=csv';

let leafMap, coordMap=new Map(), csvCache=null;
let tripLayers=[], activeN=null;
let allColKeys=[];  // all column names from breakdown CSV

leafMap=L.map('map',{center:[35.68,139.71],zoom:12});
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{attribution:'© OpenStreetMap © CARTO',subdomains:'abcd',maxZoom:19}).addTo(leafMap);

// ── Debug ──────────────────────────────────────────
function log(msg,cls=''){const el=document.createElement('div');el.className='dl'+(cls?' '+cls:'');el.textContent=msg;const b=document.getElementById('dbg-body');b.appendChild(el);b.scrollTop=9999;}
function clearLog(){document.getElementById('dbg-body').innerHTML='';}
function toggleDbg(){const b=document.getElementById('dbg-body');b.classList.toggle('open');document.getElementById('dbg-arrow2').textContent=b.classList.contains('open')?'▼':'▲';}
function openDbg(){document.getElementById('dbg-body').classList.add('open');document.getElementById('dbg-arrow2').textContent='▼';}
function toggleCfg(){const p=document.getElementById('cfg-panel');p.classList.toggle('open');document.getElementById('cfg-arrow').textContent=p.classList.contains('open')?'▼':'▲';}
function openCfg(){document.getElementById('cfg-panel').classList.add('open');document.getElementById('cfg-arrow').textContent='▼';}
function setStep(s){document.getElementById('ld-step').textContent=s;}
function showLoading(){document.getElementById('loading').style.display='flex';document.getElementById('legend').style.display='none';}
function hideLoading(){document.getElementById('loading').style.display='none';document.getElementById('legend').style.display='block';}

// ── CSV ────────────────────────────────────────────
async function fetchCSV(url){
  const r=await fetch(url);
  if(!r.ok)throw new Error('HTTP '+r.status);
  const t=await r.text();
  return Papa.parse(t,{header:true,skipEmptyLines:true,dynamicTyping:false,transformHeader:h=>h.trim().replace(/^\uFEFF/,'')}).data;
}

// ── Normalize ──────────────────────────────────────
function norm(s){
  if(!s)return'';
  return String(s).trim().replace(/[\s　\t]+/g,'')
    .replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0))
    .replace(/一丁目/g,'1丁目').replace(/二丁目/g,'2丁目').replace(/三丁目/g,'3丁目')
    .replace(/四丁目/g,'4丁目').replace(/五丁目/g,'5丁目').replace(/六丁目/g,'6丁目')
    .replace(/七丁目/g,'7丁目').replace(/八丁目/g,'8丁目').replace(/九丁目/g,'9丁目');
}
function stripSonota(s){return String(s||'').replace(/^その他/,'');}

// ── Coord map ──────────────────────────────────────
function buildCoordMap(rows){
  if(!rows.length)return new Map();
  const keys=Object.keys(rows[0]);
  log('座標CSV列: '+keys.join(' | '));
  const latCol=keys.find(k=>/緯度|lat/i.test(k))||keys[keys.length-2];
  const lngCol=keys.find(k=>/経度|lng|lon/i.test(k))||keys[keys.length-1];
  const nameCols=keys.filter(k=>k!==latCol&&k!==lngCol);
  log('name列:['+nameCols.join(',')+'] lat="'+latCol+'" lng="'+lngCol+'"','ok');
  const m=new Map();
  rows.forEach(row=>{
    const fullName=nameCols.map(c=>String(row[c]||'').trim()).join('');
    const lat=parseFloat(row[latCol]),lng=parseFloat(row[lngCol]);
    if(fullName&&!isNaN(lat)&&!isNaN(lng))m.set(norm(fullName),{lat,lng});
  });
  log('座標: '+m.size+'件',m.size>0?'ok':'err');
  if(m.size>0)log('キーサンプル: '+[...m.keys()].slice(0,3).join(' / '));
  return m;
}

function getCoords(location,cmap){
  if(!location)return null;
  const tries=[norm(location),norm(stripSonota(location))];
  for(const n of tries){
    if(!n)continue;
    if(cmap.has(n))return cmap.get(n);
    let best=null,bestLen=0;
    for(const[k,v]of cmap){if(n.startsWith(k)&&k.length>bestLen){best=v;bestLen=k.length;}}
    if(best)return best;
  }
  return null;
}

// ── Date match ─────────────────────────────────────
function matchDate(row,year,month,day){
  const all=Object.values(row).map(v=>String(v||'')).join(' ');
  const pats=[`${year}/${month}/${day}`,`${year}/${String(month).padStart(2,'0')}/${String(day).padStart(2,'0')}`,`${year}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}`,`${year}年${month}月${day}日`];
  if(pats.some(p=>all.includes(p)))return true;
  if(!/20\d\d/.test(all))return[`${month}/${day}`,`${month}月${day}`].some(p=>all.includes(p));
  return false;
}

function findCol(keys,pats){for(const p of pats){const f=keys.find(k=>k.includes(p));if(f)return f;}return null;}
function parseFare(v){return parseInt(String(v||'').replace(/[^0-9]/g,''))||0;}
function fmtFare(n){return n?'¥'+n.toLocaleString():'—';}
function shortLoc(s,n=14){if(!s)return'—';return s.length>n?s.slice(0,n)+'…':s;}
function buildLoc(row,wardCol,townCol){
  const w=wardCol?String(row[wardCol]||'').trim():'';
  const t=townCol?String(row[townCol]||'').trim():'';
  return w+t;
}

// ── Populate select dropdowns ──────────────────────
function populateSelects(keys){
  allColKeys=keys;
  ['sel-p-ward','sel-p-town','sel-d-ward','sel-d-town','sel-fare','sel-time'].forEach(id=>{
    const sel=document.getElementById(id);
    // Keep existing options (first = blank)
    while(sel.options.length>1)sel.remove(1);
    keys.forEach(k=>{
      const opt=document.createElement('option');
      opt.value=k; opt.textContent=k;
      sel.appendChild(opt);
    });
  });
}

// Auto-detect and pre-select
function autoSelect(keys){
  const pick=(id,pats)=>{
    const sel=document.getElementById(id);
    // Try exact, then contains
    for(const p of pats){
      const f=keys.find(k=>k===p);
      if(f){sel.value=f;return f;}
    }
    for(const p of pats){
      const f=keys.find(k=>k.includes(p));
      if(f){sel.value=f;return f;}
    }
    return null;
  };
  const pWard=pick('sel-p-ward',['乗車地:市区','乗車:市区','乗車市区','乗車区市','乗車区','乗区']);
  const pTown=pick('sel-p-town',['乗車地:地名','乗車:地名','乗車地名','乗車丁名','乗車町','乗町']);
  const dWard=pick('sel-d-ward',['降車地:市区','降車:市区','降車市区','降車区市','降車区','降区']);
  const dTown=pick('sel-d-town',['降車地:地名','降車:地名','降車地名','降車丁名','降車町','降町']);
  // fare: prioritize 営収, avoid 納金
  const fareCol=keys.find(k=>k==='営収')||keys.find(k=>k.includes('営収'))||
    keys.find(k=>(k.includes('売上')||k.includes('運賃'))&&!k.includes('納金'))||
    keys.find(k=>k.includes('金額')&&!k.includes('納金'));
  if(fareCol)document.getElementById('sel-fare').value=fareCol;
  const timeCol=findCol(keys,['乗車時刻','乗車時','時刻','time']);
  if(timeCol)document.getElementById('sel-time').value=timeCol;

  log('自動検出: 乗車区="'+(pWard||'—')+'" 丁="'+(pTown||'—')+'" / 降車区="'+(dWard||'—')+'" 丁="'+(dTown||'—')+'"',(pWard&&pTown&&dWard&&dTown)?'ok':'warn');
  if(!pTown||!dTown){
    log('⚠ 丁名列が見つかりません。⚙列設定を開いて手動で選択してください','warn');
    openCfg();
  }
  return{pWard,pTown,dWard,dTown,fareCol,timeCol};
}

// ── Icons ──────────────────────────────────────────
function iconP(n,active){
  const bg=active?'#fff':'#f5a000';
  const sh=active?'0 0 0 2px #f5a000,0 2px 8px rgba(0,0,0,.7)':'0 0 0 1.5px #000,0 2px 6px rgba(0,0,0,.6)';
  return L.divIcon({html:`<div style="width:22px;height:22px;background:${bg};border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:900;color:#000;font-family:sans-serif;box-shadow:${sh};">${n}</div>`,className:'',iconSize:[22,22],iconAnchor:[11,11]});
}
function iconD(active){
  return L.divIcon({html:`<div style="width:9px;height:9px;background:${active?'#f5a000':'#6868a0'};border-radius:50%;border:1.5px solid ${active?'#f5a000':'#222'};box-shadow:0 1px 4px rgba(0,0,0,.5);"></div>`,className:'',iconSize:[9,9],iconAnchor:[4,4]});
}

function setActive(n){
  if(activeN!==null){
    document.getElementById('tr-'+activeN)?.classList.remove('active');
    const p=tripLayers.find(l=>l.n===activeN);
    if(p){p.line.setStyle({color:'#f5a000',weight:1.5,opacity:.4});p.pm.setIcon(iconP(activeN,false));p.dm.setIcon(iconD(false));}
  }
  activeN=n;
  const el=document.getElementById('tr-'+n);
  if(el){el.classList.add('active');el.scrollIntoView({behavior:'smooth',block:'nearest'});}
  const c=tripLayers.find(l=>l.n===n);
  if(c){c.line.setStyle({color:'#fff',weight:3,opacity:.9});c.line.bringToFront();c.pm.setIcon(iconP(n,true));c.dm.setIcon(iconD(true));leafMap.panTo(c.pm.getLatLng(),{animate:true,duration:.4});}
}

function clearMap(){
  tripLayers.forEach(l=>{l.line.remove();l.pm.remove();l.dm.remove();});
  tripLayers=[];activeN=null;
  document.getElementById('trip-list').innerHTML='';
}

const DOW=['日','月','火','水','木','金','土'];
function dowLabel(s){const[y,m,d]=s.split('-').map(Number);return`${y}年${m}月${d}日（${DOW[new Date(y,m-1,d).getDay()]}）`;}

// ── Render trips with given column settings ─────────
function renderTrips(dayRows,pWardCol,pTownCol,dWardCol,dTownCol,fareCol,timeCol){
  clearMap();

  const trips=dayRows.map((row,i)=>{
    const pickup=buildLoc(row,pWardCol,pTownCol);
    const dropoff=buildLoc(row,dWardCol,dTownCol);
    const fare=parseFare(fareCol?row[fareCol]:'');
    const time=timeCol?String(row[timeCol]||''):'';
    const pc=getCoords(pickup,coordMap);
    const dc=getCoords(dropoff,coordMap);
    return{n:i+1,pickup,dropoff,fare,time,pc,dc,ok:!!(pc&&dc)};
  });

  const matched=trips.filter(t=>t.ok).length;
  log('描画: マッチ '+matched+'/'+trips.length+'件',matched>0?'ok':'warn');
  trips.filter(t=>!t.ok).slice(0,5).forEach(t=>log('  未マッチ #'+t.n+' 乗:"'+norm(stripSonota(t.pickup))+'" 降:"'+norm(stripSonota(t.dropoff))+'"','warn'));

  // Stats
  const tot=trips.reduce((s,t)=>s+t.fare,0);
  const lng=trips.filter(t=>t.fare>=5000).length;
  const avg=trips.length?Math.round(tot/trips.length):0;
  document.getElementById('st-fare').innerHTML='¥'+tot.toLocaleString();
  document.getElementById('st-cnt').innerHTML=trips.length+'<span class="stat-unit"> 件</span>';
  document.getElementById('st-long').innerHTML=lng+'<span class="stat-unit"> 件</span>';
  document.getElementById('st-avg').innerHTML='¥'+avg.toLocaleString();

  // Trip list
  const listEl=document.getElementById('trip-list');
  trips.forEach((t,i)=>{
    if(i>0){const d=document.createElement('div');d.className='t-div';listEl.appendChild(d);}
    const div=document.createElement('div');
    div.className='trip-row'+(t.ok?'':' no-map');
    div.id='tr-'+t.n;
    div.innerHTML=`<div class="t-badge">${t.n}</div><div class="t-info"><div class="t-loc"><span class="from">${shortLoc(t.pickup)}</span><span class="arr">↓</span><span class="to">${shortLoc(t.dropoff)}</span></div><div class="t-meta"><div class="t-fare">${fmtFare(t.fare)}</div>${t.time?`<div class="t-time">${t.time}</div>`:''}${!t.ok?'<div class="t-tag">未マッチ</div>':''}</div></div>`;
    if(t.ok)div.addEventListener('click',()=>setActive(t.n));
    listEl.appendChild(div);
  });

  // Map
  const bounds=[];
  trips.filter(t=>t.ok).forEach(t=>{
    const line=L.polyline([[t.pc.lat,t.pc.lng],[t.dc.lat,t.dc.lng]],{color:'#f5a000',weight:1.5,opacity:.45}).addTo(leafMap);
    const pm=L.marker([t.pc.lat,t.pc.lng],{icon:iconP(t.n,false)}).addTo(leafMap).bindTooltip('#'+t.n+' 乗車：'+t.pickup,{direction:'top'});
    const dm=L.marker([t.dc.lat,t.dc.lng],{icon:iconD(false)}).addTo(leafMap).bindTooltip('#'+t.n+' 降車：'+t.dropoff,{direction:'top'});
    [line,pm,dm].forEach(el=>el.on('click',()=>setActive(t.n)));
    tripLayers.push({n:t.n,line,pm,dm});
    bounds.push([t.pc.lat,t.pc.lng],[t.dc.lat,t.dc.lng]);
  });
  if(bounds.length)leafMap.fitBounds(bounds,{padding:[50,50]});
}

// ── Apply settings and render ──────────────────────
function applyAndRender(){
  const pW=document.getElementById('sel-p-ward').value;
  const pT=document.getElementById('sel-p-town').value;
  const dW=document.getElementById('sel-d-ward').value;
  const dT=document.getElementById('sel-d-town').value;
  const fare=document.getElementById('sel-fare').value;
  const time=document.getElementById('sel-time').value;
  log('--- 手動設定で再描画 ---');
  log('乗車区="'+pW+'" 丁="'+pT+'" / 降車区="'+dW+'" 丁="'+dT+'" / 営収="'+fare+'"','ok');
  if(!currentDayRows||!currentDayRows.length){log('先に日付を選んで「表示」を押してください','err');return;}
  renderTrips(currentDayRows,pW||null,pT||null,dW||null,dT||null,fare||null,time||null);
  hideLoading();
}

let currentDayRows=null;

// ── Main load ──────────────────────────────────────
async function loadData(){
  clearLog();
  showLoading();

  const dateStr=document.getElementById('date-input').value;
  const[year,month,day]=dateStr.split('-').map(Number);
  document.getElementById('s-dow').textContent=dowLabel(dateStr);

  try{
    if(coordMap.size===0){
      setStep('座標データを取得中...');
      log('座標CSV取得');
      const cr=await fetchCSV(URL_COORDS);
      log('座標CSV: '+cr.length+'行');
      coordMap=buildCoordMap(cr);
    } else log('座標: キャッシュ ('+coordMap.size+'件)','ok');

    if(!csvCache){
      setStep('日報詳細を取得中...');
      log('日報詳細CSV取得');
      csvCache=await fetchCSV(URL_BREAKDOWN);
      log('日報詳細: '+csvCache.length+'行');
    } else log('日報詳細: キャッシュ ('+csvCache.length+'行)','ok');

    if(!csvCache.length)throw new Error('日報詳細CSVが空です');
    const keys=Object.keys(csvCache[0]);

    // Populate dropdowns (once)
    if(allColKeys.length===0){
      populateSelects(keys);
      log('--- 全列名 (日報詳細) ---');
      keys.forEach((k,i)=>log('['+i+'] '+k+': "'+csvCache[0][k]+'"'));
    }

    // Auto-detect
    const ac=autoSelect(keys);

    // Filter date
    setStep(year+'/'+month+'/'+day+' を抽出中...');
    const dayRows=csvCache.filter(r=>matchDate(r,year,month,day));
    log(year+'/'+month+'/'+day+': '+dayRows.length+'件',dayRows.length?'ok':'err');

    if(!dayRows.length){
      const sd=[...new Set(csvCache.slice(0,30).flatMap(r=>Object.values(r)).filter(v=>/20\d\d/.test(String(v))))].slice(0,5);
      log('日付例: '+sd.join(' / '),'warn');
      throw new Error(year+'/'+month+'/'+day+'のデータが見つかりません');
    }

    currentDayRows=dayRows;

    // Render with auto-detected columns
    renderTrips(dayRows,
      document.getElementById('sel-p-ward').value||null,
      document.getElementById('sel-p-town').value||null,
      document.getElementById('sel-d-ward').value||null,
      document.getElementById('sel-d-town').value||null,
      document.getElementById('sel-fare').value||null,
      document.getElementById('sel-time').value||null
    );
    hideLoading();

  } catch(err){
    log('エラー: '+err.message,'err');
    openDbg();
    document.getElementById('loading').innerHTML=`<div style="text-align:center;padding:24px"><div style="color:#782020;font-size:13px;margin-bottom:8px">読み込みエラー</div><div style="color:#28283e;font-size:11px;max-width:260px;line-height:1.7">${err.message}</div></div>`;
  }
}

loadData();
</script>
